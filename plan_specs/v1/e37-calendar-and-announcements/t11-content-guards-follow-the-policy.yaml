    say to change `season` in the schedule, the results and the consent file in one edit. (c)
    `content-policy.test.ts` pins the consent manifest's `images: []`, which the first consented
    photograph would break: check what must always hold of images instead.
  priority: 2
  constraints:
    packages: [site, docs/guides]
    forbidden:
      - A guard weakened beyond following the policy's own allowlist
      - A real student's name in a test fixture
      - A dependency manifest or lockfile under site/ changed
