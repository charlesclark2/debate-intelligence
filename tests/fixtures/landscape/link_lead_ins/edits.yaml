# The edits v1-e32-t27's golden files make to the synthetic caselist (../synthetic_caselist/), so that
# a labelled link names an impact rank behind a withheld internal link, and a withheld link falls
# through to the tag. README.md works out the expected report by hand.
#
# cards: a card by its file (the digest's first two characters, repeated) and first paragraph, and its
# new tag. Every other field is the fixture's.
cards:
  - {file: b1, element_index: 0, tag: "Spending triggers a Birchmoor debt spiral"}
  - {file: b5, element_index: 3, tag: "Link: deficits follow new spending"}
  - {file: b5, element_index: 9, tag: "Deficits spike Birchmoor rates"}
# scenario_lists: by position id, as a topic's taxonomy file writes them (v1-e32-t22). Every other
# position keeps no list.
scenario_lists:
  spending-da:
    not_scenarios: [recession]
