spec:
  # Filed by the PM, 2026-10-27, from the coach's review of the republished Policy report, 2026-10-27.
  description: >-
    The coach: Policy debate no longer says "Harms"; debaters call that part of an advantage its
    impact. Count first, on the synthetic fixtures and over hspolicy26 read-only: where "harms"
    reaches the report today (a heading the normalizer keeps, a section or column name, an
    impact or link-chain row) and how many headings and cards each carries. Then fold harms
    headings into the advantage's impact, as the coach asked, so the report never shows "Harms"
    as its own section, and every count it carried is under Impact. Taxonomy ids are unchanged.
  priority: 3
  constraints:
    # PM ruling 2026-10-27, Question 2 of the checkpoint: impact cards are picked in the report
    # service and the roles live in the domain model; the guide's line on chain roles.
    packages: [debate_core.arguments, packages/debate_core/tests, config/landscape, tests/fixtures/landscape, scripts, tests/scripts, debate_core.application, debate_core.domain, docs/guides]
    forbidden:
      - A taxonomy id renamed or reused
      - Card text, a school or team code in any fixture
      - A count lost: every card under harms reaches Impact
  context:
    - kind: TaskRef
      name: v1-e32-t25-readable-impact-chains
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Counts first: where harms reaches the report and what it carries, in the report.
    - id: ac2
      description: >-
        On the synthetic fixtures, no section reads "Harms", and its cards and headings are
        counted under the advantage's impact with no count lost, matching hand-written
        golden files; tests shown failing first.
