      - ext-v1-e30-t03-archive-importer
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e34-t01-caselist-api-client reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e34-t01-caselist-api-client
    - id: t02
      kind: Task
      name: Weekly scheduled sync
      description: >-
        `debate-research caselist pull` plus a launchd schedule on the operator's Mac: download new archives,
        import, parse, publish and regenerate landscape reports; idempotent; summary per run.
      inputs:
        specRef: plan_specs/v1/e34-caselist-sync/t02-scheduled-sync.yaml
        goalRef: v1-e34-t02-scheduled-sync
      dependsOn:
      - t01
      - ext-v1-e31-t06-parse-pipeline
      - ext-v1-e30-t05-caselist-publish
      - ext-v1-e32-t05-landscape-cli
      - ext-v1-e30-t04-openev-importer
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e34-t02-scheduled-sync reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e34-t02-scheduled-sync
    - id: t03
      kind: Task
      name: Sync run log and staleness warnings
      description: >-
        Run log in S3, a local notification on failure, and a stale-data banner in landscape reports when
        the newest snapshot is older than eight days.
      inputs:
        specRef: plan_specs/v1/e34-caselist-sync/t03-sync-monitoring.yaml
        goalRef: v1-e34-t03-sync-monitoring
      dependsOn:
      - t02
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e34-t03-sync-monitoring reports phase Succeeded
        command: uv
        args:
