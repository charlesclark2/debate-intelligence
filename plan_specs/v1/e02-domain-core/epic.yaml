# EPIC E02 — Domain Core: Entities, Ports & Local Persistence
# Major version: V1 | Release: v1.0 (Foundation & verified evidence core)
# Architecture refs: §2, §6, §7, §20 step 1
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e02-domain-core
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e02-domain-core
  annotations:
    debate/title: 'E02 — Domain Core: Entities, Ports & Local Persistence'
    debate/architecture-refs: §2, §6, §7, §20 step 1
spec:
  description: >-
    Build debate_core's Pydantic domain model and the repository/provider ports that let V1 run locally
    and V2 swap in cloud implementations without touching use cases.
  priority: 1
  constraints:
    majorVersion: v1
    release: v1.0
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      V1 entities (Article, SourceSnapshot, Card, CardSpan, Citation, Search, SearchResult) are Pydantic
      models matching the §7 cloud data model, including organization/owner fields.
  - id: ac2
    description: >-
      All persistence and external providers are reached only through ports; local filesystem/SQLite implementations
      pass a reusable contract-test suite.
  - id: ac3
    description: >-
      Import-boundary rules forbid AWS SDKs, Typer and FastAPI inside debate_core domain/application layers.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e02-domain-core-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e02-domain-core
spec:
  description: >-
    Task graph for epic E02 (Domain Core: Entities, Ports & Local Persistence). Each Task node points
    at its own task-level PlanSpec.
  goalRef:
    name: v1-e02-domain-core
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e01-t03-uv-workspace-tooling
      kind: External
      name: 'Prerequisite from E01: uv workspace, Python 3.12 and quality tooling'
      description: >-
        Cross-epic prerequisite owned by v1-e01-repo-foundation (release v1.0).
      inputs:
        goalRef: v1-e01-t03-uv-workspace-tooling
        specRef: plan_specs/v1/e01-repo-foundation/t03-uv-workspace-tooling.yaml
    - id: ext-v1-e01-t04-ci-pipeline
      kind: External
      name: 'Prerequisite from E01: GitHub Actions CI pipeline'
      description: >-
        Cross-epic prerequisite owned by v1-e01-repo-foundation (release v1.0).
      inputs:
        goalRef: v1-e01-t04-ci-pipeline
        specRef: plan_specs/v1/e01-repo-foundation/t04-ci-pipeline.yaml
    - id: ext-v1-e01-t07-cli-skeleton
      kind: External
      name: 'Prerequisite from E01: debate_cli Typer + Rich skeleton'
      description: >-
        Cross-epic prerequisite owned by v1-e01-repo-foundation (release v1.0).
      inputs:
        goalRef: v1-e01-t07-cli-skeleton
        specRef: plan_specs/v1/e01-repo-foundation/t07-cli-skeleton.yaml
    - id: t01
      kind: Task
      name: Pydantic domain entities and enums
      description: >-
        Define Article, SourceSnapshot, Card, CardSpan, Citation/CitationField, Search, SearchResult,
        AccessStatus, VerificationStatus, SpanStyle, SpanPurpose, SourceType; ULID ids, timezone-aware
        timestamps, revision fields, owner_id/organization_id; JSON schema export.
      inputs:
        specRef: plan_specs/v1/e02-domain-core/t01-domain-entities.yaml
        goalRef: v1-e02-t01-domain-entities
      dependsOn:
      - ext-v1-e01-t03-uv-workspace-tooling
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e02-t01-domain-entities reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e02-t01-domain-entities
    - id: t02
      kind: Task
      name: Repository and provider port interfaces
      description: >-
        Protocols/ABCs for ArticleRepository, SnapshotStore (blob), CardRepository, SearchRepository,
        SearchProvider, ArticleFetcher, ContentExtractor, ModelRouter, Clock, IdGenerator; typed errors;
        application-service constructor injection pattern.
      inputs:
        specRef: plan_specs/v1/e02-domain-core/t02-ports.yaml
        goalRef: v1-e02-t02-ports
      dependsOn:
      - t01
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e02-t02-ports reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e02-t02-ports
    - id: t03
      kind: Task
      name: Local filesystem and SQLite repository implementations
      description: >-
        Filesystem content-addressed blob store for snapshots/exports and SQLite (or JSON) metadata repositories
        under a configurable data dir; no web framework dependency.
      inputs:
        specRef: plan_specs/v1/e02-domain-core/t03-local-repositories.yaml
        goalRef: v1-e02-t03-local-repositories
      dependsOn:
      - t02
      - t05
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e02-t03-local-repositories reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e02-t03-local-repositories
    - id: t04
      kind: Task
      name: Reusable repository contract test suite
      description: >-
        Parametrized pytest contract suites every repository implementation must pass (CRUD, idempotency,
        revision/optimistic concurrency semantics, listing/order), run against local impls now and cloud
        impls in V2.
      inputs:
        specRef: plan_specs/v1/e02-domain-core/t04-repo-contract-tests.yaml
        goalRef: v1-e02-t04-repo-contract-tests
      dependsOn:
      - t03
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e02-t04-repo-contract-tests reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e02-t04-repo-contract-tests
    - id: t05
      kind: Task
      name: Settings and configuration
      description: >-
        pydantic-settings configuration: data dir, enabled providers, API keys from env/.env, model routing
        config file, per-environment profiles; `debate-research config show` redacts secrets.
      inputs:
        specRef: plan_specs/v1/e02-domain-core/t05-settings-config.yaml
        goalRef: v1-e02-t05-settings-config
      dependsOn:
      - t01
      - ext-v1-e01-t07-cli-skeleton
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e02-t05-settings-config reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e02-t05-settings-config
    - id: t06
      kind: Task
      name: Import-boundary enforcement
      description: >-
        import-linter (or equivalent) contracts: domain/application layers may not import boto3/botocore,
        typer, fastapi, httpx; debate_cli/debate_api may not contain business logic beyond calling services;
        wired into CI.
      inputs:
        specRef: plan_specs/v1/e02-domain-core/t06-import-boundary-guard.yaml
        goalRef: v1-e02-t06-import-boundary-guard
      dependsOn:
      - t02
      - ext-v1-e01-t04-ci-pipeline
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e02-t06-import-boundary-guard reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e02-t06-import-boundary-guard
status:
  phase: Pending
