# TASK v1-e34-t19-unreadable-local-files-and-notification-codes - Unreadable local files fail a stage, and a notification says whether a failure is transient
# Epic: E34 Caselist Sync | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e34-t19-unreadable-local-files-and-notification-codes
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e34-caselist-sync
  annotations:
    debate/title: "Unreadable local files fail a stage, and a notification says whether a failure is transient"
spec:
  # Filed by the PM, 2026-10-10, from v1-e34-t13's and v1-e34-t12's Follow-up work.
  description: >-
    Three loose ends left after v1-e34-t13 and v1-e34-t12. (1) `manifest.read_manifest_lines`
    and `write_manifest` open a manifest file by path, so an unreadable manifest file in a
    readable directory is still a raw `PermissionError` and exit 70. v1-e34-t13 translated the
    stores, not these direct reads. (2) A weekly archive's `OSError` (an unreadable or vanished
    zip in the inbox) ends the whole run instead of failing that archive's import and letting
    the rest go on. v1-e34-t12 noted it. (3) The weekly agent's notification is built from the
    run record, which carries no error codes. So it cannot say whether a failed run was
    transient (exit 3, next week retries) or needs a person (exit 1). Give the run record the
    failed stages' codes in a way both the installed build and a new one can read. The record
    forbids unknown fields today, so this is a schema change, made compatibly. Then word the
    notification from them. Out of scope: the exit-code rule, and the stores v1-e34-t13
    translated.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.integrations.local, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, tests/smoke, docs/runbooks]
    forbidden:
      - A path, camp title or inbox file name in a stage reason, a record or a notification
      - A run record a build released before this task cannot read
  context:
    - kind: TaskRef
      name: v1-e34-t13-pull-stage-failure-classes
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        An unreadable manifest file is `LocalStoreAccessDenied` naming the manifest
        directory's role, for reading and writing. Through `caselist pull` it fails its
        stage with exit 3 and the data-directory hint, never exit 70. Shown failing first.
    - id: ac2
      description: >-
        A weekly archive that cannot be read fails that archive's import with its code. The
        other archives in the run import, and the run exits by v1-e34-t13's rule. Shown
        failing first.
    - id: ac3
      description: >-
        The run record carries the failed stages' codes. A record written by this build is
        read by the build currently installed (a stored record from the start commit's code,
        and the reverse), by test.
    - id: ac4
      description: >-
        The notification for a failed run says whether the next scheduled run should retry
        it (every failed required code retryable) or a person should look (any other).
        docs/runbooks/caselist-scheduled-sync.md shows both wordings.
    - id: ac5
      description: >-
        Added by the PM, 2026-10-11, from v1-e34-t18's Follow-up work. An error the publisher
        raises outside its per-object loop, `UnreadableManifest` from the plan among them,
        fails the publish stage with its existing code, and the run finishes with its summary,
        run record and notification rather than ending on the exception. The pending-work file
        is left as v1-e34-t18 settled it. Shown failing first.
    - id: ac6
      description: >-
        Added by the PM, 2026-10-11, from v1-e34-t18's Follow-up work. `_write_json` flushes
        and fsyncs the temporary file before the rename, and fsyncs the directory after it,
        for every state file it writes. A test records the order of those calls. A failing
        fsync surfaces as the same error the write raises today.
    - id: ac7
      description: >-
        Added by the PM, 2026-10-11, from v1-e34-t18's Follow-up work. The notification for a
        failed stage carries that stage's hint, the fix the summary gives, rather than only
        "caselist pull failed", for every stage whose failure has one. That includes the parse
        stage's `caselist parse --caselist <slug> --publish`, which v1-e34-t17 added. Both
        wordings of ac4 hold with a hint present. No hint names a path.
    - id: ac8
      description: >-
        Added by the PM, 2026-10-11, from v1-e34-t18's Follow-up work, which waited on this
        task's record change. A publish stage that ends `pending` after a snapshot ended
        incomplete on a code (a checksum mismatch, say) records that code on the stage as an
        earlier finding. The summary shows it, and the notification names it as needing a
        person. It does not enter `exit_code_for_failure_codes`: v1-e34-t13's rule that a
        pending stage carries no failure code for the exit is unchanged. Shown failing first
        with v1-e34-t18's shape: a mismatch, then an expiry.
    - id: ac9
      description: >-
        Added by the PM, 2026-10-11, from v1-e34-t17's Follow-up work 5. The run record
        carries the parse stage's counts (the nine integers of the summary's `parse` object,
        or null when the stage did not run), under the same compatibility as ac3, and
        `caselist runs` shows them in its table rather than only in the caption sentence
        v1-e34-t17 added.
status:
  phase: InProgress
---
