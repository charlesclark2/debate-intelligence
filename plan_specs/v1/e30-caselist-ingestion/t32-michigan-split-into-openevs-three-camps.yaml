        before any rule.
    - id: ac2
      description: >-
        The table files Michigan7, Michigan Classic and MNDI as three camps with their
        OpenEv words, a bare Michigan as the count rules, and no spelling swallowing
        another; existing files are refiled without a download; by tests shown failing
        first.
