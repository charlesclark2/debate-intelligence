        Prompt 1.3.0 and stage one carry what is ruled, by tests on invented cards shown
        failing first, with the version bumped and its cassettes keyed by it, and 1.2.0's
        recordings replaying unchanged.
    - id: ac3
      description: >-
        The operator's re-record of the 47 under 1.3.0 on the ruled routes, its breakdown
        and scans, is recorded in docs/data beside 1.2.0's (operator, recorded by the PM).
