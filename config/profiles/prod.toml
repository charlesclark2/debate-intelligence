# Environment profile: prod (DEBATE_ENV=prod)
#
# Production: the stable build the team installs, working on the real corpus
# (docs/process/branching-and-environments.md). Nothing reaches this environment that has not been
# deployed to and validated in dev.
#
# Precedence: an explicit --flag, then DEBATE_* in the environment, then .env, then this file.
# Anything not set here falls back to the built-in prod profile in
# debate_core.application.settings.
#
# NEVER put a secret in this file. It is committed. API keys, the OpenCaselist caselist_token and
# the polite-pool contact address come from the environment or from an uncommitted .env; see
# .env.example.
#
# The routing file and daily budget are owned by v1-e01-t09-dev-prerelease-channel. An installed
# stable build carries this file inside its wheel and defaults to DEBATE_ENV=prod when DEBATE_ENV
# is unset.

allow_network = true

[storage]
data_dir = "~/.debate-research/prod"

[storage.s3]
# The prod evidence bucket — the real corpus. Same three Terraform outputs as dev, from
# `terraform -chdir=infrastructure/envs/prod output`, and the same reason they are written here.
#
# `debate-research store sync --apply` into this bucket also requires --confirm-prod, because the
# difference between these four lines and dev's is the whole difference between a rehearsal and
# the team's evidence (docs/guides/evidence-store-cli.md).
bucket = "debate-prod-evidence-a7508de8"
region = "us-east-1"
aws_profile = "debate-prod-evidence"

[providers]
enabled = ["openalex", "crossref", "semantic_scholar", "rss"]

[http]
per_host_interval_seconds = 1.0
request_timeout_seconds = 30.0

[models]
routing_file = "config/model_routing.prod.yaml"
# Production spend ceiling per day, enforced by the E05 BudgetGuard. Never the same as dev's.
budget_usd_daily = 20.0

[caselist]
# The E34 gate of docs/policies/caselist-data-use.md. Off by default in
# debate_core.application.settings: an installation that has not made this decision refuses to
# reach the API rather than asking. Turned on when the weekly agent was installed, after the policy was approved and the
# weekly cadence was agreed with the OpenCaselist maintainer. The cadence, the 8-per-minute
# download rate and the 5-per-day bulk cap are the maintainer's and are not raised here.
api_enabled = true

# The backfiles (data-use policy 1.17, Permitted uses 8; v1-e34-t34): earlier seasons' complete
# archives, imported once each by `caselist backfile-import`, never pulled by the weekly run, never
# given a landscape or a per-school view, and kept by the annual purge. The four OpenCaselist serves
# for 2021-22 on (docs/data/caselist-backfile-seasons.md), in the PM's order of 2026-10-25. Here too because prod is
# published from dev's copy, so its landscape must refuse them as dev's does. PF keeps
# weeklies only and 2021-22 to 2023-24 serve no archive, so neither is here. Never one of
# sync_caselists: a profile naming a slug in both is refused at startup.
backfile_caselists = ["hspolicy25", "hsld25", "hspolicy24", "hsld24"]
