    aliases: [adv inequality, inequality adv, advantage inequality, inequality advantage, inequality]
    # The seed: v1-e32-t14's names two or more teams use here, teams (documents) beside each.
    scenarios:
      - {name: inequality, forms: [inequality]}  # 2 teams (2 documents)
    not_scenarios: []
  - id: economy-advantage
    label: Economy advantage
    kind: advantage
    side: aff
    description: The plan strengthens the economy as a whole, and an economic collapse or recession is the impact.
    aliases: [adv economy, advantage economy, economy advantage, economy adv, adv econ, econ adv, econ advantage, economy, econ]
