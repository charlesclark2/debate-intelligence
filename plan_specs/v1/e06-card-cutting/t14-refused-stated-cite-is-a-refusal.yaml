spec:
  # Filed by the PM, 2026-11-02, from v1-e06-t12's follow-up 2 (the PM's review, 2026-11-02).
  description: >-
    If a stated cite reaches the snapshot's validator with a field it refuses, `fetch` exits
    INTERNAL_ERROR. The CLI's builder can't produce one, but another caller could. Map the
    snapshot's ValidationError on a stated cite to a named refusal with the field and the
    reason, and a usage exit code.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests]
    forbidden:
      - A refused stated cite stored
      - A stated field reported as verified
  context:
    - kind: TaskRef
      name: v1-e06-t12-pasted-copy-cite-stated-by-the-user
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A stated cite the domain refuses gives a named refusal naming the field, not
        INTERNAL_ERROR, and nothing is stored, by a test shown failing first.
status:
  phase: Pending
