  graph:
    nodes:
      - id: replay-exit-doctor
        kind: Task
        name: Replay, exit codes and doctor
        description: >-
          The request comparison, the exit codes, the opt-in check and the socket.
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Model and doctor tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/models, packages/debate_cli/tests, -k, replay or exit or doctor]
status:
  phase: Pending
