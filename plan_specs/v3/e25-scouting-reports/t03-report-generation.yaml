# TASK v3-e25-t03-report-generation — Scouting report generation
# Epic: E25 Scouting Reports | Release: v3.4 (Scouting reports) | Major: V3
# Architecture refs: §3 V3 scouting story, §7, §10, §13 Opponent intelligence, §14, §15
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v3-e25-t03-report-generation
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v3
    debate/release: v3.4
    debate/epic: v3-e25-scouting-reports
  annotations:
    debate/title: Scouting report generation
    debate/architecture-refs: §3, §7, §10, §13, §14, §15
spec:
  description: >-
    Assemble a ScoutingReport for a canonical team and season from the t01 DisclosureSummary and the t02
    ResultsAnalytics. Every assertion in the report is a typed ReportAssertion with kind SOURCED (backed by
    disclosure or result ids, each resolving to source_url and retrieved_at) or INFERENCE (a strategic
    read such as "likely to go 1-off K against policy affs", which must cite the sourced assertions it
    reasons from and is rendered with an explicit inference label). A short narrative overview is
    generated with the reasoning tier through a versioned prompt that may only reference assertion ids.
    Reports are generated by an async ScoutingReportJob, persisted to AppTable/S3 with generated_at,
    input data freshness (oldest/newest retrieved_at) and prompt/model metadata, and served from cache
    until source data is refreshed or the coach forces a refresh. Exposes the create/get report API
    routes. UI and DOCX/PDF export are t04; feeding predictions is t05.
  priority: 1
  constraints:
    packages: [debate_core.domain, debate_core.application, debate_workers, debate_api]
    forbidden:
      - Any report sentence not backed by a ReportAssertion id; post-validation rejects the narrative otherwise
      - Presenting INFERENCE assertions without an inference label or without sourced premises
      - Naming individual debaters beyond the canonical team code and school (data minimization)
      - Treating OpenSearch as the report store; DynamoDB/S3 are the system of record
      - Business logic in debate_api routes or debate_workers handlers
      - Live network or real model calls in CI tests
  context:
    - kind: TaskRef
      name: v3-e25-t01-disclosure-summarization
      relation: dependsOn
    - kind: TaskRef
      name: v3-e25-t02-results-analytics
      relation: dependsOn
    - kind: TaskRef
      name: v2-e12-t03-authn-authz
      relation: dependsOn
    - kind: TaskRef
      name: v2-e13-t02-sqs-workers
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A generated ScoutingReport contains sections for disclosed Aff positions, Neg positions, side
        tendencies, results and inferences, and every assertion resolves to at least one source_url and
        retrieved_at (or, for INFERENCE, to sourced premise assertion ids).
    - id: ac2
      description: >-
        A narrative that references an unknown assertion id or contains a sentence with no assertion
        reference fails validation, triggers one repair retry, and otherwise the report is saved with the
        narrative omitted and status NARRATIVE_FAILED rather than unsourced text.
    - id: ac3
      description: >-
        Reports are cached; a GET returns the cached report with generated_at and data freshness, and a
        new job runs only when an E24 refresh changed input records or refresh=true is passed.
    - id: ac4
      description: >-
        POST /v1/scouting/reports enqueues a ScoutingReportJob and returns 202 with a job id; GET
        /v1/scouting/reports/{report_id} returns 200 for the owning organization and 404 otherwise.
    - id: ac5
      description: >-
        Persisted reports record prompt_id, prompt version, model_id and the input record ids used.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v3-e25-t03-report-generation-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v3
    debate/release: v3.4
    debate/epic: v3-e25-scouting-reports
spec:
  description: >-
    Define the assertion-based report schema, assemble sourced sections deterministically, add the
    constrained narrative, then persist/cache through a job and expose API routes.
  goalRef:
    name: v3-e25-t03-report-generation
  graph:
    nodes:
      - id: report-schema
        kind: Task
        name: ScoutingReport and ReportAssertion schema
        description: >-
          Pydantic ScoutingReport, ReportSection and ReportAssertion (kind SOURCED or INFERENCE, text,
          source refs, premise ids) with validators enforcing sourcing rules.
        outputs: [packages/debate_core/src/debate_core/domain/scouting_report.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Assertion sourcing validators pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/domain/test_scouting_report.py]
      - id: section-assembly
        kind: Task
        name: Deterministic section assembly
        description: >-
          Convert DisclosureSummary clusters and ResultsAnalytics stats into SOURCED assertions with
          templated wording and rule-based INFERENCE assertions (e.g. dominant Neg strategy) citing premises.
        dependsOn: [report-schema]
        outputs: [packages/debate_core/src/debate_core/application/opponent_intel/report_assembly.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Assembly tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/test_report_assembly.py]
      - id: narrative
        kind: Task
        name: Assertion-referenced narrative overview
        description: >-
          Prompt scouting.report_overview v1.0.0 (reasoning tier) returning ReportOverview sentences each
          with assertion ids; validator plus single repair retry; fail closed to NARRATIVE_FAILED.
        dependsOn: [section-assembly]
        outputs:
          - packages/debate_core/src/debate_core/prompts/scouting_report_overview.v1.yaml
          - packages/debate_core/src/debate_core/application/opponent_intel/report_narrative.py
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Narrative validation and fail-closed tests pass with replay router
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/test_report_narrative.py]
      - id: job-and-cache
        kind: Task
        name: ScoutingReportJob, persistence and cache policy
        description: >-
          Worker handler invoking OpponentIntelService.generate_report; repository persistence of report
          JSON to S3 and metadata to AppTable (REPORT# items); cache key from input record ids and prompt
          version; invalidate on E24 refresh events.
        dependsOn: [narrative]
        outputs:
          - packages/debate_workers/src/debate_workers/handlers/scouting_report.py
          - packages/debate_core/src/debate_core/application/opponent_intel/generate_report.py
        estimatedEffort: 4h
        acceptanceCriteria:
          - type: test_passes
            name: Job and cache invalidation tests pass against moto
            command: uv
            args: [run, pytest, packages/debate_workers/tests/test_scouting_report_job.py]
      - id: api-routes
        kind: Task
        name: Scouting report API routes
        description: >-
          Thin FastAPI routes for create (202 + job id) and get (org-scoped) with OpenAPI schema; then run
          the full quality gates.
        dependsOn: [job-and-cache]
        outputs: [packages/debate_api/src/debate_api/routes/scouting.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Route tests pass (authz, 202, 404 cross-org)
            command: uv
            args: [run, pytest, packages/debate_api/tests/routes/test_scouting.py]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
status:
  phase: Pending
