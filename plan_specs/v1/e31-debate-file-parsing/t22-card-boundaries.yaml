# TASK v1-e31-t22-card-boundaries - Bodies too long to be one card, and two cards stored as one
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t22-card-boundaries
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: "Bodies too long to be one card, and two cards stored as one"
spec:
  # Filed by the PM, 2026-10-16, from the PM's measurement of the largest clusters after the 2026-10-16 re-parse, and v1-e31-t11's step 3 sample.
  description: >-
    Two kinds of card boundary the parser misses. (1) Bodies far longer than any card: hspf26's
    second-largest cluster holds 75 distinct texts of 1,414 to 7,485 words. Count stored cards
    over 3,000 words per caselist, by the rule that ended each and by whether its file writes
    tags at all, and find what they are. (2) Two cards stored as one: v1-e31-t11's one false
    join was made through a 150-word body that holds two shorter bodies whole, which share no
    text with each other. Count bodies that hold two or more disjoint shorter bodies of other
    cards, then sample them with v1-e31-t21's sampler to see which are a missed boundary (a tag
    the parser did not read between two cut cards) and which are a long card legitimately cut
    twice. Fix the parser for what is a defect. Counts come first, from the operator's corpus.
    Not this task: how card matching treats such a body, which is v1-e31-t20's.
  priority: 2
  constraints:
    packages: [debate_core.evidence, debate_core.integrations.docx_parser, packages/debate_core/tests, scripts, tests/evals/parser, tests/fixtures/debate_files, docs/data]
    forbidden:
      - Changing a CORRECTED or COACH_REVIEWED label file
      - Running the corpus counts or a re-parse in a session (operator-run only)
      - Card text, a school, team code or file name in any fixture, file the tool writes, report or commit; the operator's checks are tallies only
  context:
    - kind: TaskRef
      name: v1-e31-t12-cite-detection
      relation: dependsOn
    - kind: TaskRef
      name: v1-e31-t21-cluster-shapes-and-sampler
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Before any rule changes, the report gives the operator-run counts for (1) and (2)
        per caselist, with (1) split by ending rule and by files that write tags.
    - id: ac2
      description: >-
        A sample of each, through v1-e31-t21's sampler, tallies only, says which are
        defects.
    - id: ac3
      description: >-
        Each defect has a synthetic fixture shown failing first, and the labelled
        evaluation's tag and cite precision and card boundaries do not fall.
    - id: ac4
      description: >-
        `parser_version` is bumped, and the operator's re-parse records (1) and (2) before
        and after in docs/data/caselist-parse-report.md.
status:
  phase: InProgress
