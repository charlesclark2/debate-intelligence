# TASK v2-e19-t05-backups-dr — Backups and restore drill
# Epic: E19 Production Readiness, Privacy & Safety | Release: v2.4 (Production readiness & school rollout) | Major: V2
# Architecture refs: §7, §15, ADR-002, ADR-003
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e19-t05-backups-dr
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.4
    debate/epic: v2-e19-production-readiness
  annotations:
    debate/title: Backups and restore drill
    debate/architecture-refs: §7, §15, ADR-002, ADR-003
spec:
  description: >-
    Prove the platform can recover from data loss before the school relies on it mid-season. Verify (and
    enforce in Terraform/policy checks) DynamoDB point-in-time recovery on AppTable and the audit table,
    S3 versioning plus lifecycle for noncurrent versions on snapshot/export buckets, and a weekly
    export manifest (item counts and hashes per table/prefix). Set RTO/RPO targets (proposed: RPO <= 5
    minutes for DynamoDB, <= 24 hours for manifests; RTO <= 4 hours), then run and document a restore drill
    in stage: restore AppTable to a point in time into a new table, recover a deleted S3 snapshot version,
    rebuild the OpenSearch index from restored data (E15 t06), and verify a sample of cards still pass
    EvidenceVerifier. This task does NOT implement cross-region replication (out of scope for V2) or
    account deletion (t03; note that restores must re-apply deletions made after the restore point).
  priority: 1
  constraints:
    packages: [infrastructure/modules/dynamodb, infrastructure/modules/s3, docs/runbooks, scripts]
    forbidden:
      - Running the restore drill against the prod table in place
      - Restores that resurrect accounts deleted after the restore point (replay deletion log)
      - Declaring backups done without a completed, timed drill
      - Public access on any backup or manifest bucket
  context:
    - kind: TaskRef
      name: v2-e11-t02-dynamodb-tables
      relation: dependsOn
    - kind: TaskRef
      name: v2-e11-t04-s3-snapshot-store
      relation: dependsOn
    - kind: TaskRef
      name: v2-e15-t06-index-rebuild
      relation: dependsOn
    - kind: TaskRef
      name: v2-e19-t03-account-lifecycle
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A policy test (terraform plan JSON checked in CI) fails if any table lacks PITR or any data bucket
        lacks versioning, block-public-access or KMS encryption.
    - id: ac2
      description: >-
        A weekly export-manifest job writes counts and SHA-256 rollups per table and S3 prefix to a private
        bucket, and the latest manifest is retrievable.
    - id: ac3
      description: >-
        docs/runbooks/restore.md defines RTO/RPO targets and step-by-step restore procedures for DynamoDB
        PITR, S3 object versions and OpenSearch rebuild, including re-applying post-restore deletions.
    - id: ac4
      description: >-
        A stage restore drill is completed and logged with actual timings vs RTO, row-count reconciliation
        against the manifest, and 20 sampled cards re-verified VERIFIED.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e19-t05-backups-dr-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.4
    debate/epic: v2-e19-production-readiness
spec:
  description: >-
    Enforce backup settings as policy, add export manifests, write the runbook with RTO/RPO, then run and
    record the drill in stage.
  goalRef:
    name: v2-e19-t05-backups-dr
  graph:
    nodes:
      - id: backup-policy
        kind: Task
        name: Backup configuration policy checks
        description: >-
          Confirm PITR/versioning/lifecycle settings in modules and add a CI check over `terraform show -json`
          plan output for required settings.
        outputs: [scripts/check_backup_policy.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Backup policy checker tests pass
            command: uv
            args: [run, pytest, tests/infrastructure/test_backup_policy.py]
          - type: command_succeeds
            name: Dev Terraform validates
            command: terraform
            args: [-chdir=infrastructure/envs/dev, validate]
      - id: export-manifests
        kind: Task
        name: Weekly export manifest job
        description: Scheduled worker writing per-table and per-prefix counts and hash rollups.
        dependsOn: [backup-policy]
        outputs: [packages/debate_workers/src/debate_workers/handlers/export_manifest.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Manifest job tests pass on moto
            command: uv
            args: [run, pytest, packages/debate_workers/tests/handlers/test_export_manifest.py]
      - id: runbook
        kind: Task
        name: Restore runbook with RTO/RPO
        description: >-
          Procedures and scripts for PITR restore to a new table, S3 version recovery and index rebuild.
        dependsOn: [export-manifests]
        outputs: [docs/runbooks/restore.md, scripts/restore_table.sh]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Runbook defines RTO and RPO
            path: docs/runbooks/restore.md
            contentMatch: "RPO"
      - id: drill
        kind: Task
        name: Stage restore drill
        description: >-
          Execute the runbook in stage end to end, reconcile against the manifest, re-verify sampled cards,
          and log timings and issues.
        dependsOn: [runbook]
        outputs: [docs/runbooks/restore-drill-log.md]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: artifact_exists
            name: Drill log recorded
            path: docs/runbooks/restore-drill-log.md
          - type: custom
            name: Drill meets RTO/RPO or has remediation
            description: >-
              Charlie reviews the drill log; timings meet targets or remediation items are filed before the
              v2.4 release gate.
status:
  phase: Pending
