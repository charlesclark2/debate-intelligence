    refuses a prerequisite it cannot find.
  goalRef:
    name: v1-e41-t07-spec-graph-checks
  graph:
    nodes:
      - id: spec-graph-checks
        kind: Task
        name: Spec graph checks
        description: >-
          The spec validator holds each epic's graph to its tasks' prerequisites, and the
          task helper refuses a prerequisite it cannot find.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Spec graph checks tests pass
            command: uv
            args: [run, pytest, tests/scripts, -k, validate_specs or task_helper]
status:
  phase: Pending
