spec:
  # Filed by the PM, 2026-11-14, from the product owner's point of 2026-11-14 that a card's argument comes from the block it sits in.
  description: >-
    The product owner's point of 2026-11-14: a card's argument comes from the block it is read
    in (a counterplan's text, then its solvency and net-benefit cards; a disadvantage's
    uniqueness, link, internal link and impact), so a tag judged alone is ambiguous. The cards
    that reach the per-card model stage are those whose headings named no position, which is why
    it scored 0.571 and 0.476 on v1-e32-t50's holdout against the 0.85 bar. Measure first,
    counts only, on the newest hspolicy26 and hsld26 snapshots: of the cards the matcher leaves
    unplaced, how many sit in a block (the innermost heading's section, or a run of cards
    between headings, as the reader defines it; say which) whose other cards the matcher placed,
    to one position or to several. Score inheritance per card against the coach's labels: choose
    any parameter on v1-e32-t21's first sample only, then score once on v1-e32-t50's holdout.
    Propose a deterministic rule (for example, inherit only when the block's placed cards agree)
    and stop for the PM's ruling. Then build it in the matcher, before the review queue, with
    its placement kind named as inherited in the report and the queue.
  priority: 2
  constraints:
    packages: [debate_core.arguments, debate_core.application, scripts, packages/debate_core/tests, docs/data]
    forbidden:
      - A model call
      - A school, team code, team name or debater name in output, a report or a test
      - A parameter chosen on the holdout
  context:
    - kind: TaskRef
      name: v1-e32-t21-local-classifier-comparison
      relation: dependsOn
    - kind: TaskRef
      name: v1-e32-t50-a-second-labelled-sample-held-out
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The measurement, and the proposed rule with its score on the first sample and once
        on the holdout, are ruled on by the PM before code.
    # PM ruling, 2026-11-20: no set-agreement rule is built; if no carry-forward variant gets more
    # than a third of the first sample's inherited cards right, inheritance is closed and ac2 reads
    # as below. Every variant got 0 right (docs/data/landscape-block-inheritance.md).
    - id: ac2
      description: >-
        The measurement is recorded and the PM rules no inheritance.
