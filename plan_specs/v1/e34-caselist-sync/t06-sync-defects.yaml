# TASK v1-e34-t06-sync-defects — Defects found by operating the sync
# Epic: E34 Scheduled Caselist Sync | Release: v1.1 (Caselist evidence store) | Major: V1
# Architecture refs: §15 reliability
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e34-t06-sync-defects
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e34-caselist-sync
  annotations:
    debate/title: Defects found by operating the sync
spec:
  description: >-
    Three defects in `caselist pull` that only appeared once someone planned a real multi-day run
    against it (v1-e30-t06). None was visible to the test suite, because each needs either a second
    day, a failed import, or a hand-imported file to show itself. They are grouped because they are
    one class - the run's bookkeeping disagreeing with the world it is bookkeeping about - and because
    the unattended schedule of v1-e34-t05 must not be enabled until at least the retry defect is
    fixed: an agent that cannot recover from one failed import fails silently every week thereafter.
    Out of scope: the full-archive namespace (v1-e34-t04 ac0), notifications and run records (t03),
    and anything about the cadence or the cap, which are the maintainer's and are fixed by the policy.
  priority: 1
  constraints:
    # `debate_cli.container` added by the PM, 2026-09-29, after the fact: ac2b requires the CLI
    # container to agree on the window and a test to pin a clock proving it, and the container had
    # no clock to pin. The criterion named the container; the package list did not. The spec was
    # wrong, not the session.
    packages: [debate_core.application, debate_cli.commands, debate_cli.container, docs/runbooks]
    forbidden:
      - Raising the daily bulk-download ceiling, the per-minute rate or the weekly cadence
      - Live network or AWS calls in CI tests (respx, moto and fakes only)
      - Fixing a defect by documenting it in the runbook instead of in the code
  context:
    - kind: TaskRef
      name: v1-e34-t03-sync-monitoring
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        An archive whose import failed is retried by the next run. It stays in the inbox, and today
        the next run decides `ALREADY_IN_INBOX` while `_import_stage` imports only what that same run
        downloaded, so it is never fetched and never imported again - a permanent silent gap that
        re-running does not close, contrary to what docs/runbooks/caselist-scheduled-sync.md tells the
        operator to do. A run imports what is in the inbox and not yet in a manifest, whether this run
        downloaded it or not, spending no download to do so. Tested with a failed import followed by a
        clean re-run.
    - id: ac2
      description: >-
        The daily download budget is enforced over a rolling 24-hour window rather than a calendar
        day, and the ledger records download timestamps rather than a date and a count. Today
        `DownloadLedger` is a single slot, `{"date": ..., "bulk_downloads": N}`, keyed on
        `self._clock().date()` over a UTC clock while its own docstring says local time and gives a
        reason for local ("the operator's day is the one they will compare against"). The live
        ledger proves the code wins: on the operator's machine it read
        `{"date": "2026-09-29", "bulk_downloads": 5}` with an mtime of 23:45:11 CDT on 2026-09-28,
        booking that evening's five downloads to the following day. And because `spent_on` returns 0
        whenever the stored date differs from the day asked about, `record` then overwrites rather
        than accumulates - a day change does not shift the count, it resets it - so two runs forty
        minutes apart across 19:00 CDT each get a fresh five.
        A calendar key is the wrong shape, not the wrong timezone, and this repository has already
        written down why. `RequestPacer` in integrations/opencaselist/pacing.py enforces the
        per-minute limit over a rolling 60-second window precisely because "a fixed per-minute bucket
        would allow twice the limit across a bucket boundary". The daily ceiling is the same rule one
        scale up and takes the same technique: a bulk download may start only if fewer than the limit
        started in the preceding 24 hours. That is conservative against a limiter counting any
        calendar in any timezone - which is what is needed, because v1-e34-t01 established the 5/day
        ceiling (`weeklyLimiter`) but not the day it counts, and docs/policies/caselist-data-use.md
        does not state it either. Choosing a timezone would be guessing; a rolling window removes the
        question.
        Scope note, correcting this criterion's original framing: the 5/day ceiling is enforced
        upstream by OpenCaselist and a refusal is already absorbed - a `ProviderRateLimited` carrying
        a wait above `SKIP_TODAY_SECONDS` means skip today, the remaining archives are recorded as
        deferred, and the run still imports, publishes and exits successfully. The maintainer
        agreement (clause 12) is the 10-file-per-minute rate, which `RequestPacer` enforces
        separately and correctly. So this is a correctness and efficiency defect whose worst outcome
        is a wasted run, not a policy breach, and it does not gate v1-e34-t05 - only ac1 does.
        For the record, no ceiling has been exceeded. Across the six runs in the operator's run log
        (2026-09-23 through 2026-09-28) the spend is 5, 5 and 5, identical under the local and the
        UTC calendar alike. The exposure is that two of those six ran within forty minutes of local
        midnight, so the doubling is a scheduling accident away rather than a hypothetical.
    - id: ac2b
      description: >-
        The window is the same on every side - the service, the CLI container, the test helpers and
        the runbooks - and a test pins a clock to prove it. A rolling window admits a sharper test
        than a day boundary did: five downloads at T are still counted at T+23h59m and released at
        T+24h01m, and five at T followed by five at T+40m are refused wherever a midnight falls
        between them. No test may derive the window from the machine's real clock or timezone, which
        is what makes today's four failures time-of-day flaky rather than reproducible - a test that
        passes at 14:00 and fails at 21:43 is worse than no test, because it teaches people to re-run
        until green. The run summary reports the window's start and the spend inside it, so an
        operator can see what a run counted against without reading the ledger file.
    - id: ac3
      description: >-
        OpenEv selection recognises a camp file already imported by hand. It matches on the inbox name
        `openev-<id>-...` rather than on content, so a file imported through `caselist import-openev`
        is invisible to it: setting `caselist.openev_event` today would re-download all 498 listed
        files and write them into the manifest as DUPLICATE rows beside the ones already held. Match on
        what the manifest records, so an already-held camp file is decided `ALREADY_IMPORTED` and costs
        no download.
    - id: ac4
      description: >-
        Each of the three has a regression test that fails on the current code and passes after, and
        docs/runbooks/caselist-scheduled-sync.md no longer tells the operator to recover a failed
        import by re-running the same command.
status:
  phase: Succeeded
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e34-t06-sync-defects-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e34-caselist-sync
spec:
  description: >-
    Reproduce each defect as a failing test first, then fix it, then correct the runbook.
  goalRef:
    name: v1-e34-t06-sync-defects
  graph:
    nodes:
      - id: retry-failed-import
        kind: Task
        name: A failed import is retried by the next run
        description: >-
          Import stage works from the inbox against the manifests rather than from this run's
          downloads. Reproduce first: a run whose import raises, then a clean run that must import the
          archive still sitting in the inbox without spending a download.
        outputs: [packages/debate_core/src/debate_core/application/caselist_sync.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Retry tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/test_caselist_sync.py, -k, retry]
      - id: download-window
        kind: Task
        name: The download budget is a rolling 24-hour window
        description: >-
          Replace the single-slot date/count ledger with recorded download timestamps and a rolling
          24-hour window, following RequestPacer's precedent; make the docstring, the container and
          the runbooks agree, and report the window and its spend in the run summary.
        dependsOn: [retry-failed-import]
        estimatedEffort: 1.5h
        acceptanceCriteria:
          - type: test_passes
            name: Rolling-window budget tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/test_caselist_sync.py, -k, window]
      - id: openev-already-held
        kind: Task
        name: OpenEv selection sees hand-imported camp files
        description: >-
          Decide OpenEv candidates against the manifest rather than the inbox name, so a hand-imported
          camp file is ALREADY_IMPORTED.
        dependsOn: [download-window]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: OpenEv selection tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/test_caselist_sync.py, -k, openev]
      - id: runbook-correction
        kind: Task
        name: Correct the scheduled-sync runbook
        description: >-
          Remove the "run the same command again" recovery advice and describe what the fixed run does.
        dependsOn: [openev-already-held]
        outputs: [docs/runbooks/caselist-scheduled-sync.md]
        estimatedEffort: 0.5h
        acceptanceCriteria:
          - type: command_succeeds
            name: Repository links still resolve
            command: uv
            args: [run, scripts/check_links.py]
status:
  phase: Pending
