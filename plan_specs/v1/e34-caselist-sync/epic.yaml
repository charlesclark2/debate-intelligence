      kind: Task
      name: Periodic full-archive refresh
      description: >-
        A monthly per-caselist rotation that fetches `<slug>-all-<date>.zip`, at most one per run and
        budgeted after the weeklies, so withdrawals are visible against the complete archive without
        exceeding the 5-per-day cap.
      inputs:
        specRef: plan_specs/v1/e34-caselist-sync/t04-full-archive-refresh.yaml
        goalRef: v1-e34-t04-full-archive-refresh
      dependsOn:
      - t02
      - ext-v1-e30-t06-initial-backfill
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e34-t04-full-archive-refresh reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e34-t04-full-archive-refresh
status:
  phase: Pending
