# TASK v3-e22-t05-coverage-report-ui — Coverage report UI and export
# Epic: E22 Case Coverage Analysis | Release: v3.1 (Case coverage analysis) | Major: V3
# Architecture refs: §3 V3 stories, §6 ExportService, §12 web workflows, §13 Coverage analysis
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v3-e22-t05-coverage-report-ui
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v3
    debate/release: v3.1
    debate/epic: v3-e22-coverage-analysis
  annotations:
    debate/title: Coverage report UI and export
    debate/architecture-refs: §3, §6, §12, §13
spec:
  description: >-
    Show a coverage analysis as an interactive report and export it to DOCX and PDF. Students start an
    analysis by choosing an aff file and their answer files; the report groups predicted positions
    (off-case, then on-case) with COVERED/WEAK/UNCOVERED status, explanation, confidence and an explicit
    "prediction, inference" label, and every finding links to the predicted node in the graph viewer and to
    the responding cards. Exports render from the same report model and include node/card references; they
    never reproduce evidence except as existing card records with their verification or import badges.
    Boundaries: classification logic is t04 and the graph viewer itself is E21-t06.
  priority: 2
  constraints:
    packages: [debate_api, debate_core.application, debate_workers, web]
    forbidden:
      - >-
        Business logic in debate_api routes or web/ components (they call debate_core services or the typed
        client)
      - Presenting imported or UNVERIFIED cards as platform-verified finished evidence
      - Presenting predicted positions without the inference label and confidence
      - Export links valid longer than 15 minutes
  context:
    - kind: TaskRef
      name: v3-e22-t04-gap-detection
      relation: dependsOn
    - kind: TaskRef
      name: v3-e21-t06-graph-viewer
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        POST /coverage-analyses creates a CoverageAnalysisJob from an aff file id and answer file ids, GET
        returns status and findings, and POST /coverage-analyses/{id}/exports returns a presigned download
        when the ExportJob completes.
    - id: ac2
      description: >-
        The report groups findings by position with status counts, defaults to uncovered-first, and filters
        by status and kind.
    - id: ac3
      description: >-
        Every finding links to its predicted node (graph viewer) and to each responding card (library or
        file outline).
    - id: ac4
      description: >-
        DOCX and PDF exports contain the same findings, labels and references as the web report.
    - id: ac5
      description: >-
        Playwright tests cover starting an analysis, filtering, following links and exporting.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v3-e22-t05-coverage-report-ui-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v3
    debate/release: v3.1
    debate/epic: v3-e22-coverage-analysis
spec:
  description: >-
    API first, then the report page, exports and end-to-end tests.
  goalRef:
    name: v3-e22-t05-coverage-report-ui
  graph:
    nodes:
      - id: api
        kind: Task
        name: Coverage analysis endpoints
        description: >-
          Create/get/export routes with owner/org authorization; typed client regenerated.
        outputs: [packages/debate_api/src/debate_api/routes/coverage.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Coverage API tests pass
            command: uv
            args: [run, pytest, packages/debate_api/tests/test_coverage_analyses.py]
      - id: report-page
        kind: Task
        name: Report page
        description: >-
          Setup form (aff + answer files), progress, grouped findings, filters and links.
        dependsOn: [api]
        outputs: ["web/app/(app)/coverage/[analysisId]/page.tsx", web/components/coverage/FindingCard.tsx]
        estimatedEffort: 4h
        acceptanceCriteria:
          - type: test_passes
            name: Coverage report unit tests pass
            command: pnpm
            args: [--dir, web, test, --, coverage]
      - id: exports
        kind: Task
        name: DOCX and PDF export
        description: >-
          ExportService report renderer (python-docx) and PDF via WeasyPrint from the same report model, run
          in an ExportJob; structural golden tests.
        dependsOn: [api]
        outputs: [packages/debate_core/src/debate_core/application/exports/coverage_report.py]
        estimatedEffort: 4h
        acceptanceCriteria:
          - type: test_passes
            name: Coverage export tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/test_coverage_export.py]
      - id: e2e
        kind: Task
        name: End-to-end tests
        description: >-
          Playwright flows with mocked API; axe checks; lint and build.
        dependsOn: [report-page, exports]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Coverage report e2e passes
            command: pnpm
            args: [--dir, web, exec, playwright, test, tests/e2e/coverage-report.spec.ts]
          - type: command_succeeds
            name: Web build succeeds
            command: pnpm
            args: [--dir, web, build]
status:
  phase: Pending
