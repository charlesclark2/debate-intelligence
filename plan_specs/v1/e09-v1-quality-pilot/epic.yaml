      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e09-t01-golden-card-fixtures reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e09-t01-golden-card-fixtures
    - id: t02
      kind: Task
      name: Golden DOCX regression tests
      description: >-
        Structural comparison of rendered DOCX (runs, styles, underline/highlight ranges) against golden
        outputs.
      inputs:
        specRef: plan_specs/v1/e09-v1-quality-pilot/t02-docx-golden-tests.yaml
