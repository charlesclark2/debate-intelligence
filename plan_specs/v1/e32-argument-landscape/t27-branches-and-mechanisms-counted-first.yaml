  acceptanceCriteria:
    - id: ac1
      description: >-
        Counts before building, read-only: (a) and (b) above, sent to the PM with the three
        options.
    - id: ac2
      description: >-
        After the ruling, on synthetic fixtures, the chosen option matches hand-written
        golden files; tests shown failing first.
    - id: ac3
      description: >-
        The operator's dry run on hspolicy26 shows the Midterms DA's branches or the Economy
        DA's mechanism as ruled, with counts before and after (operator).
status:
  phase: Pending
