    The providers named as having no adapter are pinned to the container's discovery factories.
  goalRef:
    name: v1-e07-t17-providers-without-an-adapter-pinned-to-the-factories
  graph:
    nodes:
      - id: providers-without-an-adapter-pinned-to-t
        kind: Task
        name: Adapter set pinned
        description: >-
          The providers named as having no adapter are pinned to the container's discovery
          factories.
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Adapter set pinned tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests, packages/debate_cli/tests, -k, provider]
