# TASK v1-e37-t03-announcements - Announcements and news
# Epic: E37 Calendar & Announcements | Release: v1.6 | Major: V1
# Architecture refs: ADR-0015 (as accepted 2026-10-01), docs/policies/website-publishing.md
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e37-t03-announcements
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.6
    debate/epic: v1-e37-calendar-and-announcements
  annotations:
    debate/title: Announcements and news
spec:
  # Rewritten by the PM, 2026-10-01, when ADR-0015 was revised before acceptance: announcements are
  # Markdown files in the repository, not a Google Sheet or CMS, so the source adapter, its tokens and
  # its last-good fallback are gone. ac1-ac3, ac6 and ac7 carry over unchanged in substance.
  description: >-
    Publish announcements (for example "Novice orientation Tuesday" or "Congratulations to our PF
    teams at Marquette") from Markdown files in site/content/announcements/, one file per item,
    rendered by the static site: pinned items then the newest non-expired items on the home page, a
    /news list, and one page per item. Each item has a title, publish date, Markdown body, optional
    expiry and optional pin; an optional image is allowed only with a media-consent manifest entry.
    A build-time validator enforces the publishing policy: schema errors, a likely student full name
    that is not on the public-names allowlist, email addresses, phone numbers, raw HTML or scripts
    and third-party embeds fail the build for that item with a message the editor can act on. Two
    gaps in that guard, found by the v1-e36-t08 review, close here because this is the task that
    first publishes an image: the name rules run over visible text only, so a name in an alt
    attribute is invisible to them; and nothing stops the reviewed-phrase allowlist decaying back
    into bare words. Expiry is evaluated at build time, so an expired item disappears at the next
    deploy, not on its date; the guide says so. The coach guide's announcements section is rewritten
    for these files. Out of scope: the schedule (t02), the parent email list (t05), and reading
    Buttondown's archive feed, which ADR-0015 names as a later option.
  priority: 2
  constraints:
    packages: [site/content, site/src, site/scripts, site/tests, docs/guides]
    forbidden:
      - Publishing student full names, student contact details, or photos without a media-consent entry
      - Rendering unsanitized HTML, scripts, iframes or third-party embeds from announcement bodies
      - Network calls at build time, in tests, or from a visitor's browser
      - A runtime backend; content is baked in at build time
  context:
    - kind: TaskRef
      name: v1-e37-t01-content-editing-decision
      relation: dependsOn
    - kind: TaskRef
      name: v1-e36-t04-core-pages
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        With fixture content, the home page shows pinned items first then the three newest
        non-expired announcements, /news lists all non-expired items newest first, and each item has
        its own page with title, date and rendered body.
    - id: ac2
      description: >-
        An announcement whose expiry date is before the build date appears on no page and is absent
        from the sitemap.
    - id: ac3
      description: >-
        The validator rejects fixtures containing a non-allowlisted "First Last" student name, an
        email address, a phone number, a script or iframe, or an image without a media-consent
        entry, naming the item and the rule from docs/policies/website-publishing.md; valid items
        still publish.
    - id: ac4
      description: >-
        docs/guides/coach-website-editing.md explains how to add, change, pin, expire and remove an
        announcement file, which publish path to use under ADR-0015 point 4, that expiry takes
        effect at the next deploy, and what may never be written. It no longer describes a Google
        Sheet.
    - id: ac5
      description: >-
        `pnpm --dir site lint`, `typecheck`, `test` and `build` pass offline, and Charlie publishes
        and then expires one real announcement end to end through dev and prod; the report records
        it.
    - id: ac6
      description: >-
        The publishing-policy name rules read image alt text and figure captions as well as visible
        text, so a non-allowlisted "First Last" in an alt attribute fails the build with the same
        message it would get in body copy, with a fixture proving it; this must land before the
        first photograph is published.
    - id: ac7
      description: >-
        A check keeps the media-consent allowlist in reviewed phrases rather than bare words: every
        entry is either multi-word or on a short, explicitly reviewed list of ordinary single words,
        and the check fails on a new bare-word entry outside that list, so the v1-e36-t08 ruling
        cannot quietly erode.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e37-t03-announcements-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.6
    debate/epic: v1-e37-calendar-and-announcements
spec:
  description: >-
    Schema and fixtures, the policy validator and its two gaps, the pages, then the guide.
  goalRef:
    name: v1-e37-t03-announcements
  graph:
    nodes:
      - id: schema-and-fixtures
        kind: Task
        name: Announcement schema and fixtures
        description: >-
          Front-matter schema for site/content/announcements/*.md and fixtures covering every rule.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: command_succeeds
            name: The site tests pass
            command: pnpm
            args: [--dir, site, test]
      - id: policy-validator
        kind: Task
        name: Publishing-policy validator, alt text and the allowlist check
        description: >-
          Apply the policy rules to announcements, extend the name rules to alt text and captions, and
          guard the reviewed-phrase allowlist.
        dependsOn: [schema-and-fixtures]
        estimatedEffort: 4h
        acceptanceCriteria:
          - type: custom
            name: Each rule is shown failing on a fixture and passing on a valid item
            description: >-
              Every rule in ac3, ac6 and ac7 has a fixture that fails the build naming the item and
              the rule, and the valid fixtures publish.
      - id: pages
        kind: Task
        name: Home, /news and item pages
        description: >-
          Pinned then newest on the home page, the /news list and per-item pages; expired items absent.
        dependsOn: [policy-validator]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: command_succeeds
            name: The site builds
            command: pnpm
            args: [--dir, site, build]
      - id: guide
        kind: Task
        name: Rewrite the announcements section of the coach guide
        description: >-
          How to write, publish and expire an announcement file.
        dependsOn: [pages]
        outputs: [docs/guides/coach-website-editing.md]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: artifact_exists
            name: docs/guides/coach-website-editing.md
            path: docs/guides/coach-website-editing.md
            contentMatch: "site/content/announcements"
status:
  phase: Pending
