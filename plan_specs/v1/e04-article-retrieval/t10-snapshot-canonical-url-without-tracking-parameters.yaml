          A snapshot's canonical URL drops the tracking parameters its article's does.
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Canonical URL tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests, -k, snapshot or canonical]
