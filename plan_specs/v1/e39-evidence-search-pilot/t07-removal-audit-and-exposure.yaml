# TASK v1-e39-t07-removal-audit-and-exposure - Removal, access audit and exposure: the pilot meets the policy's E39 gate
# Epic: E39 — Team Evidence Search (Student Pilot) | Release: v1.7 (Team evidence search pilot) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e39-t07-removal-audit-and-exposure
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.7
    debate/epic: v1-e39-evidence-search-pilot
  annotations:
    debate/title: "Removal, access audit and exposure: the pilot meets the policy's E39 gate"
spec:
  # Filed by the PM, 2026-10-19, from Charlie's direction of 2026-10-19 (a student search pilot before the
  # semester ends, on Chromebooks, signing in with a username, password and 2FA, outside the school's systems).
  description: >-
    (1) Removal: the function re-reads the suppression list at most five minutes apart and hides
    every occurrence it names from results, card pages and downloads; a card left with no
    occurrence answers as not found. The removal runbook gains the pilot: after `caselist
    remove`, rebuild and publish the index, then delete the superseded index versions under
    `reports/tub/search/`, noncurrent versions included. It is exercised end to end in dev and
    prod with a synthetic source (operator). (2) Audit: each card page view, copy, download and
    account change writes one append-only record (time, the actor's pool subject, role, action,
    cluster ids or a count) and nothing else: no query text, URL, token, name, team code,
    evidence text or IP address. Searches are counted, never recorded with their words. (3)
    Exposure: a check over the plan and the deployed responses that the buckets' Block Public
    Access is intact, no object is publicly reachable, signed-in responses are marked private
    and no-store, CloudFront keeps no access log, and the application logs no query text,
    school, team code or card text.
    (PM amendment 2026-10-19, from ADR-0019 and v1-e39-t01's PM questions.) Deleting superseded
    index versions needs delete on `reports/tub/search/`. That prefix alone is added to the
    removal credential's delete side, in docs/architecture/evidence-store-layout.md and the
    evidence bucket's IAM policy; nothing else under `reports/` gains a delete.
    (PM amendment 2026-10-21, from the v1-e39-t03, t06 and t09 reviews.) The removal side builds
    on what is merged. v1-e39-t03's search and card lookup take `is_suppressed(source_sha256,
    disclosure_digest)`; this task wires it to the live suppression list, re-read inside
    v1-e39-t06's index holder refresh (`_refresh`, the same at-most-five-minutes loop that
    rechecks `current.json`), so an environment frozen past five minutes rechecks the list
    before it answers. A card whose representative is suppressed is hidden until the next build
    (v1-e39-t03's behaviour, kept), and the team count after a partial suppression stays
    `surviving_counts`'s rule. The card page view (`/cards/<caselist>/<cluster id>`) and Copy
    card (`/cards/<caselist>/<cluster id>/copy`) are the two requests that write the view and
    copy records, in v1-e39-t05's audit shape (subjects, never names).
    `docs/runbooks/evidence-search.md` gains what the function fetches and when (ADR-0019 (c) 3
    and 5) and what an index refusal looks like in the app log. Superseded local index
    directories are already pruned by v1-e39-t09; this task prunes the bucket's.
  priority: 1
  constraints:
    packages: [debate_api, debate_core.application, packages/debate_api/tests, docs/runbooks, docs/data, docs/architecture, infrastructure]
    forbidden:
      - A query, school, team code, evidence text, URL, token or IP address in an audit record or log
      - Card text, a school, team code, file name, student name, username or email in any fixture, log, report or commit (synthetic values only)
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e39-t06-search-pages
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A suppressed occurrence is gone from results, card pages and downloads within five
        minutes, by test with a fake clock, shown failing first.
    - id: ac2
      description: >-
        Every audit record validates against a committed schema, and a test over every
        action shows none of the forbidden fields.
    - id: ac3
      description: >-
        Running the full Playwright journey with a fixture school, team code and query, the
        captured application logs contain none of them, by test.
    - id: ac4
      description: >-
        The removal runbook's pilot steps are exercised in dev and prod with a synthetic
        source, and the operator's record is in the report.
    - id: ac5
      description: >-
        The report maps each item of the policy's E39 gate to the test or operator record
        that proves it.
    - id: ac6
      description: >-
        (PM amendment 2026-10-19) The removal credential can delete under
        `reports/tub/search/` and nowhere else under `reports/`, by the existing grant-scope
        test extended, and the layout document says so.
    - id: ac7
      description: >-
        (PM amendment 2026-10-21) The suppression list is re-read in the index holder's
        refresh, at most five minutes apart, and an environment frozen longer rechecks
        before answering, by test with an injected clock, shown failing first.
    - id: ac8
      description: >-
        (PM amendment 2026-10-21) The evidence-search runbook says what the function
        fetches, when, and what an index refusal looks like, and the docs checks pass.
status:
  phase: Pending
