# The edits v1-e32-t28's golden files make to the synthetic caselist (../synthetic_caselist/): t25's
# edits (../readable_impact_chains/edits.yaml), then four tags more. README.md works out the expected
# tables by hand.
#
# cards: a card by its file (the digest's first two characters, repeated) and first paragraph, and its
# new tag. Every other field is the fixture's.
cards:
  - {file: a1, element_index: 6, tag: "2. Extinction from a Cedarvale collapse"}
  - {file: a3, element_index: 15, tag: null}
  - {file: a4, element_index: 3, tag: "Bulk purchasing lowers drug prices later"}
  - {file: b5, element_index: 6, tag: "Spending is at a classic record high now"}
  - {file: b6, element_index: 0, tag: "Insurance means private carriers too, per Birchmoor"}
  - {file: a5, element_index: 3, tag: "Conditionality is a voting issue for VV"}
# scenario_lists: t25's, by position id. Every other position keeps no list.
scenario_lists:
  costs-advantage:
    not_scenarios: [economic collapse]
  spending-da:
    scenarios:
      - name: Market crash
        forms: [cedarvale crash]
    not_scenarios: [recession]
