spec:
  # Filed by the PM, 2026-11-01, from the coach's read of hspolicy26's landscape report (2026-10-31).
  description: >-
    The coach read hspolicy26's landscape report (the 2026-10-30 republish) to draft a States CP
    file and found its top CP texts cut short: ranks 1 and 2 end at a colon ("... containing:"),
    with the planks that follow left out, and rank 3 stops mid-phrase. `analytic_texts.py` shows
    a group's commonest paragraph word for word, and since v1-e32-t16 it reads the planks after
    a CP text ending in a colon only to place them, never to show them. Count first, over the
    store in place (counts only, nothing quoted or committed): how many shown CP texts end in a
    colon, and how many end with no sentence end where the next paragraph in the source
    continues them (no capital, no heading, no card between), and what that continuation is in
    Verbatim terms (a second analytic, an undertag, a soft break the parser split). Then show a
    CP text whole: its planks, read by t16's rules and capped as they are, under it as one
    quoted text, and a continuation joined to it when the count shows the shape. The digest that
    groups texts then covers the whole text, so say how a group's rank and count change and
    whether any cached reading must be refreshed (`v1-e32-t30`'s analytic-text cache). Keep
    every existing rule: a text naming a school of the caselist is withheld whole, planks
    included, and nothing but the shown text is ever logged or cached as words.
  priority: 2
  constraints:
    packages: [debate_core.arguments, debate_core.application, debate_core.domain, debate_core.testing, tests/fixtures/landscape, packages/debate_core/tests, docs/guides]
    forbidden:
      - A CP text's words logged, cached or committed outside the report's own quoted text
      - A text or plank naming a school of the caselist shown
      - A real disclosed text in a fixture
  context:
    - kind: TaskRef
      name: v1-e32-t16-advantage-cp-planks
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The counts are recorded first; then a CP text ending in a colon is shown with its
        planks, a text continued in the next paragraph is joined where the count found that
        shape, a plank naming a school withholds the whole text, and the group's digest
        covers what is shown, by synthetic fixtures and tests shown failing first.
status:
  phase: InProgress
