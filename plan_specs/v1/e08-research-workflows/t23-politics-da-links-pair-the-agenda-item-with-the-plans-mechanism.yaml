spec:
  # Filed by the PM, 2026-11-09, from v1-e08-t14's ac3 and the coach's criterion (the operator's labels of 2026-11-08).
  description: >-
    The coach labelled v1-e08-t14's repeated Policy search, the politics DA's link on national
    health insurance, blind on 2026-11-08: 6 relevant of 19 rows. His criterion: a politics DA
    link card is relevant only when it ties the plan's mechanism to the political fight over a
    specific piece of legislation, because each politics DA turns on its own agenda item. Today
    the politics DA's link queries cross the plan's mechanism with generic templates (political
    capital, and with v1-e08-t16 party popularity) and name no bill. So a politics DA search
    takes the DA's agenda item, a bill's name or number that the debater types or a preset
    names, and its link queries pair that agenda item with the plan's mechanism; without an
    agenda item the search says its link queries are generic. Proposal first: the option's name,
    how the agenda item enters the queries (new templates, since a coach-reviewed template is
    never changed), the queries per search, and how it composes with v1-e08-t16's crossing. Stop
    for the PM's ruling; the coach reviews the new templates (operator). Then the operator
    repeats the search with a real agenda item and the coach labels it blind, recorded against 6
    of 19.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_core.domain, debate_cli, config, packages/debate_core/tests, packages/debate_cli/tests, docs/guides]
    forbidden:
      - A change to a coach-reviewed template
      - A live provider call in a test
      - A school, team code or debater name anywhere
  context:
    - kind: TaskRef
      name: v1-e08-t14-da-links-name-the-plans-mechanism-in-the-united-states
      relation: dependsOn
    - kind: TaskRef
      name: v1-e08-t16-mechanism-queries-cross-the-chosen-link-templates
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The proposal is ruled on by the PM and the coach has reviewed the new templates
        (operator) before they are used.
    - id: ac2
      description: >-
        With an agenda item every politics DA link query carries it and the plan's
        mechanism, and without one the search says its link queries are generic, by tests on
        fixtures shown failing first.
    - id: ac3
      description: >-
        The operator repeats the Policy search with a real agenda item and the coach labels
        it blind; the PM records nDCG@10 and the relevant count against v1-e08-t14's (6 of
        19) (operator).
status:
  phase: Pending
