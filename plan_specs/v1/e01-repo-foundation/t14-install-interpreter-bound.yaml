# TASK v1-e01-t14-install-interpreter-bound — One source for the supported interpreter
# Epic: E01 Repository & Delivery Foundation | Release: v1.0 (Foundation & verified evidence core) | Major: V1
# Architecture refs: §4 (uv packaging), §17 (guardrails)
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e01-t14-install-interpreter-bound
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
  annotations:
    debate/title: One source for the supported interpreter, enforced at install
spec:
  description: >-
    Which Python this tool supports is one decision written in three places, and the two that are
    load-bearing are not connected. `debate_core`'s `requires-python = ">=3.12,<3.13"` exists because
    the evidence normalizer pins Unicode 15.0.0 (v1-e03-t01): a different Unicode database would give
    the same source text a different fingerprint, so `normalize` refuses to run rather than silently
    change what a card hashes to. v1-e03-t01 ties that bound to the pinned version by test, so those
    two cannot drift. The third copy is `PYTHON_VERSION=3.12` in scripts/install_channel.sh, tied to
    nothing - and it is the only one that actually protects an install, because uv deliberately
    ignores upper bounds on a dependency's `Requires-Python`. v1-e03-t01 measured this against our own
    wheels with uv 0.11.7: `uv tool install --python 3.13`, `uv pip install` and a --find-links
    resolution all installed on 3.13, while pip refused with "requires a different Python". So a
    hand-run uv install on the wrong interpreter succeeds, and the first sign of trouble is
    `UnicodeDatabaseMismatchError` from inside a pipeline. The supported installer is safe only by a
    constant that nobody will remember to update. This task makes the script derive the interpreter
    from the wheel's own metadata, and gives `doctor` the ability to fail so that an install on the
    wrong interpreter is caught at install time rather than at first use. Out of scope: raising or
    relaxing the Unicode pin, the normalizer itself, and the `validate-dev` smoke suite (v1-e01-t10),
    which validates a build in CI rather than an install on an operator's machine.
  priority: 2
  constraints:
    packages:
      - scripts
      - debate_cli.commands
      - docs/runbooks
      # added on the PM's instruction, 2026-10-02
      - .github/workflows
      - tests/scripts
      - tests/architecture
      - debate_cli.installation
      - packages/debate_cli/tests
      - packages/debate_cli/README.md
      # added on the PM's instruction, 2026-10-02 (answers to the session's scope questions): a
      # public accessor for the normalizer's pin, the workspace members' requires-python lines, and
      # the documents and comments that named a version instead of pointing at the metadata
      - debate_core.evidence.normalization
      - pyproject.toml
      - packages/*/pyproject.toml
      - uv.lock
      - README.md
      - docs/evidence/normalization.md
      - docs/architecture/architecture_proposal.md
      - debate_core.application.snapshot_service
    forbidden:
      - A fourth statement of the supported interpreter anywhere, including documentation that names
        a version rather than pointing at the metadata
      - Relaxing or removing `debate_core`'s upper bound as an alternative
      - Making `doctor` fail on anything other than a check it can state precisely
      - Network access in the tests for this task
  context:
    - kind: TaskRef
      name: v1-e01-t09-dev-prerelease-channel
      relation: dependsOn
    - kind: TaskRef
      name: v1-e03-t01-text-normalization
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        scripts/install_channel.sh derives the interpreter it requests from the `Requires-Python`
        metadata of the `debate_core` wheel it is about to install, rather than from a constant in the
        script. A test proves the link: changing the bound in the wheel metadata changes what the
        script asks uv for, and a wheel whose metadata cannot be read makes the script refuse rather
        than fall back to a guess. `PYTHON_VERSION=3.12` is gone.
    - id: ac2
      description: >-
        `debate-research doctor` reports whether the running interpreter's Unicode database matches
        the version the normalizer pins, and exits non-zero when they disagree, naming both versions
        and the policy page. This is a change of contract: `doctor` reports what exists today and
        never fails, so the task must say what its exit codes now mean, in the command's docstring and
        in the runbook, and every other fact it reports must stay non-failing. A doctor that cannot
        say "this is broken" is not a doctor, but one that fails on a fact it cannot state precisely
        is worse than one that only describes.
    - id: ac3
      description: >-
        scripts/install_channel.sh runs `doctor` as part of its post-install check and fails the
        install when it exits non-zero, leaving no half-installed tool on the path. Proved against a
        real install on a 3.13 interpreter: the install fails, names the mismatch, and
        `command -v debate-research` finds nothing new afterwards. The existing `--version --json`
        check stays; this is an addition to it, not a replacement.
    - id: ac4
      description: >-
        The supported interpreter is stated in exactly one place, `debate_core`'s `requires-python`,
        and every other mention derives from it or points at it. A test enumerates the repository for
        a hardcoded Python version outside that one declaration, `.python-version` and the CI matrix,
        and fails on a new one. The runbook describes how to check an install rather than which
        version to pass.
    - id: ac5
      description: >-
        Added by the PM, 2026-10-02, from v1-e01-t17's follow-up work. `install_channel.sh` runs
        `uv tool install --force` before any check, so a build that fails `--version`, the provenance
        check or `python -m debate_cli.installation` has already replaced the build the weekly launchd
        agent runs. The script installs into a temporary uv tool directory first, runs every check
        there, and replaces the real install only if all of them pass. A test shows a build failing its
        integration check leaves the previous install untouched. If `doctor` gains the ability to fail
        here (ac2), it runs in that rehearsal too, so one command answers "is this installation
        sound".
    - id: ac6
      description: >-
        Added by the PM, 2026-10-02, from v1-e01-t10's follow-up work. `install_channel.sh` warns that
        `debate-research` on this PATH is another build on every automated install, where the warning is
        noise: validate-dev and dev-prerelease install into scratch tool directories that are never on
        the PATH. An explicit option (not a guess from the environment) silences that one warning for
        such installs; every other message, and every failure, is unchanged. A person running the
        script by hand still sees it. Both workflows pass the option, and a test shows the warning
        present without it and absent with it.
status:
  phase: InProgress
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e01-t14-install-interpreter-bound-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
spec:
  description: >-
    The failing check first, then the source of truth, then the install-time gate that uses it.
  goalRef:
    name: v1-e01-t14-install-interpreter-bound
  graph:
    nodes:
      - id: doctor-can-fail
        kind: Task
        name: doctor checks the Unicode database and can fail
        description: >-
          Add the normalizer's pinned version and the running database to `environment_report`, decide
          and document what a non-zero `doctor` means, and fail only on that one check. Reproduce
          first with a faked `unicodedata.unidata_version`.
        outputs:
          - packages/debate_cli/src/debate_cli/commands/doctor.py
          - packages/debate_cli/tests/commands/test_doctor.py
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: doctor tests pass
            command: uv
            args: [run, pytest, packages/debate_cli/tests/commands/test_doctor.py]
      - id: interpreter-from-metadata
        kind: Task
        name: The install script reads the wheel's Requires-Python
        description: >-
          Parse `Requires-Python` from the `debate_core` wheel's METADATA and pass the resulting
          version to uv; refuse rather than guess when it cannot be read.
        dependsOn: [doctor-can-fail]
        outputs:
          - scripts/install_channel.sh
          - tests/scripts/test_install_channel.py
        estimatedEffort: 2.5h
        acceptanceCriteria:
          - type: test_passes
            name: Install script tests pass
            command: uv
            args: [run, pytest, tests/scripts/test_install_channel.py]
          - type: command_succeeds
            name: Install script passes shellcheck
            command: shellcheck
            args: [scripts/install_channel.sh]
      - id: one-source
        kind: Task
        name: One statement of the supported interpreter
        description: >-
          Remove the remaining hardcoded versions, add the test that forbids a new one, and rewrite
          the runbook to describe checking an install rather than naming a version.
        dependsOn: [interpreter-from-metadata]
        outputs:
          - docs/runbooks/caselist-scheduled-sync.md
          - tests/architecture/test_single_interpreter_source.py
        estimatedEffort: 1.5h
        acceptanceCriteria:
          - type: test_passes
            name: Single-source test passes
            command: uv
            args: [run, pytest, tests/architecture/test_single_interpreter_source.py]
status:
  phase: Pending
