        A coach sample with a second label column scores an answer naming either label
        correct, refuses an invalid or repeated second label, reports the second-label count
        in the breakdown, and scores a sample without the column exactly as before, by tests
        shown failing first.
    - id: ac3
      description: >-
        The coach's relabelled sample reads without refusal (operator, recorded by the PM).
