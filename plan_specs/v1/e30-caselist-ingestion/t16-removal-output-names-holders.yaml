# TASK v1-e30-t16-removal-output-names-holders - The removal plan names holders correctly in every case
# Epic: E30 Caselist Evidence Ingestion | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e30-t16-removal-output-names-holders
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e30-caselist-ingestion
  annotations:
    debate/title: "The removal plan names holders correctly in every case"
spec:
  # Filed by the PM, 2026-10-11, from v1-e30-t10's Follow-up work 2 and 4.
  description: >-
    v1-e30-t10 fixed "also held by N other team(s)" for a `--source` removal of a caselist file.
    The same defect remains in other plan lines. (1) A `--source` plan of a file only one camp
    file holds says "also held by 1 camp file(s)". (2) A `--source` plan says "this team's"
    where there is no requesting team: "N of this team's path(s) to a shared file", and "this
    team's copies of 0 shared file(s)" in the facts for the confirmation to the requester. (3)
    For a later upload withdrawn from a path, `other_teams` counts the teams at its other paths
    without leaving out the team at the removed path, so a second path of the same team would
    read "1 other team(s)". No fixture has that case yet. (4) A shared file withdrawn from one
    caselist and kept in another cannot be attributed afterwards: nothing in the suppression
    list or the removal log says which caselist the withdrawal took it from. Out of scope: the
    JSON keys v1-e30-t11 settled, which stay as they are.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, tests/smoke, docs/runbooks]
    forbidden:
      - A change to the plan's JSON keys v1-e30-t11 settled
      - A school, team code or file name in a plan line, the suppression list or the removal log
  context:
    - kind: TaskRef
      name: v1-e30-t10-removal-docstrings-and-residue
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Each of (1) to (3) has a fixture shown failing first, and the text and JSON name
        only holders other than the one removed. A file no other holder has says nothing of
        other holders.
    - id: ac2
      description: >-
        Case (3) is built first as a fixture of a later upload at a second path of the same
        team, and its result is recorded in the report whether or not it was failing.
    - id: ac3
      description: >-
        A withdrawal records which caselist it took the file from, by slug, in the removal
        log and in the suppression entry, readable by the build at the start commit.
    - id: ac4
      description: >-
        No plan line says 'this team's' where the removal names no team, by a test that
        walks every line of a `--source` plan.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e30-t16-removal-output-names-holders-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e30-caselist-ingestion
spec:
  description: >-
    Fix the remaining holder wording and record the caselist of a withdrawal.
  goalRef:
    name: v1-e30-t16-removal-output-names-holders
  graph:
    nodes:
      - id: holder-wording
        kind: Task
        name: Holders named correctly
        description: >-
          The three wording fixes, the attribution and their fixtures.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Removal tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application, -k, removal]
status:
  phase: Pending
