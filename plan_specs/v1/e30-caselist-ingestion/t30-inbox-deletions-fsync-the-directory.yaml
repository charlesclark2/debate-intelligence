spec:
  # Filed by the PM, 2026-10-30, from v1-e30-t26's Follow-up 1.
  description: >-
    v1-e30-t26 gave the inbox rewrite the directory fsync, but `inbox_purge._carry_out` deletes
    a planned inbox file with `path.unlink()`, and the rewrite removes its staging directory,
    and neither fsyncs the inbox directory after. After a power cut a deleted archive that held
    removed bytes can come back: a takedown that did not hold. fsync the directory after each
    delete, with `durable_files.fsync_directory`, and raise a failed fsync.
  priority: 2
  constraints:
    packages: [debate_core.application, packages/debate_core/tests]
    forbidden:
      - Network or AWS access in any test
  context: []
  acceptanceCriteria:
    - id: ac1
      description: >-
        Each inbox deletion is followed by a directory fsync, and a failed one raises, by a
        recording test shown failing first.
