      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The stance label's format and the relabelling are ruled on by the PM, and the
        coach's relabelled sample reads with `--check-sample` (operator).
    - id: ac2
      description: >-
        Prompt 1.2.0 carries (a), (b) and the stance, the evaluation scores a wrong stance
        as its own outcome, by tests on invented cards shown failing first, and the prompt's
        version is bumped with its cassettes keyed by it.
    - id: ac3
      description: >-
        The operator's re-record of the 47 under 1.2.0 on the PM's route, its breakdown and
        scans, is recorded in docs/data beside 1.1.0's (operator, recorded by the PM).
status:
