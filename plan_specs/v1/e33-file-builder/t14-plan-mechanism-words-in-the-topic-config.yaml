spec:
  # Filed by the PM, 2026-10-31, from v1-e33-t11's question 2 (the PM's ruling B, 2026-10-31).
  description: >-
    v1-e33-t11's plank rule (an affirmative's alias or tag keyword, or a t16 plank label) marked
    1 of 68 kept blocks on hspolicy26 and missed both blocks the coach named, a preemption block
    and a waiver block. Add a per-topic list of plan-mechanism words to the landscape topic
    config (config/landscape, beside the topic's other files), loaded and validated with the
    config, which the coach edits; seed hspolicy26's with `preempt`, `preemption`, `waiver` and
    `waive`, and say the coach adds more. t11's rule also marks a kept block whose heading holds
    one of these words as a whole word (or its stem, if you choose and state a stemming rule).
    The rule's other two parts are unchanged. Measure on hspolicy26 as t11 did: the blocks
    marked before and after.
    (PM amendment 2026-10-31, from v1-e33-t13's question 1, ruling B.) Also give a kept affirmative-side
    block (v1-e33-t13) its own comment, saying why it was marked, e.g. "Check this block against the
    affirmative's plan: its heading names an affirmative or one of its advantages."; t11's plank comment
    stays for blocks this rule or t11's marks; a block marked both ways gets one comment, the plank one.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.integrations, packages/debate_core/tests, config/landscape, tests/config, docs/guides]
    forbidden:
      - A team's text written into a draft
      - A topic without the list refused
  context:
    - kind: TaskRef
      name: v1-e33-t11-suggest-drafts-a-cp-file-a-coach-can-build-on
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A topic's plan-mechanism words load with its config, a CP draft marks a kept block
        whose heading holds one, a topic with no list behaves as before, and hspolicy26's
        preemption and waiver blocks are marked, by counts and tests shown failing first.
