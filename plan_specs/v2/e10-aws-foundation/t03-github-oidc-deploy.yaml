# TASK v2-e10-t03-github-oidc-deploy — GitHub OIDC deploy roles
# Epic: E10 AWS & Infrastructure-as-Code Foundation | Release: v2.0 (Cloud platform foundation) | Major: V2
# Architecture refs: §4 GitHub Actions + ECR, §5, §14 least-privilege IAM, §15
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e10-t03-github-oidc-deploy
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.0
    debate/epic: v2-e10-aws-foundation
  annotations:
    debate/title: GitHub OIDC deploy roles
    debate/architecture-refs: §4, §5, §14, §15
spec:
  description: >-
    Let GitHub Actions reach AWS without long-lived keys. Create the GitHub OIDC identity provider and,
    per environment, three least-privilege roles: a read-only plan role (assumable only from the dev
    branch, for post-merge, nightly drift and manually dispatched plans), an apply role and an app-deploy
    role (push to ECR, update ECS services). Trust follows ADR-0013
    (docs/process/branching-and-environments.md): dev apply/deploy roles trust only
    `repo:<owner>/debate-intelligence:ref:refs/heads/dev` (and the `development` environment subject);
    prod apply/deploy roles trust only `repo:<owner>/debate-intelligence:environment:production`, an
    environment restricted to main with required reviewers, so nothing but main reaches prod. Wire
    reusable workflows that assume them. terraform plan against a real account never runs on PRs into
    dev (docs/process/working-agreements.md §1): a PR's author runs the dev plan locally as an operator
    step and pastes the summary into the PR; CI plans run after the merge (before dev apply), nightly as a
    drift check, and on workflow_dispatch.
    This task does NOT define what gets deployed (API deploy is E12-t04, workers E13-t02, web E14-t03);
    it supplies the trust relationships and reusable workflow plumbing they call. It builds on the V1
    AWS baseline: the dev and prod accounts, Identity Center and state buckets come from v1-e29-t01 and
    v1-e29-t02, and the V1 evidence buckets (v1-e29-t03) join the CI-managed Terraform roots unchanged;
    V1's operator SSO access stays for operator steps. Environments are dev and prod only (ADR-0013).
  priority: 1
  constraints:
    packages: [infrastructure/modules/github_oidc, infrastructure/envs, .github/workflows]
    forbidden:
      - Long-lived AWS access keys stored as GitHub secrets
      - Trust policies with wildcard repository or branch subjects (e.g. repo:*)
      - AdministratorAccess or "*:*" on any CI role
      - Pull-request workflows able to assume apply or deploy roles
      - terraform plan or apply against a real AWS account in the PR path into dev
      - Prod roles trusting a branch ref (including dev) instead of environment:production
      - Dev roles trusting refs/heads/main or any branch other than dev
  context:
    - kind: TaskRef
      name: v1-e29-t02-terraform-bootstrap
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        An IAM OIDC provider for token.actions.githubusercontent.com exists in each environment account,
        and role trust policies pin aud=sts.amazonaws.com and a sub scoped to this repository.
    - id: ac2
      description: >-
        The plan role trusts only ref:refs/heads/dev (no pull_request subjects) and has read-only
        permissions plus state-bucket access; dev apply/deploy roles trust only ref:refs/heads/dev, and prod
        apply/deploy roles trust only environment:production.
    - id: ac3
      description: >-
        Prod apply requires the `production` GitHub environment (main only, required reviewers); a PR
        workflow or a workflow on dev attempting to assume the prod apply role fails with AccessDenied.
    - id: ac4
      description: >-
        After a merge to dev, and on the nightly drift schedule and workflow_dispatch, a workflow posts
        terraform plan output for dev using the plan role before any dev apply; no plan runs on PRs into
        dev, and no AWS secret keys exist in the repository or organization secrets.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e10-t03-github-oidc-deploy-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.0
    debate/epic: v2-e10-aws-foundation
spec:
  description: >-
    Build a reusable OIDC module, instantiate it per environment with scoped roles, then switch CI to
    plan-then-apply on dev (post-merge), nightly/dispatched drift plans and apply-prod-via-production
    using those roles and prove the negative cases.
  goalRef:
    name: v2-e10-t03-github-oidc-deploy
  graph:
    nodes:
      - id: oidc-module
        kind: Task
        name: github_oidc Terraform module
        description: >-
          Module creating the OIDC provider and parameterized roles (plan/apply/deploy) with trust
          conditions on aud and sub, and inline least-privilege policies passed in by the caller.
        outputs: [infrastructure/modules/github_oidc/main.tf, infrastructure/modules/github_oidc/variables.tf]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: artifact_exists
            name: OIDC module pins the audience condition
            path: infrastructure/modules/github_oidc/main.tf
            contentMatch: "token.actions.githubusercontent.com:aud"
      - id: env-roles
        kind: Task
        name: Per-environment role instances
        description: >-
          Instantiate the module in dev and prod with the plan role trusting ref:refs/heads/dev only; dev
          apply/deploy trust ref:refs/heads/dev; prod apply/deploy trust environment:production only;
          scope deploy to ECR push and ecs:UpdateService on tagged resources.
        dependsOn: [oidc-module]
        outputs: [infrastructure/envs/dev/ci_roles.tf, infrastructure/envs/prod/ci_roles.tf]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: command_succeeds
            name: dev environment validates with CI roles
            command: terraform
            args: [-chdir=infrastructure/envs/dev, validate]
          - type: command_succeeds
            name: dev plan succeeds
            command: terraform
            args: [-chdir=infrastructure/envs/dev, plan, -lock-timeout=60s]
      - id: ci-workflows
        kind: Task
        name: Post-merge plan and per-environment apply workflows
        description: >-
          Add reusable workflows using aws-actions/configure-aws-credentials with role-to-assume,
          id-token write permission, plan then apply on pushes to dev, a nightly schedule and
          workflow_dispatch running plan only (drift report to the job summary), no pull_request trigger,
          and prod apply only inside the `production` environment on main (orchestrated by v2-e12-t07).
        dependsOn: [env-roles]
        outputs: [.github/workflows/terraform-plan.yml, .github/workflows/terraform-apply.yml]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Plan workflow requests an OIDC token
            path: .github/workflows/terraform-plan.yml
            contentMatch: "id-token: write"
      - id: negative-tests
        kind: Task
        name: Prove least privilege
        description: >-
          From a PR branch, attempt to assume the plan and prod apply roles, from dev attempt to write to
          ECR with the plan role and to assume the prod apply role; all must fail. Record results and remove
          any legacy access keys.
        dependsOn: [ci-workflows]
        outputs: [docs/runbooks/ci-aws-access.md]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: custom
            name: Negative assume-role checks recorded
            description: >-
              Coach reviews the CI logs showing AccessDenied for the PR-to-prod-apply and dev-to-prod-apply
              attempts and confirms no AWS access keys exist in GitHub secrets.
          - type: artifact_exists
            name: CI AWS access runbook exists
            path: docs/runbooks/ci-aws-access.md
status:
  phase: Pending
