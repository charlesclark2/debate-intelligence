    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
spec:
  description: >-
    Thin the two package __init__ modules and import from submodules, then re-measure the
    affected-set shares.
  goalRef:
    name: v1-e01-t29-slim-package-reexports
  graph:
    nodes:
      - id: slim-reexports
        kind: Task
        name: Slim package re-exports
        description: >-
          Thin the two package __init__ modules and import from submodules, then
          re-measure the affected-set shares.
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Architecture and import tests pass
            command: uv
            args: [run, pytest, tests/architecture, tests/scripts, -k, import or affected]
status:
  phase: Pending
