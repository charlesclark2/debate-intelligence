spec:
  # Filed by the PM, 2026-11-09, from v1-e32-t60's follow-up 2 (the PM's review, 2026-11-08).
  description: >-
    v1-e32-t60 passes over only a tournament term on report.md's own fixed lines. A fixed line
    carries no value, so no school, team code or tournament can be on it, yet a team code that
    is a common word (an `AT` on the `AT:` bullet) is a false hit every week. Pass over every
    scan kind on an exact fixed line, still by whole-line equality, and count what is passed
    over by kind in `scan.exempted`. Every line that carries a value is scanned as today.
  priority: 3
  constraints:
    packages: [debate_core.arguments, debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests]
    forbidden:
      - A real tournament, school or team name in a fixture, test, log or report
      - A line that carries a value passed over by the scan
  context:
    - kind: TaskRef
      name: v1-e32-t62-the-withheld-tags-notes-counts-on-a-line-of-their-own
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Every scan kind on an exact fixed line is passed over and counted by kind, while
        every line carrying a value is scanned as before, by tests on invented names shown
        failing first.
status:
  phase: Pending
