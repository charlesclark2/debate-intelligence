  graph:
    nodes:
      - id: keychain-errors
        kind: Task
        name: Keychain errors named
        description: >-
          Count the keyring errors the token store can meet, then name each with a code
          and hint, make a missing token's delete quiet, and carry the code into the run
          record.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Token store tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/opencaselist]
status:
  phase: Pending
