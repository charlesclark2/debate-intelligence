# RELEASE v1.8 — Weekly caselist run in the cloud
# Major version: V1. Epics: E40
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: release-v1-8
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.8
  annotations:
    debate/title: v1.8 — Weekly caselist run in the cloud
spec:
  description: >-
    The weekly caselist run (pull, import, publish, parse, search index) runs in the team's AWS
    account on a schedule, logging in to OpenCaselist by itself with credentials held in Secrets
    Manager, keeping its state in the evidence bucket, and telling the coach when a run fails or
    is late. The coach's Mac stops being the server the debaters' fresh evidence depends on. Needs
    v1.1's sync and parsed store and v1.7's search index stage.
  priority: 1
  acceptanceCriteria:
  - id: epic-e40
    description: >-
      Epic E40 (Weekly Caselist Run in the Cloud) goal is Succeeded.
  - id: tagged
    description: >-
      Release tag v1.8.0 is pushed and CHANGELOG.md has a v1.8 section.
  - id: gate
    description: >-
      Gate release-v1-8-gate is approved.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Gate
metadata:
  name: release-v1-8-gate
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.8
spec:
  gateType: review
  description: >-
    Release review for v1.8 (Weekly caselist run in the cloud): a scheduled cloud run completes
    end to end in dev and prod with the Mac's schedule off, confirm CI green on the release tag, confirm
    the data-use policy's amended access rule is met, and confirm no evidence-integrity regressions.
  reviewers:
  - user:charlie
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: release-v1-8-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.8
spec:
  description: >-
    Release plan for v1.8: complete its epic, tag, and pass the release gate.
  goalRef:
    name: release-v1-8
  series: v1
  version: v1.8
  graph:
    nodes:
    - id: e40
      kind: External
      name: Epic E40 — Weekly Caselist Run in the Cloud
      inputs:
        goalRef: v1-e40-cloud-caselist-run
        specRef: plan_specs/v1/e40-cloud-caselist-run/epic.yaml
    - id: tag-release
      kind: Task
      name: Tag and publish v1.8.0
      description: >-
        Update CHANGELOG.md, bump package versions, create the git tag, and publish release notes.
      dependsOn:
      - e40
      acceptanceCriteria:
      - type: command_succeeds
        name: Release tag exists
        command: git
        args:
        - rev-parse
        - v1.8.0
    - id: release-review
      kind: Gate
      name: v1.8 release review
      dependsOn:
      - tag-release
      gateRef:
        name: release-v1-8-gate
status:
  phase: Pending
