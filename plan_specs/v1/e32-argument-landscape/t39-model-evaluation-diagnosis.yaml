  acceptanceCriteria:
    - id: ac1
      description: >-
        The breakdown and the terminal-only hit listing work on synthetic fixtures and
        replay cassettes: every labelled card falls in exactly one outcome and the outcomes
        sum to the labelled count, the deterministic placement is shown beside each, and
        nothing hit-bearing reaches JSON output, a log or a file; by tests shown failing
        first.
    - id: ac2
      description: >-
        The operator's replay run over the kept cassettes (operator, recorded by the PM)
        gives the counts recorded in docs/data/landscape-model-evaluation.md, and the PM has
        the options.
