    A first preflight step only the takedown role passes, and the grant's purpose stated
    correctly.
  goalRef:
    name: v1-e29-t08-takedown-preflight-identity
  graph:
    nodes:
      - id: preflight-identity
        kind: Task
        name: The preflight checks the caller first
        description: >-
          The identity check, its tests, the probe clean-up note and the grant comment.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Removal tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application, -k, preflight or removal]
status:
  phase: Pending
