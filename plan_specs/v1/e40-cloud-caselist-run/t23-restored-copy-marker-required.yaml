  acceptanceCriteria:
    - id: ac1
      description: >-
        The operator's pass printing `restored before the marker: 0` is recorded; the second
        list is gone from both runbooks and their test; a `--restored-copy` with no marker
        is refused with its code and hint and a marked copy is accepted, by tests shown
        failing first.
