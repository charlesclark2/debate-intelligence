# src/lib/content.ts at build time and read by src/app/events/page.tsx, which holds no copy of
# its own.
#
# THE SHAPE, AND WHY THE COPY LIVES HERE RATHER THAN IN content/pages/events.md
# -----------------------------------------------------------------------------
# content/pages/events.md still owns the page: its title, its description, its place in the
# navigation and the lead paragraph. This file owns the structure: what is true of all three
# events, the three events themselves, and the sections that close the page.
#
# Charlie approved this wording in v1-e36-t04. The detail bodies below are that copy, moved but
# not rewritten. Two things did change shape, and both are restructuring rather than editing:
#
#   1. Each event's bold summary line ("Two students per side. About 40 to 50 minutes per round.
#      The most common starting point.") is gone from the detail, because every fact in it is now
#      a field in `comparison` below, where the same fact can be read across all three events at
#      once. Nothing in that line was dropped.
#   2. `summary` and the `speechPattern` and `bestFor` comparison fields are drawn from sentences
#      already in the approved copy, compressed to fit a card. They are the only lines on this
#      page that are not word for word from the draft, and the session report for
#      v1-e36-t07-page-structure-pass lists each one for Charlie to confirm.
#
# House style, enforced by the loader exactly as it is for content/pages/: no em dashes, and no
# acronym this file does not spell out. Detail and section bodies are Markdown, rendered at build
# time.

# What the four comparison fields are called on the page. They are copy, so they live here; the
# page decides where they go. Every event fills all four, so a parent reads the same four rows
# three times over and the differences are the only thing that moves.
comparisonLabels:
  teamSize: Team size
  speechPattern: Speech pattern
  topicCadence: Topic cadence
  bestFor: Best for

# The at-a-glance block above the comparison: the things a parent does not have to check event by
# event, because they are the same in all three.
sharedTruths:
  title: True of all three events
  items:
    - title: Students argue both sides
      body: >-
        Which side you get is assigned, not chosen, so a debater prepares the case for and
        against.
    - title: Nobody is alone with the topic
      body: >-
        Cases, evidence and practice rounds are team work, even in the events where one student
        competes alone.
    - title: There is no audience to speak of
      body: >-
        A round is a small room with the two sides, a judge and a timer.

# The label above the topic each event is arguing right now. It sits apart from the four
# comparison fields because it is the one thing on this page with a shelf life: Public Forum and
# Lincoln-Douglas change theirs through the season and Charlie updates them here, with no code
# change and no deploy of anything but content.
#
# A topic nobody has filled in yet is written as [[TBD: what is needed]]. It renders as a visible
# TBD badge on the dev preview and src/lib/publishing-policy.ts fails a prod build while it is
# there, so a stale or empty topic cannot quietly reach parents.
currentTopicLabel: Current topic

comparisonTitle: The three events side by side
comparisonIntro: >-
  A student usually picks one and sticks with it for a season, and every event is open to a
  beginner.

events:
  - id: public-forum
    name: Public Forum
    summary: Asks whether something does more good than harm on balance.
    # The label on the link from this card down to the detail below. Each event names itself, so
    # the three links read differently from one another in a screen reader's list of links.
    detailActionLabel: How a Public Forum round runs
    currentTopic: '[[TBD: the Public Forum topic for this month]]'
    comparison:
      teamSize: Two students per side.
      speechPattern: Four short speeches a side and three crossfires, in about 40 to 50 minutes.
      topicCadence: A new topic every month or two.
      bestFor: The most common starting point.
    detail: |
      Public Forum debate asks whether something does more good than harm on balance. The topic
      changes every month or two, so the research stays current: a recent one asked whether the
      country should pause construction of the largest data centers.

      Public Forum was designed to be understood by an attentive member of the public, and in
      Wisconsin that matters, because most judges are parents and community members rather than
      debate specialists. Clear beats fast in this event, every time.

      **How a round runs.** Before the round a coin flip decides which side each team takes and
      which team speaks first. Then the speeches get shorter on purpose.

      - Two four-minute **constructive** speeches, one per side, which build each team's case.
      - Two four-minute **rebuttals**, which answer the other team's case.
      - Two three-minute **summaries**, which narrow the round to the arguments that matter.
      - Two two-minute **final focus** speeches, which give the judge one or two reasons to vote.
      - Three three-minute **crossfires** in between, where both debaters may ask and answer
        questions.
      - A few minutes of **prep time** per team, spent however the team likes across the round.

      Formal plans and counterplans are not allowed here. A team defends the resolution as it is
      written.

  - id: lincoln-douglas
    name: Lincoln-Douglas
    summary: >-
      Asks what ought to be done and how we would know: moral and philosophical questions rather
      than predictions.
    detailActionLabel: How a Lincoln-Douglas round runs
    currentTopic: '[[TBD: the Lincoln-Douglas topic for this two-month cycle]]'
    comparison:
      teamSize: One student per side, with no partner.
      speechPattern: Five speeches and two cross-examinations, in about 40 to 45 minutes.
      topicCadence: A new topic every two months.
      bestFor: A student who wants to work alone on moral and philosophical questions.
    detail: |
      Lincoln-Douglas debate asks what ought to be done and how we would know: moral and
      philosophical questions rather than predictions. A recent topic asked whether colonizing
      outer space is a moral imperative. Topics rotate every two months, so a debater rebuilds
      their case about three times a year.

      A traditional case runs on a **value**, the ideal the judge should prioritize, such as
      justice or human dignity, and a **criterion**, the test for reaching it. The rest of the case
      has to connect back to both.

      **How a round runs.** One debater does every job: research, speaking, questioning,
      note-taking and strategy.

      - **Affirmative constructive**, six minutes: define the terms, set the framework, read the
        case.
      - **Negative constructive**, seven minutes: the negative case plus answers to the affirmative
        one.
      - **First affirmative rebuttal**, four minutes: answer all seven minutes of that, and
        rebuild.
      - **Negative rebuttal**, six minutes: narrow to the best path and compare the two frameworks.
      - **Second affirmative rebuttal**, three minutes: one path, their best objection, the ballot.
      - Two three-minute **cross-examinations**, one in each direction.
      - Four minutes of **prep time** each, split however the debater likes.

      The affirmative speaks first and last; the negative gets one long speech in the middle.
      Answering a seven-minute speech in four minutes is the pressure this event is built around.

  - id: policy
    name: Policy debate
    summary: Asks whether one specific plan should be adopted.
    detailActionLabel: How a Policy round runs
    # From the approved copy, which names this year's resolution: Policy runs one topic all year,
    # so this is the only one of the three that is already known.
    currentTopic: Whether the federal government should establish national health insurance.
    comparison:
      teamSize: Two students per side.
      speechPattern: Eight speeches and four cross-examinations, in about 80 minutes plus prep.
      topicCadence: One topic all year.
      bestFor: A student who wants to go deep on one question all year, with a partner.
    detail: |
      Policy debate asks whether one specific plan should be adopted, and it uses a single
      resolution for the whole season: this year, whether the federal government should establish
      national health insurance. That makes the research exceptionally deep. Quoted evidence is
      read aloud in the round, and a quoted passage is called a card.

      The affirmative reads a plan, why the situation is not already improving, what is going wrong
      now, and evidence that the plan would work. The negative answers the case directly and can
      also run separate arguments: a **disadvantage** (the plan causes a worse new problem), a
      **counterplan** (a different plan without the downside), **topicality** (the plan is not what
      the resolution asked for) or a **kritik** (a challenge to the assumptions behind the plan).

      **How a round runs.**

      - Four eight-minute **constructive** speeches, two per side, where new arguments are allowed.
      - Four five-minute **rebuttals**, two per side, which may only extend and answer.
      - Four three-minute **cross-examinations**, one after each constructive speech.
      - Several minutes of **prep time** per team.

      Partners have different roles and win or lose together. The hardest speech in the event is
      the first affirmative rebuttal, which has five minutes to answer thirteen consecutive
      negative minutes.

# The sections that close the page: the vocabulary a parent meets in all three events, what the
# person deciding the round is actually doing, and what a Saturday looks like.
closingSections:
  - id: cross-examination-and-prep-time
    title: Cross-examination and prep time
    body: |
      **Cross-examination** is the part of a round where one side asks the other direct questions.
      It is not a speech. Debaters use it to clarify what the other side is claiming, to find a gap
      in the reasoning, or to make an opponent commit to a position they can then answer. Public
      Forum calls its version crossfire, and in crossfire both debaters may ask as well as answer.

      **Prep time** is a bank of minutes each side may spend during the round, between speeches, to
      decide what the next speech has to do. When it runs out, the next speaker starts anyway.
      Learning to spend it deliberately is one of the first real skills a debater picks up.
  - id: what-the-judge-does
    title: What the judge does
    body: |
      One judge, usually sitting at the back of the room with a pen, decides the round. They are
      often a parent or a community member rather than a debate specialist.

      The judge takes notes on every argument as it is made, on a running record debaters call a
      **flow**. At the end they decide which side gave the better reasons to vote for it, write
      down the **reason for decision** explaining why, and submit a **ballot**. In most Wisconsin
      tournaments they also give each speaker a score for how well they spoke.

      Judges do not decide who was louder or who they personally agree with. An argument that
      nobody answers is usually treated as true, so coverage matters, and the side that explains
      why its strongest argument outweighs the other side's usually wins.

      Parents can judge, and the team needs judges to compete at all. What that involves is
      answered on the [parent questions](/faq/) page.
  - id: a-tournament-day
    title: What a tournament day looks like
    body: |
      A typical Wisconsin tournament is at a host high school on a Saturday. Students arrive around
      8:00 AM and compete into the afternoon, with several rounds through the day, gaps between
      them, and elimination rounds at the end for the students who advance. Food during the day is
      one of the costs families cover; the [parent questions](/faq/) page sets out the rest.
