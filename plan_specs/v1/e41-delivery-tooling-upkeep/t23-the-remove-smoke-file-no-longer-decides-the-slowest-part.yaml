# TASK v1-e41-t23-the-remove-smoke-file-no-longer-decides-the-slowest-part - The remove smoke file's setup no longer decides CI's slowest part
# Epic: E41 — Delivery Tooling Upkeep | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
