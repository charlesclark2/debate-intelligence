# EPIC E21 — Argument Graph
# Major version: V3 | Release: v3.0 (Debate file intelligence & argument graph)
# Architecture refs: §7 ArgumentTable, §13 Argument graph, ADR-007, ADR-008
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v3-e21-argument-graph
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v3
    debate/release: v3.0
    debate/epic: v3-e21-argument-graph
  annotations:
    debate/title: E21 — Argument Graph
    debate/architecture-refs: §7 ArgumentTable, §13 Argument graph, ADR-007, ADR-008
spec:
  description: >-
    Persist typed argument nodes and edges with source references and confidence behind a GraphRepository,
    extract them from parsed files, and provide coverage/coherence queries.
  priority: 12
  constraints:
    majorVersion: v3
    release: v3.0
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      ArgumentNode/ArgumentEdge records (SUPPORTS, ANSWERS, TURNS, MITIGATES, CONTRADICTS, PREREQUISITE,
      LINKS_TO, SOLVES, IMPACTS, PERMUTES) persist with source refs and confidence.
  - id: ac2
    description: >-
      GraphRepository abstracts DynamoDB adjacency so Neptune can be added later without application changes.
  - id: ac3
    description: >-
      Node/edge extraction accuracy is measured on a labeled set; a graph viewer shows provenance.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
