# TASK v2-e10-t04-kms-secrets — KMS keys and Secrets Manager
# Epic: E10 AWS & Infrastructure-as-Code Foundation | Release: v2.0 (Cloud platform foundation) | Major: V2
# Architecture refs: §5 KMS/Secrets Manager, §14 encryption at rest and in transit, §15
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e10-t04-kms-secrets
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.0
    debate/epic: v2-e10-aws-foundation
  annotations:
    debate/title: KMS keys and Secrets Manager
    debate/architecture-refs: §4, §5, §14, §15
spec:
  description: >-
    Provide the encryption and secret-storage primitives that DynamoDB (E11-t02), S3 (E11-t04),
    OpenSearch (E15) and the workers consume. Define one KMS key per data class (operational data,
    source snapshots/exports, logs, secrets) with rotation enabled and key policies that grant use only
    to named service roles, plus Secrets Manager entries for external provider credentials (e.g.
    Semantic Scholar/GDELT/news API keys, OpenCaselist tokens later) with a documented rotation process.
    It also adds a SecretsProvider adapter in debate_core.integrations so application code reads
    secrets through the existing settings/port mechanism, never via boto3 in domain/application.
    Consumers attach grants in their own tasks; this task does NOT create tables, buckets or indices.
    It builds on the V1 AWS baseline: accounts and state come from v1-e29-t01/v1-e29-t02, and the
    evidence-bucket key created in V1 (v1-e29-t03) becomes the snapshots/evidence data-class key by
    bringing it under the kms module (terraform import or moved blocks), never by recreating it, so V1
    objects stay readable. Environments are dev and prod only (ADR-0013).
  priority: 1
  constraints:
    packages: [infrastructure/modules/kms, infrastructure/modules/secrets, debate_core.integrations]
    forbidden:
      - Secrets in Terraform state as plaintext values, tfvars, .env files committed to git, or logs
      - Key policies granting kms:* to account root principals beyond the standard admin statement
      - Importing boto3 in debate_core.domain or debate_core.application
      - Live AWS calls in unit tests (use moto or stubbed clients)
  context:
    - kind: TaskRef
      name: v1-e29-t02-terraform-bootstrap
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Customer-managed KMS keys exist per environment for data classes app-data, snapshots, logs and
        secrets, each with enable_key_rotation=true, an alias, and a documented data-class mapping;
        the snapshots key is the existing V1 evidence-bucket key (adopted, not replaced), and a dev plan
        shows no destroy/replace of that key or of the V1 evidence buckets.
    - id: ac2
      description: >-
        Key policies allow encrypt/decrypt only for explicitly listed role ARNs passed in as variables;
        an unlisted role receives AccessDenied on kms:Decrypt.
    - id: ac3
      description: >-
        Secrets Manager secrets are created as empty shells by Terraform (values set out-of-band) and
        encrypted with the secrets key; no secret value appears in Terraform state or the repo.
    - id: ac4
      description: >-
        An AwsSecretsProvider adapter resolves settings fields marked as secret references, caches values
        with a TTL, redacts them from logs/reprs, and is covered by moto-backed tests.
    - id: ac5
      description: >-
        docs/runbooks/secrets-rotation.md describes how to set, rotate and revoke each provider secret.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e10-t04-kms-secrets-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.0
    debate/epic: v2-e10-aws-foundation
spec:
  description: >-
    Create the key and secret modules, instantiate them per environment, then add the application-side
    adapter and rotation runbook.
  goalRef:
    name: v2-e10-t04-kms-secrets
  graph:
    nodes:
      - id: kms-module
        kind: Task
        name: KMS module per data class
        description: >-
          Module that creates a CMK with rotation, alias and a key policy composed from admin and
          user-role variables; outputs key ARNs by data class.
        outputs: [infrastructure/modules/kms/main.tf, infrastructure/modules/kms/outputs.tf]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: KMS module enables rotation
            path: infrastructure/modules/kms/main.tf
            contentMatch: "enable_key_rotation"
      - id: secrets-module
        kind: Task
        name: Secrets Manager module
        description: >-
          Module creating secret shells (no secret_string) for provider credentials, encrypted with the
          secrets CMK, with resource policies limited to worker/API task roles.
        dependsOn: [kms-module]
        outputs: [infrastructure/modules/secrets/main.tf]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Secrets module exists
            path: infrastructure/modules/secrets/main.tf
            contentMatch: "aws_secretsmanager_secret"
      - id: env-wiring
        kind: Task
        name: Instantiate keys and secrets per environment
        description: >-
          Wire both modules into dev and prod and export key ARNs for later tasks via outputs; adopt the
          V1 evidence-bucket key (v1-e29-t03) into the kms module with import/moved blocks and confirm the
          plan has no key or bucket replacement.
        dependsOn: [secrets-module]
        outputs: [infrastructure/envs/dev/security.tf]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: command_succeeds
            name: dev environment validates
            command: terraform
            args: [-chdir=infrastructure/envs/dev, validate]
          - type: command_succeeds
            name: dev plan succeeds
            command: terraform
            args: [-chdir=infrastructure/envs/dev, plan, -lock-timeout=60s]
      - id: secrets-adapter
        kind: Task
        name: AwsSecretsProvider adapter
        description: >-
          Implement a SecretsProvider port implementation using boto3 in debate_core.integrations, with
          TTL caching and SecretStr redaction, selected by settings when running in AWS.
        dependsOn: [env-wiring]
        outputs: [packages/debate_core/src/debate_core/integrations/aws_secrets.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Secrets adapter tests pass against moto
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/test_aws_secrets.py]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
      - id: rotation-runbook
        kind: Task
        name: Rotation runbook
        description: >-
          Document setting, rotating and revoking each provider secret and the KMS data-class mapping.
        dependsOn: [secrets-adapter]
        outputs: [docs/runbooks/secrets-rotation.md]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: artifact_exists
            name: Rotation runbook exists
            path: docs/runbooks/secrets-rotation.md
            contentMatch: "rotate"
status:
  phase: Pending
