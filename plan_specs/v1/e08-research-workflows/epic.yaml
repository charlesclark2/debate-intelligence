        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e08-t05-search-command
    - id: t06
      kind: Task
      name: '`--auto-cut N` batch cutting'
      description: >-
        Cut the top N accessible results via CardService with a concurrency limit, export bundle and a
        per-result success/failure report.
      inputs:
        specRef: plan_specs/v1/e08-research-workflows/t06-auto-cut.yaml
