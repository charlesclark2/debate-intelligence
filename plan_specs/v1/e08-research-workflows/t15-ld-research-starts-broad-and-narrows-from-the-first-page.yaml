spec:
  # Filed by the PM, 2026-11-03, from v1-e08-t05's ac6 and the coach's feedback (2026-11-02).
  description: >-
    The coach on LD research: start high level, then hone in on what the surface research finds.
    v1-e08-t05's LD search (de-extinction) gave 10 relevant of 16 labelled rows, and the useful
    directions were in the first page's own subjects (ethics, ecology, mourning, the animal
    subject). Propose the shape before building anything: for example, `search` suggesting
    narrower follow-up queries from the first page's subjects or concepts (OpenAlex's own
    fields, never a model), and a way to search within a saved search. Say what each costs in
    provider requests and what a student types. The PM rules on the proposal before any code.
    (PM amendment 2026-11-05, from v1-e07-t13's deviation 2.) There is no search guide under
    docs/guides: "the search guide" is the `debate-research search` section of
    `packages/debate_cli/README.md`, inside the `debate_cli` package.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.domain, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/guides]
    forbidden:
      - A model call to suggest a query
      - A live provider call in a test
      - A school, team code or debater name anywhere
  context:
    - kind: TaskRef
      name: v1-e08-t05-search-command
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The proposal is sent to the PM and ruled on before any code.
    - id: ac2
      description: >-
        What the ruling asks for is built with tests on recorded fixtures shown failing
        first, and the search guide says how a student narrows a search.
status:
  phase: InProgress
