          The retry rule and the publisher guard.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Parse tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application, -k, parse or publish]
status:
