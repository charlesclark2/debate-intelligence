# Model routing for the prod environment (DEBATE_ENV=prod): the stable build the team installs.
#
# Owned by v1-e01-t09-dev-prerelease-channel. The schema is
# debate_core.integrations.models.routing_policy.RoutingPolicy; config/model_routing.example.yaml
# explains each task class, where the identifiers come from and why no Claude route sets a
# temperature.
#
# Each class gets the model whose quality it needs, under the prod daily budget
# (models.budget_usd_daily in config/profiles/prod.toml). config/model_routing.dev.yaml routes the
# same classes one tier cheaper. Dev and prod must never share this file (the task spec forbids
# it). Identifiers checked against the AWS Bedrock model cards on 2026-10-16
# (v1-e05-t01-model-router-port).

version: 1

routes:
  complex_reasoning:
    provider: bedrock
    model_id: anthropic.claude-sonnet-5-5
    inference_profile: us.anthropic.claude-sonnet-5-5
    region: us-east-1
    max_tokens: 8192
    timeout_seconds: 300

  high_volume:
    provider: bedrock
    model_id: anthropic.claude-haiku-5-5
    inference_profile: us.anthropic.claude-haiku-5-5
    region: us-east-1
    max_tokens: 2048
    timeout_seconds: 60

  deep_audit:
    provider: bedrock
    model_id: anthropic.claude-opus-5-5
    inference_profile: us.anthropic.claude-opus-5-5
    region: us-east-1
    max_tokens: 16384
    timeout_seconds: 600

  embeddings:
    provider: bedrock
    model_id: amazon.titan-embed-text-v2:0
    region: us-east-1
    timeout_seconds: 30

  rerank:
    provider: bedrock
    model_id: cohere.rerank-v3-5:0
    region: us-east-1
    timeout_seconds: 30
