# TASK v1-e05-t02-bedrock-adapter — Amazon Bedrock adapter
# Epic: E05 Model Router & Structured LLM Contracts | Release: v1.2 (Argument landscape & file building) | Major: V1
# Architecture refs: §10, ADR-005 (Bedrock behind ModelRouter), §14 (secrets), §15 (retries), §20 step 5
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e05-t02-bedrock-adapter
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e05-model-router
  annotations:
    debate/title: Amazon Bedrock adapter
    debate/architecture-refs: §10, ADR-005, §14, §15, §20 step 5
spec:
  description: >-
    Implement BedrockModelRouter, the production ModelRouter adapter, using the Bedrock Runtime Converse API
    (InvokeModel for Titan embeddings and Cohere rerank). Structured output is requested through tool use
    with the Pydantic schema's JSON Schema as the single tool and `toolChoice` `auto`, so the model returns
    arguments rather than prose; a response that skips the tool or fails the schema goes to t05's
    validation and repair. Amended by the PM, 2026-10-16: the current Claude models reject a forced
    tool choice, and Bedrock lists structured outputs as not supported for them (model cards checked
    2026-10-16, cited in v1-e05-t01's report). Inference profile and region come from the routing config; credentials come only from the
    standard AWS credential chain (profile/SSO/env), never from repo files. Throttling and transient
    service errors are retried with bounded backoff. boto3 is an optional extra (debate-core[aws]; amended
    by the PM, 2026-10-17: the aws extra already carries boto3, so no second extra is added) so students
    without AWS access can run the CLI on the fake router. Out of scope: schema validation and
    repair retries (t05), fixtures/replay (t03), cost accounting (t07).
  priority: 1
  constraints:
    packages: [debate_core.integrations]
    forbidden:
      - >-
        A new boto3 or botocore import outside debate_core.integrations.bedrock, and any in
        debate_core.domain or debate_core.application, as the import contracts already enforce.
        Amended by the PM, 2026-10-17: debate_core.integrations.s3 already imports it.
      - Hard-coded AWS keys, account IDs or model IDs in code or tests
      - Live Bedrock calls in the unit/CI test suite (botocore Stubber or recorded fixtures only)
      - Retrying non-idempotent or validation (4xx other than throttling) errors
  context:
    - kind: TaskRef
      name: v1-e05-t01-model-router-port
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        BedrockModelRouter passes the shared ModelRouter contract suite using botocore Stubber responses for
        Converse (tool-use output), Titan embeddings and Cohere rerank.
    - id: ac2
      description: >-
        generate_structured sends the schema as the single toolConfig tool with toolChoice auto, never a
        forced choice, and parses the toolUse input into the schema type; a response with no toolUse
        block raises a typed ModelOutputError, which t05's guard repairs. Amended by the PM, 2026-10-16.
    - id: ac3
      description: >-
        ThrottlingException, ServiceUnavailable and ModelNotReady are retried up to the configured attempts
        with jittered backoff; AccessDenied and ValidationException fail immediately with typed errors.
    - id: ac4
      description: >-
        Without the aws extra no boto3 is installed, and selecting provider bedrock without it raises a
        clear configuration error naming debate-core[aws]. Amended by the PM, 2026-10-17: boto3 is
        already debate-core's aws extra, which the CLI depends on; no second extra for the same
        package.
    - id: ac5
      description: >-
        The resolved model_id, inference profile ARN/region and request id are returned on every response.
    - id: ac6
      description: >-
        `effort` (Converse `output_config.effort`) is a route default and a per-call parameter, merged like
        the other overrides, validated at load, and reported on the resolved route. Added by the PM,
        2026-10-16, from v1-e05-t01's Follow-up work.
    # PM ruling 2026-10-22: ac7 moves to v1-e05-t08, which grants the access it needs; t08 waited on
    # this task while this task waited on t08's grant. This task is Succeeded on its other criteria.
    - id: ac7
      description: >-
        Operator-run, the first real call on each Claude route, with the operator's credentials, recorded
        in the report: which toolChoice types and structured-output options the model accepts, whether a
        non-default temperature is refused (if not, a route may set one again), and that each model id
        and inference profile in the routing files resolves. A Stubber test pins each answer. Added by
        the PM, 2026-10-16.
status:
  phase: Succeeded
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e05-t02-bedrock-adapter-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e05-model-router
spec:
  description: >-
    Package the optional extra, build the Converse client, add structured tool-use output, then embeddings
    and rerank, then retries, verified entirely with botocore Stubber.
  goalRef:
    name: v1-e05-t02-bedrock-adapter
  graph:
    nodes:
      - id: optional-extra
        kind: Task
        name: aws optional extra and lazy import
        description: >-
          Use the boto3 already declared under [project.optional-dependencies] aws in debate_core (amended
          by the PM, 2026-10-17), import it lazily inside the adapter module, and raise
          BedrockNotInstalledError when absent.
        outputs:
          - packages/debate_core/pyproject.toml
          - packages/debate_core/src/debate_core/integrations/bedrock/__init__.py
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: artifact_exists
            name: bedrock extra declared
            path: packages/debate_core/pyproject.toml
            contentMatch: "bedrock"
      - id: converse-client
        kind: Task
        name: Converse client with credential chain and route config
        description: >-
          Build the bedrock-runtime client from the resolved route (region, inference profile) using the
          default credential chain and a botocore Config with connect/read timeouts.
        dependsOn: [optional-extra]
        outputs: [packages/debate_core/src/debate_core/integrations/bedrock/router.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Client construction tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/bedrock/test_router.py, -k, client]
      - id: structured-tool-use
        kind: Task
        name: Structured output via tool use
        description: >-
          Translate the Pydantic schema to a toolSpec with toolChoice auto (amended by the PM,
          2026-10-16: never forced), parse the toolUse input, and map stopReason/usage fields into
          ModelResponse.
        dependsOn: [converse-client]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Tool-use structured output tests pass
            command: uv
            args:
              - run
              - pytest
              - packages/debate_core/tests/integrations/bedrock/test_router.py
              - -k
              - structured
      - id: embed-rerank
        kind: Task
        name: Titan embeddings and Cohere rerank
        description: >-
          Implement embed via InvokeModel (Titan Text Embeddings V2, configurable dimensions) and rerank via
          the Cohere Rerank model, both routed by task class.
        dependsOn: [converse-client]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Embedding and rerank tests pass
            command: uv
            args:
              - run
              - pytest
              - packages/debate_core/tests/integrations/bedrock/test_router.py
              - -k
              - "embed or rerank"
      - id: retries-and-contract
        kind: Task
        name: Throttling retries and contract suite
        description: >-
          Add bounded jittered retries for throttling/unavailable errors, typed errors for the rest, run the
          shared contract suite against the stubbed adapter, and re-check types and import boundaries.
        dependsOn: [structured-tool-use, embed-rerank]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Full Bedrock adapter tests pass offline
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/bedrock]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
status:
  phase: Pending
