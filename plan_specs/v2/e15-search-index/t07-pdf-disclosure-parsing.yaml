      - id: pdf-adapter
        kind: Task
        name: PDF disclosures parse into the store
        description: >-
          The adapter, the fixtures, the accuracy measurement, and the operator's run.
        estimatedEffort: 8h
        acceptanceCriteria:
          - type: test_passes
            name: Parser tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations]
status:
  phase: Pending
