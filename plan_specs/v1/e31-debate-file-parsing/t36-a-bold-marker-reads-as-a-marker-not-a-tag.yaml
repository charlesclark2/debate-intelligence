spec:
  # Filed by the PM, 2026-11-04, from v1-e31-t23's follow-up (the PM's review, 2026-11-03).
  description: >-
    Under M3 (no marker is a cite) a bold marker line at reading size is read as a tag through
    the classifier's bold-heading rule, so its card still divides there; v1-e31-t23 pinned that
    in `test_in_round_marker_cites.py`. Count those lines per caselist first (operator-run,
    counts only), then, if the PM rules it, read a marker line in any style as nothing, so the
    card stays whole, with fixtures shown failing first, the labelled evaluation's precision
    held and the parser version bumped.
  priority: 3
  constraints:
    packages: [debate_core.evidence, debate_core.integrations, scripts, packages/debate_core/tests, tests/scripts, docs/data]
    forbidden:
      - Card text in the report, a commit or the session
      - A rule before the PM's ruling
      - A fall in tag or EVIDENCE precision on the labelled evaluation
  context:
    - kind: TaskRef
      name: v1-e31-t23-in-round-markers
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The count of bold markers read as tags per caselist is sent to the PM before any
        rule.
    - id: ac2
      description: >-
        A ruled rule has fixtures shown failing first, precision holds on the labelled
        evaluation (operator), and the parser version is bumped with the operator's re-parse
        written out.
status:
  phase: Pending
