# TASK v1-e01-t02-github-remote — Create GitHub repository, push, and protect main
# Epic: E01 Repository & Delivery Foundation | Release: v1.0 (Foundation & verified evidence core) | Major: V1
# Architecture refs: §4 (GitHub Actions + ECR), §17, §18
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e01-t02-github-remote
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
  annotations:
    debate/title: Create GitHub repository, push, and protect main
    debate/architecture-refs: §4, §17, §18
spec:
  description: >-
    The remote already exists: Charlie created https://github.com/charlesclark2/debate-intelligence and
    pushed main and dev over HTTPS on 2026-09-17. **It is public, by decision**, so that GitHub Actions
    minutes are free - which is what makes the v1-e01-t04 CI pipeline affordable to run on every PR. That
    decision rests on a control this spec originally anticipated as a risk: no real debate file, excerpt,
    school, team code or student name may enter the repository at all, scrubbed or otherwise. The
    v1-e31-t02, t03 and t05 rulings enforce it in the specs, docs/policies/caselist-data-use.md
    prohibitions 1, 9 and 10 enforce it in policy, and v1-e30-t03's and v1-e31-t03's tests assert it in
    code. Fixtures are synthetic with invented schools and team codes. A public repository is safe
    precisely because there is nothing in it to expose; if that ever stops being true, visibility is the
    wrong lever and the file is. This task puts the repository-level guardrails from
    docs/process/branching-and-environments.md (ADR-0013: main = prod, dev = development environment)
    in place: dev as the GitHub default branch so task PRs target it, the protect-main ruleset (PR with
    1 approval, dismiss stale approvals, conversation resolution, no force-push or deletion, pushes
    restricted, admin-only emergency bypass) and the protect-dev ruleset (PR required, no force-push or
    deletion, 0 approvals allowed for the solo owner), CODEOWNERS, bug and task issue templates that
    reference the task spec path, secret scanning with push protection, and a CONTRIBUTING.md aligned
    with the process doc. Boundaries: required status checks are added by the tasks that produce them
    (`ci` in t04, `promotion-source`/`back-merge` and all PR/promotion templates in t08, `validate-dev`
    in t10); GitHub Environments are v2-e12-t07; this task creates no workflows, tooling (t03) or ADR
    docs (t06).
  priority: 2
  constraints:
    packages: [.github, CONTRIBUTING.md, repo settings]
    forbidden:
      - >-
        Any real debate file, excerpt, school name, team code or student name entering the repository.
        This, not visibility, is the control that makes a public repository safe, and it is absolute
      - Committing secrets, tokens or .env files (enable GitHub secret scanning/push protection)
      - Allowing force-push, deletion or direct pushes to main or dev
      - Leaving main as the default branch (task PRs must target dev by default)
  context:
    - kind: TaskRef
      name: v1-e01-t01-init-local-repo
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The repository charlesclark2/debate-intelligence has main and dev with the full local history,
        `origin` is configured locally, and the default branch is dev. Visibility is public, and secret
        scanning and push protection are enabled - on a public repository a committed token is exposed the
        moment it lands, so these are not optional here.
    - id: ac2
      description: >-
        Ruleset protect-main (target main) requires a pull request with **0** required approvals and an
        **empty bypass list**, dismisses stale approvals, requires conversation resolution, blocks
        force-push and deletion, and allows the **Merge** method only. Zero, not one: GitHub does not let
        an author approve their own pull request, so on a solo-owner repository a required approval would
        deadlock every promotion to main. The human approval is the promotion checklist in
        docs/policies/website-publishing.md and, from V2, the `production` environment approval. This is
        what docs/process/branching-and-environments.md has specified since ADR-0013; an earlier draft of
        this criterion said one approval with an admin bypass, which contradicted that document and would
        have been weaker besides, since an empty bypass list binds the owner too.
    - id: ac3
      description: >-
        Ruleset protect-dev (target dev) requires a PR and blocks force-push and deletion; a direct push to
        dev or main is rejected.
    - id: ac4
      description: >-
        .github/CODEOWNERS and issue templates for bug and task (with a spec path field) exist on dev, and
        CONTRIBUTING.md links docs/process/branching-and-environments.md and the task/<task-name> flow.
    - id: ac5
      description: >-
        Secret scanning and push protection are enabled on the repository.
status:
  phase: InProgress
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e01-t02-github-remote-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
spec:
  description: >-
    Confirm the existing remote and branches, make dev the default, add repository hygiene files,
    then apply the two rulesets and security settings and verify them with the gh CLI.
  goalRef:
    name: v1-e01-t02-github-remote
  graph:
    nodes:
      - id: confirm-remote
        kind: Task
        name: Confirm remote, branches and default branch
        description: >-
          The remote was created and pushed on 2026-09-17; add `origin` locally if missing, confirm both
          main and dev exist, and set dev as the default branch (Settings → General, UI only). Visibility
          is public and stays public; confirm secret scanning and push protection are on, which matter
          more here than on a private repository.
        estimatedEffort: 0.5h
        acceptanceCriteria:
          - type: command_succeeds
            name: Remote origin is configured
            command: git
            args: [remote, get-url, origin]
          - type: command_succeeds
            name: Repository is public, with secret scanning and push protection on
            command: bash
            args: [-c, "gh repo view charlesclark2/debate-intelligence --json visibility
                   | jq -e '.visibility == \"PUBLIC\"' && gh api repos/charlesclark2/debate-intelligence
                   | jq -e '.security_and_analysis.secret_scanning.status == \"enabled\"
                   and .security_and_analysis.secret_scanning_push_protection.status == \"enabled\"'"]
          - type: command_succeeds
            name: Default branch is dev
            command: bash
            args: [-c, "gh repo view charlesclark2/debate-intelligence --json defaultBranchRef
                   | jq -e '.defaultBranchRef.name == \"dev\"'"]
      - id: hygiene-files
        kind: Task
        name: CODEOWNERS, issue templates and CONTRIBUTING
        description: >-
          Add CODEOWNERS (Charlie owns everything; plan_specs/ and .github/ explicitly), bug and task
          issue templates with a spec-path field, and align CONTRIBUTING.md with the process doc
          (task branches from dev, PRs into dev, promotion PRs to main). PR templates are t08.
        dependsOn: [confirm-remote]
        outputs:
          - .github/CODEOWNERS
          - .github/ISSUE_TEMPLATE/task.yml
          - .github/ISSUE_TEMPLATE/bug.yml
          - CONTRIBUTING.md
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: artifact_exists
            name: CODEOWNERS exists
            path: .github/CODEOWNERS
          - type: artifact_exists
            name: Task issue template asks for the spec path
            path: .github/ISSUE_TEMPLATE/task.yml
            contentMatch: "plan_specs/"
          - type: artifact_exists
            name: CONTRIBUTING links the process doc
            path: CONTRIBUTING.md
            contentMatch: "branching-and-environments.md"
      - id: rulesets
        kind: Task
        name: protect-main and protect-dev rulesets, secret scanning
        description: >-
          In the GitHub UI create rulesets protect-main and protect-dev exactly as the process doc's
          "Set now" list describes (no required status checks yet; later tasks add them), and enable
          secret scanning and push protection.
        dependsOn: [confirm-remote]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: command_succeeds
            name: Both rulesets are readable via the API
            command: bash
            args: [-c, "gh api 'repos/{owner}/{repo}/rulesets'
                   | jq -e 'map(.name) | index(\"protect-main\") != null and index(\"protect-dev\") != null'"]
          - type: custom
            name: Protection verified by attempting direct pushes
            description: >-
              Charlie confirms a direct `git push origin main` and `git push origin dev` from a scratch
              commit are rejected, a force-push is refused, and secret scanning push protection is on.
status:
  phase: Pending
