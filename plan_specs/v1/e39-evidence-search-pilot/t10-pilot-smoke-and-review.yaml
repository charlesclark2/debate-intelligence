# TASK v1-e39-t10-pilot-smoke-and-review - Dev smoke checks, the coach's beta and the student pilot
# Epic: E39 — Team Evidence Search (Student Pilot) | Release: v1.7 (Team evidence search pilot) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e39-t10-pilot-smoke-and-review
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.7
    debate/epic: v1-e39-evidence-search-pilot
  annotations:
    debate/title: "Dev smoke checks, the coach's beta and the student pilot"
spec:
  # Filed by the PM, 2026-10-19, from Charlie's direction of 2026-10-19 (a student search pilot before the
  # semester ends, on Chromebooks, signing in with a username, password and 2FA, outside the school's systems).
  description: >-
    Cloud smoke checks under tests/smoke/cloud marked `dev` (run by validate-dev before a
    promotion, never in PR CI): a synthetic dev user, its TOTP seed held in the dev
    environment's parameter store, signs in, searches a seeded synthetic index, opens a card,
    copies it, downloads it and matches the file's re-parse; an unauthenticated request is sent
    to sign-in; a removed synthetic source disappears. The seed is a handful of synthetic .docx
    files (fake schools, no real disclosures) loaded by an idempotent script. Then the coach's
    beta on prod (a checklist in the runbook), and a student pilot with three to five debaters
    for at least a week. docs/data/evidence-search-pilot.md records tallies and themes, never
    names, and the go or no-go for the whole team.
    (PM amendment 2026-10-21, superseding the signed-in cloud smoke above, from the PM's rulings
    on v1-e39-t02, t03, t05 and t06.) No TOTP seed is stored for CI, and validate-dev runs no
    signed-in check. Its smoke checks need no account: `/healthz`, the `302` to managed login
    for a request without a session, the content-hashed `app.js` and `app.css` with their
    immutable cache header, and the CSP on every response. The signed-in journey (sign in,
    search, open a card, Copy card, download, a removed synthetic source gone) is an
    operator-run script against dev, where the operator types the code when asked; nothing holds
    a seed. The synthetic seed goes in through the dev store as a synthetic caselist, and the
    dev index is built and published by the normal path (v1-e39-t09's stage or `tub index`); no
    script publishes a separate index over dev's `current.json`. The app configures logging so
    the index holder's `INFO` lines (index loaded, its size and load time; no query, card or
    user) reach the function's app log, and the query time (p50, p95) and the cold-start index
    load are measured on the Lambda function from that log and recorded in
    docs/data/evidence-search-pilot.md. The coach's beta checklist also covers: a real
    Chromebook (sign in, search, open a card, Copy card into Google Docs, formatting kept),
    moved here from v1-e39-t06 because no Chromebook was available on 2026-10-21; each tester's
    first sign-in with screenshots, saying which factors managed login offered, which was chosen
    and whether the app's enrolment page then appeared (v1-e39-t05's open finding); and one
    paste into Word, yes or no.
  priority: 1
  constraints:
    # PM amendment 2026-10-21: validate-dev's wiring and its test.
    packages: [tests/smoke, scripts, docs/runbooks, docs/data, packages/debate_api, .github/workflows, tests/scripts]
    forbidden:
      - A real student's name, username or feedback quoted with an identity
      - Real disclosed files in the dev seed
      - Smoke checks in PR CI
  context:
    - kind: TaskRef
      name: v1-e39-t07-removal-audit-and-exposure
      relation: dependsOn
    - kind: TaskRef
      name: v1-e39-t08-card-download
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The dev smoke checks pass against dev (operator-run) and are wired into
        validate-dev, by the workflow's own test.
    - id: ac2
      description: >-
        The coach's beta checklist is complete on prod and recorded (operator).
    - id: ac3
      description: >-
        The student pilot has run for at least a week; docs/data/evidence-search-pilot.md
        records its tallies, themes and the go or no-go.
    - id: ac4
      description: >-
        (PM amendment 2026-10-21) validate-dev's pilot smoke checks need no account and no
        stored secret, by the workflow's own test; the signed-in journey is an operator-run
        script whose run is recorded in the report.
    - id: ac5
      description: >-
        (PM amendment 2026-10-21) The index holder's load lines reach the function's app
        log, and the Lambda query time (p50, p95) and cold-start index load are recorded in
        docs/data/evidence-search-pilot.md.
    - id: ac6
      description: >-
        (PM amendment 2026-10-21) The coach's beta records the Chromebook check, the first
        sign-in screenshots' answers and the Word paste, as yes or no and counts, never
        names.
status:
  phase: Pending
