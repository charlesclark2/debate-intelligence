spec:
  # Filed by the PM, 2026-10-24, from the coach's read of the first Policy report with v1-e32-t09 to t11 (Charlie, 2026-10-24).
  description: >-
    v1-e32-t09 identifies an affirmative by its plan text, so a kritikal affirmative, with an
    advocacy statement or a method and no plan, falls among the rounds with no identified aff
    (709 of 2,192 on hspolicy26 through 2026-10-20). v1-e32-t11's counts found a
    role-of-the-ballot label in 19 affirmative documents (15 teams). Counts first (working
    agreement 7), read-only, over the affirmative rounds with no identified aff: how many files
    hold no `should` plan text and one or more of a role of the ballot, an advocacy-statement
    label (`Advocacy`, `Our advocacy is`, `The 1AC is`), a method label, or K-aff headings; how
    many of those are placed under a K by its alias; and the teams behind each. Send the counts
    to the PM with options before building: (a) one generic K-aff position per topic; (b) K-aff
    positions in the taxonomy named by the K they read (cap, afropessimism, settler
    colonialism), as v1-e32-t09's mechanisms are; with whether t01's position kinds need a new
    kind, a taxonomy version bump under v1-e32-t08's released-ids lock. After the ruling, the
    report shows kritikal affirmatives as their own group in the affirmative section, states how
    many rounds remain with no identified aff, and quotes an advocacy statement only if the PM
    and Charlie add it to data-use policy 1.13's quotable texts.
  priority: 3
  constraints:
    # PM amendment 2026-10-25, from the PM's rulings on the build's questions (1): the K-aff file's
    # loader, and the scripts that must read the run's vocabulary, with their tests.
    packages: [debate_core.application, debate_core.arguments, debate_core.domain, tests/fixtures/landscape, packages/debate_core/tests, docs/guides, config/landscape, tests/config, debate_core.integrations, scripts, tests/scripts]
    forbidden:
      - A school, team code or debater's name in a circuit-wide file, log or commit
      - Card text, plan or counterplan text in a committed file or fixture (synthetic values only)
      - Network or AWS access in any test
      - Model calls (deterministic only; model stages are v1-e32-t07's)
  context:
    - kind: TaskRef
      name: v1-e32-t09-policy-plan-texts
      relation: dependsOn
