      - id: coverage-in-parts
        kind: Task
        name: Coverage in parts
        description: >-
          Measure coverage per part on a push and combine it in one short job.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: CI workflow tests pass
            command: uv
            args: [run, pytest, tests/scripts, -k, ci_workflow]
status:
