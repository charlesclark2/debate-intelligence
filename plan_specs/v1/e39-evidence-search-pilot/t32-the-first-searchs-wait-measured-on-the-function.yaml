  # Filed by the PM, 2026-11-12, from v1-e39-t18's follow-up 1 (the PM's review, 2026-11-12).
  description: >-
    v1-e39-t18 measured today's index loading in 6.96 s in the function's image on this Mac at
    1.16 CPUs, at the top of ADR-0019 (c) 7's 6 to 8 s band, and the CPU part (gunzip and two
    sha256s), not the download, is the long one. Lambda's arm64 cores may be slower.
    v1-e39-t04's REPORT lines give init only. Propose and run one measurement of the first
    search's wait after a cold start on dev's function (operator-run, counts and times only),
    against (c) 7, and say whether the load needs work (for example one hash, or a cheaper
    decompress) before the index grows further. Stop for the PM's ruling before any change.
  priority: 3
