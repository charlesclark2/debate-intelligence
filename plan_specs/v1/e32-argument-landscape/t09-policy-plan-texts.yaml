# TASK v1-e32-t09-policy-plan-texts - Each Policy team's plan text, counted first, so single payer splits by mechanism
# Epic: E32 Argument Landscape Reports | Release: v1.2 (Argument landscape & file building) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e32-t09-policy-plan-texts
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e32-argument-landscape
  annotations:
    debate/title: "Each Policy affirmative round's plan, counted first, so the landscape names what affs read"
spec:
  # Filed by the PM, 2026-10-23, from the coach's request of 2026-10-23, recorded in v1-e32-t01's follow-up work.
  description: >-
    The coach wants the Policy landscape to split the `single payer` aff by mechanism, which no
    heading shows: the mechanism is in each team's plan text, usually a short analytic paragraph
    under a heading such as "Plan" or "Plan Text", which the parsed store may not keep as a
    card. Counts first (working agreement 7), read-only, over the hspolicy26 store: how many
    affirmative files carry a plan-text heading (by the normalized forms v1-e32-t01's normalizer
    gives); for how many the paragraph under it is in the parsed store, and in what unit (an
    analytic, a card's text, or nothing); and how many distinct plan texts there are, by a
    normalized fingerprint, counted by teams. Send the counts and one to three ways to get the
    texts (keep the paragraphs the store already holds; a parser change in E31 to keep analytic
    paragraphs under a plan heading, with a parser_version bump and a re-parse; or reading the
    raw sources again in this task) to the PM, and change nothing until the PM rules. Then
    extract, per team, its plan text's mechanism words deterministically, and write a review
    sheet for the coach, outside the repository like v1-e32-t01's: each distinct plan text
    cluster with its team count and the words that tell it apart, never a team code or school.
    The coach names each mechanism as a child aff of `single payer` with tag keywords he
    supplies (the PM's ruling for a Medicare for All split, 2026-10-23); this task applies his
    answers to policy-2026-27-nhi.yaml with a version bump. Plan text never enters a committed
    file: only the coach's mechanism names and keywords do.
    (PM amendment 2026-10-23, from v1-e32-t02's round-level coverage.) Widened and raised to
    priority 1. Headings name the plan in only 17.3% of hspolicy26's affirmative documents, and
    9.0% of them place an aff, so a heading rule cannot say what affs teams read. This task
    identifies each affirmative round's plan from the signals headings do not carry, counted
    first and each counted separately before any rule: the plan text in the round's own file (as
    above); the same team's other affirmative rounds (a team's aff carried across its rounds
    only when its own files agree); and the caselist's own record of the round and its cite
    entries (their titles, matched against the taxonomy's aff aliases, counts only, never a team
    code or file name in any output). The counts go to the PM with the share of affirmative
    rounds and teams each signal would identify, alone and together, and nothing is built until
    the PM rules. The result is a per-round aff assignment the report counts (method recorded,
    never a guess: a round no signal identifies stays unidentified). The coach's mechanism split
    of single payer (above) follows on the same plan texts. Also from v1-e32-t02: two heading
    forms miss the costs-advantage aliases (`adv 1 costs`, `advantage one costs`); fix them in
    t01's normalizer here, with synthetic cases shown failing first, since this task works on
    the same headings. Aim to merge before v1-e32-t05's first dev run; the first report does not
    wait for it.
  priority: 1
  constraints:
    packages: [debate_core.arguments, debate_core.application, debate_core.integrations, scripts, config/landscape, packages/debate_core/tests, tests/scripts, docs/guides]
    forbidden:
      - Card text, a school, team code, file name or person's name in any fixture, log, report or commit (synthetic values only)
      - Network or AWS access in any test
      - Model calls (deterministic only; model classification is v1-e32-t07's, behind the policy's E32 gate)
      - Any change to the parser, the parsed store or a fingerprint before the PM rules on the counts
      - Plan text, or any text from a team's file, in a committed file; only the coach's names and keywords
  context:
    - kind: TaskRef
      name: v1-e32-t01-position-taxonomy
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Counts, per side and by teams, of plan-text headings, of the paragraph under them as
        held in the store (by unit), and of distinct plan texts, sent to the PM with one to
        three options, before any change.
    - id: ac2
      description: >-
        After the ruling: a deterministic extraction of each team's plan text and a review
        sheet outside the repository grouping them into clusters with team counts, by tests
        on synthetic sources shown failing first.
    - id: ac3
      description: >-
        The coach's mechanisms are child affs of single payer in policy-2026-27-nhi.yaml,
        with his tag keywords, the taxonomy_version bumped, and the config tests passing;
        the counts of his decisions are in the report.
    # PM amendment 2026-10-23: the round-level aff identification.
    - id: ac4
      description: >-
        Counts, before any rule, of the affirmative rounds and teams each signal identifies (plan
        text, the team's other rounds, the caselist's round and cite titles), alone and together, sent
        to the PM; after the ruling, each identified round carries its aff and the signal that named
        it, and an unidentified round stays unidentified, by tests on synthetic sources shown failing
        first.
status:
  phase: Pending
