# TASK v2-e35-t01-tub-data-model — Tub data model
# Epic: E35 Debate Tub (Web File Access) | Release: v2.1 (Web app, debate tub & async jobs) | Major: V2
# Architecture refs: §12 Card Library, §14 access control, §7 DynamoDB physical strategy, ADR-0014
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e35-t01-tub-data-model
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.1
    debate/epic: v2-e35-debate-tub
  annotations:
    debate/title: Tub data model
    debate/architecture-refs: §7, §12, §14, ADR-0014
spec:
  description: >-
    Define what a "debate tub" entry is before anything is indexed or served. A TubFile is metadata about
    one object already in the S3 evidence store (S3 stays the system of record for bytes): organization_id,
    bucket-relative S3 key and version id, sha256, size, format (docx/pdf), kind (BUILT_FILE from E33-t05,
    CASELIST_SOURCE and CAMP_FILE from E30-t05, COACH_UPLOAD from the tub API), event (LD/PF/Policy), topic
    (resolution slug), position (e.g. "Space Col Bad K", "Grid Reliability DA"), side (AFF/NEG/BOTH/
    UNKNOWN), a display title, status (ACTIVE/REMOVED) and provenance (FILE_IMPORT mode, caselist slug,
    snapshot date, tournament/round label, recipe hash for built files). TubCollections are coach-curated
    lists (e.g. "Hsld26 Neg core"), and tub roles map E12 roles to tub actions (student: browse/download;
    coach: also upload/curate/remove; administrator: all). The task extends the E11 AppTable design with
    tub access patterns and key builders; it does NOT index S3 (t02), serve routes (t03), build UI (t04)
    or implement audit and takedown (t05, which only reuses the status field defined here). School and
    team codes are stored only as disclosed on the caselist; debater names are never stored.
  priority: 1
  constraints:
    packages: [debate_core.domain, debate_core.integrations.dynamodb, docs/data]
    forbidden:
      - File bytes, card text or presigned URLs stored in DynamoDB items (S3 is the blob system of record)
      - Debater full names, emails or other personal data in TubFile, keys or GSIs
      - Scan or unbounded client-side filtering in any tub access pattern
      - A separate tub table, or forking E11 key conventions instead of extending them
      - Importing boto3 in debate_core domain/application
      - Marking caselist or camp material as platform-verified evidence
  context:
    - kind: TaskRef
      name: v2-e11-t01-access-pattern-design
      relation: dependsOn
    - kind: TaskRef
      name: v1-e33-t05-file-publish
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Pydantic TubFile, TubCollection and TubProvenance entities with closed enums for kind, side, event,
        format and status exist in debate_core.domain, and a TubFileRepository port declares every read and
        write the later tasks need.
    - id: ac2
      description: >-
        docs/data/tub-access-patterns.md lists each tub access pattern (by organization + topic + position
        + side, by kind, by collection, by S3 key, by sha256, metadata search terms, removed files) with
        caller, key condition, index and expected cardinality, each served by Query or GetItem.
    - id: ac3
      description: >-
        Tub key builders extend the E11 key module with unit tests pinning exact key strings, and a
        mapping table shows how E33-t05 file metadata and E30-t05 manifest rows populate each TubFile field.
    - id: ac4
      description: >-
        A role-to-action table (student, coach, administrator x browse, download, upload, curate, remove)
        is documented and encoded as a pure policy function with tests; everything else is denied.
    - id: ac5
      description: >-
        Charlie approves the model and its personal-data review (which disclosed fields are stored, why,
        and that no debater names are kept) in the PR.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e35-t01-tub-data-model-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.1
    debate/epic: v2-e35-debate-tub
spec:
  description: >-
    Domain entities and port first, then access patterns and key design on top of AppTable, then tested
    key builders and the role policy, closing with a design and personal-data review.
  goalRef:
    name: v2-e35-t01-tub-data-model
  graph:
    nodes:
      - id: tub-entities
        kind: Task
        name: TubFile, TubCollection and provenance entities
        description: >-
          Pydantic v2 models and enums (TubFileKind, Side, DebateEvent, TubFileStatus) with validators
          (sha256 hex, S3 key under an allowed prefix raw/, files/ or uploads/) and a TubFileRepository
          Protocol (upsert_by_s3_key, get, list_by_facet, list_by_collection, find_by_sha256, search_terms).
        outputs:
          - packages/debate_core/src/debate_core/domain/tub.py
          - packages/debate_core/src/debate_core/domain/ports/tub_repository.py
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Tub entity validation tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/domain/test_tub.py]
      - id: access-patterns
        kind: Task
        name: Tub access patterns and key design
        description: >-
          Extend the AppTable design: ORG#<org>#TUB partitions, a facet GSI keyed by topic with sort key
          POS#<position>#SIDE#<side>#FILE#<ulid>, lookups by S3 key hash and sha256 on the external-id GSI,
          collection membership items, and bounded search-term items (normalized title/position tokens).
          Include item examples, projections and hot-partition notes for a ~5k-file organization.
        dependsOn: [tub-entities]
        outputs: [docs/data/tub-access-patterns.md]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: artifact_exists
            name: Tub access-pattern document covers the facet index
            path: docs/data/tub-access-patterns.md
            contentMatch: "POS#"
      - id: key-builders
        kind: Task
        name: Tub key builders and item codecs
        description: >-
          Pure key builders (tub_file_pk, tub_facet_gsi, tub_s3key_lookup, tub_search_term) and codecs next
          to the E11 key module, with tests pinning exact strings and ULID newest-first ordering.
        dependsOn: [access-patterns]
        outputs: [packages/debate_core/src/debate_core/integrations/dynamodb/tub_keys.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Tub key builder tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/dynamodb/test_tub_keys.py]
      - id: metadata-mapping-and-roles
        kind: Task
        name: Source metadata mapping and tub role policy
        description: >-
          Document how E33-t05 built-file metadata and E30-t05 manifest rows map to TubFile fields
          (unknown side/position stay UNKNOWN, never guessed by a model), and implement tub_can(role,
          action) as a deny-by-default pure function with a full matrix test.
        dependsOn: [tub-entities]
        outputs:
          - docs/data/tub-metadata-mapping.md
          - packages/debate_core/src/debate_core/domain/tub_policy.py
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Metadata mapping document exists
            path: docs/data/tub-metadata-mapping.md
            contentMatch: "manifests/"
          - type: test_passes
            name: Tub role policy matrix passes
            command: uv
            args: [run, pytest, packages/debate_core/tests/domain/test_tub_policy.py]
      - id: design-review
        kind: Task
        name: Quality gates and design review
        description: >-
          Run type and import checks, then review the model, access patterns and personal-data choices
          with Charlie.
        dependsOn: [key-builders, metadata-mapping-and-roles]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: command_succeeds
            name: Type check passes for debate_core
            command: uv
            args: [run, pyright, packages/debate_core]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
          - type: custom
            name: Charlie approves the tub model and personal-data review
            description: >-
              Charlie reviews the access patterns, role table and stored disclosure fields in the PR and
              confirms no debater names or unnecessary personal data are modeled.
status:
  phase: Pending
