  # Filed by the PM, 2026-11-09, from v1-e32-t60's follow-up 1 (the PM's review, 2026-11-08).
  description: >-
    v1-e32-t60 passes over report.md's own fixed lines, but the note on withheld tags carries
    three counts inside its sentence, so it is a scan hit every week (its key's digit masking
    keeps the accepted digest stable). Put the counts on a line of their own, so the note's
    sentence is a fixed line the scan passes over and the counts line carries no tournament
    word. FIXED_LINES and the golden reports follow.
  priority: 3
  constraints:
    packages: [debate_core.arguments, debate_core.application, packages/debate_core/tests, tests/fixtures/landscape]
    forbidden:
      - A real tournament, school or team name in a fixture, test, log or report
      - A line that carries a value passed over by the scan
