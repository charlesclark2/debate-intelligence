# RELEASE v1.1 — Caselist evidence store
# Major version: V1. Epics: E29, E30, E31, E34
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: release-v1-1
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.1
  annotations:
    debate/title: v1.1 — Caselist evidence store
spec:
  description: >-
    OpenCaselist archives and OpenEv camp files for HS LD, Policy and PF are imported, deduplicated,
    parsed into cards and stored in S3 (dev and prod) with manifests; a daily scheduled sync captures
    every archive window from the day it ships; CardMirror is evaluated and ADR-0014 records the editor
    decision. E34 sits in this release rather than v1.2 because of ADR-0016: an OpenCaselist download
    holds about seven days of modifications and nothing can re-fetch a window that was missed, so the
    sync has to be running before, not after, the corpus work that depends on it.
  priority: 2
  acceptanceCriteria:
  - id: epic-e29
    description: >-
      Epic E29 (Cloud Evidence Store (S3)) goal is Succeeded.
  - id: epic-e30
    description: >-
      Epic E30 (Caselist Evidence Ingestion) goal is Succeeded.
  - id: epic-e31
    description: >-
      Epic E31 (Debate File Parsing) goal is Succeeded.
  - id: epic-e34
    description: >-
      Epic E34 (Scheduled Caselist Sync) goal is Succeeded, and the daily schedule is enabled and has
      completed at least one unattended run.
  - id: tagged
    description: >-
      Release tag v1.1.0 is pushed and CHANGELOG.md has a v1.1 section.
  - id: gate
    description: >-
      Gate release-v1-1-gate is approved.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Gate
metadata:
  name: release-v1-1-gate
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.1
spec:
  gateType: review
  description: >-
    Release review for v1.1 (Caselist evidence store): demo the release goal end to end, confirm CI green
    on the release tag, and confirm no evidence-integrity regressions.
  reviewers:
  - user:charlie
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: release-v1-1-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.1
spec:
  description: >-
    Release plan for v1.1: complete its epics, tag, and pass the release gate.
  goalRef:
    name: release-v1-1
  series: v1
  version: v1.1
  graph:
    nodes:
    - id: e29
      kind: External
      name: Epic E29 — Cloud Evidence Store (S3)
      inputs:
        goalRef: v1-e29-cloud-evidence-store
        specRef: plan_specs/v1/e29-cloud-evidence-store/epic.yaml
    - id: e30
      kind: External
      name: Epic E30 — Caselist Evidence Ingestion
      inputs:
        goalRef: v1-e30-caselist-ingestion
        specRef: plan_specs/v1/e30-caselist-ingestion/epic.yaml
    - id: e31
      kind: External
      name: Epic E31 — Debate File Parsing
      inputs:
        goalRef: v1-e31-debate-file-parsing
        specRef: plan_specs/v1/e31-debate-file-parsing/epic.yaml
    - id: e34
      kind: External
      name: Epic E34 — Scheduled Caselist Sync
      inputs:
        goalRef: v1-e34-caselist-sync
        specRef: plan_specs/v1/e34-caselist-sync/epic.yaml
    - id: tag-release
      kind: Task
      name: Tag and publish v1.1.0
      description: >-
        Update CHANGELOG.md, bump package versions, create the git tag, and publish release notes.
      dependsOn:
      - e29
      - e30
      - e31
      - e34
      acceptanceCriteria:
      - type: command_succeeds
        name: Release tag exists
        command: git
        args:
        - rev-parse
        - v1.1.0
    - id: release-review
      kind: Gate
      name: v1.1 release review
      dependsOn:
      - tag-release
      gateRef:
        name: release-v1-1-gate
status:
  phase: Pending
