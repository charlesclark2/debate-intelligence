spec:
  # Filed by the PM, 2026-11-05, from v1-e07-t16's question 6 (the PM's ruling, 2026-11-05).
  description: >-
    `tests/scripts/test_compare_card_clusters.py::test_one_key_answers_and_a_key_pressed_before_
    the_question_is_discarded` writes its answer key `d` from a threading.Timer at 0.3 s; if
    `scripts/compare_card_clusters.py`'s read_key flushes after the timer fires, the key written
    at 3.0 s answers instead. Make the test write its keys after the script says it is waiting
    (a line or a seam the test can read), not on a timer.
  priority: 3
  constraints:
    packages: [scripts, tests/scripts]
    forbidden:
      - A longer timer in place of the fix
      - A behaviour change to the script beyond the seam
  context:
    - kind: TaskRef
      name: v1-e07-t16-public-pool-footer-test-on-an-injected-clock
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The key test writes its keys after the script is waiting, and gives one answer under
        a slow start, by a test shown failing first.
status:
  phase: Pending
