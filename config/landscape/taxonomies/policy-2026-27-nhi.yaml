    aliases: [t establish]
  - id: should-t
    label: T-should
    kind: t
    side: neg
    description: Should means immediate and certain, so a plan that is delayed or conditional is not topical.
    aliases: [t should]
  - id: comprehensive-t
    label: T-comprehensive
    kind: t
    side: neg
    description: National health insurance must be comprehensive, so a plan covering one group or one service is not topical.
    aliases: [t comprehensive]
