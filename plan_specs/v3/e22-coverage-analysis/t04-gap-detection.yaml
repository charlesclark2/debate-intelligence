# TASK v3-e22-t04-gap-detection — Coverage gap detection
# Epic: E22 Case Coverage Analysis | Release: v3.1 (Case coverage analysis) | Major: V3
# Architecture refs: §3 V3 stories, §13 Coverage analysis, §16 coverage eval
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v3-e22-t04-gap-detection
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v3
    debate/release: v3.1
    debate/epic: v3-e22-coverage-analysis
  annotations:
    debate/title: Coverage gap detection
    debate/architecture-refs: §3, §13, §16
spec:
  description: >-
    Decide, for each predicted position, whether the student's extension and answer files cover it. The
    CoverageAnalysis use case runs cross-graph edge extraction (the E21 edge extractor) from student answer
    nodes to predicted nodes, then applies answers_to/unanswered queries and a documented policy to classify
    each predicted node COVERED, WEAK or UNCOVERED. A gap is a predicted node lacking a sufficiently
    supported ANSWERS/TURNS/MITIGATES relationship, never a keyword miss. Findings explain themselves with
    node and card references, and ties fall toward WEAK or UNCOVERED because false negatives cost more than
    extra warnings. Boundaries: the report UI and export are t05 and the labeled evaluation is t06.
  priority: 1
  constraints:
    packages: [debate_core.arguments, debate_core.application, debate_workers, prompts]
    forbidden:
      - Keyword or embedding similarity alone deciding coverage
      - Persisting nodes, edges or findings whose card/node references do not resolve
      - Model calls without a registered prompt_id/semver and persisted GeneratedArtifactMetadata
      - >-
        Live network or real model calls in unit/CI tests (use respx/vcr fixtures and the fake/replay
        ModelRouter)
  context:
    - kind: TaskRef
      name: v3-e22-t03-position-prediction
      relation: dependsOn
    - kind: TaskRef
      name: v3-e21-t04-graph-queries
      relation: dependsOn
    - kind: TaskRef
      name: v3-e21-t03-edge-extraction
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        CoverageAnalysis takes an aff file, its predicted positions and one or more student answer files,
        and runs cross-graph edge extraction before classification.
    - id: ac2
      description: >-
        COVERED requires a card-backed TURNS edge or at least two card-backed ANSWERS/MITIGATES edges on
        distinct steps at confidence 0.7 or higher; WEAK covers analytic-only, 0.5-0.7 confidence or
        single-step responses; UNCOVERED means no qualifying edge. Thresholds are configuration and
        documented.
    - id: ac3
      description: >-
        A test where an answer file mentions "federalism" with no supported ANSWERS edge yields UNCOVERED,
        and a paraphrased answer with a supported edge yields COVERED.
    - id: ac4
      description: >-
        Each CoverageFinding holds the predicted node ref, status, response edge refs, supporting card ids,
        explanation and confidence; LLM explanations (prompt coverage.gap_explanation) may cite only those
        refs.
    - id: ac5
      description: >-
        A CoverageAnalysisJob persists findings and status, and tests run on replay fixtures.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v3-e22-t04-gap-detection-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v3
    debate/release: v3.1
    debate/epic: v3-e22-coverage-analysis
spec:
  description: >-
    Use case orchestration, classification policy, explanations, then the job and tests.
  goalRef:
    name: v3-e22-t04-gap-detection
  graph:
    nodes:
      - id: use-case
        kind: Task
        name: CoverageAnalysis use case
        description: >-
          Load aff, predicted and answer graphs; invoke cross-graph edge extraction; gather responses via
          graph queries.
        outputs: [packages/debate_core/src/debate_core/arguments/coverage/gap_detection.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Use case tests pass
            command: uv
            args:
              - run
              - pytest
              - packages/debate_core/tests/arguments/coverage/test_gap_detection.py
              - "-k"
              - use_case
      - id: classification
        kind: Task
        name: Coverage classification policy
        description: >-
          CoveragePolicy value object with thresholds, FN-averse tie-breaking and keyword-trap tests.
        dependsOn: [use-case]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Classification tests pass
            command: uv
            args:
              - run
              - pytest
              - packages/debate_core/tests/arguments/coverage/test_gap_detection.py
              - "-k"
              - classify
      - id: explanations
        kind: Task
        name: Finding explanations
        description: >-
          Template explanations for every finding plus optional model explanation with reference validation.
        dependsOn: [classification]
        outputs: [prompts/coverage/gap_explanation.yaml]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Gap explanation prompt registered
            path: prompts/coverage/gap_explanation.yaml
            contentMatch: "prompt_id: coverage.gap_explanation"
          - type: test_passes
            name: Explanation tests pass
            command: uv
            args:
              - run
              - pytest
              - packages/debate_core/tests/arguments/coverage/test_gap_detection.py
              - "-k"
              - explain
      - id: job
        kind: Task
        name: CoverageAnalysisJob
        description: >-
          Worker handler with progress stages (predict, map, classify), idempotency and persisted findings.
        dependsOn: [explanations]
        outputs: [packages/debate_workers/src/debate_workers/handlers/coverage_analysis.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Coverage job tests pass
            command: uv
            args: [run, pytest, packages/debate_workers/tests/handlers/test_coverage_analysis.py]
          - type: command_succeeds
            name: Type check passes for debate_core
            command: uv
            args: [run, pyright, packages/debate_core]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
status:
  phase: Pending
