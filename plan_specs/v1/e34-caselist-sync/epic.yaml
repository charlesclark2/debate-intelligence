# EPIC E34 — Scheduled Caselist Sync
# Major version: V1 | Release: v1.1 (Caselist evidence store)
# Architecture refs: §9 Opponent data, §15 reliability, §14
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e34-caselist-sync
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e34-caselist-sync
  annotations:
    debate/title: E34 — Scheduled Caselist Sync
    debate/architecture-refs: §9 Opponent data, §15 reliability, §14
spec:
  description: >-
    After the data-use policy allows it, pull archives from the OpenCaselist API with the operator's own
    login token on a daily schedule, and run import → publish so every window is captured before it is
    gone; parse and landscape attach to the same run once E31 and E32 exist. ADR-0016 is why this epic
    ships in v1.1 ahead of the backfill rather than after the landscape work: a download holds roughly
    seven days of modifications, no endpoint returns a complete caselist, and consecutive weekly pulls
    overlap by about 6% of a week's files, so a run that slips loses the gap permanently. Daily pulls
    overlap six-sevenths and cost bandwidth rather than storage, because identity is content-addressed.
  priority: 2
  constraints:
    majorVersion: v1
    release: v1.1
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      An authenticated OpenCaselist API client lists caselists and downloads archives and OpenEv files,
      with rate limiting and without ever logging the token.
  - id: ac2
    description: >-
      A daily scheduled run on the operator's machine imports and publishes new archives idempotently,
      and reports what it captured. Parse and landscape stages run when their epics are present and are
      skipped, not failed, when they are not.
  - id: ac3
    description: >-
      A failed, skipped or stale run is impossible to miss: the run log, a staleness check the operator
      sees without going looking, and a warning in any report built on stale data. Under ADR-0016 a
      silently missed run is unrecoverable data loss, not a delayed refresh.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e34-caselist-sync-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e34-caselist-sync
spec:
  description: >-
    Task graph for epic E34 (Scheduled Caselist Sync). Each Task node points at its own task-level PlanSpec.
  goalRef:
    name: v1-e34-caselist-sync
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e30-t01-caselist-data-use-policy
      kind: External
      name: 'Prerequisite from E30: Caselist and OpenEv data-use policy'
      description: >-
        Cross-epic prerequisite owned by v1-e30-caselist-ingestion (release v1.1).
      inputs:
        goalRef: v1-e30-t01-caselist-data-use-policy
        specRef: plan_specs/v1/e30-caselist-ingestion/t01-caselist-data-use-policy.yaml
    - id: ext-v1-e30-t03-archive-importer
      kind: External
      name: 'Prerequisite from E30: Archive importer'
      description: >-
        Cross-epic prerequisite owned by v1-e30-caselist-ingestion (release v1.1).
      inputs:
        goalRef: v1-e30-t03-archive-importer
        specRef: plan_specs/v1/e30-caselist-ingestion/t03-archive-importer.yaml
    - id: ext-v1-e30-t04-openev-importer
      kind: External
      name: 'Prerequisite from E30: OpenEv camp-file importer'
      description: >-
        Cross-epic prerequisite owned by v1-e30-caselist-ingestion (release v1.1).
      inputs:
        goalRef: v1-e30-t04-openev-importer
        specRef: plan_specs/v1/e30-caselist-ingestion/t04-openev-importer.yaml
    - id: ext-v1-e30-t05-caselist-publish
      kind: External
      name: 'Prerequisite from E30: Publish sources and manifests to S3'
      description: >-
        Cross-epic prerequisite owned by v1-e30-caselist-ingestion (release v1.1).
      inputs:
        goalRef: v1-e30-t05-caselist-publish
        specRef: plan_specs/v1/e30-caselist-ingestion/t05-caselist-publish.yaml
    - id: ext-v1-e31-t06-parse-pipeline
      kind: External
      name: 'Prerequisite from E31: Incremental parse pipeline'
      description: >-
        Cross-epic prerequisite owned by v1-e31-debate-file-parsing (release v1.1).
      inputs:
        goalRef: v1-e31-t06-parse-pipeline
        specRef: plan_specs/v1/e31-debate-file-parsing/t06-parse-pipeline.yaml
    - id: ext-v1-e32-t05-landscape-cli
      kind: External
      name: 'Prerequisite from E32: `debate-research landscape` command'
      description: >-
        Cross-epic prerequisite owned by v1-e32-argument-landscape (release v1.2).
      inputs:
        goalRef: v1-e32-t05-landscape-cli
        specRef: plan_specs/v1/e32-argument-landscape/t05-landscape-cli.yaml
    - id: t01
      kind: Task
      name: OpenCaselist API client
      description: >-
        Client for api.opencaselist.com/v1 using the operator's caselist_token (stored in the macOS keychain
        or a local secret file, never logged or committed): list caselists, list and download weekly archives
        (/caselists/{caselist}/downloads) and OpenEv files; rate limiting and backoff; recorded fixtures.
      inputs:
        specRef: plan_specs/v1/e34-caselist-sync/t01-caselist-api-client.yaml
        goalRef: v1-e34-t01-caselist-api-client
      dependsOn:
      - ext-v1-e30-t01-caselist-data-use-policy
      - ext-v1-e30-t03-archive-importer
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e34-t01-caselist-api-client reports phase Succeeded
        command: uv
        args:
