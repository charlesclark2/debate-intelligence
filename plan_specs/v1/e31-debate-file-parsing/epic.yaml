      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e31-t01-cardmirror-evaluation reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e31-t01-cardmirror-evaluation
    - id: t02
      kind: Task
      name: Verbatim/CardMirror style profile
      description: >-
        Canonical style profile shared by the parser and every writer: heading levels (pocket/hat/block/tag),
        cite style, underline/emphasis/highlight, analytic and undertag styles, and heuristics for files
        that don't use Verbatim styles; fixtures curated from team and caselist files.
      inputs:
        specRef: plan_specs/v1/e31-debate-file-parsing/t02-verbatim-style-profile.yaml
