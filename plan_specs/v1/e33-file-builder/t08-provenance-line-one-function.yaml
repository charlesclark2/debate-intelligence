  graph:
    nodes:
      - id: one-line
        kind: Task
        name: No provenance line in built files
        description: >-
          Stop writing the provenance line in built files, keep the sidecar, and turn the quality check round.
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Writer tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/docx_file_writer]
