# EPIC E32 — Argument Landscape Reports
# Major version: V1 | Release: v1.2 (Argument landscape & file building)
# Architecture refs: §13 Coverage analysis (archetypes), §10 structured outputs
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e32-argument-landscape
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e32-argument-landscape
  annotations:
    debate/title: E32 — Argument Landscape Reports
    debate/architecture-refs: §13 Coverage analysis (archetypes), §10 structured outputs
spec:
  description: >-
    Classify parsed blocks and cards into the positions being read on each topic and publish weekly landscape
    reports: what is read, by how many teams, on which side, what is new, and the most-read cards.
    (PM amendment 2026-10-22, from the coach's priorities of 2026-10-22.) The first target is
    Policy, whose 2026-27 national health insurance topic runs all season and whose team starts
    competing on 2026-11-07: the plans affirmatives read and the DAs, CPs and Ks negatives read,
    from the hspolicy26 store, before that date. LD comes second, on the November-December
    de-extinction topic once teams have disclosed on it; the two remaining space colonization
    tournaments are not worth a taxonomy. The team has no PF debaters, so PF is out of scope
    until it does. Classification ships deterministic first (headings, tags and coach overrides,
    v1-e32-t02); the model stage for what headings cannot place is v1-e32-t07, which waits on
    E05 and the data-use policy's E32 gate. The first reports show the unclassified share
    honestly rather than waiting for the model.
  priority: 1
  constraints:
    majorVersion: v1
    release: v1.2
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      Per-topic position taxonomies exist for the Policy 2026-27 topic and the LD de-extinction topic and
      are editable by coaches (PM amendment 2026-10-22: no PF taxonomy while the team has no PF debaters).
  - id: ac2
    description: >-
      Blocks and cards are classified into positions with confidence and rationale; unknowns are queued
      for review.
  - id: ac3
    description: >-
      A weekly landscape report per caselist (Markdown and CSV, published to S3) shows positions, frequency,
      side split, week-over-week change and top cards with sources.
status:
  phase: Pending
---
