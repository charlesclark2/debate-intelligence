spec:
  # Filed by the PM, 2026-11-04, from Charlie's decision of 2026-11-04: a future task after 2026-12-01 to move to the updated 5.x models.
  description: >-
    v1.2 ships on Claude Haiku 4.5 and Sonnet 4.6 (v1-e05-t20) because the account's
    cross-region quotas for the 5.5 models read 0.0 and AWS declined on 2026-11-04 to restore
    them until the account shows sustained usage. Not before 2026-12-01: the operator submits a
    new quota increase request through the Service Quotas console, as AWS asked, for the current
    5.x models' cross-region tokens-per-minute quotas in us-east-1 (which models, read from the
    console's own list then, and the values, chosen with the PM from the account's usage). When
    the quotas read non-zero (bedrock-access.md step 5): move dev's and prod's routes to the 5.x
    models, class for class (the PM rules which), the grant naming exactly what the routing
    files route to, the prices restated from the operator's reading of the pricing page; dev's
    plan and apply and first calls, then prod's, the PM reading each plan; the spend budget's
    lists after the first billed calls; and the landscape model evaluation re-recorded on the
    new routes and recorded beside the 4.x figures (operator), since the bar is measured per
    route. Blocked until the quotas are granted, a condition outside this repository; the PM
    sets it to Pending then.
    (PM, 2026-11-04.) Blocked until the account's Bedrock quotas for the 5.x models read non-zero, and
    not started before 2026-12-01, when the operator resubmits the request through Service Quotas.
  priority: 3
  constraints:
    packages: [config, infrastructure/modules/bedrock_access, infrastructure/modules/model_spend_budget, infrastructure/envs, packages/debate_core/tests, tests/docs, docs/runbooks, docs/data]
    forbidden:
      - Starting before the quotas read non-zero
      - A price written from memory
      - A wildcard resource in the grant
      - A real model call in a test
  context:
    - kind: TaskRef
