# EPIC E35 — Debate Tub (Web File Access)
# Major version: V2 | Release: v2.1 (Web app, debate tub & async jobs)
# Architecture refs: §12 Card Library, §14 access control, ADR-0014
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e35-debate-tub
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v2
    debate/release: v2.1
    debate/epic: v2-e35-debate-tub
  annotations:
    debate/title: E35 — Debate Tub (Web File Access)
    debate/architecture-refs: §12 Card Library, §14 access control, ADR-0014
spec:
  description: >-
    Give debaters a signed-in "debate tub" in the web app: browse, search and download the team's built
    files, caselist sources and camp files from the S3 evidence store, organized by topic, position and
    side.
  priority: 9
  constraints:
    majorVersion: v2
    release: v2.1
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      Files published to S3 by V1 are indexed and browsable by topic, position and side, with provenance.
  - id: ac2
    description: >-
      Only members of the team's organization can list or download files; downloads use short-lived presigned
      URLs and are audited.
  - id: ac3
    description: >-
      Files open in CardMirror or download as .docx; coaches can upload files into the tub.
status:
  phase: Pending
---
