spec:
  # Filed by the PM, 2026-11-06, from v1-e32-t55's point 2 (the PM's ruling of 2026-11-06).
  description: >-
    v1-e32-t55's re-record repaired two batches (string_too_long). A repair cassette's input
    includes the model's own failed answer, so all 63 of its hits were in_input, which keeps a
    hit even when it carries a trusted mark (53 a JSON key, 10 a taxonomy word), and the scan
    read not clean for the first time since v1-e32-t44's marks. in_input exists to keep copied
    card text. Count a repair cassette's hit as in_input only when its words come from the cards
    the failed call sent, not from the failed answer, and keep every other rule. Tests on
    invented cassettes.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.arguments, packages/debate_core/tests]
    forbidden:
      - Card text from any real cassette in a test, log or report
      - A hit in the cards sent ever set aside
  context:
    - kind: TaskRef
      name: v1-e32-t44-scan-marked-hits-leave-a-text-clean
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A repair cassette's hit from the failed answer alone is not in_input, while one from
        the cards sent still is, by tests on invented cassettes shown failing first.
status:
  phase: Pending
