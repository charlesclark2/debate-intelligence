    Keep the schedule and options on reinstall, fix two comments, and name the takedown set's
    environment.
  goalRef:
    name: v1-e34-t25-reinstall-keeps-every-setting
  graph:
    nodes:
      - id: reinstall-settings
        kind: Task
        name: Reinstall keeps every setting
        description: >-
          The plist reads, the comments and the doctor line.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Installer tests pass
            command: uv
            args: [run, pytest, tests/integration/test_launchd_install.py]
status:
  phase: Pending
