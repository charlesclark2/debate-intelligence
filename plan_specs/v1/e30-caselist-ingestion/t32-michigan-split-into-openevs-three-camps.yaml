spec:
  # Filed by the PM, 2026-10-31, from the OpenEv camp words the PM read on 2026-10-31, at the operator's request.
  description: >-
    `camp_aliases.yaml` merges `Michigan7`, `Michigan Classic`, `MNDI` and `Michigan National
    Debate Institute` into one canonical camp, `Michigan`. OpenEv files three camps: `MNDI`
    (Michigan (MNDI)), `UM7` (Michigan) and `UMC` (Michigan (Classic)), read from its 2026 Files
    By Camp list. So a Michigan camp card cannot link to its camp's page (v1-e39-t28's rule
    leaves a merged camp without a word). Count first, read-only and counts only: how many
    stored camp files are `Michigan`, and how many of them name each spelling in their path or
    file name, and how many name none (a bare `Michigan`). Then split the table into three
    canonical camps, each with its spellings and its OpenEv word (`MNDI`, `UM7`, `UMC`), and say
    how a bare `Michigan` is filed: it stays `Michigan`, with no word, unless the count shows
    another rule is sound. Matching takes whole words, so `Michigan` must not swallow `Michigan
    Classic`: say how the loader orders or refuses that. Refile the existing camp files' camp
    from their stored names without a download, and say what else carries the camp (the parsed
    occurrence rows, the search index) and how each learns the new one: a rebuild, a re-import
    of metadata, or the next parse. Stop and report if it needs a parser or fingerprint version
    bump.
  priority: 3
  constraints:
    packages: [debate_core.application, packages/debate_core/tests, debate_cli, packages/debate_cli/tests, docs/data, docs/runbooks]
    forbidden:
      - A download, or network access in a test
      - A school, student or lab name in the report
      - A camp given a word OpenEv's list does not show
  context:
    - kind: TaskRef
      name: v1-e30-t04-openev-importer
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
