      - ext-v1-e02-t01-domain-entities
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e31-t02-verbatim-style-profile reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e31-t02-verbatim-style-profile
    - id: t03
      kind: Task
      name: Debate .docx parser
      description: >-
        Moved from V3 (was v3-e20-t03). Detect Verbatim-style heading levels (pocket/hat/block/tag), cites,
