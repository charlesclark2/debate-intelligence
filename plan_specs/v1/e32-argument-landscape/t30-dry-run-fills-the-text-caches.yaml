spec:
  # Filed by the PM, 2026-10-30, from v1-e40-t17's Follow-up work.
  description: >-
    The plan-text and analytic-text caches key on the parser version, so the first report after
    a bump re-reads every on-topic source, and a dry run keeps none of it, so the publish reads
    them again. The caches hold derived fields and no evidence text. Decide with the PM whether
    a dry run may write them (v1-e32-t05's rule says a dry run writes nothing), then build what
    is ruled.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests]
    forbidden:
      - Evidence text written to a cache
      - A model call in a dry run
  context: []
  acceptanceCriteria:
    - id: ac1
      description: >-
        As ruled: the publish after a dry run on a new parser version reads no source the
        dry run read, by tests shown failing first.
status:
  phase: Pending
