# TASK v1-e30-t30-inbox-deletions-fsync-the-directory - Inbox deletions fsync the inbox directory, so a removed archive cannot come back after a power cut
# Epic: E30 Caselist Evidence Ingestion | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e30-t30-inbox-deletions-fsync-the-directory
