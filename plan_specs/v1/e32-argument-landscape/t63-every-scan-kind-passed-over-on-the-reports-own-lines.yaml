# TASK v1-e32-t63-every-scan-kind-passed-over-on-the-reports-own-lines - The bundle scan passes over every kind of term on the report's own fixed lines, not only a tournament
# Epic: E32 Argument Landscape Reports | Release: v1.2 (Argument landscape & file building) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e32-t63-every-scan-kind-passed-over-on-the-reports-own-lines
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e32-argument-landscape
  annotations:
