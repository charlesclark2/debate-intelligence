spec:
  # Filed by the PM, 2026-11-05, from the 1.2.0 re-record of 2026-11-05 (the PM's reading of the sample's size).
  description: >-
    The bar is read on the coach's 47 labelled cards, of which Sonnet counts 33: one card moves
    the score about three points, and the 95% interval on 23 of 33 runs from about 0.53 to 0.83,
    so a route that truly scores 0.85 can score 0.75 on this sample. Three prompt versions have
    now been tuned on the same 47, so a score on them also flatters the prompt. Before any route
    is declared to meet the bar: draw a second sample by the same strata and seed rule, sharing
    no card with the 47, of a size proposed from the interval wanted at 0.85 (say the size, the
    interval it gives, and the coach's time at the t46 sitting's pace), and stop for the PM's
    ruling; the coach labels it in a sitting like v1-e32-t46's (stance included, unmarked, the
    model and the scores never shown); `--check-sample` reads it; and the evaluation reads the
    second sample as a holdout, never used to tune a prompt, beside the first.
    (PM amendment 2026-11-05, from v1-e32-t49's ruling 3.) At the same sitting the coach sees rows
    16, 33 and 57 of the first sample: each is labelled as read in a file disclosed only on the side
    opposite its position, so t46's side rule scores any answer there as answering. They may not be
    mislabels: a negative can read an affirmative's advantage (an advantage counterplan claiming to
    solve it, rows 16 and 33), and a kritikal affirmative can read a kritik's theory (row 57). Per row
    the coach chooses an at: label, a second label, or "the side rule is wrong here"; the third becomes
    a PM-filed follow-up on t46's other-side rule. v1-e32-t53 (generic-k's description) is decided
    before this sitting.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.arguments, scripts, packages/debate_core/tests, packages/debate_cli/tests, docs/data, docs/runbooks]
    forbidden:
      - Card text, a tag, heading or label text in the report, docs, logs or a test
      - A school, team code or debater name anywhere
      - A card shared with the first sample
      - A prompt tuned on the holdout
      - A live model call by the session
  context:
