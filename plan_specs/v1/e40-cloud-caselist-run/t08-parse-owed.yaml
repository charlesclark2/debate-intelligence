# TASK v1-e40-t08-parse-owed - A week a killed run published is parsed by the next run, not left for the next import
# Epic: E40 — Weekly Caselist Run in the Cloud | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e40-t08-parse-owed
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.8
    debate/epic: v1-e40-cloud-caselist-run
  annotations:
    debate/title: "A week a killed run published is parsed by the next run, not left for the next import"
spec:
  # Filed by the PM, 2026-10-24, from v1-e40-t04's finding 2 (the PM's review of 2026-10-24).
  description: >-
    A run killed after its publish stage and before its parse leaves that week published but not
    parsed. The next pull finds nothing new to import, and the parse stage parses only what its
    own run imported, so the week waits for the next import into that caselist or for `caselist
    parse --publish` by hand. Nothing is lost; it is late, on the Mac as in the cloud. Record a
    "parse owed" entry, per caselist and snapshot, in the run's state files when a publish
    completes, cleared when that snapshot's parse completes. Keep it in local mode's state and
    in bucket mode's saved state alike, so either runner honours it. A run that starts with a
    parse owed parses those snapshots first, even when it imports nothing, and `caselist runs`
    and `caselist status` say a parse is owed. A removal that reaches a snapshot clears its
    entry.
    (PM amendment 2026-10-27, from v1-e31-t31's code check.) A parser version the store has no
    directory of owes a full parse of every caselist the run follows, openev included, whether
    or not the run imports into it that week. The run parses what is owed before its index
    stage, so the first run on a new image builds an index of the new version instead of
    failing. Today a bump needs the operator's full parse from a restored copy (v1-e31-t31's
    runbook steps).
    (PM amendment 2026-10-31, from v1-e40-t18's Deviation 1.) A parse-owed entry is cleared only when
    that snapshot's parsed store is published complete, not when its parse completes, so a parse stage
    whose publish failed leaves it owed. The next run, weekly or started by hand, then parses and
    publishes it whether or not it imports into the caselist. When this ships, v1-e40-t18's cure no
    longer needs "that imports into a caselist": drop it from `cloud_parse_cure`'s hint and fix line,
    from the banners' tests and from `caselist-cloud-run.md`'s "A failed parse stage".
    (PM amendment 2026-11-01, from v1-e40-t22's Follow-up 3.) A parse stage that ran over its failure
    rate but published its parsed store owes nothing, so it names no cure: today it gets v1-e40-t18's
    "the next cloud run that imports into …" line, where local mode gives `PARSE_COMMAND`.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_core.integrations, packages/debate_core/tests, debate_cli, packages/debate_cli/tests, docs/runbooks]
    forbidden:
      - Network or AWS access in any test (moto and stand-ins only)
      - A school, team code or path in the state files
  context:
    - kind: TaskRef
      name: v1-e40-t04-run-state-on-s3
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A run killed after its publish and before its parse leaves a parse-owed entry, and
        the next run parses that snapshot first though it imports nothing, in local and
        bucket mode; a completed parse clears it; tests shown failing first, using
        v1-e40-t04's kill harness.
    - id: ac2
      description: >-
        `caselist runs` and `caselist status` say a parse is owed, and a removal that
        reaches the snapshot clears the entry, by test.
    - id: ac3
      description: >-
        A parse stage whose parsed-store publish fails leaves the entry, and the next run
        parses and publishes that snapshot though it imports nothing; the cloud cure's hint
        no longer says "that imports into"; by tests shown failing first.
status:
  phase: InProgress
