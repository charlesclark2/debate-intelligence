# TASK v1-e40-t02-secrets-token-store-and-login - The caselist token in Secrets Manager, and a scheduled login that renews it
# Epic: E40 — Weekly Caselist Run in the Cloud | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e40-t02-secrets-token-store-and-login
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.8
    debate/epic: v1-e40-cloud-caselist-run
  annotations:
    debate/title: "The caselist token in Secrets Manager, and a scheduled login that renews it"
spec:
  # Filed by the PM, 2026-10-22, from Charlie's decision of 2026-10-22 and ADR-0020.
  description: >-
    A Secrets Manager backend for the existing caselist token store (beside the keychain and
    file backends), and a scheduled login job that reads the coach's Tabroom password, trades it
    for a token through `POST /login` as `caselist auth login` does, and stores only the token.
    Only the login job's role reads the password; the run's role reads the token. Both secrets
    use their own KMS key, CloudTrail logs every read, and a failed login emails the coach
    without naming the account. Terraform for both secrets, the key, the roles and the schedule,
    in dev then prod. ADR-0020 may amend this task.
  priority: 1
  constraints:
    packages: [debate_core.integrations, debate_core.application, debate_cli, infrastructure, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks]
    forbidden:
      - Logging or persisting the password or the token outside Secrets Manager
      - Any role but the login job's reading the password
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e40-t01-cloud-run-adr
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The Secrets Manager backend passes the token store's contract tests with a stubbed
        client, and a redaction test shows neither secret reaches a log or an error.
    - id: ac2
      description: >-
        Terraform's tests show only the login role can read the password and only the run
        role the token, both under the dedicated key; the operator applies dev, then prod at
        promotion, and one scheduled login stores a token (operator).
status:
  phase: Pending
