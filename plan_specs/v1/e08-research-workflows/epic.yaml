        specRef: plan_specs/v1/e07-discovery-adapters/t02-openalex-adapter.yaml
    - id: ext-v1-e07-t05-rss-news-adapter
      kind: External
      name: 'Prerequisite from E07: Publisher RSS/Atom and Google News RSS adapter'
      description: >-
        Cross-epic prerequisite owned by v1-e07-discovery-adapters (release v1.2).
      inputs:
        goalRef: v1-e07-t05-rss-news-adapter
        specRef: plan_specs/v1/e07-discovery-adapters/t05-rss-news-adapter.yaml
    - id: t01
      kind: Task
      name: SearchService fan-out
      description: >-
        Concurrent provider fan-out with per-provider timeout, partial-result reporting and persisted
        Search/SearchResult records.
      inputs:
        specRef: plan_specs/v1/e08-research-workflows/t01-federated-search-service.yaml
        goalRef: v1-e08-t01-federated-search-service
      dependsOn:
      - ext-v1-e07-t01-search-provider-contract
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e08-t01-federated-search-service reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e08-t01-federated-search-service
    - id: t02
      kind: Task
      name: Normalization and deduplication
      description: >-
        Dedupe by DOI, canonical URL, source ids and fuzzy title/author similarity; merge metadata from
        multiple providers.
      inputs:
        specRef: plan_specs/v1/e08-research-workflows/t02-normalize-dedupe.yaml
        goalRef: v1-e08-t02-normalize-dedupe
      dependsOn:
      - t01
      - ext-v1-e04-t01-url-canonicalization
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e08-t02-normalize-dedupe reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e08-t02-normalize-dedupe
    - id: t03
      kind: Task
      name: Explainable feature ranking
      description: >-
        BM25 lexical relevance, recency, source-type, peer-review, OA/accessibility and citation features
        combined into a transparent score with per-result explanations.
      inputs:
        specRef: plan_specs/v1/e08-research-workflows/t03-feature-ranking.yaml
        goalRef: v1-e08-t03-feature-ranking
      dependsOn:
      - t02
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e08-t03-feature-ranking reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e08-t03-feature-ranking
    - id: t04
      kind: Task
      name: Argument/need query expansion
      description: >-
        Taxonomy of debate arguments (e.g., politics-da, econ-da, heg) and needs (uniqueness, link, internal-link,
        impact, answers) mapped to query templates, with optional LLM expansion through ModelRouter.
      inputs:
        specRef: plan_specs/v1/e08-research-workflows/t04-argument-need-expansion.yaml
