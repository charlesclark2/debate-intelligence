# The positions a Policy landscape report counts on the 2026-27 national health insurance topic.
# docs/guides/landscape-taxonomy.md says how to add a position or an alias, retire or merge one, and
# bump taxonomy_version. Every alias is a heading as the normalizer writes it, and came from the
# seeded candidates (headings at least two teams used) or from the coach. Never delete or reuse an
# id once released: retire it with deprecated: true, and merged_into when it was renamed or merged.
# generic.yaml's Policy positions are merged in when a report reads this file.
#
# 1.1.0 (2026-10-24, the coach's first review-queue pass, v1-e32-t05): added debt-da, ai-da,
# democracy-da, sustainability-advantage and biotech-advantage, each with its queue heading as alias.
# 1.2.0 (2026-10-24, the coach's answers to the plan-text sheet, v1-e32-t09): nine mechanisms of
# single payer as its children and thirteen other affs, each with the coach's tag keywords and no
# alias. A child's id is its mechanism name in kebab case plus -aff; the others keep the coach's ids.
# nhi-aff has no keywords: plan_texts/policy-2026-27-nhi.yaml says when a plan text names it.
# 1.3.0 (2026-10-25, the PM's ruling 1 on v1-e32-t17's counts): kritikal-aff, one generic kritikal
# affirmative, with no alias and no keyword. kritikal_affs/policy-2026-27-nhi.yaml says when a file names
# it: a K-aff marker in a file with no plan text.
# 1.4.0 (2026-10-26, v1-e32-t22): scenario lists on eleven DAs and advantages, seeded from v1-e32-t14's
# names two or more teams use (its session report, hspolicy26 through 2026-10-20), each name its own
# one form until the coach merges, renames or drops them. A position with a list shows only the coach's
# names; the others keep t14's rule. docs/guides/landscape-taxonomy.md says how to edit a list.
# 1.4.1 (2026-11-01, v1-e32-t40, for the coach's review): a one-line description drafted for every
# position that had none, generic.yaml's Policy positions with them (generic 1.1.1). The model stage
# sends each position with its side and description. Drafts until the coach approves or corrects them
# (the task's session report holds the review sheet); no count moves, so a patch.
schema_version: 1
topic_id: policy-2026-27-nhi
taxonomy_version: 1.4.1
event: POLICY
positions:

  # Affirmative plans, by mechanism
  - id: single-payer-aff
    label: Single payer
    kind: aff
    side: aff
    description: A plan for one public insurer that pays for everyone's care, with no narrower mechanism named.
    aliases: [single payer, aff single payer, single payer aff, singlepayer]

  # Single payer's mechanisms, from the coach's plan-text answers: a card under single payer whose tag
  # holds one child's keywords goes under that child, and a plan text naming one names it.
  # PM ruling 2026-10-24 (v1-e32-t09, resumed question 1): each label here and in the affs below is the
  # coach's mechanism_name in sentence case. tests/config refuses a capital after a label's first word
  # (it reads as a person's name), so only the case changed; his wording is otherwise kept.
  - id: global-budgets-aff
    label: Global budgets
    kind: aff
    side: aff
    description: A single payer plan that pays hospitals a fixed yearly budget instead of paying per service.
    parent: single-payer-aff
    tag_keywords: [global budget, global budgets, global budgeting, global operating budget, global operating budgets]
  - id: single-public-authority-aff
    label: Single public authority
    kind: aff
    side: aff
    description: A single payer plan run by one public authority that collects and pays out the money.
    parent: single-payer-aff
    tag_keywords: [public authority, financing authority]
  - id: medicare-for-all-aff
    label: Medicare for all
    kind: aff
    side: aff
    description: A single payer plan that extends Medicare to everyone (Medicare for All).
    parent: single-payer-aff
    tag_keywords: [medicare for all, improved medicare, m4a, "3069", medicaid for all]
  - id: lower-payment-rates-aff
    label: Lower payment rates
    kind: aff
    side: aff
    description: A single payer plan whose mechanism is lower rates paid to doctors, hospitals and drug makers.
    parent: single-payer-aff
    tag_keywords: [lower payment rates]
  - id: value-based-reimbursement-aff
    label: Value-based reimbursement
    kind: aff
    side: aff
    description: A single payer plan that pays providers for patient outcomes rather than for the number of services.
    parent: single-payer-aff
    tag_keywords: [value based reimbursement, value based payments, value based payment, value based healthcare, value based care]
  - id: disparate-impact-enforcement-aff
    label: Disparate impact enforcement
    kind: aff
    side: aff
    description: A single payer plan that enforces disparate impact rules against discrimination in care.
    parent: single-payer-aff
    tag_keywords: [disparate impact]
  - id: degrowth-aff
    label: Degrowth
    kind: aff
    side: aff
    description: A single payer plan defended as a move toward degrowth, away from an economy built on growth.
    parent: single-payer-aff
    tag_keywords: [degrowth]
  - id: prescription-drug-coverage-aff
    label: Prescription drug coverage
    kind: aff
    side: aff
    description: A single payer plan centred on covering prescription drugs.
    parent: single-payer-aff
    tag_keywords: [prescription drug, covering pharmaceuticals]
  - id: nanomedicine-coverage-aff
    label: Nanomedicine coverage
    kind: aff
    side: aff
    description: A single payer plan that covers nanomedicine treatments.
    parent: single-payer-aff
    tag_keywords: [nanomedicine, nanomedical]

  # Other affs, from the same answers
  - id: nhi-aff
    label: Resolutional NHI
    kind: aff
    side: aff
    description: A plan that enacts the resolution's national health insurance as worded, with no narrower mechanism.
  - id: public-option-aff
    label: Public option
    kind: aff
    side: aff
    description: A plan for a government insurance plan anyone can buy, alongside private insurers.
    tag_keywords: [public option, federal employees health benefits]
  - id: ucc-aff
    label: UCC
    kind: aff
    side: aff
    description: A plan for universal catastrophic coverage, insuring everyone against large costs with a sliding-scale deductible.
    tag_keywords: [ucc, universal catastrophic coverage, catastrophic health insurance, sliding scale]
  - id: indigenous-aff
    label: Indigenous
    kind: aff
    side: aff
    description: A plan for the health insurance of Indigenous peoples, such as reforming the Indian Health Service.
    tag_keywords: [indigenous]
  - id: reproductive-health-aff
    label: Reproductive health
    kind: aff
    side: aff
    description: A plan that covers reproductive care, including abortion, for example by ending the Hyde Amendment.
    tag_keywords: [reproductive, hyde amendment]
  - id: tiered-nhi-aff
    label: Tiered NHI
    kind: aff
    side: aff
    description: A plan for national health insurance in tiers, a basic public level with further levels above it.
    tag_keywords: [tiered national health insurance]
  - id: incarceration-aff
    label: Incarceration
    kind: aff
    side: aff
    description: A plan that extends health insurance to people in prison or jail.
    tag_keywords: [incarcerated, incarceration, correctional]
  - id: voucher-aff
    label: Vouchers
    kind: aff
    side: aff
    description: A plan that gives people vouchers to buy private insurance.
    tag_keywords: [voucher]
  - id: medicaid-expansion-aff
    label: Medicaid expansion
    kind: aff
    side: aff
    description: A plan that expands Medicaid to more people or to every state.
    tag_keywords: [medicaid expansion]
  - id: aca-reform-aff
    label: ACA reform
    kind: aff
    side: aff
    description: A plan that reforms or builds on the Affordable Care Act's marketplaces and subsidies.
    tag_keywords: [affordable care act]
  - id: childrens-coverage-aff
    label: Children's coverage
    kind: aff
    side: aff
    description: A plan that insures every child.
    tag_keywords: [for all children]
  - id: eco-nhi-aff
    label: Ecological NHI
    kind: aff
    side: aff
    description: A plan for national health insurance tied to ecological health, such as climate or environmental care.
    tag_keywords: [ecological, green national health insurance, sustainable national health insurance]
  - id: human-enhancement-aff
    label: Human enhancement
    kind: aff
    side: aff
    description: A plan that covers human enhancement technologies beyond treating illness.
    tag_keywords: [human enhancement]

  # The kritikal affirmative (v1-e32-t17): one position for every K aff, named by no heading or tag
  - id: kritikal-aff
    label: Kritikal affirmative
    kind: aff
    side: aff
    description: An affirmative with a role of the ballot, an advocacy statement or a method and no plan text.

  # Advantages: standalone until the headings show which aff each belongs to
  - id: costs-advantage
    label: Costs advantage
    kind: advantage
