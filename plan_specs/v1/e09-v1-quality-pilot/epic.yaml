        specRef: plan_specs/v1/e06-card-cutting/t04-docx-renderer.yaml
    - id: ext-v1-e08-t06-auto-cut
      kind: External
      name: 'Prerequisite from E08: `--auto-cut N` batch cutting'
      description: >-
        Cross-epic prerequisite owned by v1-e08-research-workflows (release v1.2).
      inputs:
        goalRef: v1-e08-t06-auto-cut
        specRef: plan_specs/v1/e08-research-workflows/t06-auto-cut.yaml
    - id: t01
      kind: Task
      name: Golden card fixtures from team files
      description: >-
        Curate representative cards (policy, LD, PF) from the team's evidence files with snapshots, expected
        spans and expected DOCX formatting.
      inputs:
        specRef: plan_specs/v1/e09-v1-quality-pilot/t01-golden-card-fixtures.yaml
