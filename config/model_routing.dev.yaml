# Model routing for the dev environment (DEBATE_ENV=dev): the pre-release channel a tester runs on
# their own machine, and what a source checkout resolves to when DEBATE_ENV is unset.
#
# Owned by v1-e01-t09-dev-prerelease-channel. The schema is
# debate_core.integrations.models.routing_policy.RoutingPolicy; config/model_routing.example.yaml
# explains each task class, where the identifiers come from and why no Claude route sets a
# temperature.
#
# Dev routes every text class one tier cheaper than prod (config/model_routing.prod.yaml): dev is
# where a new prompt's first, wrong version runs, and it runs under a daily budget of at most $2
# (models.budget_usd_daily in config/profiles/dev.toml, enforced by the E05 BudgetGuard). A prompt
# that only works on the prod model is found out in validate-dev rather than on the team's corpus.
# Embeddings and rerank are the same models as prod on purpose: a vector index built in dev with a
# different embedding model would not be comparable with anything.
#
# Dev and prod must never share this file (the task spec forbids it). Identifiers checked against
# the AWS Bedrock model cards on 2026-10-16 (v1-e05-t01-model-router-port).
#
# Until the 5.5 quotas are restored, the three Claude routes go to the models this account can call
# (v1-e05-t13-dev-routes-to-callable-claude-models). On 2026-10-27 the account's applied
# cross-region tokens-per-minute quotas for Claude Haiku, Sonnet and Opus 5.5 were all 0, so Bedrock
# refuses every call to them as "not available for this account", and they are held at zero under an
# open AWS support case. Claude Haiku 4.5 and Sonnet 4.6 hold non-zero quotas and answered a first
# call that day (v1-e05-t08's PM record). complex_reasoning and high_volume go to Haiku 4.5 and
# deep_audit to Sonnet 4.6, each route keeping its region, max_tokens and timeout. Prod is unchanged.
# When the support case restores the quotas, a later change switches dev back to Haiku 5.5 and
# Sonnet 5.5. Haiku 4.5 costs ten times Haiku 5.5 (config/model_pricing.yaml), so high_volume runs
# cost more here than in prod until then.

version: 1

routes:
  complex_reasoning:
    provider: bedrock
    model_id: anthropic.claude-haiku-4-5-20251001-v1:0
    inference_profile: us.anthropic.claude-haiku-4-5-20251001-v1:0
    region: us-east-1
    max_tokens: 8192
    timeout_seconds: 300

  high_volume:
    provider: bedrock
    model_id: anthropic.claude-haiku-4-5-20251001-v1:0
    inference_profile: us.anthropic.claude-haiku-4-5-20251001-v1:0
    region: us-east-1
    max_tokens: 2048
    timeout_seconds: 60

  deep_audit:
    provider: bedrock
    model_id: anthropic.claude-sonnet-4-6
    inference_profile: us.anthropic.claude-sonnet-4-6
    region: us-east-1
    max_tokens: 16384
    timeout_seconds: 600

  embeddings:
    provider: bedrock
    model_id: amazon.titan-embed-text-v2:0
    region: us-east-1
    timeout_seconds: 30

  rerank:
    provider: bedrock
    model_id: cohere.rerank-v3-5:0
    region: us-east-1
    timeout_seconds: 30
