      inputs:
        goalRef: v1-e30-t06-initial-backfill
        specRef: plan_specs/v1/e30-caselist-ingestion/t06-initial-backfill.yaml
    - id: t01
      kind: Task
      name: OpenCaselist API client
      description: >-
        Client for api.opencaselist.com/v1 using the operator's caselist_token (stored in the macOS keychain
        or a local secret file, never logged or committed): list caselists, list and download weekly archives
