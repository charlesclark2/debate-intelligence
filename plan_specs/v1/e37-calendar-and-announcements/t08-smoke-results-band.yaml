  graph:
    nodes:
      - id: smoke-results
        kind: Task
        name: Smoke check for results
        description: >-
          Add the two checks to scripts/site_smoke.py with recorded-page tests.
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Smoke script tests pass
            command: uv
            args: [run, pytest, tests/scripts/test_site_smoke.py]
