# THE TOURNAMENT SCHEDULE
# -----------------------
# One entry per tournament. This file is the source of record for the season (ADR-0015, as
# accepted 2026-10-01): the /schedule/ page and the calendar file parents subscribe to
# (/schedule.ics) are both built from it, and nothing else. It was seeded from
# docs/data/2026-27-tournament-schedule.md, which is no longer updated.
#
# Validated at build time by src/lib/tournaments.ts. A mistake fails the build naming the entry
# and the field. How to add, change and remove a tournament, and how a change reaches the site:
# docs/guides/coach-website-editing.md, "Events: the tournament schedule file".
#
# Everything here is public. Never write a student's name, an email address, a phone number, a
# ride, a hotel room or a roster. The build refuses an email address, a phone number and any name
# it has not been told about.
#
# Each entry:
#
#   id         Lower case and hyphens, with the year, e.g. glenbrooks-2026. NEVER change it once
#              published, and never reuse one: a subscriber's calendar app knows the tournament by
#              it, so a new id shows parents a second copy of the same tournament.
#   name       The tournament's name.
#   start      The first day, as 2026-11-21.
#   end        The last day, for a tournament of more than one day. Leave it out for one day.
#   events     Any of: policy, lincoln-douglas, public-forum (the ids in content/events.yaml).
#   held       in-person, online-at-school (online, but debated at Whitefish Bay High School, so
#              students come to school), or online-from-home.
#   where      The town, or the host school and town. Required for in-person; left out for the two
#              online kinds. "To be announced" is an answer.
#   overnight  no, yes, or possibly.
#   byEvent    Instead of events/held/where/overnight, when the events are held differently: one
#              group per arrangement, each with its own events, held, where and overnight.
#   status     confirmed, tentative, or conditional. A conditional entry also needs `condition`:
#              the sentence that says what it depends on, which the page shows in full.
#   signUpBy   Optional. The date families must have signed up by.
#   notes      Optional. One or two short sentences.
#   nationals  true for a national tournament, which the page lists in its own section.
#
# The order of entries here does not matter: the page sorts them by date. Two tournaments on the
# same dates are found from the dates and both marked on the page; there is nothing to mark here.

