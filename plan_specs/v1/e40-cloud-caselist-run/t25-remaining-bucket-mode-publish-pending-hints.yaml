# TASK v1-e40-t25-remaining-bucket-mode-publish-pending-hints - In bucket mode the failed-publish banners and the CLI's next step point at the cloud run, not a publish from the Mac
# Epic: E40 — Weekly Caselist Run in the Cloud | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e40-t25-remaining-bucket-mode-publish-pending-hints
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.8
    debate/epic: v1-e40-cloud-caselist-run
  annotations:
    debate/title: "In bucket mode the failed-publish banners and the CLI's next step point at the cloud run, not a publish from the Mac"
spec:
  # Filed by the PM, 2026-11-01, from v1-e40-t22's Follow-up work 1, 2 and 4 (the PM's review, 2026-11-01).
  description: >-
    v1-e40-t22 moved the login banner, the failure-rate hint and the newer-fingerprint hint to
    the cloud run in bucket mode. Three hints there still name `caselist pull
    --publish-pending`, a publish from the operator's working copy: a failed publish stage's
    banner (`fix_command=PUBLISH_PENDING_COMMAND`), the "manifest published again" banner
    (`MANIFEST_PUBLISHED_AGAIN_TITLE`), and the CLI's own next step for a failed publish stage
    (`caselist_pull.py`). The bucket-mode login banner also says the run "kept everything it
    fetched" and that "the publish after the login uploads this machine's copy", neither true of
    a cloud task. Give each the cloud run's wording, decided by `bucket_run` and `bucket_mode`
    as t22 does, and look at the suppression list's fallback reason, which quotes `aws sso
    login` in a record reason.
    (PM amendment 2026-11-01, from v1-e40-t08's Follow-up 1, ruled (a).) Since v1-e40-t08 the next pull
    parses what is owed whatever it imports, so two more hints drop "imports into": local mode's parse fix
    (`_unpublished_parsed_store_fix`, "The next pull that imports into that caselist does the same; ...")
    and the bucket-mode newer-table hint (`NewerFingerprintTable.cloud_fix`, "The next cloud run that
    imports into <caselist> on an image ..."), with the tests and the runbook paragraph that pin them
    (v1-e40-t08's report lists them).
  priority: 3
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks]
    forbidden:
      - A bucket-mode hint naming a command that publishes from the operator's working copy
      - A record shape an earlier build refuses to read
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e40-t22-bucket-mode-hints-point-at-the-cloud
      relation: dependsOn
    - kind: TaskRef
      name: v1-e40-t08-parse-owed
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        In bucket mode the failed-publish banner, the published-again banner, the CLI's next
        step and the login banner's two sentences name the cloud run's cure and no Mac-side
        publish, local mode is unchanged, and the cloud image and the Mac's installed build
        read every record written, by tests shown failing first.
status:
  phase: Succeeded
