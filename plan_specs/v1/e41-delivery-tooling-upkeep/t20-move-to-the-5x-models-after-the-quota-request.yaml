  acceptanceCriteria:
    - id: ac1
      description: >-
        The quota request is submitted through Service Quotas after 2026-12-01 and its
        answer recorded, and the quotas read non-zero before any change (operator, recorded
        by the PM).
    - id: ac2
      description: >-
        Dev's and prod's routing name the 5.x models the PM ruled, the grant names exactly
        what the routing files route to, and the prices are restated, pinned by the modules'
        tests shown failing first.
    - id: ac3
      description: >-
        Dev's and prod's plans and applies (the PM reading each), the first call on each
        route, the spend budget's lists, and the landscape evaluation re-recorded on the new
        routes (operator).
