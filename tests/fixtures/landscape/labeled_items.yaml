  - event: PF
    taxonomy:
      topic_id: pf-sample-topic
      taxonomy_version: 1.4.2
      event: PF
      positions:
        - {id: jobs-contention, label: Jobs, kind: contention, side: aff, aliases: [jobs]}
        - {id: grid-contention, label: Grid reliability, kind: contention, side: aff, aliases: [grid, grid reliability]}
        - {id: innovation-contention, label: Innovation, kind: contention, side: aff, aliases: [innovation]}
        - {id: ai-innovation-contention, label: AI innovation, kind: contention, side: aff, parent: innovation-contention, tag_keywords: [artificial intelligence]}
        - {id: emissions-contention, label: Emissions, kind: contention, side: neg, aliases: [emissions]}
        - {id: water-contention, label: Water use, kind: contention, side: neg, aliases: [water, water use]}
        - {id: local-economy-contention, label: Local economy, kind: contention, side: neg, tag_keywords: [small business]}
        - {id: tax-revenue-response, label: Tax revenue, kind: response, side: both, aliases: [tax revenue]}
        - {id: cost-benefit-framing, label: Cost benefit framing, kind: criterion, side: both, aliases: [cost benefit, cbf]}
    overrides: []
    caselist_schools: {}
    documents:
      - name: pf-pro-file
        team_names: [Willow Creek, WC]
        cards:
          - {path: [Pro, Jobs], tag: Construction hires locally, carries_alias: true,
             expect: {position: jobs-contention, role: READS, method: ALIAS}}
          - {path: [Pro, Jobs, Link], tag: Each center hires hundreds, carries_alias: true,
             expect: {position: jobs-contention, role: READS, method: INHERITED}}
          - {path: [Pro, Jobs, "AT: Automation"], tag: Automation is slow, carries_alias: true,
             expect: {position: jobs-contention, role: READS, method: INHERITED}}
          - {path: [Pro, Grid Reliability], tag: Demand response helps, carries_alias: true,
             expect: {position: grid-contention, role: READS, method: ALIAS}}
          - {path: [Pro, Grid, Impact], tag: Blackouts kill, carries_alias: true,
             expect: {position: grid-contention, role: READS, method: INHERITED}}
          - {path: [Pro, Innovation], tag: Artificial intelligence research accelerates, carries_alias: true,
             expect: {position: ai-innovation-contention, role: READS, method: TAG_KEYWORD}}
          - {path: [Pro, Innovation], tag: Research accelerates, carries_alias: true,
             expect: {position: innovation-contention, role: READS, method: ALIAS}}
          - {path: ["AT: Emissions"], tag: Renewables power centers, carries_alias: true,
             expect: {position: emissions-contention, role: ANSWERS, method: ALIAS}}
          - {path: [A2 Emissions], tag: Offsets work, carries_alias: true,
