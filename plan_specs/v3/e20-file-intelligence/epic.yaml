# EPIC E20 — Debate File Intelligence
# Major version: V3 | Release: v3.0 (Debate file intelligence & argument graph)
# Architecture refs: §6 FileIntelligenceService, §13 Argument graph (file parsing)
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v3-e20-file-intelligence
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v3
    debate/release: v3.0
    debate/epic: v3-e20-file-intelligence
  annotations:
    debate/title: E20 — Debate File Intelligence
    debate/architecture-refs: §6 FileIntelligenceService, §13 Argument graph (file parsing)
spec:
  description: >-
    Upload debate files through the web app and parse them with the V1 debate-docx parser (E31) into pockets/hats/blocks/tags,
    cites, evidence and analytics, preserving formatting metadata.
  priority: 13
  constraints:
    majorVersion: v3
    release: v3.0
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      Uploaded DOCX files are stored privately with hashes and parsed asynchronously by the shared V1
      parser.
  - id: ac2
    description: >-
      Parsed sections keep underline/highlight metadata and link to Card records.
  - id: ac3
    description: >-
      Parser accuracy on uploaded files is tracked against the V1 parser evaluation set.
status:
  phase: Pending
---
