[project]
name = "debate-api"
version = "1.1.0"
description = "HTTP API service (thin surface over debate_core)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The student search pilot's app (v1-e39-t04, ADR-0019 (b)): a plain ASGI app served by uvicorn,
# which the Lambda Web Adapter forwards function URL events to. No Mangum and no Lambda code here,
# so the same app runs under uvicorn locally, in tests and in V2's container. uvicorn without its
# `standard` extra: the pure-Python h11 server is enough for one function, and adds nothing to
# the image that needs compiling.
#
# v1-e39-t05 adds sign-in: debate-core's `tub` extra for the Cognito, audit and parameter adapters
# its composition root builds; cryptography for the AES-GCM session cookie; jinja2 for the pages;
# and segno, pure Python with no dependencies, which draws the authenticator QR code as SVG on the
# server so the secret never leaves the page as an image request.
dependencies = [
    "cryptography>=44",
    "debate-core[tub]",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "segno>=1.6",
    "uvicorn>=0.32",
]

[tool.uv.sources]
debate-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
