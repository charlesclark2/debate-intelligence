# Argument and need query expansion for federated search (v1-e08-t04-argument-need-expansion).
#
# `debate-research search "<query>" --argument <argument> --need <need>` asks the search providers
# the queries below instead of the bare query.
#
# Families (v1-e08-t08): each family of arguments has its own needs, and an argument's kind chooses
# its family (da and advantage, framework, theory, cp, k). An argument lists, for every need of its
# family and no other, the templates it expands into, and `--need` takes only its family's needs:
# a framework has no uniqueness or internal link, because the question is whether it is good or not.
# A need's name means the same need in every family that has it (answers, link, impact).
#
# In a template, {query} is what the debater typed, {topic} the topic (from --topic, the topic
# preset at the bottom of this file, or otherwise the query itself), and {bill} the agenda item a
# politics DA is about, which only the request can give. A template naming a variable the request
# did not give is skipped, so every pair keeps at least one template that names only {query} and
# {topic}. No template names a current event: what changes week to week is a variable.
#
# Windows: each need has a default recency window, and a template may set its own. A search with
# its own --since keeps it. `any` means any age. The coach's windows (2026-11-02): uniqueness one
# year, 30 days for the politics DA; link, internal link and answers five years; impact any age.
# Framing has no window: philosophy evidence doesn't go stale. The theory, counterplan and kritik
# windows are drafts for his review.
#
# Loaded and validated by debate_core.application.query_expansion.load_argument_taxonomy; a mistake
# fails the load naming the field. Raise taxonomy_version on every change. Every entry says
# `review: awaiting_coach_review` until the coach has read it and changed it to `coach_reviewed`.
# Version 1.1.0 is the coach's review of 2026-11-02 (v1-e08-t04's ac4): his windows, templates and
# decisions. Version 1.2.0 (v1-e08-t08, for his review) gives each family its own needs, reshapes
# util, deontology, structural violence and cost-benefit into framing with his content, gives theory
# its own family, and adds the landscape's generic counterplans and kritiks. The DAs and advantages
# he reviewed are unchanged. Version 1.3.0 (v1-e08-t14, for his review) gives the NHI topic preset
# the country and its affirmatives' plan mechanisms, which a DA's link search names; no argument
# entry changes. Version 1.5.0 (v1-e32-t06) adds the LD de-extinction topic preset, whose topic is
# taken word for word from its committed resolution, and six of the topic's own LD arguments, each a
# contention of its landscape taxonomy; the coach approved the preset and all six on 2026-11-05, none
# changed. No other argument entry changes.
#
# Ids: an argument the Policy landscape taxonomy also counts (config/landscape/taxonomies/) uses the
# landscape's id, and says so in landscape_id. The spelling in the task spec is an alias
# (econ-da -> economy-da, ptx -> politics-da, elections -> midterms-da).
#
# Schema 2 (v1-e08-t08): `families`, each with its kinds and needs, replaces the one `needs` list.
schema_version: 2
taxonomy_version: 1.5.0

variables:
  query: What the debater typed as the search query.
  topic: >-
    What the topic is about: --topic, or the topic preset's value, or otherwise the query.
  bill: >-
    The agenda item a politics DA says the plan trades off with, as the request names it. Never
    written into a template, because it changes from week to week.
  impact: >-
    The impact a debater names for a scenario (for example war), as the request gives it.
  country: >-
    The country the resolution's plan is in, from the topic preset. A DA's link search on a topic
    with plan mechanisms names it in every query it adds.

families:

  # DAs and advantages: the coach-reviewed needs and windows of taxonomy 1.1.0, unchanged.
  - id: da-and-advantage
    label: DAs and advantages
    kinds: [da, advantage]
    needs:
      - id: uniqueness
        label: Uniqueness
        description: Where things stand now, before the plan or action.
        aliases: [uq, u]
        recency_days: 365
      - id: link
        label: Link
        description: How the plan or action sets the argument off.
        aliases: [l]
        recency_days: 1826
      - id: internal-link
        label: Internal link
        description: The step that connects the link to the impact.
        aliases: [il]
        recency_days: 1826
      - id: impact
        label: Impact
        description: What happens in the end, and why it matters. Older scholarship is fine.
        aliases: [i, impacts]
        recency_days: any
      - id: answers
        label: Answers (AT)
        description: Evidence answering the other side's version of the argument.
        aliases: [at, a2, answers-to]
        recency_days: 1826

  # Framing: whether the framework is good or not (the coach, 2026-11-02). No window: philosophy
  # evidence doesn't go stale.
  - id: framing
    label: Framing
    kinds: [framework]
    needs:
      - id: framework-good
        label: Framework good
        description: Why the round should be weighed this way.
        aliases: [fw-good]
        recency_days: any
      - id: answers
        label: Answers (AT)
        description: Why the round should not be weighed this way.
        aliases: [at, a2, answers-to]
        recency_days: any

  # Theory: the rule, why it is good for debate, why breaking it is a reason to vote, and answers.
  - id: theory
    label: Theory
    kinds: [theory]
    needs:
      - id: interpretation
        label: Interpretation
        description: The rule the theory argument says debaters should follow.
        aliases: [interp]
        recency_days: any
      - id: standards
        label: Standards
        description: Why the interpretation is better for debate, such as fairness, education or ground.
        aliases: [standard]
        recency_days: any
      - id: voters
        label: Voters
        description: Why breaking the rule is a reason to vote, and what the judge should do about it.
        aliases: [voter, voting-issue]
        recency_days: any
      - id: answers
        label: Answers (AT)
        description: Evidence answering the other side's theory argument.
        aliases: [at, a2, answers-to]
        recency_days: any

  # Counterplans.
  - id: counterplan
    label: Counterplans
    kinds: [cp]
    needs:
      - id: solvency
        label: Solvency
        description: That the counterplan solves the affirmative's advantages, or does what the plan does.
        aliases: [solves]
        recency_days: 1826
      - id: net-benefit
        label: Net benefit
        description: A reason to prefer the counterplan that the plan, or doing both, does not get.
        aliases: [nb, net-benefits]
        recency_days: 1826
      - id: competition
        label: Competition
        description: Why the counterplan is a reason to reject the plan rather than to do both.
        aliases: [comp]
        recency_days: any
      - id: answers
        label: Answers (AT)
        description: Evidence answering the counterplan, such as that it does not solve or that both can be done.
        aliases: [at, a2, answers-to]
        recency_days: 1826

  # Kritiks.
  - id: kritik
    label: Kritiks
    kinds: [k]
    needs:
      - id: link
        label: Link
        description: How the affirmative's plan, assumptions or representations link to the kritik.
        aliases: [l]
        recency_days: 1826
      - id: impact
        label: Impact
        description: What the linked assumptions lead to, and why it matters.
        aliases: [i, impacts]
        recency_days: any
      - id: alternative
        label: Alternative
        description: What the kritik offers instead of the affirmative.
        aliases: [alt]
        recency_days: any
      - id: framework
        label: Framework
        description: How the judge should weigh the round, so that the kritik comes first.
        aliases: [fw]
        recency_days: any
      - id: answers
        label: Answers (AT)
        description: Evidence answering the kritik, such as the permutation, the alternative failing or the affirmative's framework.
        aliases: [at, a2, answers-to]
        recency_days: any

