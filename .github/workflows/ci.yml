# The PR and push gate for dev and main (v1-e01-t04-ci-pipeline).
#
# Branch protection requires exactly one status check, `ci`: the aggregate job at the bottom. Every
# other job that runs on a pull request is one of its needs, so a job added later gates merges as
# soon as it is appended to that list, and no ruleset has to be edited. Do not rename `ci`; the other
# job ids can change freely.
#
# Every check a pull request needs lives in this file, including the ones later tasks add (web in
# v2-e14-t01, api-contract in v2-e12-t06). A new job is gated on a `changes` output and appended to
# the `ci` job's needs and to its PATH_FILTER_OF_JOB map. Separate workflows are only for work that is
# not on the PR path: validate-dev, nightly schedules and manual dispatches. The one carve-out is
# promotion-guard.yml (v1-e01-t08): `promotion-source` and `back-merge` run only on pull requests into
# main and are required checks on protect-main in their own right. Do not add them to `ci`.
#
# CI stays light (docs/process/working-agreements.md §1): the `ci` check on a PR into dev has a budget
# of 5 minutes and a target of under 3 on a typical pull request. Nothing here reaches a model, a
# search provider or an AWS account, and nothing reads a repository secret. The only network use is
# installing tools and dependencies. LLM evaluations, browser end-to-end suites, live canaries,
# terraform plan/apply and load tests never run here.
#
# What keeps it there is the `test` job (v1-e01-t27). It was one runner taking 4 to 6 minutes over
# the whole suite, and it grew with every task. Now:
#   * It is a matrix of parts that run side by side, each `pytest --part K/N` on its own runner. A
#     part is not a list of directories: tests/pytest_plugins/run_in_parts.py deals every test file's
#     tests round the parts, so the parts are level without anyone balancing them and no part can
#     be forgotten. tests/scripts/test_ci_workflow_test_job.py collects every part and proves that
#     together they are exactly the unsplit selection.
#   * A pull request into dev runs the tests its changes reach (v1-e01-t38): scripts/ci_test_selection.py
#     reads scripts/affected_tests.py's selection against the pull request's base commit, always-run
#     list included, and the parts deal that list. Every other run is the whole default selection: a
#     pull request into main (a promotion), a push to dev or main, a dispatch. So is a pull request
#     into dev that changes shared test ground (this file among it), whose base is not in the
#     checkout, or whose selection fails or comes back empty. It fails toward more tests, never
#     fewer, and the job summary says how many test files ran and, for the whole selection, why.
#     The push run on dev is the whole selection, and the dev pre-release waits for it, so a test the
#     selection missed fails before any release; a red push run on dev is fixed by the next pull
#     request before anything else merges (working agreement 10).
#   * It measures no coverage. The `coverage` job does, over the whole selection, on pushes to dev and
#     main only.
#   * When it drifts: every part ends with its 25 slowest tests (`--durations=25`). If `ci` on
#     ordinary pull requests passes 3 minutes, or one part's pytest step passes 2, append the next
#     number to the `test` job's `matrix.part`. That is the whole change. If one part is steadily
#     slower than the rest, its durations name the few slow tests that landed together; make them
#     cheaper, as working agreement 1 describes.
#
# Every job in every workflow names its runner image, ubuntu-24.04, never ubuntu-latest: GitHub moves
# ubuntu-latest to Ubuntu 26 from 2026-10-19, and a new image (its python3, shellcheck, gh) must not
# change a promotion check without someone deciding it should. tests/scripts/test_workflow_runners.py
# fails on any `-latest` label.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # refresh-generated-files.yml dispatches this on bot/refresh-generated-files (v1-e01-t16): a pull
  # request opened with the workflow token starts no pull_request run, and protect-dev requires
  # `ci` on its head commit. A dispatch runs every job, like a push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes the run for the old head. Pushes to dev and main are
  # never cancelled, so every merge commit gets its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas of the repository a pull request touches. Pushes to dev and main run every job: they
  # are the record that the merged result is green, and the 5-minute budget is for pull requests.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's files through the REST API.
      pull-requests: read
    outputs:
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      infrastructure: ${{ github.event_name != 'pull_request' || steps.filter.outputs.infrastructure == 'true' }}
      site: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # A change to this file runs every job, so a workflow edit is always exercised by its own PR.
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            # Everything the Python test suite reads, not only the Python code. Tests check every
            # tracked Markdown file's links (tests/docs), the real spec tree and ROADMAP.md
            # (tests/specs), the scripts and ops/ wrappers they drive, config/, the Terraform
            # variables the settings tests compare against, and what .gitignore covers. A test that
            # starts reading another repository path adds it here, or a PR touching only that path
            # skips the suite and breaks the next PR instead.
            python:
              - *workflow
              - 'packages/**'
              - 'tests/**'
              - 'conftest.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'scripts/**'
              - 'ops/**'
              - 'config/**'
              - 'plan_specs/**'
              - '**/*.md'
              - 'infrastructure/envs/**'
              - '.gitignore'
              # tests/scripts read the workflows themselves: their permissions, triggers and
              # pinned runners (test_workflow_runners.py, test_back_merge_workflow.py).
              - '.github/workflows/**'
            infrastructure:
              - *workflow
              - 'infrastructure/**'
              - 'scripts/terraform_checks.sh'
              - '.terraform-version'
            site:
              - *workflow
              - 'site/**'
            web:
              - *workflow
              - 'web/**'
              - 'clients/**'
            api:
              - *workflow
              - 'packages/debate_api/**'
              - 'openapi/**'
              - 'clients/**'
            workflows:
              - '.github/workflows/**'
              - 'scripts/actionlint.sh'

  # Runs on every trigger, whatever changed. It checks the whole tree rather than the changed files:
  # `ruff format --check` failed on dev from #53 until #70 because pre-commit only formats staged
  # files and a rebase runs no hooks, and conflict markers sat on dev from #56 inside a Markdown table
  # in a module docstring, where Python parsed the file and the whole suite passed over them. The
  # pre-commit hooks only protect a clone where someone ran `uv run pre-commit install`; this does not.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes no major-version tag
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - &install-python
        name: Install Python from .python-version
        run: uv python install
      - &uv-sync
        name: Install the locked workspace
        # --all-packages is required, not tidiness. The workspace root is `package = false` with
        # `dependencies = []`, so a plain `uv sync` installs the dev group and none of the four
        # members; pyright, pytest and lint-imports then all fail on an unimportable debate_core.
        # scripts/task start uses the same flag when it creates a worktree, for the same reason.
        run: uv sync --locked --all-packages
      - name: ruff check
        run: uv run --frozen ruff check --output-format=github .
      - name: ruff format --check
        run: uv run --frozen ruff format --check .
      - name: check-merge-conflict over every tracked file
        # The same hook as .pre-commit-config.yaml, run over every tracked text file.
        run: uv run --frozen pre-commit run check-merge-conflict --all-files --show-diff-on-failure

  typecheck:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *setup-uv
      - *install-python
      - *uv-sync
      - name: pyright
        run: uv run --frozen pyright

  # The selection, in parts that run side by side (see the top of this file): on a pull request into
  # dev, the tests its changes reach; on every other event, the whole default selection. Every part
  # runs on every event this job runs on.
  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Every part reports its own failures: one failing part does not cancel the others.
      fail-fast: false
      matrix:
        # To add a part, append the next number and change nothing else. Each part asks for itself
        # out of strategy.job-total, and `ci` needs this job as a whole: a matrix job is one entry
        # in `needs`, and its result is a failure if any part failed.
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # On a pull request, the merge commit GitHub tests and its two parents. The first parent
          # is the pull request's base commit, which the selection compares with. Nothing else is
          # fetched: a base that is not among them runs the whole selection.
          fetch-depth: 2
      - *setup-uv
      - *install-python
      - *uv-sync
      - name: Choose the tests (the affected set on a pull request into dev, otherwise all of them)
        # Writes the test files to run, one per line, and says how many and why in the job summary.
        # An empty file is the whole default selection. If the script cannot run at all, the file is
        # emptied, so a broken selection runs more tests, never fewer.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! uv run --frozen python scripts/ci_test_selection.py --event "$EVENT_NAME" \
              --base-branch "$BASE_BRANCH" --base-sha "$BASE_SHA" --ref-name "$REF_NAME" \
              --output "$RUNNER_TEMP/test-selection.txt" --summary "$GITHUB_STEP_SUMMARY"; then
            : > "$RUNNER_TEMP/test-selection.txt"
            echo "::warning title=Test selection::scripts/ci_test_selection.py failed, so this part runs the whole default selection."
            printf '### Tests: the whole default selection\n\nscripts/ci_test_selection.py failed, so every part runs its share of every test file.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: pytest (one part of the selection, no slow or live tests, no coverage)
        # pyproject.toml's addopts already say `-n auto` and the markers, and block sockets; they are
        # spelled out here so the PR path cannot quietly start running slow or live tests if addopts
        # change. The durations are how anyone sees which tests are slow on a runner, where the
        # order is not the one a laptop gives. pytest reads `@FILE` as more arguments, one per line;
        # an empty file adds none, and pytest runs every path in `testpaths`.
        run: uv run --frozen pytest -n auto -m "not slow and not live" --part "${{ matrix.part }}/${{ strategy.job-total }}" --durations=25 "@$RUNNER_TEMP/test-selection.txt"

  # Branch coverage of the whole default selection, with the report every run printed until
  # v1-e01-t27, on pushes to dev and main only: nothing is gated on coverage (pyproject.toml sets no
  # fail_under), and measuring it took a third of the suite's time on every pull request. It is one
  # unsplit run, so the report covers everything at once, and it is the collection the parts above
  # are compared with. It is not one of `ci`'s needs, because `ci` is what a pull request waits for
  # and this never runs on one.
  #
  # It does not fail the push's run (PM batch 2026-10-27v). From 2026-10-26 the unsplit run passed its
  # 20-minute limit on every push to dev, each push's run concluded `failure` though every part of
  # `test` passed, and the dev pre-release, which waits for a successful push run, made no build for
  # about thirty merges. The parts above are what decides whether the push run is green; this job
  # reports coverage when it finishes, and its own result is still shown. Measuring coverage in the
  # parts and combining it is v1-e01-t42.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    continue-on-error: true
    # Longer than the other jobs: this is the one run that still grows with the suite.
    timeout-minutes: 40
    steps:
      - *checkout
      - *setup-uv
      - *install-python
      - *uv-sync
      - name: pytest --cov (the whole default selection, unsplit)
        run: uv run --frozen pytest -n auto --cov --cov-report=term-missing -m "not slow and not live"

  # The contracts live in pyproject.toml's [tool.importlinter]; v1-e02-t06-import-boundary-guard
  # owns the full set.
  import-boundaries:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *setup-uv
      - *install-python
      - *uv-sync
      - name: lint-imports
        run: uv run --frozen lint-imports
      # What lint-imports cannot see: how much a CLI command or API route does (v1-e02-t06).
      - name: check_thin_handlers.py
        run: uv run --frozen python scripts/check_thin_handlers.py

  # Runs on every trigger. The validator reads the whole plan_specs/ tree in about a second.
  spec-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # check_command_blocks.py diffs the session reports against the base branch, which needs
          # the history back to where the pull request branched, and origin/<base> itself.
          fetch-depth: 0
      - *setup-uv
      - *install-python
      - *uv-sync
      - name: validate_specs.py
        run: uv run --frozen python scripts/validate_specs.py
      # Every trigger: each document under docs/ starts with its docs-index description. This never
      # compares with the committed docs/README.md, so it cannot ask a task to regenerate it.
      - name: docs_index.py --check-descriptions
        run: uv run --frozen python scripts/docs_index.py --check-descriptions
      # Every trigger: no `#` comment in a shell code block someone pastes into zsh (working
      # agreement 9, v1-e01-t19). On a pull request it also reads the session reports the pull
      # request adds or changes; historical reports are records and are never scanned. A push or
      # dispatch has no base branch, so it scans everything but the session reports.
      - name: check_command_blocks.py
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            uv run --frozen python scripts/check_command_blocks.py --base "origin/${BASE_REF}"
          else
            uv run --frozen python scripts/check_command_blocks.py
          fi
      - name: spec_index.py --check and docs_index.py --check (pull requests into main only)
        # github.base_ref is the pull request's target branch, and is empty on push and dispatch
        # events. Task PRs into dev change a spec phase or add a document, and so leave ROADMAP.md
        # and docs/README.md stale by design: refresh-generated-files.yml regenerates both on dev in
        # a pull request of its own, so that parallel task PRs never conflict on them (v1-e01-t16).
        # The dev-to-main promotion PR is where a stale generated file is stopped (v1-e01-t05 ac4).
        if: github.base_ref == 'main'
        run: |
          status=0
          uv run --frozen python scripts/spec_index.py --check || status=1
          uv run --frozen python scripts/docs_index.py --check || status=1
          exit "$status"

  # Handed over by v1-e29-t02-terraform-bootstrap. Static checks only: fmt, validate with
  # -backend=false, tflint and mocked `terraform test`. No AWS credentials exist in this workflow;
  # plan and apply stay operator steps until the OIDC roles of v2-e10-t03.
  terraform-checks:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - name: Read the pinned Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false # the script checks exit codes itself
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: scripts/terraform_checks.sh
        env:
          # tflint --init fetches its AWS ruleset from GitHub releases; the workflow's own token keeps
          # it clear of the anonymous rate limit that shared runner addresses hit. Not a repository
          # secret, and it carries only this workflow's contents: read.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/terraform_checks.sh

  # Handed over by v1-e36-t03-site-scaffold: lint, typecheck, test and a dev build of the public team
  # site, all offline, through the same script as the site-checks pre-commit hook. Since v1-e36-t10
  # the script ends by running the export checks against that build (site/scripts/export-checks.sh),
  # and they fail rather than skip if there is no export of this tree to read.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json # pnpm version from its packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm --dir site install --frozen-lockfile
      - name: site/scripts/pre-commit-checks.sh
        run: site/scripts/pre-commit-checks.sh

  # actionlint over every workflow, pinned to one version and checksum-verified, with ShellCheck over
  # the run: blocks (v1-e01-t15-promotion-guard-sweep ac7). The promotion guards' permission shape is
  # only as good as the workflows that carry it, so "actionlint is clean" is checked here on each pull
  # request that touches a workflow, not claimed in a session report. scripts/actionlint.sh holds the
  # version and the checksums; it runs the same way in a checkout.
  workflow-lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - name: actionlint over every workflow
        run: scripts/actionlint.sh

  # The single required status check on the protect-dev and protect-main rulesets. It passes only if
  # every job it needs succeeded, or was skipped because its path filter found nothing to check. A job
  # skipped for any other reason (the `changes` job failed, a condition was wrong) fails it. It needs
  # every job above except `coverage`, which runs on pushes only.
  ci:
    needs:
      - changes
      - lint
      - typecheck
      - test
      - import-boundaries
      - spec-validate
      - terraform-checks
      - site
      - workflow-lint
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every check passed or was skipped by its path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Each path-filtered job and the `changes` output that gates it. A job missing from this map
          # has no filter, so it has to succeed.
          PATH_FILTER_OF_JOB: >-
            {"typecheck": "python", "test": "python", "import-boundaries": "python",
             "terraform-checks": "infrastructure", "site": "site", "workflow-lint": "workflows"}
        run: |
          jq -r --argjson filter_of "$PATH_FILTER_OF_JOB" '
            (.changes.outputs // {}) as $changed
            | to_entries[]
            | .key as $job | .value.result as $result | $filter_of[$job] as $filter
            | if $result == "success" then "ok    \($job)"
              elif $result == "skipped" and $filter != null and $changed[$filter] == "false"
                then "skip  \($job) (nothing changed under the \($filter) filter)"
              else "FAIL  \($job): \($result)"
              end
          ' <<< "$NEEDS" | tee verdicts.txt
          if grep -q '^FAIL' verdicts.txt; then
            exit 1
          fi
