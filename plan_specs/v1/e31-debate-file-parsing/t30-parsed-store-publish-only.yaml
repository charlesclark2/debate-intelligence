# TASK v1-e31-t30-parsed-store-publish-only - Publish the parsed store without rebuilding it
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t30-parsed-store-publish-only
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: "Publish the parsed store without rebuilding it"
spec:
  # Filed by the PM, 2026-10-19, from v1-e31-t20's Follow-up 3 and its PM review.
  description: >-
    `caselist parse --publish` always rebuilds before it publishes, so a change that needs only
    a publish (a second environment, a publish that failed after its rebuild) costs a full
    rebuild. Add a publish-only path for an existing version directory: it checks that the
    directory is complete and was written by the running parser and fingerprint versions, then
    publishes exactly as the rebuild's publish does, with the same suppression and withholding
    rules, never a second copy of them.
  priority: 3
  constraints:
    # PM ruling 2026-10-22: a CLI surface change carries its smoke check.
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/guides, tests/smoke]
    forbidden:
      - A second implementation of the publisher's suppression or withholding rules
      - Publishing an incomplete version directory
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e31-t20-long-cuts-and-limits
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Publishing an existing complete version directory uploads the same objects the
        rebuild's publish would, without rebuilding, by test shown failing first.
    # PM ruling 2026-10-22: "another fingerprint version" means an occurrence table not stamped by
    # this build, or a per-source record a newer build stamped; older per-source stamps are
    # published, as --publish publishes them.
    - id: ac2
      description: >-
        An incomplete directory, or one written by another parser or fingerprint version, is
        refused with its reason, by test.
    - id: ac3
      description: >-
        The guide gives the command and when to use it; `scripts/check_command_blocks.py`
        passes.
    # PM ruling 2026-10-22: aggregates are refused where the target environment's list stops
    # what they name.
    - id: ac4
      description: >-
        Aggregates naming a source or a disclosure that the target environment's suppression list
        now stops or holds are refused before any upload, asked of the list the publisher is given
        through the rebuild's own predicates, by test shown failing first.
status:
  phase: Succeeded
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e31-t30-parsed-store-publish-only-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
spec:
  description: >-
    A publish-only path for an existing, complete parsed-store version directory.
  goalRef:
    name: v1-e31-t30-parsed-store-publish-only
  graph:
    nodes:
      - id: publish-only
        kind: Task
        name: Parsed store publish-only path
        description: >-
          A publish-only path for an existing, complete parsed-store version directory.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Parse publish tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application, -k, parsed_publish or publish]
status:
  phase: Pending
