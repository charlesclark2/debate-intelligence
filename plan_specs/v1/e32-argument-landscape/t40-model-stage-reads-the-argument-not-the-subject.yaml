# TASK v1-e32-t40-model-stage-reads-the-argument-not-the-subject - The model stage names the argument a card is read as, with each position's side and description, and the scrub and scan fixed
# Epic: E32 Argument Landscape Reports | Release: v1.2 (Argument landscape & file building) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e32-t40-model-stage-reads-the-argument-not-the-subject
  namespace: debate-intelligence
  labels:
