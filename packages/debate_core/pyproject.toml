[project]
name = "debate-core"
version = "0.1.0"
description = "Domain core of the Debate Intelligence Platform: entities, use cases, evidence and retrieval."
readme = "README.md"
requires-python = ">=3.12"
# The domain layer is deliberately thin: validation (pydantic) and ULID generation only.
# No I/O, AWS SDK, HTTP or web-framework dependency belongs here — see docs/process/working-agreements.md.
dependencies = [
    "pydantic>=2.9",
    "python-ulid>=3.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
