# TASK v1-e01-t04-ci-pipeline — GitHub Actions CI pipeline
# Epic: E01 Repository & Delivery Foundation | Release: v1.0 (Foundation & verified evidence core) | Major: V1
# Architecture refs: §4 (GitHub Actions), §16 (recorded fixtures, no unstable CI), §17 guardrails
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e01-t04-ci-pipeline
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
  annotations:
    debate/title: GitHub Actions CI pipeline
    debate/architecture-refs: §4, §16, §17
spec:
  description: >-
    Add the GitHub Actions workflow that gates every PR into dev or main and every push to dev or main
    (docs/process/branching-and-environments.md): ruff lint/format, pyright, pytest, import-boundary
    checks and PlanSpec validation as separately named jobs, plus a final aggregate job named `ci` that
    needs all of them and is the single required status check on both the protect-dev and protect-main
    rulesets (so adding jobs later never requires ruleset edits). CI is hermetic — no live network or
    model calls, no cloud credentials — and light (docs/process/working-agreements.md §1): a `changes`
    job (dorny/paths-filter) computes path filters so each job runs only when its area changed. The
    `python` filter is wider than the Python source tree, because the default pytest selection is:
    packages/, tests/, pyproject.toml, uv.lock, and also plan_specs/, ROADMAP.md, scripts/, ops/,
    config/ and every tracked Markdown file, since the suite validates specs, checks links and anchors
    across the whole repository, lints the shell under ops/ and reads the profile TOMLs. A narrower
    filter lets a docs-only pull request merge green and then fail the next Python one, which is how a
    gate stops being believed. The other filters are web (web/ or clients/), infrastructure
    (infrastructure/) and api (packages/debate_api/, openapi/, clients/).
    `lint` and `spec-validate` carry no path filter at all: ac1 requires `check-merge-conflict` over
    every tracked file and `validate_specs.py` on every trigger, and a filtered job cannot honour
    either. Every PR check lives as a job in this one
    ci.yml, including the ones later tasks add (web in v2-e14-t01, terraform-checks in v1-e29-t02 —
    if v1-e29-t02 merged first, this task adds the `terraform-checks` job that calls
    scripts/terraform_checks.sh; the `site` job that v1-e36-t03 hands to this task by name, running
    the jsdom and axe-core checks over site/;
    api-contract in v2-e12-t06), and each new job is appended to the aggregate `ci` job's needs, so
    path-filtered checks still gate merges; separate workflows are only for non-PR work. The test job
    runs the default pytest selection that excludes `slow` and `live` markers, and heavy suites (LLM
    evals, browser end-to-end, live canaries, terraform plan/apply, load tests, long security scans) are
    never part of the PR path into dev; they run in validate-dev, on a nightly schedule or by
    workflow_dispatch. The import-linter contracts themselves are authored in
    E02-t06; this task runs `lint-imports` as a job that passes trivially until those contracts land.
    The spec-validate job also runs `scripts/spec_index.py --check`, but only on pull requests whose
    base branch is main. ROADMAP.md is generated and stays current only because the PM remembers, so it
    needs a gate somewhere; it cannot be pre-commit or the PR path into dev, because every task PR
    changes a spec's phase and so makes ROADMAP.md stale, and the session cannot regenerate a file
    outside its constraints.packages. Two concurrent task PRs that both regenerated it would conflict on
    it every time. The dev-to-main promotion PR is the one place the check fits: one PR at a time, raised
    by the PM, who refreshes ROADMAP.md in its own `specs/roadmap-refresh` PR (docs/process/task-workflow.md)
    and can regenerate it in the promotion PR without conflicting with anything. A stale ROADMAP.md
    therefore cannot reach main, and never blocks a task. The lint job also runs `check-merge-conflict` over
    every tracked file. That hook exists in .pre-commit-config.yaml, but a hook only protects a clone
    where someone ran `uv run pre-commit install`, and conflict markers reached dev once already,
    inside a Markdown table in a module docstring where Python parsed the file and the whole suite
    passed over it.
    Container build/ECR push and deploy workflows belong to V2 and are out of scope.
  priority: 1
  constraints:
    packages: [.github/workflows]
    forbidden:
      - Live network, search-provider or Bedrock calls from CI jobs
      - Long-lived AWS credentials or provider API keys in repository secrets for the test workflow
      - Renaming job ids once they are required checks without updating branch protection
      - Heavy suites (LLM evals, browser end-to-end, live canaries, terraform plan/apply against real
        accounts, load tests, multi-minute security scans) in the PR path into dev
      - Any change that pushes the required `ci` check on a PR into dev past its 5-minute budget without
        moving work out of the PR path in the same PR
  context:
    - kind: TaskRef
      name: v1-e01-t02-github-remote
      relation: dependsOn
    - kind: TaskRef
      name: v1-e01-t03-uv-workspace-tooling
      relation: dependsOn
    - kind: TaskRef
      name: v1-e01-t05-spec-tooling
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        .github/workflows/ci.yml runs on pull_request and push for branches dev and main with jobs lint,
        typecheck, test, import-boundaries and spec-validate, and an aggregate `ci` job that fails if any
        of them fails, or is skipped for any reason other than its path filter. spec-validate runs
        `validate_specs.py` on every trigger and `spec_index.py --check` only when the pull request's base
        branch is main, so a stale ROADMAP.md fails the promotion PR and never fails a task PR into dev
        (v1-e01-t05 ac4); lint runs
        `check-merge-conflict` over every tracked file, so a conflict marker cannot reach dev through a
        clone where the pre-commit hook was never installed.
    - id: ac2
      description: >-
        Jobs use astral-sh/setup-uv with dependency caching keyed on uv.lock so warm-cache runs stay
        within the ac5 budget.
    - id: ac3
      description: >-
        A PR into dev that introduces a ruff error, a failing test or an invalid PlanSpec is blocked by a
        red required `ci` check; `ci` is required on both dev and main.
    - id: ac4
      description: >-
        Workflow permissions default to contents read, and the workflow references no secrets.
    - id: ac5
      description: >-
        The required `ci` check on a PR into dev completes in under 5 minutes wall-clock (10 minutes hard
        ceiling): jobs are path-filtered (python, web/clients, infrastructure), the test job's pytest run
        excludes the `slow` and `live` markers, and no heavy suite (LLM evals, browser end-to-end, live
        canaries, terraform plan/apply, load tests, long security scans) runs on PRs into dev.
status:
  phase: InProgress
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e01-t04-ci-pipeline-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
spec:
  description: >-
    Write the workflow with stable job names, add caching, lint the workflow locally, then prove the
    gates by opening a deliberately failing PR.
  goalRef:
    name: v1-e01-t04-ci-pipeline
  graph:
    nodes:
      - id: workflow
        kind: Task
        name: CI workflow with stable job names
        description: >-
          ci.yml triggered on pull_request and push for [dev, main] with a `changes` job (dorny/paths-filter)
          exposing path filter outputs (python, web, infrastructure, api), jobs lint (ruff check + format
          --check, plus check-merge-conflict over every tracked file), typecheck (pyright), test
          (pytest -n auto --cov -m "not slow and not live"),
          import-boundaries (lint-imports), spec-validate (validate_specs.py always, plus
          spec_index.py --check guarded by `github.base_ref == 'main'`) and site (v1-e36-t03's jsdom
          and axe-core checks). typecheck, test, import-boundaries and site are gated on the filter
          outputs; lint and spec-validate are not, per ac1. And an
          aggregate `ci` job (needs: all, if: always(), fails unless every need succeeded or was skipped by
          its path filter, i.e. result success, or skipped with its filter output false); jobs later tasks add
          to the PR path (web, terraform-checks, api-contract) go in this file, gated on
          `needs.changes.outputs.<filter>`, and are added to `ci`'s needs; `timeout-minutes: 10` on every job;
          top-level `permissions: contents: read`; concurrency group cancels superseded runs.
        outputs: [.github/workflows/ci.yml]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Workflow defines the spec-validate job
            path: .github/workflows/ci.yml
            contentMatch: "spec-validate"
          - type: artifact_exists
            name: Workflow fails a stale ROADMAP.md on the promotion PR only
            path: .github/workflows/ci.yml
            contentMatch: "spec_index.py --check"
          - type: artifact_exists
            name: Workflow fails a committed conflict marker
            path: .github/workflows/ci.yml
            contentMatch: "check-merge-conflict"
          - type: artifact_exists
            name: Workflow runs for dev and main
            path: .github/workflows/ci.yml
            contentMatch: "branches: [dev, main]"
          - type: artifact_exists
            name: Path filters use dorny/paths-filter
            path: .github/workflows/ci.yml
            contentMatch: "dorny/paths-filter"
          - type: artifact_exists
            name: Test job excludes slow and live markers
            path: .github/workflows/ci.yml
            contentMatch: "not slow and not live"
          - type: command_succeeds
            name: Workflow passes actionlint
            command: actionlint
            args: [.github/workflows/ci.yml]
      - id: caching
        kind: Task
        name: uv caching and Python setup
        description: >-
          Use astral-sh/setup-uv with enable-cache and cache-dependency-glob uv.lock; install Python
          from .python-version; `uv sync --locked` in each job.
        dependsOn: [workflow]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: artifact_exists
            name: setup-uv caching is configured
            path: .github/workflows/ci.yml
            contentMatch: "enable-cache: true"
      - id: green-run
        kind: Task
        name: Green run on dev
        description: >-
          Push the workflow through a task PR into dev and confirm every job, including `ci`, succeeds on
          the dev push (main gets its first green run at the next promotion), and that the PR run of the
          workflow finished within the 5-minute budget.
        dependsOn: [caching]
        estimatedEffort: 0.5h
        acceptanceCriteria:
          - type: command_succeeds
            name: Latest CI run on dev succeeded
            command: bash
            args: [-c, "gh run list --workflow ci.yml --branch dev --limit 1 --json conclusion
                   | jq -e '.[0].conclusion == \"success\"'"]
          - type: command_succeeds
            name: Latest PR run of CI finished in under 5 minutes
            command: bash
            args: [-c, "gh run list --workflow ci.yml --event pull_request --limit 1
                   --json conclusion,startedAt,updatedAt | jq -e '.[0] | .conclusion == \"success\"
                   and (.updatedAt | fromdate) - (.startedAt | fromdate) < 300'"]
      - id: gate-proof
        kind: Task
        name: Prove required checks block bad PRs
        description: >-
          Open a throwaway PR into dev with a ruff violation and an invalid spec, confirm `ci` fails and
          merge is blocked, then close it; add `ci` as a required status check to the protect-dev and
          protect-main rulesets in the GitHub UI.
        dependsOn: [green-run]
        estimatedEffort: 0.5h
        acceptanceCriteria:
          - type: custom
            name: Failing PR is blocked from merge
            description: >-
              Owner confirms the throwaway PR showed red lint, spec-validate and `ci` checks, GitHub
              reported "Merging is blocked", and both rulesets list `ci` as required.
status:
  phase: Pending
