          Status, the publisher's refusal and the inbox.
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Removal and status tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application, -k, hold or held or status]
status:
