# TASK v1-e33-t12-files-check-names-each-warned-card - files check and files build name each warned or failed card, its check and why, as the quality report does
# Epic: E33 Evidence File Builder | Release: v1.2 (Argument landscape & file building) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e33-t12-files-check-names-each-warned-card
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e33-file-builder
  annotations:
