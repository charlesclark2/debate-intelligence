  goalRef:
    name: v1-e40-t37-redact-keeps-text-between-apostrophes
  graph:
    nodes:
      - id: redact-keeps-text-between-apostrophes
        kind: Task
        name: Apostrophes kept
        description: >-
          Redaction no longer takes two apostrophes for a quoted path and removes the
          words between them.
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Apostrophes kept tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests, -k, redact]
