# TASK v1-e31-t29-card-matching-recall - Card matching recovers two kinds of pair it now keeps apart
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t29-card-matching-recall
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: "Card matching recovers two kinds of pair it now keeps apart"
spec:
  # Filed by the PM, 2026-10-19, from v1-e31-t20's preview findings and the PM's rulings of 2026-10-18 and 2026-10-19.
  description: >-
    (1) A long body 0.9 inside another with a word changed at both ends: v4 finds long cuts from
    either end, so the 13 pairs with the "holds neither of its ends" outcome are divided where
    v3 joined them. (2) Two trims of one card that share no text (t08's brannock-ferry-fares and
    kessler-night-buses): under the card ruling they are two passages; recovering them needs
    evidence beyond the bodies, such as an identical cite and tag, and must never rejoin
    Brannock's rows, the shape of v1-e31-t11's false join. Count each first, sample with
    v1-e31-t21's sampler, and build only what keeps precision at 1.000 on every labelled set.
  priority: 3
  constraints:
    packages: [debate_core.evidence, debate_core.application, packages/debate_core/tests, scripts, tests/scripts, docs/data]
    forbidden:
      - Any change that joins a pair a coach checked as different
      - A cluster id kept as a durable key
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e31-t20-long-cuts-and-limits
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Counts for (1) and (2) per caselist, and a sample through t21's sampler, before any
        rule changes.
    - id: ac2
      description: >-
        Precision stays 1.000 on every labelled set, Brannock's rows stay apart, and each
        recovered shape has fixtures shown failing first.
status:
  phase: Pending
