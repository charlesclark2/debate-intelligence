      Gate release-v3-1-gate is approved.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Gate
metadata:
  name: release-v3-1-gate
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v3
    debate/release: v3.1
spec:
  gateType: review
  description: >-
    Release review for v3.1 (Case coverage analysis): demo the release goal end to end, confirm CI green
    on the release tag, and confirm no evidence-integrity regressions.
  reviewers:
  - user:charlie
  - role:coach
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: release-v3-1-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v3
    debate/release: v3.1
spec:
  description: >-
    Release plan for v3.1: complete its epics, tag, and pass the release gate.
  goalRef:
    name: release-v3-1
  series: v3
  version: v3.1
  graph:
    nodes:
    - id: e22
      kind: External
      name: Epic E22 — Case Coverage Analysis
      inputs:
        goalRef: v3-e22-coverage-analysis
        specRef: plan_specs/v3/e22-coverage-analysis/epic.yaml
