[project]
name = "debate-core"
version = "1.1.0"
description = "Domain core of the Debate Intelligence Platform: entities, use cases, evidence and retrieval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The domain layer is deliberately thin: validation (pydantic) and ULID generation only.
# No I/O, AWS SDK, HTTP or web-framework dependency belongs here — see docs/process/working-agreements.md.
dependencies = [
    "pydantic>=2.9",
    # Configuration only (debate_core.application.settings, v1-e02-t05): environment/.env layering
    # and the YAML model-routing file. Neither reaches the network or a cloud SDK.
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-ulid>=3.0",
    # Card manifests (v1-e03-t06-verify-command): `debate-research verify` checks a manifest against
    # its published JSON Schema before reading a card, and reports the failing JSON path. The
    # reference implementation, so the schema's meaning is the standard's, not ours. It resolves
    # only the schemas it is handed and never fetches a `$ref`.
    "jsonschema>=4.23",
    # Prompt templates (v1-e05-t04-prompt-registry): debate_core.integrations.models.prompt_registry
    # renders the reviewed files under prompts/ in a sandboxed environment with strict undefined
    # variables. Templates are compiled from strings; nothing is loaded from a path a template names.
    "jinja2>=3.1",
    # Canonical URLs (v1-e04-t01-url-canonicalization): debate_core.retrieval turns an internationalized
    # host into its ASCII form by UTS #46 with nontransitional processing, as the WHATWG URL Standard
    # and current browsers do. The standard library's `idna` codec is IDNA 2003, which maps `faß.de`
    # to `fass.de`, a different registered domain. Pure Python, no network. BSD-3-Clause. 3.7 is
    # the release that fixed quadratic-time encoding of crafted input (CVE-2024-3651), and the hosts
    # it encodes here come from untrusted links.
    "idna>=3.7",
]

# boto3 is optional on purpose. The domain and application layers never import it — the
# import-linter contract in the workspace root enforces that — and a laptop running the V1 CLI
# against its local evidence directory has no reason to install an AWS SDK. Only
# debate_core.integrations.s3 (v1-e29-t04-s3-blob-store) and debate_core.integrations.bedrock, the
# Bedrock model router (v1-e05-t02-bedrock-adapter), need it, so it arrives with the extra that names
# the cloud they talk to: `uv sync --all-packages --extra aws`, or `pip install debate-core[aws]`.
# Choosing the Bedrock provider without it is a configuration error that names this extra.
[project.optional-dependencies]
aws = [
    "boto3>=1.35",
]
# The debate .docx parser (v1-e31-t03) reads WordprocessingML with lxml, which is the only XML
# parser that can be built with entity resolution, DTD loading and network access all switched
# off — a file that arrived from a stranger is opened with all three off. It is optional for the
# same reason boto3 is: the domain and application layers never import it (the import-linter
# contract in the workspace root enforces that), and only debate_core.integrations.docx_parser
# needs it: `uv sync --all-packages --extra docx`, or `pip install debate-core[docx]`.
docx = [
    "lxml>=5.3",
]

# The HTTP client every adapter that talks HTTP uses: the article fetcher
# (debate_core.integrations.http_fetcher, v1-e04-t02), the discovery providers
# (debate_core.integrations.discovery, E07) and the OpenCaselist client. Optional for the same
# reason boto3 is: the domain and application layers never import it. Its own extra, rather than a
# passenger in one adapter's, so that a missing httpx is reported as this extra whichever adapter
# reached for it (PM ruling 2026-10-21, v1-e04-t02 packaging).
http = [
    "httpx>=0.28",
]

# PM ruling 2026-10-22 (v1-e07-t05: feedparser falls back to a loose parser on a hostile feed).
# The feed providers (debate_core.integrations.discovery, v1-e07-t05) parse RSS and Atom from
# strangers with defusedxml over the standard library's ElementTree, which refuses a document that
# declares an entity or refers to an external one instead of expanding or fetching it. Optional
# for the same reason boto3 is, and its own extra so that each distribution belongs to one extra.
# The feed providers also need the `http` extra for their transport: `debate-core[http,feeds]`.
feeds = [
    "defusedxml>=0.7.1",
]

# The OpenCaselist API client (v1-e34-t01-caselist-api-client): keyring for the macOS keychain the
# operator's caselist_token lives in. The client also needs the `http` extra for its transport, so a
# front end that wires it asks for both: `debate-core[http,opencaselist]`, as `tub` goes with `aws`.
opencaselist = [
    "keyring>=25",
]

# The student search pilot's sign-in (v1-e39-t05, ADR-0019 (d)): debate_core.integrations.cognito
# checks an ID token's RS256 signature with cryptography. Its boto3 calls, and those of
# cloudwatch_audit and parameter_store, come with the `aws` extra, so a front end that wires them
# asks for both: `debate-core[aws,tub]`. Kept apart from `aws` so that each distribution belongs to
# one extra, which is how `debate_cli.installation` names the extra a missing module needs.
tub = [
    "cryptography>=44",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
