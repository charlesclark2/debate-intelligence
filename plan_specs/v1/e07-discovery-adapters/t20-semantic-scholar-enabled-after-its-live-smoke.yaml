# TASK v1-e07-t20-semantic-scholar-enabled-after-its-live-smoke - Semantic Scholar is enabled in both profiles once its live smoke has passed
# Epic: E07 Discovery Provider Adapters | Release: v1.4 (Federated research from the CLI) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e07-t20-semantic-scholar-enabled-after-its-live-smoke
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.4
    debate/epic: v1-e07-discovery-adapters
  annotations:
    debate/title: "Semantic Scholar is enabled in both profiles once its live smoke has passed"
spec:
  # Filed by the PM, 2026-11-09, from v1-e07-t04's follow-up 1 (the PM's review, 2026-11-09).
  description: >-
    v1-e07-t04's adapter is wired into the CLI and enabled in no profile. Once the operator's
    live smokes, v1-e07-t04's operator follow-ups 1 (without a key) and 2 (with one, if the
    per-user file holds a key), have passed on an installed build and the PM has recorded them,
    enable `semantic_scholar` in config/profiles/dev.toml and prod.toml as v1-e07-t13 did for
    Crossref and the government providers. Update the profiles' comments and the search and
    provider-credentials guides: what a student without a key sees (the shared pool, one request
    a second, the later queries of an expanded search answered not asked).
    (PM amendment 2026-11-11, from the operator's keyless smoke of the same day.) Every keyless
    request was refused with HTTP 429, the first included: the shared pool is not usable for the
    team. So Semantic Scholar is enabled only with a key. Without one it is not configured: the
    factory does not build it, and it is named with its cure (request a key through the form on
    Semantic Scholar's API page) and not counted, as v1-e07-t15 treats GovInfo without its key. ac1
    reads as the keyed smoke, plus one keyless single query that returns results, run on a quiet day
    (the operator's API agreement says unauthenticated requests have succeeded). This waits for
    v1-e07-t22, the backoff the same agreement commits to.
    (PM amendment 2026-11-12, from the operator's requests of the same day.) Semantic
    Scholar's HTTPS endpoint answers a keyed request with the unauthenticated 429, and its HTTP endpoint
    answers the same request with results (the operator records). The product owner chose to use HTTP
    until Semantic Scholar fixes HTTPS, as a narrow opt-in: a setting
    `providers.semantic_scholar_insecure_http`, false by default, set only in a person's own credentials
    file and never in a committed profile; when true, the Semantic Scholar adapter alone asks
    `http://api.semanticscholar.org`, follows no redirect, and `doctor --providers` and the search footer
    say "Semantic Scholar asked over HTTP: the key is sent unencrypted". Every other provider stays on
    HTTPS. ac1's keyed smoke runs on a build carrying the opt-in, with it set; the keyless query (b) is
    one curl request, with no key header, and needs no particular build. ac2 is narrowed: the dev
    profile enables semantic_scholar once ac1 has passed; the prod profile waits for HTTPS (a follow-up
    task once Semantic Scholar answers). The opt-in comes out in one change when HTTPS works.
  priority: 3
  constraints:
    packages: [config/profiles, debate_core.integrations.discovery, debate_core.application, packages/debate_core/tests, debate_cli, packages/debate_cli/tests, docs/guides]
    forbidden:
      - A key or any secret in a profile
      - Enabling it before its live smoke has passed
      - A live provider call in a test
  context:
    - kind: TaskRef
      name: v1-e07-t22-a-paced-call-checks-the-breaker-at-its-turn-and-backs-off-on-429
      relation: dependsOn
    - kind: TaskRef
      name: v1-e07-t15-a-provider-without-its-key-does-not-make-a-search-partial
      relation: dependsOn
    - kind: TaskRef
      name: v1-e07-t04-semantic-scholar-adapter
      relation: dependsOn
    - kind: TaskRef
      name: v1-e07-t13-profiles-enable-the-providers-that-passed-their-smoke
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The operator's live smokes, keyless and (if a key exists) keyed, have passed and are
        recorded by the PM (operator).
    - id: ac2
      description: >-
        Both profiles enable semantic_scholar and the guides say what a student without a
        key sees, by tests on the committed profiles shown failing first.
    - id: ac3
      description: >-
        (PM amendment 2026-11-11) Without a key Semantic Scholar is not configured, named
        with its cure and not counted as partial, and with one it is built and asked, by
        tests shown failing first.
    - id: ac4
      description: >-
        (PM amendment 2026-11-12) With providers.semantic_scholar_insecure_http unset the
        adapter asks HTTPS only; with it true it asks HTTP, follows no redirect and is named
        as unencrypted in doctor and the footer; no committed profile sets it; by tests
        shown failing first.
status:
  phase: InProgress
