      - ext-v2-e10-t03-github-oidc-deploy
      - ext-v1-e01-t10-validate-dev-gate
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e12-t07-promotion-pipeline reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e12-t07-promotion-pipeline
