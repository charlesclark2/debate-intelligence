# TASK v1-e31-t19-remaining-cite-shapes - The cite shapes the parser still misses, counted first
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t19-remaining-cite-shapes
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: "The cite shapes the parser still misses, counted first"
spec:
  # Filed by the PM, 2026-10-15, from v1-e31-t12's Follow-up work and the PM's rulings in its review.
  description: >-
    The cite shapes v1-e31-t12 measured and left. (1) A cite behind a first name or a title:
    7,200 tagged cards with no cite have a name and a year within the first 40 characters of the
    line under the tag, but not at its front. (2) A cite in a paragraph style that resolves to
    nothing: 957 lines, 904 of them by an alias, in a list or web style the profile maps to no
    unit. (3) Highlighted cites: 593 lines open in bold with a name and a year and hold
    highlighting; take one only when a body follows. (4) v1-e31-t09's cite-style hold: a cite
    style that marks no name and year at the head is emphasis, not a cite, so change the hold,
    including v1-e31-t09's 300-word fixture (ruled in t12's review). (5) Short plain lines
    inside a body are read as nothing: measure that whole population first, then decide. (6) A
    short cite on its own line: an author and a two-digit year with a curly apostrophe (as in
    "Smith ’24"), alone on the line above a long bracketed cite, leaves the card's short_cite
    empty though tag, cite and evidence are right (4 cards in 2 of the 5 files the operator
    checked by eye on 2026-10-16). (7) Two cards in one checked file have no tag where the
    document may hold one, read under the bracketed heuristic cite line; the operator confirms in
    Word before the session counts it. (6) and (7) added by the PM, 2026-10-16. Counts
    come first for every shape, from the operator's corpus, before any rule changes. Out of
    scope: the four short cites in the corrected files (v1-e31-t13), the second line of a cite
    in small print, and the sentence openers t12 left.
  priority: 2
  constraints:
    packages: [debate_core.evidence, debate_core.integrations.docx_parser, packages/debate_core/tests, scripts, tests/evals/parser, tests/fixtures/debate_files, docs/data]
    forbidden:
      - Changing a CORRECTED or COACH_REVIEWED label file
      - Running the corpus counts or a re-parse in a session (operator-run only)
      - A school, team code, card text or file name in a fixture from a real file, a report or a commit
  context:
    - kind: TaskRef
      name: v1-e31-t12-cite-detection
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Before any rule changes, the report gives the operator-run counts for each of (1) to
        (5), and for each shape the share a proposed rule reaches and the share it would
        wrongly take, on a sample checked by the coach.
    - id: ac2
      description: >-
        Each of (1) to (4) is built or ruled out on those counts; each built rule has
        synthetic fixtures shown failing first, and the labelled evaluation's cite precision
        does not fall.
    - id: ac3
      description: >-
        (4): the cite-style hold no longer holds a paragraph whose style marks no name and
        year at its head, and v1-e31-t09's 300-word fixture is changed to match, by test.
    - id: ac4
      description: >-
        `parser_version` is bumped, and the operator's re-parse records the cards whose cite
        changed, in docs/data/caselist-parse-report.md.
    - id: ac5
      description: >-
        (6): the short cite is read from the line above, curly or straight apostrophe, by
        synthetic fixture shown failing first, with the corpus count of cards it fills. (7): if
        the operator confirms the tag is in the document, the shape is counted and fixed the same
        way; if not, the report says so and nothing changes. Added by the PM, 2026-10-16.
status:
  phase: InProgress
