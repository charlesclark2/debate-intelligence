# EPIC E33 — Evidence File Builder
# Major version: V1 | Release: v1.2 (Argument landscape & file building)
# Architecture refs: §6 ExportService, §8 provenance, ADR-0006
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e33-file-builder
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e33-file-builder
  annotations:
    debate/title: E33 — Evidence File Builder
    debate/architecture-refs: §6 ExportService, §8 provenance, ADR-0006
spec:
  description: >-
    Build Verbatim/CardMirror-compatible evidence files from disclosed cards: a file recipe, a lossless
    writer that carries each card's original formatting, provenance for every card, and publication to
    S3.
  priority: 3
  constraints:
    majorVersion: v1
    release: v1.2
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      A YAML file recipe describes a file's pockets/hats/blocks and the cards (by fingerprint) and analytics
      in it.
  - id: ac2
    description: >-
      Built files open cleanly in Verbatim and CardMirror, with every card's text and formatting identical
      to its source and a provenance record per card.
  - id: ac3
    description: >-
      Built files are published to the files/ prefix in S3 with topic, position, side and source metadata
      for the debate tub.
status:
  phase: Pending
---
