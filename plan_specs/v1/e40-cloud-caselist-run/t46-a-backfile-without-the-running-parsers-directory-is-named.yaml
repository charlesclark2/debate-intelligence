# TASK v1-e40-t46-a-backfile-without-the-running-parsers-directory-is-named - A backfile with no directory at the running parser version is named
# Epic: E40 — Weekly Caselist Run in the Cloud | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e40-t46-a-backfile-without-the-running-parsers-directory-is-named
  namespace: debate-intelligence
  labels:
