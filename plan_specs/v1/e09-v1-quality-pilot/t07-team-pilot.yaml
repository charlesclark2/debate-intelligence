# TASK v1-e09-t07-team-pilot — Student/coach guide and team pilot
# Epic: E09 V1 Quality, Evaluation & Team Pilot | Release: v1.5 (V1 quality gate & team pilot) | Major: V1
# Architecture refs: §3 V1 user stories, §14 (minors, data minimization), §16, §22
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e09-t07-team-pilot
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.5
    debate/epic: v1-e09-v1-quality-pilot
  annotations:
    debate/title: Student/coach guide and team pilot
    debate/architecture-refs: §3, §14, §16, §22
spec:
  description: >-
    Put V1 in students' hands on live topics and capture what V2 must fix. Deliverables: a student
    quickstart (install, config, first cut, reading verification statuses, why UNVERIFIED cards are not
    finished evidence and must not be read in round as-is), a command guide (search, cut, verify, daily,
    --auto-cut, --max-cost, plus the caselist workflow: `caselist import`/`caselist parse`, `landscape
    report`, `files build`, `store sync`) with worked examples on the current Policy (national health
    insurance), LD (space colonization) and PF (data-center moratorium) topics, and a coach guide (budgets,
    reviewing auto-cut bundles, the edit policy, the weekly caselist import → landscape → file build → sync
    routine, and why imported disclosed cards are not platform-verified). During the pilot the coach runs
    the caselist workflow and debaters use its landscape reports and built files. A two-to-three-week pilot
    with volunteer debaters produces a structured feedback log (docs/pilot/feedback.csv: date, build, event,
    command, outcome, issue type, severity, notes) keyed by anonymous participant codes only, plus a pilot
    summary that ranks V2 candidate improvements. Because participants may be minors, the pilot collects no
    names, emails or grades, participation is voluntary, and the coach confirms any school/parent notice
    requirements before start. Channels (docs/process/branching-and-environments.md): pilot volunteers first
    run the dev pre-release channel (vX.Y.Z-dev.N, DEBATE_ENV=dev) so fixes can reach them before promotion.
    The V1 dev channel runs on the tester's own machine against public topic sources and nothing leaves that
    machine except the coach's `store sync` to the dev evidence bucket (unlike cloud dev in V2, which holds
    synthetic data only); the wider team uses only the stable channel (vX.Y.Z from main, DEBATE_ENV=prod),
    and a pilot fix reaches the team only through a validated promotion. Boundaries: no new product
    features; bugs found become issues or V1 patch tasks.
  priority: 2
  constraints:
    packages: [docs/guides, docs/pilot]
    forbidden:
      - Recording student names, emails, school IDs or grades in the feedback log or repo
      - Presenting UNVERIFIED output as usable evidence in guides or examples
      - Starting the pilot before coach confirmation of school/parent notice requirements
      - Giving non-pilot team members dev pre-release builds
      - Pilot workflows that send dev-channel data off the tester's machine or use non-public sources
  context:
    - kind: TaskRef
      name: v1-e09-t06-packaging-release
      relation: dependsOn
    - kind: TaskRef
      name: v1-e09-t05-e2e-fixture-suite
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        docs/guides/quickstart.md, commands.md and coach.md exist, and every command example in them runs
        successfully against the recorded e2e fixtures (doc-example test).
    - id: ac2
      description: >-
        At least 5 pilot participants across at least two events each complete at least one search and one
        cut on a current topic using a dev pre-release build, and each feedback row records the build
        version (e.g. v1.5.0-dev.4) it was observed on; the coach runs the caselist workflow (import,
        parse, landscape report, files build, store sync) on at least two weekly snapshots and at least 3
        participants log feedback on a landscape report or built file.
    - id: ac3
      description: >-
        docs/pilot/feedback.csv contains at least 20 entries using anonymous participant codes only, and a
        scrub check finds no email addresses or roster names.
    - id: ac4
      description: >-
        docs/pilot/summary.md ranks the top V2 improvements with linked feedback rows and is reviewed by
        Charlie before V2 planning.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e09-t07-team-pilot-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.5
    debate/epic: v1-e09-v1-quality-pilot
spec:
  description: >-
    Write and test the guides, prepare the pilot (consent/notice, feedback template), run it, then
    synthesize the V2 input.
  goalRef:
    name: v1-e09-t07-team-pilot
  graph:
    nodes:
      - id: guides
        kind: Task
        name: Quickstart, command and coach guides
        description: >-
          Write the three guides with topic-specific examples, including the caselist workflow commands
          against the synthetic e2e archive, and a test that executes fenced debate-research examples
          against e2e fixtures.
        outputs: [docs/guides/quickstart.md, docs/guides/commands.md, docs/guides/coach.md]
        estimatedEffort: 4h
        acceptanceCriteria:
          - type: test_passes
            name: Guide examples execute against fixtures
            command: uv
            args: [run, pytest, tests/docs/test_guide_examples.py]
      - id: pilot-prep
        kind: Task
        name: Pilot preparation and privacy checks
        description: >-
          Feedback CSV template with participant codes, scrub script, pilot plan with dates and topics; coach
          confirms school/parent notice requirements.
        dependsOn: [guides]
        outputs: [docs/pilot/plan.md, docs/pilot/feedback.csv, scripts/scrub_feedback.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Pilot plan exists
            path: docs/pilot/plan.md
          - type: custom
            name: Coach confirms notice requirements
            description: >-
              Charlie confirms any school or parent notice needed for student participation is complete.
      - id: run-pilot
        kind: Task
        name: Run the pilot
        description: >-
          Onboard volunteers onto the dev pre-release channel (scripts/install_channel.sh), hold a kickoff
          and a mid-pilot check-in, log feedback weekly with the build version, and move the team to the
          stable release once it is promoted and tagged from main.
        dependsOn: [pilot-prep]
        estimatedEffort: 6h
        acceptanceCriteria:
          - type: command_succeeds
            name: Feedback log passes the scrub check
            command: uv
            args: [run, scripts/scrub_feedback.py, --check, docs/pilot/feedback.csv]
          - type: custom
            name: Participation threshold met
            description: >-
              At least 5 participants across at least two events completed a search and a cut on a current
              topic, the coach ran the caselist workflow on two weekly snapshots, and at least 3
              participants gave feedback on a landscape report or built file.
      - id: synthesis
        kind: Task
        name: Pilot summary and V2 priorities
        description: >-
          Cluster feedback, rank V2 improvements with linked rows, and review with Charlie.
        dependsOn: [run-pilot]
        outputs: [docs/pilot/summary.md]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Pilot summary exists
            path: docs/pilot/summary.md
          - type: custom
            name: Coach reviews pilot summary
            description: >-
              Charlie approves the ranked V2 improvement list for V2 planning.
status:
  phase: Pending
