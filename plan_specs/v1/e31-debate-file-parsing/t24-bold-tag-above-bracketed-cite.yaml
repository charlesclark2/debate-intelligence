spec:
  # Filed by the PM, 2026-10-19, from v1-e31-t19's ac5 item (7), with the operator's check in Word of 2026-10-19.
  description: >-
    v1-e31-t19's (7): in the hspf26 file of v1-e31-t12's step 6
    (`heuristic-cite-line-bracketed`), cards 2 and 3 of 16 have no tag, and the line above each
    bracketed cite is read as body. The operator checked both in Word on 2026-10-19: each line
    is the card's tag, formatted as an ordinary bold tag. Count the shape first, read-only over
    the dev store as t12 and t19 counted (a line directly above a cite the bracketed rule reads,
    read as body or nothing, in bold or a tag style), then sample it with
    `scripts/sample_cite_shapes.py` if more than a few files hold it, then fix the parser for
    what is a defect. Counts come first and the PM rules before the rule changes. Merge before
    the combined re-parse of v1-e31-t19 and v1-e31-t20 if it can, so one re-parse carries it.
    (PM amendment 2026-10-19, from v1-e33-t02's ruling (d) and its Follow-up 1.) The same task
    makes the highlighted-cite look-ahead (v1-e31-t19's
    `assembly-highlighted-cite-before-the-body`) step over an Undertag paragraph, so that the
    provenance line a built file writes below every cite no longer turns a highlighted cite into
    body. When it does, v1-e33-t02's `test_today_the_parser_does_not_step_over_the_line` fails
    by design: change it to assert the new reading, and
    `test_a_highlighted_cite_is_refused_until_the_parser_steps_over_the_line` then asserts that
    such a card builds and reads back. The writer itself does not change. Both changes share one
    parser bump: whichever of this task and v1-e31-t22 merges second takes the next version.
  priority: 1
  constraints:
    packages: [debate_core.evidence, debate_core.integrations.docx_parser, packages/debate_core/tests, scripts, tests/scripts, docs/data]
    forbidden:
      - A rule change before the counts are ruled on
      - Card text, a name or a file name in anything committed or printed
      - Writing to the operator's data directory
      - Passing --write-baseline, or touching a label file or tests/evals/baselines/
  context:
    - kind: TaskRef
      name: v1-e31-t19-remaining-cite-shapes
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Before any rule changes, the report gives the operator-corpus count of the shape per
        caselist and, if sampled, the coach's tallies.
    - id: ac2
      description: >-
        The fix has synthetic fixtures shown failing first, the two cards of (7) read with
        their tags, and the labelled evaluation's tag and cite precision do not fall.
    - id: ac3
      description: >-
        `parser_version` is bumped; the re-parse is the operator's and is recorded in
        docs/data/caselist-parse-report.md.
    - id: ac4
      description: >-
        (PM amendment 2026-10-19) A highlighted cite with an Undertag paragraph before its
        body is still read as the cite, by a synthetic fixture shown failing first;
        v1-e33-t02's pinned pair of tests is updated and a built file holding such a card
        reads back as its source.
