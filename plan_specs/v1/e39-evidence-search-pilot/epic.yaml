# EPIC E39 — Team Evidence Search (Student Pilot)
# Major version: V1 | Release: v1.7 (Team evidence search pilot)
# Architecture refs: ADR-0019, ADR-0012, ADR-0006, docs/policies/caselist-data-use.md (E39 gate)
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e39-evidence-search-pilot
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.7
    debate/epic: v1-e39-evidence-search-pilot
  annotations:
    debate/title: E39 — Team Evidence Search (Student Pilot)
    debate/architecture-refs: ADR-0019, ADR-0012, ADR-0006, caselist data-use policy E39 gate
spec:
  description: >-
    Give the team's debaters a signed-in web page, usable on a school Chromebook, to search the
    disclosed and camp cards in the evidence store and take a card out with its provenance:
    copied with its formatting into Google Docs or Word, or downloaded as a Verbatim .docx
    through the E33 writer. A pilot for the end of the 2026 fall semester, on the smallest stack
    that meets the data-use policy's E39 gate (ADR-0019): one function behind CloudFront on the
    team domain, a weekly SQLite full-text index built from the parsed store, and Cognito
    accounts the coach creates (username, password, authenticator-app codes, an opt-in
    emailed-code fallback; no Google or school account). The school's activities director and IT
    approved the tool for students (policy open question 6, version 1.10). V2's E12, E15 and E35
    replace its pieces later; this epic says which in ADR-0019.
  priority: 1
  constraints:
    majorVersion: v1
    release: v1.7
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  # PM amendment 2026-10-22: data-use policy version 1.11 takes the provenance line out of copied and
  # downloaded cards; the card page still shows it.
  - id: ac1
    description: >-
      A signed-in debater on a school Chromebook finds a card by words in its tag, author or
      text, filtered by event, caselist and side, and copies it into Google Docs with its
      formatting, its provenance shown on the card page, in prod.
  - id: ac2
    description: >-
      Every item of the data-use policy's E39 gate is met and each is proven by a named test
      or operator record.
  - id: ac3
    description: >-
      The coach's beta and a student pilot have run on prod, and their findings and the go or
      no-go for the whole team are recorded.
status:
  phase: Pending
