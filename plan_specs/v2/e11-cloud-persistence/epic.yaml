# EPIC E11 — Cloud Persistence Adapters
# Major version: V2 | Release: v2.0 (Cloud platform foundation)
# Architecture refs: §7, ADR-002, ADR-003, §15
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e11-cloud-persistence
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v2
    debate/release: v2.0
    debate/epic: v2-e11-cloud-persistence
  annotations:
    debate/title: E11 — Cloud Persistence Adapters
    debate/architecture-refs: §7, ADR-002, ADR-003, §15
spec:
  description: >-
    Design AppTable access patterns, provision DynamoDB and S3, and implement cloud repositories that
    pass the V1 contract tests unchanged.
  priority: 7
  constraints:
    majorVersion: v2
    release: v2.0
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      AppTable single-table design is documented against enumerated access patterns before tables are
      created.
  - id: ac2
    description: >-
      DynamoDB and S3 repositories pass the E02 contract suite; snapshots are private, versioned and encrypted.
  - id: ac3
    description: >-
      Cards use conditional writes so reprocessing cannot overwrite student edits; V1 local libraries
      can be migrated.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e11-cloud-persistence-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v2
    debate/release: v2.0
    debate/epic: v2-e11-cloud-persistence
spec:
  description: >-
    Task graph for epic E11 (Cloud Persistence Adapters). Each Task node points at its own task-level
    PlanSpec.
  goalRef:
    name: v2-e11-cloud-persistence
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e02-t01-domain-entities
      kind: External
      name: 'Prerequisite from E02: Pydantic domain entities and enums'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t01-domain-entities
        specRef: plan_specs/v1/e02-domain-core/t01-domain-entities.yaml
    - id: ext-v1-e02-t04-repo-contract-tests
      kind: External
      name: 'Prerequisite from E02: Reusable repository contract test suite'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t04-repo-contract-tests
        specRef: plan_specs/v1/e02-domain-core/t04-repo-contract-tests.yaml
    - id: ext-v1-e29-t04-s3-blob-store
      kind: External
      name: 'Prerequisite from E29: S3 blob-store adapter'
      description: >-
        Cross-epic prerequisite owned by v1-e29-cloud-evidence-store (release v1.1).
      inputs:
        goalRef: v1-e29-t04-s3-blob-store
        specRef: plan_specs/v1/e29-cloud-evidence-store/t04-s3-blob-store.yaml
    - id: ext-v2-e10-t04-kms-secrets
      kind: External
      name: 'Prerequisite from E10: KMS keys and Secrets Manager'
      description: >-
        Cross-epic prerequisite owned by v2-e10-aws-foundation (release v2.0).
      inputs:
        goalRef: v2-e10-t04-kms-secrets
        specRef: plan_specs/v2/e10-aws-foundation/t04-kms-secrets.yaml
    - id: ext-v2-e12-t03-authn-authz
      kind: External
      name: 'Prerequisite from E12: Authentication, roles and tenancy'
      description: >-
        Cross-epic prerequisite owned by v2-e12-identity-api (release v2.0).
      inputs:
        goalRef: v2-e12-t03-authn-authz
        specRef: plan_specs/v2/e12-identity-api/t03-authn-authz.yaml
    - id: t01
      kind: Task
      name: AppTable access-pattern design
      description: >-
        Enumerate V2 access patterns, choose PK/SK/GSI patterns (USER#, CARD#, JOB#, SEARCH#, ORG#), document
        in docs/data/, record ADR if deviating.
      inputs:
        specRef: plan_specs/v2/e11-cloud-persistence/t01-access-pattern-design.yaml
        goalRef: v2-e11-t01-access-pattern-design
      dependsOn:
      - ext-v1-e02-t01-domain-entities
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e11-t01-access-pattern-design reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e11-t01-access-pattern-design
    - id: t02
      kind: Task
      name: DynamoDB tables in Terraform
      description: >-
        AppTable with GSIs, on-demand capacity, PITR, KMS encryption, TTL for transient items.
      inputs:
        specRef: plan_specs/v2/e11-cloud-persistence/t02-dynamodb-tables.yaml
        goalRef: v2-e11-t02-dynamodb-tables
      dependsOn:
      - t01
      - ext-v2-e10-t04-kms-secrets
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e11-t02-dynamodb-tables reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e11-t02-dynamodb-tables
    - id: t03
      kind: Task
      name: DynamoDB repository implementations
      description: >-
        Repositories implementing E02 ports; pass contract suite against DynamoDB Local/moto.
      inputs:
        specRef: plan_specs/v2/e11-cloud-persistence/t03-dynamodb-repositories.yaml
        goalRef: v2-e11-t03-dynamodb-repositories
      dependsOn:
      - t02
      - ext-v1-e02-t04-repo-contract-tests
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e11-t03-dynamodb-repositories reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e11-t03-dynamodb-repositories
    - id: t04
      kind: Task
      name: S3 snapshot and export store
      description: >-
        Private versioned buckets, block public access, lifecycle rules, KMS, S3 SnapshotStore impl, short-lived
        presigned download URLs.
      inputs:
        specRef: plan_specs/v2/e11-cloud-persistence/t04-s3-snapshot-store.yaml
        goalRef: v2-e11-t04-s3-snapshot-store
      dependsOn:
      - ext-v2-e10-t04-kms-secrets
      - ext-v1-e02-t04-repo-contract-tests
      - ext-v1-e29-t04-s3-blob-store
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e11-t04-s3-snapshot-store reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e11-t04-s3-snapshot-store
    - id: t05
      kind: Task
      name: Optimistic concurrency for cards and files
      description: >-
        Revision attributes with conditional writes; conflict errors surfaced to callers; tests for reprocessing
        vs edit races.
      inputs:
        specRef: plan_specs/v2/e11-cloud-persistence/t05-optimistic-concurrency.yaml
        goalRef: v2-e11-t05-optimistic-concurrency
      dependsOn:
      - t03
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e11-t05-optimistic-concurrency reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e11-t05-optimistic-concurrency
    - id: t06
      kind: Task
      name: V1 local-library migration tool
      description: >-
        CLI command to upload a local V1 data dir (snapshots, cards) into a user's cloud account preserving
        hashes and ids.
      inputs:
        specRef: plan_specs/v2/e11-cloud-persistence/t06-v1-data-migration.yaml
        goalRef: v2-e11-t06-v1-data-migration
      dependsOn:
      - t03
      - t04
      - ext-v2-e12-t03-authn-authz
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e11-t06-v1-data-migration reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e11-t06-v1-data-migration
status:
  phase: Pending
