# TASK v1-e32-t66-a-block-is-classified-from-its-tags-in-order - A block of cards the matcher left unplaced is classified as a whole from its tags in order, scored on the coach's labels
# Epic: E32 Argument Landscape Reports | Release: v1.2 (Argument landscape & file building) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e32-t66-a-block-is-classified-from-its-tags-in-order
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e32-argument-landscape
  annotations:
    debate/title: "A block of cards the matcher left unplaced is classified as a whole from its tags in order, scored on the coach's labels"
spec:
  # Filed by the PM, 2026-11-14, from the product owner's decision of 2026-11-14 that context-based classification is wanted in V1 if it meets the bar.
  description: >-
    (PM amendment 2026-11-25: the premise is rewritten, because v1-e32-t65 closed with no
    inheritance.) For a card the deterministic matcher left unplaced, the model sees its block,
    not the card alone: the cards in file order within its deciding section (t65's definition,
    the deepest section over the card holding a placed card; the proposal gives the fallback
    where none does, with counts), its headings and its cards' tags in file order, and a
    counterplan's or plan's text as written (data-use policy 1.23). Never an evidence body, a
    cite, a school, a team code, a team name or a debater name. Each card takes its block's
    answer for it, scored per card against the coach's existing labels. Proposal first: the
    block's definition with counts, the prompt (a new version of landscape.classify_position or
    its own id), the batch shape and the cost of one first-sample record run at the committed
    prices. Stop for the PM's ruling. Then build only what a first-sample record run needs, in
    at most three prompt rounds, each recorded by the operator after the PM authorizes it. Go
    or no-go is on v1-e32-t21's first sample: unless a round scores at least 0.85 there (the
    cancelled per-card stage scored 0.684 there and 0.571 on the holdout), stop, leave the
    holdout unread and the stage off by default, and record the scores in
    docs/data/landscape-model-evaluation.md. Only after a round meets 0.85 on the first sample
    is the stage wired and v1-e32-t50's holdout recorded once and scored against 0.85.
    ClassificationKey names the model (the route's model id), so a cached answer is reused
    only under the same model and prompt, and prod reads dev's classifications only under
    that key (v1-e05-t20's ac2). The hold on other live runs stands.
  priority: 2
  constraints:
    packages: [debate_core.arguments, debate_core.application, debate_core.domain, prompts, packages/debate_core/tests, packages/debate_cli/tests, docs/data]
    forbidden:
      - An evidence body, a school, a team code, a team name or a debater name in a prompt input or a cassette
      - A prompt tuned on the holdout
      - A live model call by a session
      - The stage on by default without the bar met on the holdout
  context:
    - kind: TaskRef
      name: v1-e32-t65-a-card-inherits-its-blocks-position
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The proposal is ruled on by the PM before code.
    - id: ac2
      description: >-
        Replayed from the operator's recordings, with the input and cassette scans clean, the
        first sample's per-card score is recorded for each prompt round. If a round meets 0.85
        there, the holdout's per-card score is recorded once against the 0.85 bar, and the stage
        is on by default only if the holdout meets it. If none does, the holdout is not read and
        the stage stays off (PM amendment 2026-11-25).
status:
  phase: Pending
