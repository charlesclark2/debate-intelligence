# TASK v1-e30-t04-openev-importer — OpenEv camp-file importer
# Epic: E30 Caselist Evidence Ingestion | Release: v1.1 (Caselist evidence store) | Major: V1
# Architecture refs: §8 provenance/hashes, §9, §14, §16
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e30-t04-openev-importer
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e30-caselist-ingestion
  annotations:
    debate/title: OpenEv camp-file importer
    debate/architecture-refs: §8, §9, §14, §16
spec:
  description: >-
    Add `debate-research caselist import-openev <zip|dir> --year <yyyy> --event <ld|policy|pf>` so the
    camp files the coach downloads manually from OpenEv (about 106 Policy files are already on hand) enter
    the same local evidence store as caselist disclosures. Each file becomes a SourceDocument with origin
    OPENEV and a CampFile carrying camp (normalized through an editable alias table, e.g. DDI, Michigan,
    Gonzaga, SDI, NHSI, UTNIF), year, event and file title (the filename minus camp prefix and extension),
    with a warning when the camp cannot be resolved. It reuses the t03 archive reader, hashing, blob
    store, classification and manifest writer (extracting a small shared pipeline where needed rather than
    copying code) and writes manifests/openev/<year>-<event>.jsonl. Content identical to a caselist source
    is stored once and linked from both records, which lets E31 and E32 see when disclosed cards came from
    camp files. Boundaries: downloading from the OpenEv API is v1-e34-t01, publishing t05, parsing E31;
    files whose sha256 is on the removal suppression list are skipped (implemented in t07).
  priority: 2
  constraints:
    packages: [debate_core.application, debate_core.domain, debate_cli, tests/fixtures/openev]
    forbidden:
      - Duplicating the t03 hashing/dedupe/manifest logic instead of reusing it
      - Real camp files or excerpts in fixtures; fixtures are generated synthetic .docx files
      - Network calls in the importer or its tests
      - Business logic in debate_cli
  context:
    - kind: TaskRef
      name: v1-e30-t03-archive-importer
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Importing the synthetic OpenEv fixture records a CampFile per file with camp, year, event and file
        title; names whose camp is not in camp_aliases.yaml get camp UNKNOWN and a warning, not a failure.
    - id: ac2
      description: >-
        A camp file byte-identical to a file already imported from a caselist snapshot creates no second blob
        and is reported as DUPLICATE with a reference to the existing SourceDocument.
    - id: ac3
      description: >-
        <data_dir>/manifests/openev/<year>-<event>.jsonl uses the same schema version and row layout as
        caselist manifests plus camp fields, and re-importing the same archive is a no-op.
    - id: ac4
      description: >-
        The shared import pipeline is used by both `caselist import` and `caselist import-openev`, and the
        t03 test suite still passes unchanged.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e30-t04-openev-importer-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e30-caselist-ingestion
spec:
  description: >-
    Extract the shared pipeline behind the t03 tests, add camp metadata parsing, then the OpenEv service,
    command and smoke check.
  goalRef:
    name: v1-e30-t04-openev-importer
  graph:
    nodes:
      - id: shared-pipeline
        kind: Task
        name: Extract the shared source-import pipeline
        description: >-
          Move read → hash → store → classify → manifest into a SourceImportPipeline parameterized by a
          metadata extractor, keeping CaselistImportService behavior identical.
        outputs: [packages/debate_core/src/debate_core/application/caselist/pipeline.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Caselist import tests still pass after the refactor
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/caselist/test_import_service.py]
      - id: camp-metadata
        kind: Task
        name: Camp metadata parser and alias table
        description: >-
          Parse camp, file title and optional lab from OpenEv filenames and folders using an editable
          camp_aliases.yaml; unresolved camps yield UNKNOWN with a warning.
        outputs:
          - packages/debate_core/src/debate_core/application/caselist/camp_metadata.py
          - packages/debate_core/src/debate_core/application/caselist/camp_aliases.yaml
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Camp metadata tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/caselist/test_camp_metadata.py]
      - id: openev-service-and-cli
        kind: Task
        name: OpenEv import service and command
        description: >-
          OpenEvImportService on the shared pipeline (CampFile records, cross-origin dedupe, openev
          manifest) and the `caselist import-openev` command with --year, --event, --dry-run and --json;
          a synthetic fixture builder with fake camp names and one file identical to a caselist fixture.
        dependsOn: [shared-pipeline, camp-metadata]
        outputs:
          - packages/debate_core/src/debate_core/application/caselist/openev_import_service.py
          - tests/fixtures/openev/build_synthetic_openev.py
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: OpenEv import tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/caselist/test_openev_import.py]
          - type: command_succeeds
            name: Command is registered
            command: uv
            args: [run, debate-research, caselist, import-openev, --help]
      - id: smoke-and-gates
        kind: Task
        name: Smoke check and quality gates
        description: >-
          Extend the caselist smoke check with an OpenEv import into a temp data dir; type check and import
          boundaries.
        dependsOn: [openev-service-and-cli]
        outputs: [tests/smoke/test_caselist_import_smoke.py]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Import smoke checks pass
            command: uv
            args: [run, pytest, tests/smoke/test_caselist_import_smoke.py]
          - type: command_succeeds
            name: Type check passes
            command: uv
            args: [run, pyright, packages/debate_core, packages/debate_cli]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
status:
  phase: Pending
