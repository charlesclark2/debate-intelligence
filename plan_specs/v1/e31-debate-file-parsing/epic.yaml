        - --require-succeeded
        - v1-e31-t03-debate-docx-parser
    - id: t04
      kind: Task
      name: Card fingerprints and occurrences
      description: >-
        Card fingerprints (normalized body-text hash plus near-duplicate buckets), an occurrence table
        across teams, rounds and snapshots, and `debate-research caselist cards` statistics.
      inputs:
        specRef: plan_specs/v1/e31-debate-file-parsing/t04-card-fingerprints.yaml
