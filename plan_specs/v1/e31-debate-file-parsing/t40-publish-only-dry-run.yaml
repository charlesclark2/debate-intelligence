    caselist parse --publish-only has a dry run that lists what it would send and refuses what
    it would refuse.
  goalRef:
    name: v1-e31-t40-publish-only-dry-run
  graph:
    nodes:
      - id: publish-only-dry-run
        kind: Task
        name: Publish-only dry run
        description: >-
          caselist parse --publish-only has a dry run that lists what it would send and
          refuses what it would refuse.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Publish-only dry run tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests, packages/debate_cli/tests, -k, publish_only]
