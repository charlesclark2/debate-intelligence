# TASK v1-e31-t11-long-card-splits-and-fragment-merges - Copies split apart by the short-body rule, and long bodies merged through a fragment
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t11-long-card-splits-and-fragment-merges
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: "Copies split apart by the short-body rule, and long bodies merged through a fragment"
spec:
  # Filed by the PM, 2026-10-11, from the PM's close-out of v1-e31-t08 (docs/data/caselist-parse-report.md) and v1-e31-t08's Follow-up work 1, 8 and 10.
  description: >-
    On the re-parsed corpus (2026-10-11) `card-fingerprint-v2` divided 51 clusters, and the
    operator judged 9 of 10 sampled divided pairs to be the same card (81 divided pairs in all).
    The likely cause is v1-e31-t08's rule that a short body joins only when every longer body
    holding it is in one cluster: when the longer copies themselves never merged, the short cut
    stays alone though all are one card. That points at why long copies split, and at
    `MIN_CUT_SHARE`, which t08 named as the constant to revisit if divided pairs were mostly the
    same card. The opposite risk is open too: two long bodies are still matched on containment
    through the banding, so a fragment of 64 words or more that two different long cards contain
    can merge them. hspolicy26's largest cluster is 1,172 cards of 166 distinct texts and nobody
    has looked at it. Diagnose the 81 divided pairs by counts only, look at the largest
    clusters, and fix what is wrong without lowering precision on the labelled sets. Out of
    scope: the exact fingerprint, and the abbreviation linking rules.
  priority: 2
  constraints:
    packages: [debate_core.evidence, debate_core.application, packages/debate_core/tests, scripts, docs/data]
    forbidden:
      - Precision below 1.000 on either labelled set
      - Real card text in any fixture, log, commit or report; the operator's samples are tallies only
  context:
    - kind: TaskRef
      name: v1-e31-t08-short-card-recall
      relation: dependsOn
    - kind: TaskRef
      name: v1-e31-t09-first-corpus-parse-findings
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A read-only diagnosis of the divided pairs on the dev store, by counts: for each,
        whether its longer copies are in more than one cluster, and which threshold kept
        them apart. Recorded in the report.
    - id: ac2
      description: >-
        `compare_card_clusters.py sample` can be pointed at a cluster by id. The operator
        checks 10 pairs from each of the three largest clusters per caselist, tallies only.
        Amended by the PM, 2026-10-16: the operator checked hsld26's and hspf26's (60 pairs).
        For every caselist, the share of pairs of distinct texts that share no text, measured
        read-only over its three largest clusters, stands in for the rest.
    - id: ac3
      description: >-
        Each defect found has a synthetic fixture shown failing first. Recall on both
        labelled sets does not fall, and precision stays 1.000.
    - id: ac4
      description: >-
        If the fingerprint's clustering changes, `FINGERPRINT_VERSION` is bumped.
        Operator-run: the counts and both samples again after the rebuild, recorded in
        docs/data/caselist-parse-report.md.
status:
  phase: Succeeded
