[project]
name = "debate-cli"
version = "0.1.0"
description = "debate-research command-line interface (thin surface over debate_core)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["debate-core"]

[tool.uv.sources]
debate-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
