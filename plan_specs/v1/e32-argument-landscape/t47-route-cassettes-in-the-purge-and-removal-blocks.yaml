spec:
  # Filed by the PM, 2026-11-03, from v1-e32-t43's follow-up (accepted deviation, 2026-11-03).
  description: >-
    `landscape evaluate --route` records a route's cassettes under `model-cassettes-<route>/`
    (`model-cassettes-deep_audit/` exists on the operator's Mac since 2026-11-03), and
    `landscape cassettes --route` lists and deletes them. The annual purge and the removal
    runbooks' cassette steps run the default directory only, and say in a paragraph to tell the
    PM when a route directory exists. Give each a block that finds every `model-cassettes-*`
    directory and runs the same delete for each, with its own confirmation code, so the data-use
    policy's deletion reaches every route's cassettes, and add the runbook tests that pin the
    blocks.
  priority: 3
  constraints:
    packages: [docs/runbooks, tests/docs, debate_cli, packages/debate_cli/tests]
    forbidden:
      - A block that deletes without a dry run and a confirmation code
      - Card text or a team name in a runbook or test
  context:
    - kind: TaskRef
      name: v1-e32-t43-model-evaluation-system-score-refusals-and-a-second-route
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The purge and removal runbooks' cassette steps reach every route's cassette
        directory, each with a dry run and its own confirmation code, pinned by runbook
        tests.
status:
  phase: Pending
