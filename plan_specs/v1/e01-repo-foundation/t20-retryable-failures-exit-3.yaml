  graph:
    nodes:
      - id: exit-codes
        kind: Task
        name: Retryable failures exit 3
        description: >-
          The mapping, the translation, the consumer inventory.
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: custom
            name: Shown failing first, then passing
            description: >-
              An expired session and an unreadable blob directory each exit 1 or 70 today and exit 3 after
              the change, with every consumer listed.
