    scenarios:
      - {name: dedev, forms: [dedev]}                # 2 teams (2 documents)
      - {name: isolationism, forms: [isolationism]}  # 2 teams (2 documents)
    not_scenarios: []
  - id: coverage-advantage
    label: Coverage advantage
    kind: advantage
    side: aff
