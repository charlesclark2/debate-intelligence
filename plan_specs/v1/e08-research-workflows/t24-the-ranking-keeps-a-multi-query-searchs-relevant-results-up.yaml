apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e08-t24-the-ranking-keeps-a-multi-query-searchs-relevant-results-up
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
