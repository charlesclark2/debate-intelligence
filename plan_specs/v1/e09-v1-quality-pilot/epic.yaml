# EPIC E09 — V1 Quality, Evaluation & Team Pilot
# Major version: V1 | Release: v1.3 (V1 quality gate & team pilot)
# Architecture refs: §16, §10 Prompt governance, §11 acceptance criteria
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e09-v1-quality-pilot
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.3
    debate/epic: v1-e09-v1-quality-pilot
  annotations:
    debate/title: E09 — V1 Quality, Evaluation & Team Pilot
    debate/architecture-refs: §16, §10 Prompt governance, §11 acceptance criteria
spec:
  description: >-
    Build golden-card and LLM evaluation harnesses that gate prompt/model promotion, package the CLI,
    and pilot it with the team.
  priority: 4
  constraints:
    majorVersion: v1
    release: v1.3
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      Golden DOCX tests lock formatting; span evals report precision/recall vs coach labels and zero unsupported
      evidence text.
  - id: ac2
    description: >-
      Prompt/model promotion requires an evaluation comparison in CI.
  - id: ac3
    description: >-
      Students install the CLI with one command and a pilot produces a feedback log that informs V2.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e09-v1-quality-pilot-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.3
    debate/epic: v1-e09-v1-quality-pilot
spec:
