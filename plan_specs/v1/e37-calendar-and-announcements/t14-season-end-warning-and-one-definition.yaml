spec:
  # Filed by the PM, 2026-11-01, from v1-e37-t13's Follow-up work 2 and 3 (the PM's review, 2026-11-01).
  description: >-
    Since v1-e37-t13 `isStale` treats a `dateChecked` after the season's end as stale, but the
    warning for an entry nothing publishes still says only that the start-of-season check "has
    not been recorded". When `dateChecked` is after `seasonEnd`, add that it is dated after the
    season ends, which is usually a mistyped year. And `loadSchedule` (`tournaments.ts`) and
    `loadResults` (`results.ts`) build their own `${year + 1}-07-31` strings: use
    `seasonEnd(season)` instead, with the shipped schedule and results unchanged.
  priority: 3
  constraints:
    packages: [site, docs/guides]
    forbidden:
      - A guard weakened
      - A real student's name in a test fixture
      - A dependency manifest or lockfile under site/ changed
  context:
    - kind: TaskRef
      name: v1-e37-t13-consent-checked-after-the-season-is-stale
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        An entry dated after its season is warned as such, the schedule and results range
        checks use `seasonEnd`, and the shipped schedule and results load byte for byte as
        before, by tests shown failing first.
status:
  phase: Pending
