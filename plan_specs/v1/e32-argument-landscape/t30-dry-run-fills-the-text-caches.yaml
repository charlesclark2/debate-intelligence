# TASK v1-e32-t30-dry-run-fills-the-text-caches - A dry run fills the plan-text and analytic-text caches, so the first report after a parser bump reads sources once
# Epic: E32 Argument Landscape Reports | Release: v1.2 (Argument landscape & file building) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e32-t30-dry-run-fills-the-text-caches
  namespace: debate-intelligence
  labels:
