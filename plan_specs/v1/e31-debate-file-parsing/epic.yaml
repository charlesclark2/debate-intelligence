spec:
  description: >-
    Task graph for epic E31 (Debate File Parsing). Each Task node points at its own task-level PlanSpec.
  goalRef:
    name: v1-e31-debate-file-parsing
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e01-t06-adr-docs
      kind: External
      name: 'Prerequisite from E01: Architecture proposal and ADR records'
      description: >-
        Cross-epic prerequisite owned by v1-e01-repo-foundation (release v1.0).
      inputs:
        goalRef: v1-e01-t06-adr-docs
        specRef: plan_specs/v1/e01-repo-foundation/t06-adr-docs.yaml
    - id: ext-v1-e02-t01-domain-entities
      kind: External
      name: 'Prerequisite from E02: Pydantic domain entities and enums'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t01-domain-entities
        specRef: plan_specs/v1/e02-domain-core/t01-domain-entities.yaml
    - id: ext-v1-e30-t02-caselist-domain-model
      kind: External
