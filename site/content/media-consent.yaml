# Media-consent manifest.
#
# This file is the build's record of who the site is allowed to name and which images it is
# allowed to publish. It is checked by src/lib/publishing-policy.ts and by
# tests/content-policy.test.ts, and it implements these parts of
# docs/policies/website-publishing.md:
#
#   Students 1-2               a student is named only with a current-season consent form on file
#   Students 10-11             no student name in a file name, a path or anywhere outside content/
#   Photos and media consent 4 every image of an identifiable person carries an entry here
#   Consent renewal            consent expires; the check is repeated at the start of every season
#
# It holds no form, no signature, no student record and no contact detail. `consentReference` is
# opaque: the mapping from a reference to a person is Charlie's, kept with the activities office,
# and is never committed. Everything here is public by construction, because an entry exists only
# so that the same name or image may appear on a public page.
#
# A season runs 1 August to 31 July and is labelled like `2026-27`.
#
# What the build does with it:
#   - a named student or an image of a person with no entry here FAILS a prod build;
#   - an entry whose `dateChecked` predates the start of `season` WARNS, so a lapsed
#     start-of-season check is visible without anyone remembering to look.

season: '2026-27'

# Students the site may name, in the form it may name them. Empty: the team has not had its first
# practice of the season, and no page names a student.
students: []
# Example of the shape, for when the first entry is added:
#   - publishedName: Jordan Rivera
#     publishedForm: full-name-and-class-year
#     graduationYear: 2028
#     consentReference: MC-2026-014
#     season: '2026-27'
#     dateChecked: 2026-09-18

# Images of identifiable people. Empty: the site publishes no photograph of any person.
images: []
# Example of the shape:
#   - path: /photos/novice-orientation.jpg
#     consentReference: MC-2026-014
#     depicts: 2 team members, both covered
#     season: '2026-27'
#     dateChecked: 2026-09-18

# Images that show no identifiable person and therefore need no consent entry. Every image the
# site ships is either here or in `images` above; anything else fails the build.
nonPersonImages:
  - path: /brand/wfb-mark-navy-transparent.png
    reason: The team's W BAY mark, navy on transparent, in the header. No person in the frame.
  - path: /brand/wfb-mark-white-knockout.png
    reason: The same mark knocked out in white, in the navy footer. No person in the frame.
  - path: /brand/wfb-mark-square-light-512.png
    reason: Square light-background version of the mark, for sharing. No person in the frame.

# Words that may appear inside a capitalised name on this site. The guard flags any run of
# capitalised words containing a word that is not listed here, which is how an unreviewed student
# name is caught before it reaches prod. Reviewing words rather than whole phrases is what keeps
# "Email Coach Clark" and "Whitefish Bay High School" quiet while "Jordan Rivera" is not.
#
# A student's name never goes here. It goes in `students` above, with a consent reference.
# The full published-names allowlist, covering opponent schools and tournaments, is v1-e37-t03.
permittedNameWords:
  # Adults acting publicly, named under Students rule: coaches may be named as coaches.
  - Charlie
  - Clark
  - Coach
  - Head
  # The school, the district and the places the team goes.
  - Whitefish
  - Bay
  - High
  - School
  - Team
  - English
  - Wing
  - Wisconsin
  - Kansas
  - City
  - Chicago
  - Minneapolis
  - Iowa
  # Organisations and events.
  - National
  - Speech
  - Debate
  - Association
  - Catholic
  - Forensic
  - League
  - Coaches
  - Tournament
  - Champions
  - Public
  - Forum
  - Policy
  # Accessibility statement and holidays.
  - Web
  - Content
  - Accessibility
  - Guidelines
  - Martin
  - Luther
  - King
  - Jr
  # Ordinary words that start a sentence or a heading next to a capitalised word.
  - Email
  - Joining
  - The
  # From the title-case page heading "Debate Events Offered" (v1-e36-t07). Neither word is a
  # surname; they are here rather than the heading being reworded because this is the path the
  # guard itself names for a capitalised phrase that is not a person.
  - Events
  - Offered
  # From the Public Forum resolution in content/events.yaml, which names the country.
  - United
  - States
  # Days and months, so a date next to a capitalised word is not read as a name.
  - Monday
  - Mondays
  - Tuesday
  - Wednesday
  - Wednesdays
  - Thursday
  - Thursdays
  - Friday
  - Saturday
  - Sunday
  - January
  - February
  - March
  - April
  - May
  - June
  - July
  - August
  - September
  - October
  - November
  - December
