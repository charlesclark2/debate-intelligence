# EPIC E06 — Card Cutting, Citation & Export
# Major version: V1 | Release: v1.1 (URL → verified card)
# Architecture refs: §6 CardService/CitationService/ExportService, §8, §11, §20 steps 6-7
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e06-card-cutting
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e06-card-cutting
  annotations:
    debate/title: E06 — Card Cutting, Citation & Export
    debate/architecture-refs: §6 CardService/CitationService/ExportService, §8, §11, §20 steps 6-7
spec:
  description: >-
    Compose retrieval, model selection and verification into CardService; resolve verifiable citations;
    render DOCX and JSON manifests in the team's card conventions; ship `debate-research cut`.
  priority: 2
  constraints:
    majorVersion: v1
    release: v1.1
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      `debate-research cut <URL> --format <profile> --output evidence.docx` produces a tagged, cited,
      underlined, verified card end to end.
  - id: ac2
    description: >-
      Every citation field carries provenance and a verified/unverified state; nothing is invented.
  - id: ac3
    description: >-
      DOCX output matches the team's card formatting conventions and embeds a machine-readable manifest
      that `verify` can check.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e06-card-cutting-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e06-card-cutting
spec:
  description: >-
    Task graph for epic E06 (Card Cutting, Citation & Export). Each Task node points at its own task-level
    PlanSpec.
  goalRef:
    name: v1-e06-card-cutting
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e02-t01-domain-entities
      kind: External
      name: 'Prerequisite from E02: Pydantic domain entities and enums'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t01-domain-entities
        specRef: plan_specs/v1/e02-domain-core/t01-domain-entities.yaml
    - id: ext-v1-e03-t04-verifier
      kind: External
      name: 'Prerequisite from E03: EvidenceVerifier and verification statuses'
      description: >-
        Cross-epic prerequisite owned by v1-e03-evidence-integrity (release v1.0).
      inputs:
        goalRef: v1-e03-t04-verifier
        specRef: plan_specs/v1/e03-evidence-integrity/t04-verifier.yaml
    - id: ext-v1-e03-t06-verify-command
      kind: External
      name: 'Prerequisite from E03: `debate-research verify` command'
      description: >-
        Cross-epic prerequisite owned by v1-e03-evidence-integrity (release v1.0).
      inputs:
        goalRef: v1-e03-t06-verify-command
        specRef: plan_specs/v1/e03-evidence-integrity/t06-verify-command.yaml
    - id: ext-v1-e04-t05-article-service
      kind: External
      name: 'Prerequisite from E04: ArticleService orchestration'
      description: >-
        Cross-epic prerequisite owned by v1-e04-article-retrieval (release v1.1).
      inputs:
        goalRef: v1-e04-t05-article-service
        specRef: plan_specs/v1/e04-article-retrieval/t05-article-service.yaml
    - id: ext-v1-e05-t06-card-selection-contract
      kind: External
      name: 'Prerequisite from E05: CardSelection / MarkupSpan contract and prompts'
      description: >-
        Cross-epic prerequisite owned by v1-e05-model-router (release v1.1).
      inputs:
        goalRef: v1-e05-t06-card-selection-contract
        specRef: plan_specs/v1/e05-model-router/t06-card-selection-contract.yaml
    - id: ext-v1-e05-t07-usage-telemetry
      kind: External
      name: 'Prerequisite from E05: Token/cost telemetry and budgets'
      description: >-
        Cross-epic prerequisite owned by v1-e05-model-router (release v1.1).
      inputs:
        goalRef: v1-e05-t07-usage-telemetry
        specRef: plan_specs/v1/e05-model-router/t07-usage-telemetry.yaml
    - id: t01
      kind: Task
      name: CitationService with per-field provenance
      description: >-
        Resolve author, credentials (only when verifiable), title, publication, date, URL, accessed date
        from HTML meta/JSON-LD/OpenGraph and Crossref (by DOI); each field records source and verified
        flag; cite formatting rules.
      inputs:
        specRef: plan_specs/v1/e06-card-cutting/t01-citation-service.yaml
        goalRef: v1-e06-t01-citation-service
      dependsOn:
      - ext-v1-e04-t05-article-service
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e06-t01-citation-service reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e06-t01-citation-service
    - id: t02
      kind: Task
      name: CardService pipeline
      description: >-
        Use case: snapshot → CardSelection → span extraction → tag/markup → citation → verification →
        persist; returns Card with VerificationResult; UNVERIFIED path preserved with reasons.
      inputs:
        specRef: plan_specs/v1/e06-card-cutting/t02-card-service.yaml
        goalRef: v1-e06-t02-card-service
      dependsOn:
      - t01
      - ext-v1-e05-t06-card-selection-contract
      - ext-v1-e03-t04-verifier
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e06-t02-card-service reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e06-t02-card-service
    - id: t03
      kind: Task
      name: Card format profiles from team conventions
      description: >-
        Derive format profiles (tag style, cite block, underline/highlight/bold, font sizes, condensing)
        from representative team files in the debate folder; profiles stored as config.
      inputs:
        specRef: plan_specs/v1/e06-card-cutting/t03-format-profiles.yaml
        goalRef: v1-e06-t03-format-profiles
      dependsOn:
      - ext-v1-e02-t01-domain-entities
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e06-t03-format-profiles reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e06-t03-format-profiles
    - id: t04
      kind: Task
      name: DOCX renderer
      description: >-
        python-docx renderer producing headings/tags, cite block, evidence with underline/highlight from
        CardSpans, unverified banner, and an embedded custom XML manifest part.
      inputs:
        specRef: plan_specs/v1/e06-card-cutting/t04-docx-renderer.yaml
        goalRef: v1-e06-t04-docx-renderer
      dependsOn:
      - t02
      - t03
      - t05
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e06-t04-docx-renderer reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e06-t04-docx-renderer
    - id: t05
      kind: Task
      name: JSON manifest export
      description: >-
        Versioned JSON manifest with card, spans, snapshot id/hashes, citation provenance, model/prompt
        metadata; round-trips through verify.
      inputs:
        specRef: plan_specs/v1/e06-card-cutting/t05-json-manifest-export.yaml
        goalRef: v1-e06-t05-json-manifest-export
      dependsOn:
      - t02
      - ext-v1-e03-t06-verify-command
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e06-t05-json-manifest-export reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e06-t05-json-manifest-export
    - id: t06
      kind: Task
      name: '`debate-research cut` command'
      description: >-
        CLI command with --format, --output, --need, --json; progress display; explicit retrieval/verification
        failure messages; exit codes.
      inputs:
        specRef: plan_specs/v1/e06-card-cutting/t06-cut-command.yaml
        goalRef: v1-e06-t06-cut-command
      dependsOn:
      - t04
      - t05
      - ext-v1-e05-t07-usage-telemetry
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e06-t06-cut-command reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e06-t06-cut-command
    - id: t07
      kind: Task
      name: Verify DOCX files
      description: >-
        Extend `verify` to read the embedded manifest from DOCX, re-derive evidence from stored snapshots,
        and detect manual edits to quoted text in the document body.
      inputs:
        specRef: plan_specs/v1/e06-card-cutting/t07-verify-docx.yaml
        goalRef: v1-e06-t07-verify-docx
      dependsOn:
      - t04
      - ext-v1-e03-t06-verify-command
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e06-t07-verify-docx reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e06-t07-verify-docx
status:
  phase: Pending
