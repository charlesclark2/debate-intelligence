      - id: report-from-restored-copy
        kind: Task
        name: Landscape report from a restored copy
        description: >-
          Count what the report reads and writes, propose, then run it over a restored copy
          with the landscape state kept in the data directory.
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Landscape CLI tests pass
            command: uv
            args: [run, pytest, packages/debate_cli/tests, -k, landscape]
status:
  phase: Pending
