spec:
  # Filed by the PM, 2026-10-30, from v1-e30-t28's Follow-up 4 and question 2.
  description: >-
    `landscape/model-cassettes/<prompt>/<key>.json` does not say which caselist a recording came
    from, so the annual purge cannot delete a purged season's cassettes alone, and the PM's
    ruling of 2026-10-30 (a season that becomes a backfile loses its classifications) needs it.
    Record the caselist with each cassette, readably by older replays, and give the purge
    runbook the command.
  priority: 3
  constraints:
    packages: [debate_core.integrations, debate_core.application, packages/debate_core/tests, docs/runbooks]
    forbidden:
      - A cassette that replays for a call whose recorded values differ
      - A real model call in a test
  context: []
  acceptanceCriteria:
    - id: ac1
      description: >-
        A cassette names its caselist, an older cassette still replays, and one caselist's
        cassettes can be listed and deleted alone, by tests shown failing first.
status:
  phase: InProgress
