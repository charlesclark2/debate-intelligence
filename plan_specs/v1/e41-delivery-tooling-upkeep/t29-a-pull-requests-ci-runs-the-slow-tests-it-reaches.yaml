apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e41-t29-a-pull-requests-ci-runs-the-slow-tests-it-reaches
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
