# pre-commit hooks. Every hook runs through `uv run --frozen`, so tool versions come from uv.lock
# (no separate hook revisions to keep in step) and nothing is fetched from the network.
# Install once per clone:  uv run pre-commit install
# Run by hand:             uv run pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: unsupported
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen end-of-file-fixer
        language: unsupported
        types: [text]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run --frozen check-added-large-files --maxkb=500
        language: unsupported
      # Markers reached dev once, in a Markdown table inside a module docstring: Python parsed the
      # file, 1,788 tests passed over it, and nothing noticed. `git add` during a rebase does not
      # check, so this is the only thing between a hurried `rebase --continue` and the main branch.
      - id: check-merge-conflict
        name: check for merge conflict markers
        entry: uv run --frozen check-merge-conflict --assume-in-merge
        language: unsupported
        types: [text]
      # The PlanSpec validator (v1-e01-t05). Both scripts run through the project environment
      # (`python scripts/...`) rather than their PEP 723 headers, because `uv run --frozen` refuses a
      # script that has no lockfile of its own, and because the project environment is already
      # installed and reaches no network. The headers are what makes them runnable on their own.
      #
      # It reads the whole plan_specs/ tree rather than the
      # files that changed, because most of what it checks is between documents: a prerequisite
      # that names a task in a later release, an epic Plan that has stopped listing one of its
      # task files, a duplicated metadata.name. It takes about a second, so it runs only when
      # plan_specs/ or the validator itself changed.
      - id: validate-specs
        name: validate PlanSpecs
        entry: uv run --frozen python scripts/validate_specs.py
        language: unsupported
        files: ^(plan_specs/|scripts/validate_specs\.py$)
        pass_filenames: false
        require_serial: true
      # The offline Markdown link and anchor checker (v1-e01-t05). Also whole-repository rather
      # than per-file: renaming a heading breaks links in files the commit never touched, which is
      # exactly the case the ad-hoc linkcheckmd run in v1-e01-t06 could not see.
      #
      # `scripts/spec_index.py --check` is deliberately NOT a hook. ROADMAP.md is refreshed by the
      # PM in a PR of its own so that parallel task PRs do not conflict on it, which means a task
      # branch is expected to leave it stale; v1-e01-t04 requires the check only on pull requests
      # into main, which the PM raises one at a time.
      - id: check-links
        name: check Markdown links and anchors
        entry: uv run --frozen python scripts/check_links.py
        language: unsupported
        types: [markdown]
        pass_filenames: false
        require_serial: true
      # Terraform is not a uv dependency: it and tflint come from the operator's machine
      # (`brew install hashicorp/tap/terraform tflint`) and from the CI runner's setup steps, and
      # the script says so if either is missing. It runs only when infrastructure/ or the script
      # itself changed, because it takes a few seconds and downloads the AWS provider the first
      # time. It needs no AWS credentials: see the header of scripts/terraform_checks.sh.
      - id: terraform-checks
        name: terraform fmt, validate and tflint
        entry: scripts/terraform_checks.sh
        language: unsupported
        files: ^(infrastructure/|scripts/terraform_checks\.sh$)
        pass_filenames: false
        require_serial: true
      # Node and pnpm are not uv dependencies either: they come from the operator's machine
      # (`brew install node`, then `npm install -g pnpm@10.15.0`) and from the CI runner's setup
      # steps, and the script says so if either is missing. It runs only when site/ changed,
      # because it lints, type-checks, tests and builds the site, which takes about ten seconds.
      # Everything it runs is offline: see the header of site/scripts/pre-commit-checks.sh.
      - id: site-checks
        name: site lint, typecheck, test and build
        entry: site/scripts/pre-commit-checks.sh
        language: unsupported
        files: ^site/
        pass_filenames: false
        require_serial: true
