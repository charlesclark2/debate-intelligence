# TASK v1-e31-t34-what-the-bold-tag-rules-leave-above-a-cite - What the bold tag rules leave above a cite: the lines not bold, sampled, and the inline card, counted
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
