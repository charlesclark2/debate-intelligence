# TASK v1-e34-t30-doctor-unparsed-store - doctor says when a store the weekly run will index has never been parsed
# Epic: E34 Caselist Sync | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e34-t30-doctor-unparsed-store
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e34-caselist-sync
  annotations:
    debate/title: "doctor says when a store the weekly run will index has never been parsed"
spec:
  # Filed by the PM, 2026-10-21, from v1-e39-t09's Follow-up 2.
  description: >-
    v1-e39-t09's search-index stage fails, under its PM ruling Q3, when a configured caselist or
    `openev` has never been parsed, so a fresh installation's first Wednesday ends incomplete.
    `debate-research doctor` gains a check, before that run, naming each store the stage would
    index that has no version directory for the installed build's parser, with `caselist parse
    --caselist <slug>` as the fix. When `caselist.refresh_search_index` is off, the check says
    it does not apply.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks]
    forbidden:
      - A path, school, team code or file name in doctor's output
      - Network or AWS access in any test
  acceptanceCriteria:
    - id: ac1
      description: >-
        doctor names each unparsed store the stage would index, with the parse command, and
        passes when every store is parsed or the setting is off, by tests shown failing
        first.
status:
  phase: InProgress
