      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The second sample's size, drawn from the interval wanted at 0.85 and the coach's
        time, is ruled on by the PM.
    - id: ac2
      description: >-
        The second sample is drawn by the strata and seed rule with no card from the first,
        by tests on invented cards shown failing first, and the evaluation reads it as a
        holdout beside the first.
    - id: ac3
      description: >-
        The coach labels it in a sitting and `--check-sample` reads it (operator, recorded
        by the PM).
