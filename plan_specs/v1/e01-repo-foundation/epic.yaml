# EPIC E01 — Repository & Delivery Foundation
# Major version: V1 | Release: v1.0 (Foundation & verified evidence core)
# Architecture refs: §4, §6, §17, §18
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e01-repo-foundation
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
  annotations:
    debate/title: E01 — Repository & Delivery Foundation
    debate/architecture-refs: §4, §6, §17, §18
spec:
  description: >-
    Create the git repository, GitHub remote, uv workspace, quality tooling, CI, PlanSpec tooling, ADR
    docs, and the thin Typer CLI shell every later epic plugs into.
  priority: 1
  constraints:
    majorVersion: v1
    release: v1.0
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      A GitHub repository exists with protected main, PR template, and required CI checks.
  - id: ac2
    description: >-
      `uv sync` builds the workspace; ruff, type checking, pytest and spec validation all run in CI on
      every PR.
  - id: ac3
    description: >-
      ADR-001..009 and the architecture proposal are versioned under docs/.
  - id: ac4
    description: >-
      `debate-research --version` runs from an installed CLI with no business logic in the CLI package.
status:
  # Set by the PM, 2026-10-15, at the v1.0 close-out: all 27 tasks Succeeded. ac1: protect-main
  # and protect-dev rulesets (docs/process/rulesets), the task, promotion and hotfix templates, and
  # the required `ci`, promotion guards and `validate-dev` status. ac2: ci.yml runs ruff, pyright,
  # pytest (five parts), lint-imports and validate_specs.py on every pull request into dev or main.
  # ac3: ADR-0001 to 0009 under docs/adr and docs/architecture/architecture_proposal.md. ac4:
  # validate-dev installs each dev pre-release and checks `debate-research --version --json`
  # (v0.1.0-dev.151: 85 recorded smoke checks passed), and lint-imports keeps business logic out
  # of debate_cli (12 contracts kept).
  phase: Succeeded
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e01-repo-foundation-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
spec:
  description: >-
    Task graph for epic E01 (Repository & Delivery Foundation). Each Task node points at its own task-level
    PlanSpec.
  goalRef:
    name: v1-e01-repo-foundation
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e02-t05-settings-config
      kind: External
      name: 'Prerequisite from E02: Settings and configuration'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t05-settings-config
        specRef: plan_specs/v1/e02-domain-core/t05-settings-config.yaml
    - id: ext-v1-e03-t06-verify-command
      kind: External
      name: 'Prerequisite from E03: `debate-research verify` command'
      description: >-
        Cross-epic prerequisite owned by v1-e03-evidence-integrity (release v1.0).
      inputs:
        goalRef: v1-e03-t06-verify-command
        specRef: plan_specs/v1/e03-evidence-integrity/t06-verify-command.yaml
    - id: t01
      kind: Task
      name: Initialize local git repository and monorepo skeleton
      description: >-
        git init, .gitignore, README, the §6 directory layout (packages/debate_core, debate_cli, debate_api,
        debate_workers, web, infrastructure, tests), plan_specs/ tree. Completed during project setup
        (2026-09-17).
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t01-init-local-repo.yaml
        goalRef: v1-e01-t01-init-local-repo
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t01-init-local-repo reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t01-init-local-repo
    - id: t02
      kind: Task
      name: Create GitHub repository, push, and protect main
      description: >-
        Create the GitHub repo (public, so Actions minutes are free for v1-e01-t04's CI; what makes that
        safe is that no real debate file, school, team code or student name may enter the repository at
        all), add remote, push history, enable branch protection on main (PR required, no force-push;
        required status checks arrive with v1-e01-t04, t08 and t10), add CODEOWNERS, PR and issue
        templates, and
        set dev as the default branch with protect-main / protect-dev rulesets per docs/process/branching-and-environments.md
        (main = prod, dev = development environment).
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t02-github-remote.yaml
        goalRef: v1-e01-t02-github-remote
      dependsOn:
      - t01
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t02-github-remote reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t02-github-remote
    - id: t03
      kind: Task
      name: uv workspace, Python 3.12 and quality tooling
      description: >-
        Root pyproject with uv workspace members for each package, Python 3.12 pin, ruff (lint+format),
        pyright or mypy strict for debate_core, pytest + pytest-xdist + coverage, pre-commit hooks.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t03-uv-workspace-tooling.yaml
        goalRef: v1-e01-t03-uv-workspace-tooling
      dependsOn:
      - t01
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t03-uv-workspace-tooling reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t03-uv-workspace-tooling
    - id: t04
      kind: Task
      name: GitHub Actions CI pipeline
      description: >-
        Workflow running lint, type check, unit tests, import-boundary checks and PlanSpec validation
        on PRs and pushes; caching for uv; status check names stable so they can be required in branch
        protection. Runs on PRs into dev and main and on pushes to both.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t04-ci-pipeline.yaml
        goalRef: v1-e01-t04-ci-pipeline
      dependsOn:
      - t02
      - t03
      - t05
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t04-ci-pipeline reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t04-ci-pipeline
    - id: t05
      kind: Task
      name: PlanSpec validation and index tooling
      description: >-
        scripts/validate_specs.py (schema shape, unique names, dependsOn resolution, acyclicity, epic-in-one-major-version
        rule) and scripts/spec_index.py (regenerates ROADMAP tables). Initial version written during setup;
        this task wires it into pre-commit and CI and adds status reporting.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t05-spec-tooling.yaml
        goalRef: v1-e01-t05-spec-tooling
      dependsOn:
      - t01
      - t03
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t05-spec-tooling reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t05-spec-tooling
    - id: t06
      kind: Task
      name: Architecture proposal and ADR records
      description: >-
        Commit the architecture proposal as markdown under docs/architecture, split ADR-001..ADR-009 into
        docs/adr/NNNN-*.md using a standard ADR template, and add an ADR index plus a process for new
        ADRs.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t06-adr-docs.yaml
        goalRef: v1-e01-t06-adr-docs
      dependsOn:
      - t01
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t06-adr-docs reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t06-adr-docs
    - id: t07
      kind: Task
      name: debate_cli Typer + Rich skeleton
      description: >-
        debate_cli package exposing the `debate-research` entry point with Typer app, Rich console/output
        helpers, global --verbose/--json flags, `--version`, and a pattern where commands only parse args
        and call debate_core application services.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t07-cli-skeleton.yaml
        goalRef: v1-e01-t07-cli-skeleton
      dependsOn:
      - t03
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t07-cli-skeleton reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t07-cli-skeleton
    - id: t08
      kind: Task
      name: dev→main promotion workflow and guards
      description: >-
        Implement docs/process/branching-and-environments.md in GitHub: promotion-source check (PRs to
        main only from dev or hotfix/*), promotion PR template (included tasks, dev build id, validate-dev
        link, manual checks), merge-commit-only promotion, hotfix back-merge check that fails when main
        has commits dev lacks, and required-check wiring for ci on dev and main.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t08-branch-promotion-workflow.yaml
        goalRef: v1-e01-t08-branch-promotion-workflow
      dependsOn:
      - t02
      - t04
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t08-branch-promotion-workflow reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t08-branch-promotion-workflow
    - id: t09
      kind: Task
      name: Dev pre-release channel and environment profiles for the CLI
      description: >-
        On every merge to dev, build and publish a GitHub pre-release vX.Y.Z-dev.N of the CLI installable
        with uv tool install; DEBATE_ENV=dev|prod settings profiles with separate data dirs, provider/model
        config and a low dev model budget; `debate-research --version` reports the channel and commit.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t09-dev-prerelease-channel.yaml
        goalRef: v1-e01-t09-dev-prerelease-channel
      dependsOn:
      - t08
      - t07
      - ext-v1-e02-t05-settings-config
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t09-dev-prerelease-channel reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t09-dev-prerelease-channel
    - id: t10
      kind: Task
      name: validate-dev smoke gate for promotions
      description: >-
        A validate-dev workflow that installs the exact dev pre-release, runs the smoke suite (tests/smoke/,
        recorded fixtures plus a small opt-in live canary) with DEBATE_ENV=dev, and posts a validate-dev
        commit status; required on promotion PRs to main. Documents how later tasks add smoke checks.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t10-validate-dev-gate.yaml
        goalRef: v1-e01-t10-validate-dev-gate
      dependsOn:
      - t09
      - ext-v1-e03-t06-verify-command
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t10-validate-dev-gate reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t10-validate-dev-gate
    - id: t11
      kind: Task
      name: Task lifecycle CLI and session workflow
      description: >-
        scripts/task (ready, start, resume, prompt, list, report, review, sync, pr, finish) and scripts/task_helper.py:
        one git worktree and task/<task> branch per task off origin/dev, prerequisite check, kickoff prompt
        for the Claude session, session report template with PM verdict, PR into dev gated on PM acceptance,
        and clean-up of worktree plus local/remote branch after merge. Documented in docs/process/task-workflow.md
        and working-agreements.md. Completed during project setup (2026-09-18).
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t11-task-workflow-cli.yaml
        goalRef: v1-e01-t11-task-workflow-cli
      dependsOn:
      - t01
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t11-task-workflow-cli reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t11-task-workflow-cli
    - id: t12
      kind: Task
      name: Re-run the promotion guards when main moves
      description: >-
        A promotion PR open before a hotfix lands keeps a stale green `back-merge` and can merge a
        combination onto prod that dev never validated. back-merge.yml re-runs promotion-guard.yml
        for open PRs into main.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t12-promotion-guard-rerun.yaml
        goalRef: v1-e01-t12-promotion-guard-rerun
      dependsOn:
      - t08
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t12-promotion-guard-rerun reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t12-promotion-guard-rerun
    - id: ext-v1-e02-t06-import-boundary-guard
      kind: External
      name: 'Prerequisite from E02: import-boundary enforcement'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0). It writes the contracts
        and the exception lists this task empties.
      inputs:
        goalRef: v1-e02-t06-import-boundary-guard
        specRef: plan_specs/v1/e02-domain-core/t06-import-boundary-guard.yaml
    - id: t13
      kind: Task
      name: Empty the import-boundary exception lists
      description: >-
        v1-e02-t06 found five pre-existing violations of the architecture it enforces and recorded
        them as shrink-only exceptions. This turns the ratchet: four adapter imports move into the
        composition root and `caselist pull` comes under its statement budget.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t13-composition-root-cleanup.yaml
        goalRef: v1-e01-t13-composition-root-cleanup
      dependsOn:
      - ext-v1-e02-t06-import-boundary-guard
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t13-composition-root-cleanup reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t13-composition-root-cleanup
    - id: ext-v1-e03-t01-text-normalization
      kind: External
      name: 'Prerequisite from E03: the Unicode pin'
      description: >-
        Cross-epic prerequisite owned by v1-e03-evidence-integrity (release v1.0). It pins Unicode
        15.0.0 for the evidence normalizer and sets `debate_core`'s `requires-python` upper bound to
        match, which is the single declaration this task makes everything else derive from.
      inputs:
        goalRef: v1-e03-t01-text-normalization
        specRef: plan_specs/v1/e03-evidence-integrity/t01-text-normalization.yaml
    - id: t14
      kind: Task
      name: One source for the supported interpreter, enforced at install
      description: >-
        The supported Python is written in three places and the copy that actually protects an
        install - `PYTHON_VERSION=3.12` in install_channel.sh - is tied to nothing, because uv
        ignores upper bounds on a dependency's Requires-Python. The script derives it from the wheel
        metadata instead, and `doctor` gains the ability to fail so a wrong-interpreter install is
        caught at install time rather than at first use.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t14-install-interpreter-bound.yaml
        goalRef: v1-e01-t14-install-interpreter-bound
      dependsOn:
      - t09
      - ext-v1-e03-t01-text-normalization
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t14-install-interpreter-bound reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t14-install-interpreter-bound
    - id: t15
      kind: Task
      name: Re-run the promotion guards without waiting for an event
      description: >-
        t12 closed the stale-green gap for every push that arrives. t12's own sandbox proved one may
        not: a lost push produces no job, and a job that never ran cannot fail. A schedule and a
        dispatch re-run the guards without depending on an event.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t15-promotion-guard-sweep.yaml
        goalRef: v1-e01-t15-promotion-guard-sweep
      dependsOn:
      - t12
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t15-promotion-guard-sweep reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t15-promotion-guard-sweep
    - id: t16
      kind: Task
      name: Generate the docs index instead of hand-editing it
      description: >-
        docs/README.md is derived information kept by hand, so every doc-producing task collides
        there and a renamed document goes unnoticed. Generate it as ROADMAP.md is generated, with a
        --check mode, and correct the agreement that asks sessions to edit it.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t16-generated-docs-index.yaml
        goalRef: v1-e01-t16-generated-docs-index
      dependsOn:
      - t05
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t16-generated-docs-index reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t16-generated-docs-index
    - id: t17
      kind: Task
      name: The installed build carries what its commands need
      description: >-
        The channel build has none of debate-core's optional extras, so every `caselist pull` fails on a
        missing boto3, and the channel's checks never imported an integration. Fix the declaration and the
        verification.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t17-installed-build-extras.yaml
        goalRef: v1-e01-t17-installed-build-extras
      dependsOn:
      - t09
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t17-installed-build-extras reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t17-installed-build-extras
    - id: t18
      kind: Task
      name: 'scripts/task restarts a task that merged partially'
      description: >-
        Resuming a --partial task has no supported path, and the verdict check reads the first
        review in a report.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t18-restart-partial-tasks.yaml
        goalRef: v1-e01-t18-restart-partial-tasks
      dependsOn:
      - t07
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t18-restart-partial-tasks reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t18-restart-partial-tasks
    - id: t19
      kind: Task
      name: 'Command blocks in the docs are safe to paste into zsh'
      description: >-
        A check that fails on a # comment in a shell block in the Markdown a person pastes from, the
        fixes, and the session prompt line.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t19-paste-safe-command-blocks.yaml
        goalRef: v1-e01-t19-paste-safe-command-blocks
      dependsOn:
      - t07
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t19-paste-safe-command-blocks reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t19-paste-safe-command-blocks
    - id: t20
      kind: Task
      name: 'A failure that may succeed on retry never shares an exit code with a verdict'
      description: >-
        Retryable store failures exit 3 everywhere; filesystem stores translate operating-system
        refusals.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t20-retryable-failures-exit-3.yaml
        goalRef: v1-e01-t20-retryable-failures-exit-3
      dependsOn:
      - ext-v1-e03-t06-verify-command
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t20-retryable-failures-exit-3 reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t20-retryable-failures-exit-3
    - id: t21
      kind: Task
      name: 'The storage and OpenCaselist smoke checks run against the installed build'
      description: >-
        Loopback stand-ins (moto server, an OpenCaselist stand-in) so the publish, remove, pull and
        runs smoke checks run against the installed pre-release in validate-dev.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t21-installed-smoke-stand-ins.yaml
        goalRef: v1-e01-t21-installed-smoke-stand-ins
      dependsOn:
      - t10
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t21-installed-smoke-stand-ins reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t21-installed-smoke-stand-ins
    - id: t22
      kind: Task
      name: 'The real install is the build the rehearsal checked, and doctor answers for all of it'
      description: >-
        Pin the real install's resolution to the rehearsal's; doctor fails on an integration that does
        not import.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t22-install-resolves-once.yaml
        goalRef: v1-e01-t22-install-resolves-once
      dependsOn:
      - t14
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t22-install-resolves-once reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t22-install-resolves-once
    - id: t23
      kind: Task
      name: 'The installed build runs on a Python that uv manages'
      description: >-
        The installer requests a uv-managed interpreter, so a conda or Homebrew update cannot break the
        agent's build in place.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t23-managed-python.yaml
        goalRef: v1-e01-t23-managed-python
      dependsOn:
      - t22
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e01-t23-managed-python reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e01-t23-managed-python
    - id: t24
      kind: Task
      name: 'A partial merge''s open items are read from the current session''s sections'
      description: >-
        `scripts/task pr --partial` reads the open-items markers only from the current
        session's sections, so a resumed report cannot pass on an earlier session's NOT RUN.
      inputs:
        specRef: plan_specs/v1/e01-repo-foundation/t24-partial-open-items-current-session.yaml
        goalRef: v1-e01-t24-partial-open-items-current-session
      dependsOn:
