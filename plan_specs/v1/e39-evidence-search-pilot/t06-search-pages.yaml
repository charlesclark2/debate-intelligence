# TASK v1-e39-t06-search-pages - Search pages: search, results, the card page and Copy card, on a Chromebook
# Epic: E39 — Team Evidence Search (Student Pilot) | Release: v1.7 (Team evidence search pilot) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e39-t06-search-pages
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.7
    debate/epic: v1-e39-evidence-search-pilot
  annotations:
    debate/title: "Search pages: search, results, the card page and Copy card, on a Chromebook"
spec:
  # Filed by the PM, 2026-10-19, from Charlie's direction of 2026-10-19 (a student search pilot before the
  # semester ends, on Chromebooks, signing in with a username, password and 2FA, outside the school's systems).
  description: >-
    Server-rendered pages in debate_api over v1-e39-t03: a search page with one box and filters
    for event, caselist, side and date; results with tag, short cite, snippet, counts and the
    provenance line; a card page with the formatted card, the label "Disclosed evidence, not
    platform-verified" (ADR-0006), and every surviving occurrence's provenance. Copy card puts
    text/html and text/plain on the clipboard, so a paste into Google Docs or Word keeps bold,
    underline, emphasis and highlight colours, with the provenance line below the cite as a
    built file has it. The pages work in a Chromebook's Chrome at 1366x768 and 1280x800, by
    keyboard alone, and on a phone; they load nothing from another origin and use no inline
    script; a page weighs under 150 KB before the card body.
    (PM amendment 2026-10-20, from v1-e31-t22.) 12,048 stored cards (5%) run over 3,000 words,
    and nearly all are real cards. A card page leads with what is read aloud (the underlined and
    highlighted text), with the rest of the card shown on request, and a result's snippet never
    carries a whole long card. Copy card still copies the whole card with its formatting.
  priority: 1
  constraints:
    # PM ruling 2026-10-20: this task owns the function's index holder (ADR-0019 (c) 3 and 5), which
    # no spec had assigned and the pages need. The first request that needs the index reads
    # `reports/tub/search/current.json` and the manifest, streams the object through gunzip and sha256
    # into /tmp, refuses it on a digest mismatch or an unknown format version, and opens it read-only
    # and immutable. Sign-in, the callback, the health check and the empty search page never wait for
    # it. The pointer is re-read by conditional GET at most five minutes apart, and a frozen
    # environment past five minutes rechecks before it answers; a new pointer is downloaded to a new
    # path, swapped in, and the old file deleted, never rewritten in place. It is one refresh loop,
    # which v1-e39-t07 extends with the suppression list's re-read (`is_suppressed` stays None here).
    # So the holder's port and use case go in debate_core.application, its S3 adapter in
    # debate_core.integrations.s3, an in-memory published index for the tests of both packages in
    # debate_core.testing, and their tests in packages/debate_core/tests. The PM's notes of
    # the same day add Playwright and axe as dev dependencies, so pyproject.toml and uv.lock too.
    packages:
      - debate_api
      - packages/debate_api/tests
      - tests/integration
      - debate_core.application
      - debate_core.integrations.s3
      - debate_core.testing
      - packages/debate_core/tests
      - pyproject.toml
      - uv.lock
    forbidden:
      - A third-party script, font, analytics or tracking
      - Inline script or a CSP exception for one
      - Card text, a school, team code, file name, student name, username or email in any fixture, log, report or commit (synthetic values only)
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e39-t03-search-core
      relation: dependsOn
    - kind: TaskRef
      name: v1-e39-t05-accounts-and-sign-in
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Playwright tests against the app served locally with a synthetic index search,
        filter, page, open a card and copy it at 1366x768 and 390x844, and axe reports no
        serious or critical violation.
    - id: ac2
      description: >-
        Copied HTML pasted into a fixture editable region keeps every formatting span,
        compared as coverage, with the provenance line below the cite, by test.
    - id: ac3
      description: >-
        No page requests another origin or carries inline script, by a test over every
        response and its CSP; the page-weight budget holds, by test.
    - id: ac4
      description: >-
        On dev, the operator's Chromebook check: search, open a card, copy it into Google
        Docs, formatting kept; reported yes or no for each (operator follow-up).
    - id: ac5
      description: >-
        (PM amendment 2026-10-20) A card over 3,000 words shows its read-aloud text first
        and the rest on request, and its search result's snippet stays within the
        page-weight budget, by test.
status:
  phase: InProgress
