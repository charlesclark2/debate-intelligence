# TASK v1-e31-t23-in-round-markers - In-round markers kept in a card's evidence text
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t23-in-round-markers
  namespace: debate-intelligence
  labels:
