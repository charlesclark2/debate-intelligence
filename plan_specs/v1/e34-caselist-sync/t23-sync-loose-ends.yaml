metadata:
  name: v1-e34-t23-sync-loose-ends-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e34-caselist-sync
spec:
  description: >-
    Fix the seven loose ends and give two banners their own words.
  goalRef:
    name: v1-e34-t23-sync-loose-ends
  graph:
    nodes:
      - id: sync-loose-ends
        kind: Task
        name: Sync loose ends fixed
        description: >-
          The findings, the fsyncs, the runs table, the archive code, the torn manifest,
          the banners and the redaction.
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Pull tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application, -k, pull or sync or runs]
status:
  phase: Pending
