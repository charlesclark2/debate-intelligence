# validate-dev: the gate between dev and main (v1-e01-t10-validate-dev-gate).
#
# "Validated in dev" (docs/process/branching-and-environments.md) is a commit status with context
# `validate-dev`, and protect-main requires it green on a promotion's head commit. This workflow is
# what posts it, through scripts/validate_dev.py, and only ever on the commit whose pre-release it
# installed and tested:
#
#   resolve   posts `pending` on the commit, then finds the published vX.Y.Z-dev.N pre-release
#             whose tag points at exactly that commit;
#   smoke     checks out that commit, installs the pre-release with scripts/install_channel.sh into
#             a scratch uv tool directory (the installer verifies SHA256SUMS and the wheels'
#             provenance and refuses an incomplete build), asserts the installed
#             `debate-research --version --json` reports this commit, tag and channel dev, and runs
#             tests/smoke's recorded tier against that installed binary, offline; with `live`, also
#             the canary tier;
#   slow      checks out the same commit and runs the offline slow tier from source,
#             pytest -m "slow and not live and not eval and not operator_data": the suites tasks
#             mark `slow` to keep them out of the PR `ci` check (working agreement 1). The parser
#             evaluation (`eval`) is left out because it needs the evaluation corpus, which by policy
#             never reaches a runner, so here it could only skip, and a skip fails a tier. It runs on
#             the operator's Mac before any promotion containing a parser change (v1-e31-t05).
#             `operator_data` is left out for the same reason: data only the operator's machine
#             holds, such as the tub's own search index (v1-e01-t34);
#             The tier includes the search pages' browser suite (packages/debate_api/tests/browser,
#             v1-e39-t06), so the job installs Playwright's Chromium first: without it every browser
#             test errors, and the tier fails (PM ruling 2026-10-21, v1-e39-t06 Q1). For the same
#             reason it pulls the pilot function's arm64 base image, the one scripts/tub_deploy.sh
#             --print-base-image names, for the SQLite checks that run inside it (v1-e01-t34);
#   image     builds the weekly cloud run's image from the same pre-release, as the operator's
#             scripts/caselist_run_deploy.sh --dry-run builds it (v1-e40-t03, ADR-0020 (1)): for
#             linux/arm64, natively on GitHub's arm64 runner, checked offline by
#             ops/caselist_run/check_image.sh. Then, inside that image, it runs
#             tests/smoke/test_caselist_pull.py against the installed build there: `caselist pull`
#             against the S3 and OpenCaselist stand-ins, on loopback inside the container. No AWS
#             account, no OpenCaselist and no credential are involved; the build reaches PyPI and
#             Docker's registries, as any image build does. An arm64 runner rather than buildx
#             under QEMU, because the build runs Python (the install's rehearsal, `doctor`) and the
#             smoke check runs the CLI and its parse workers, and emulated Python is several times
#             slower;
#   conclude  posts `success` on the commit the installed build reported, only when every job
#             passed and that commit, and both test trees, are the one requested. Anything else posts
#             `failure` (`error` if the run was cancelled) on the requested commit. Then, for a run
#             from dev that posted the status, a failure opens an issue labelled `validate-dev` or
#             comments on the open one, and a success closes it: a red validate-dev went unseen for
#             days from 2026-10-20, because nothing but the status said so (v1-e01-t34).
#
# In any tier a skipped test fails the tier: a check skipped for a missing fixture did not run.
#
# Triggers:
#   * workflow_dispatch (sha, tag, live): dev-prerelease.yml dispatches this after publishing each
#     dev pre-release, with --ref dev, or --ref hotfix/<slug> for a hotfix head, which is validated
#     exactly like a dev head. A release created with GITHUB_TOKEN starts no workflow, so the
#     `release` trigger below never fires for those; the dispatch is the one event that token may
#     cause. A person can dispatch it too, for any commit with a published dev pre-release.
#   * release: prereleased, for a pre-release published by a person rather than by the workflow.
#   * schedule: nightly, against the head of dev (the default branch), so the slow tier keeps
#     running even on a quiet day. A nightly failure turns the head's status red, which is right:
#     the commit no longer validates.
#   * workflow_call, so v2-e12-t07 can call this and add the cloud suite; a caller that posts the
#     combined status itself sets leave_status_to_caller.
#
# The live canary tier runs only with the dispatch input `live: true` or the repository variable
# VALIDATE_DEV_LIVE set to `true`; it never calls OpenCaselist (tests/smoke/test_live_canary.py).
#
# SECURITY. Permissions are contents: read, statuses: write and issues: write, and nothing else.
# statuses: write is held only by `resolve` and `conclude`, and issues: write only by `conclude`,
# which run this workflow's own copy of the driver; the jobs that run the validated commit's tests
# hold contents: read alone, and the driver withholds GH_TOKEN from pytest, so the code under test
# can neither post its own status nor read the token. The issue's text is the commit, the tag,
# conclude's own description and the run's link, and nothing from the environment.
# No job is named `validate-dev`: a check run of that name would land on the workflow's own commit,
# which for a dispatch from dev is dev's head and not necessarily the commit validated.

name: Validate dev pre-release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose dev pre-release to validate
        required: true
        type: string
      tag:
        description: Its pre-release tag (vX.Y.Z-dev.N); found from the commit when left empty
        required: false
        type: string
        default: ""
      live:
        description: Also run the live canary tier
        required: false
        type: boolean
        default: false
  release:
    types: [prereleased]
  schedule:
    - cron: "23 7 * * *"
  workflow_call:
    inputs:
      sha:
        description: Full 40-character commit SHA whose dev pre-release to validate
        required: true
        type: string
      tag:
        description: Its pre-release tag; found from the commit when empty
        required: false
        type: string
        default: ""
      live:
        description: Also run the live canary tier
        required: false
        type: boolean
        default: false
      leave_status_to_caller:
        description: Post no validate-dev status; the calling workflow posts the combined one
        required: false
        type: boolean
        default: false
    outputs:
      tag:
        description: The pre-release tag that was installed
        value: ${{ jobs.resolve.outputs.tag }}
      installed_sha:
        description: The commit the installed build reported
        value: ${{ jobs.smoke.outputs.installed_sha }}
      state:
        description: success, failure or error
        value: ${{ jobs.conclude.outputs.state }}

permissions:
  contents: read

concurrency:
  group: validate-dev-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

env:
  # A dispatch or a call names the commit; a release event runs at the tag's commit; the nightly
  # schedule runs at the head of the default branch, dev. Comparisons are written `== true` so an
  # absent input (null) never counts as set.
  REQUESTED_SHA: ${{ inputs.sha || github.sha }}
  REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name || '' }}
  LIVE: ${{ (inputs.live == true || vars.VALIDATE_DEV_LIVE == 'true') && 'true' || 'false' }}
  POST_STATUS: ${{ inputs.leave_status_to_caller == true && 'false' || 'true' }}

jobs:
  resolve:
    name: find the pre-release and mark the commit pending
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Post pending on the commit, then find its published dev pre-release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- --sha "$REQUESTED_SHA"
          if [ -n "$REQUESTED_TAG" ]; then set -- "$@" --tag "$REQUESTED_TAG"; fi
          if [ "$POST_STATUS" = true ]; then set -- "$@" --post-status; fi
          python3 scripts/validate_dev.py resolve "$@"

  smoke:
    name: install the pre-release and run the smoke suite against it
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      installed_sha: ${{ steps.smoke.outputs.installed_sha }}
      tests_commit: ${{ steps.smoke.outputs.tests_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REQUESTED_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes no major-version tag
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: Install the locked workspace, for pytest and the fixture builders
        # The tests run from this checkout; the CLI they test is the installed pre-release.
        run: uv sync --locked --all-packages
      - name: Install the pre-release and run the smoke tiers against the installed binary
        id: smoke
        env:
          # install_channel.sh downloads the release assets with gh; the driver keeps the token
          # from pytest.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -- --sha "$REQUESTED_SHA" --tag "$TAG" --work-dir "$RUNNER_TEMP/validate-dev-smoke"
          set -- "$@" --report "$RUNNER_TEMP/validate-dev-smoke/report.json"
          if [ "$LIVE" = true ]; then set -- "$@" --live; fi
          python3 scripts/validate_dev.py smoke "$@"

  slow:
    name: run the offline slow tier from the same commit
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tests_commit: ${{ steps.slow.outputs.tests_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REQUESTED_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes no major-version tag
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: Install the locked workspace
        run: uv sync --locked --all-packages
      # The search pages' browser tests (v1-e39-t06) drive Chromium through Playwright. This installs
      # the build the locked Playwright names, and the system libraries it needs on the runner; the
      # tests then run offline, every page served in-process (PM ruling 2026-10-21, v1-e39-t06 Q1).
      - name: Install Playwright's Chromium for the browser tests
        run: uv run --locked playwright install --with-deps chromium
      # The DOCX renderer's open check (v1-e06-t04) converts a rendered file with LibreOffice headless.
      # Without soffice on the runner it skips, and a skip fails the tier (v1-e01-t10).
      - name: Install LibreOffice for the rendered-DOCX open check
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer
          soffice --version
      # Two SQLite checks run inside the pilot function's base image, for linux/arm64 as the function
      # runs (v1-e39-t02, v1-e39-t03). Without the image on the runner they skip, and a skip fails
      # the tier, which it did from 2026-10-20 (v1-e01-t34). scripts/tub_deploy.sh names the image
      # it builds on, from requires-python, so this pulls exactly that; the pull logs the digest it
      # got, and the inspect the platform. QEMU lets this x86-64 runner run the image's python3.
      - name: Set up QEMU, so the runner can run the arm64 Lambda image
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Pull the Lambda base image scripts/tub_deploy.sh builds on
        run: |
          base="$(scripts/tub_deploy.sh --print-base-image)"
          image="${base% *}"
          platform="${base#* }"
          docker pull --platform "$platform" "$image"
          docker image inspect --format "pulled {{.Os}}/{{.Architecture}} {{.RepoDigests}}" "$image"
      - name: Run pytest -m "slow and not live and not eval and not operator_data", offline
        id: slow
        run: python3 scripts/validate_dev.py slow --sha "$REQUESTED_SHA" --work-dir "$RUNNER_TEMP/validate-dev-slow"

  image:
    name: build the run image from the pre-release and pull against stand-ins inside it
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REQUESTED_SHA }}
          persist-credentials: false
      # uv, for the smoke check's own environment inside the image. The image itself carries no uv.
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes no major-version tag
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build and check the run image from the pre-release, for linux/arm64
        env:
          # gh downloads the release's wheels on the runner; the token never enters the build.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: scripts/caselist_run_deploy.sh dev "$TAG" --dry-run
      - name: Run caselist pull in the image against the S3 and OpenCaselist stand-ins
        # tests/smoke/test_caselist_pull.py against the image's own debate-research, with the
        # checkout mounted for the tests and an environment of their own under /tmp. A skipped
        # test fails this step, as it fails a validate-dev tier.
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/checkout" --workdir /checkout \
            --volume "$(command -v uv):/usr/local/bin/uv:ro" \
            --env HOME=/tmp/home --env USER=runner \
            --env UV_PROJECT_ENVIRONMENT=/tmp/check-venv \
            --env UV_PYTHON_INSTALL_DIR=/tmp/uv-python \
            --env UV_CACHE_DIR=/tmp/uv-cache \
            --env DEBATE_SMOKE_BIN=/opt/debate-research/bin/debate-research \
            --env DEBATE_SMOKE_EXPECT_SHA="$REQUESTED_SHA" \
            --env DEBATE_SMOKE_EXPECT_TAG="$TAG" \
            --entrypoint sh "debate-dev-caselist-run:$TAG" -c \
            'uv sync --locked --all-packages --quiet && uv run --locked --no-sync pytest tests/smoke/test_caselist_pull.py -m "not live and not in_process" --no-cov --junitxml=image-smoke.xml -p no:cacheprovider -rfEs'
          python3 scripts/validate_dev.py tier-report --name "image smoke" image-smoke.xml

  conclude:
    name: post the final validate-dev status
    needs: [resolve, smoke, slow, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      issues: write
    outputs:
      state: ${{ steps.conclude.outputs.state }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Post success on the installed commit, or failure on the requested one
        id: conclude
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          INSTALLED_SHA: ${{ needs.smoke.outputs.installed_sha }}
          SMOKE_COMMIT: ${{ needs.smoke.outputs.tests_commit }}
          SLOW_COMMIT: ${{ needs.slow.outputs.tests_commit }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          SLOW_RESULT: ${{ needs.slow.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -- --sha "$REQUESTED_SHA"
          set -- "$@" --job "resolve=$RESOLVE_RESULT" --job "smoke=$SMOKE_RESULT" --job "slow=$SLOW_RESULT"
          set -- "$@" --job "image=$IMAGE_RESULT"
          if [ -n "$TAG" ]; then set -- "$@" --tag "$TAG"; fi
          if [ -n "$INSTALLED_SHA" ]; then set -- "$@" --installed-sha "$INSTALLED_SHA"; fi
          if [ -n "$SMOKE_COMMIT" ]; then set -- "$@" --smoke-commit "$SMOKE_COMMIT"; fi
          if [ -n "$SLOW_COMMIT" ]; then set -- "$@" --slow-commit "$SLOW_COMMIT"; fi
          if [ "$POST_STATUS" = true ]; then set -- "$@" --post-status; fi
          python3 scripts/validate_dev.py conclude "$@"
      # Only for dev, and only when this run posted the status: a hotfix head, a tag's release
      # event or a caller that posts its own status is not dev's verdict. always(), because the
      # step above exits 1 on a failure, which is exactly when this has to run.
      - name: Open or update the validate-dev issue on a failure, close it on a success
        if: always() && steps.conclude.outputs.state != '' && env.POST_STATUS == 'true' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          STATE: ${{ steps.conclude.outputs.state }}
          DESCRIPTION: ${{ steps.conclude.outputs.description }}
        run: |
          set -- --sha "$REQUESTED_SHA" --state "$STATE" --description "$DESCRIPTION"
          if [ -n "$TAG" ]; then set -- "$@" --tag "$TAG"; fi
          python3 scripts/validate_dev.py issue "$@"
      - name: Summary
        if: always()
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          INSTALLED_SHA: ${{ needs.smoke.outputs.installed_sha }}
          STATE: ${{ steps.conclude.outputs.state }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          SLOW_RESULT: ${{ needs.slow.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          {
            echo "### validate-dev: ${STATE:-not posted}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Requested commit | \`${REQUESTED_SHA}\` |"
            echo "| Pre-release | ${TAG:-none found} |"
            echo "| Installed build reported | \`${INSTALLED_SHA:-nothing}\` |"
            echo "| Jobs | resolve ${RESOLVE_RESULT}, smoke ${SMOKE_RESULT}, slow ${SLOW_RESULT}, image ${IMAGE_RESULT} |"
            echo "| Live canary tier | ${LIVE} |"
            echo "| Status posted by this run | ${POST_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
