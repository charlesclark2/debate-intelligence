spec:
  # Filed by the PM, 2026-11-09, from v1-e07-t10's follow-up (the PM's review, 2026-11-09).
  description: >-
    test_search_presenter.py's stand-in Crossref answers "not asked" without the pacer, so the
    wrapper counts those answers as successes (`success_count == 3`), where the real adapter's
    health since v1-e07-t10 reads 1 answered and 2 not asked. Move the stand-in onto a `Pacer`
    from `debate_core.integrations.discovery.pace` (or build the case from the real adapter on
    its hand-written fixtures), on virtual time, so the health the test shows is the real one's.
    The footer lines it pins today stay as they are.
  priority: 3
  constraints:
    packages: [packages/debate_cli/tests]
    forbidden:
      - A live provider call or a real sleep in a test
      - A change to the footer's text
  context:
    - kind: TaskRef
      name: v1-e07-t10-time-waiting-on-a-pace-is-not-a-failure
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The stand-in's provider health reads as the real adapter's (answered and not asked
        counted apart) while the footer it pins is unchanged, by the test shown failing
        first against today's stand-in.
status:
  phase: Pending
