# EPIC E24 — Opponent Data Integrations
# Major version: V3 | Release: v3.3 (Opponent data integrations)
# Architecture refs: §7 OpponentTable, §9 Opponent data, §13 Opponent intelligence, §14, §19
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v3-e24-opponent-data
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v3
    debate/release: v3.3
    debate/epic: v3-e24-opponent-data
  annotations:
    debate/title: E24 — Opponent Data Integrations
    debate/architecture-refs: §7 OpponentTable, §9 Opponent data, §13 Opponent intelligence, §14, §19
spec:
  description: >-
    Ingest public OpenCaselist disclosures and Tabroom results through documented interfaces with provenance,
    resolve team identities, and govern data use.
  priority: 16
  constraints:
    majorVersion: v3
    release: v3.3
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      OpenCaselist and Tabroom public data are ingested via documented/public interfaces respecting terms
      and rate limits.
  - id: ac2
    description: >-
      Every stored assertion carries source_url and retrieved_at; admins can remove records.
  - id: ac3
    description: >-
      Team/debater identities are normalized across sources.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
