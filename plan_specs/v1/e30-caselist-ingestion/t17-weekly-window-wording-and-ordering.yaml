# TASK v1-e30-t17-weekly-window-wording-and-ordering - No text calls a weekly archive cumulative, and import ordering is checked against the window model
# Epic: E30 Caselist Evidence Ingestion | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e30-t17-weekly-window-wording-and-ordering
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e30-caselist-ingestion
  annotations:
    debate/title: "No text calls a weekly archive cumulative, and import ordering is checked against the window model"
spec:
  # Filed by the PM, 2026-10-11, from v1-e30-t10's Follow-up work 5.
  description: >-
    A weekly archive holds about a week's editing; the complete archive is the cumulative copy
    (docs/data/caselist-backfill-2026-09.md). v1-e30-t10 corrected the import service's opening
    paragraph, and policy 1.6 the policy. About twenty other places still say weekly archives
    are cumulative, among them the line `caselist remove` prints for the confirmation to the
    requester ("next week's cumulative archive cannot bring any of it back"), the removal
    runbook's introduction, and `SnapshotOutOfOrder`'s message. In `import_service.py` the
    Ordering section still reasons from cumulative weeklies, and nobody has checked what an
    out-of-order import does under the window model. That may be wrong in behaviour, not only in
    wording. Out of scope: the data-use policy, which is the PM's to change.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks, docs/data]
    forbidden:
      - A change to what a removal or an import does, unless the ordering investigation shows a defect, which is then shown failing first
  context:
    - kind: TaskRef
      name: v1-e30-t10-removal-docstrings-and-residue
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A search for 'cumulative' and its variants across packages, docs and runbooks is in
        the report. Every hit that describes a weekly archive is corrected, and every hit
        that describes the complete archive is kept.
    - id: ac2
      description: >-
        The line printed for the confirmation to the requester is still true and no longer
        calls the weekly archive cumulative, by test.
    - id: ac3
      description: >-
        The ordering investigation: what an import does when a weekly archive arrives after
        a later one, and when a complete archive arrives between weeklies, each on a
        synthetic fixture. The result is in the report. Any defect is fixed, shown failing
        first. The Ordering section and `SnapshotOutOfOrder` are rewritten to match.
status:
  phase: Pending
---
