# TASK v1-e39-t08-card-download - Download a card or a small file as Verbatim .docx through the E33 writer
# Epic: E39 — Team Evidence Search (Student Pilot) | Release: v1.7 (Team evidence search pilot) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e39-t08-card-download
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.7
    debate/epic: v1-e39-evidence-search-pilot
  annotations:
    debate/title: "Download a card or a small file as Verbatim .docx through the E33 writer"
spec:
  # Filed by the PM, 2026-10-19, from Charlie's direction of 2026-10-19 (a student search pilot before the
  # semester ends, on Chromebooks, signing in with a username, password and 2FA, outside the school's systems).
  description: >-
    Download .docx on a card page and for a selection (a cart of up to 30 cards held in the
    session) builds a Verbatim file through the E33 `EvidenceFileWriter` port, reading sources
    from `raw/` with the existing `SnapshotStore`, with the provenance line and sidecar exactly
    as `files build` writes them. A refused card (READBACK_MISMATCH, UNSUPPORTED_CONTENT) is
    named with a plain reason, and the student can drop it and build the rest. A card whose
    source is suppressed is never offered. The file is streamed back as an attachment and
    nothing is written to the bucket. When the function's parser version is not the index
    manifest's, download is switched off with a message, never failed card by card. Each
    download writes v1-e39-t07's audit record.
    (PM amendment 2026-10-19.) A function URL buffers at most 6 MB of response (ADR-0019, Lambda
    quotas). A downloaded file is kept under that limit with headroom, or the route streams it;
    a cart that would exceed the cap is refused before building, with a plain message, never
    failed at the response.
    (PM amendment 2026-10-20, from v1-e33-t06's Follow-up 3.) The writer reading the bucket is
    given `source_stores`, one `SnapshotStore` per `raw/` prefix (`raw/caselist/<slug>` and
    `raw/openev/<year>`), so camp cards download as caselist cards do.
  priority: 2
  constraints:
    packages: [debate_api, debate_core.application, packages/debate_api/tests]
    forbidden:
      - Writing to `exports/` or any other prefix
      - A second card writer beside E33's
      - Card text, a school, team code, file name, student name, username or email in any fixture, log, report or commit (synthetic values only)
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e39-t07-removal-audit-and-exposure
      relation: dependsOn
    - kind: TaskRef
      name: v1-e33-t02-lossless-card-writer
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A single card downloaded through the app route re-parses as its source, by test with
        a stubbed store.
    - id: ac2
      description: >-
        The cart cap, a refused card's message, and dropping it and building the rest work,
        by tests shown failing first.
    - id: ac3
      description: >-
        A parser-version mismatch switches download off with a message, by test; each
        download writes one audit record, by test.
    - id: ac4
      description: >-
        The operator opens a downloaded single card and a cart file in Word with Verbatim
        and imports one into Google Docs; reported yes or no (operator follow-up).
    - id: ac5
      description: >-
        (PM amendment 2026-10-19) A cart whose built file would pass the buffered-response
        limit is refused before building, or streamed, by test with a synthetic cart near
        the limit.
    - id: ac6
      description: >-
        (PM amendment 2026-10-20) A camp card downloads with its OpenEv line, read from its
        `raw/openev/<year>` store, by test with stubbed stores.
status:
  phase: Pending
---
