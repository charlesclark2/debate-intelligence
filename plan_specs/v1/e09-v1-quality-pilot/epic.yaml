  version: '1'
  graph:
    nodes:
    - id: ext-v1-e01-t02-github-remote
      kind: External
      name: 'Prerequisite from E01: Create GitHub repository, push, and protect main'
      description: >-
        Cross-epic prerequisite owned by v1-e01-repo-foundation (release v1.0).
      inputs:
        goalRef: v1-e01-t02-github-remote
        specRef: plan_specs/v1/e01-repo-foundation/t02-github-remote.yaml
    - id: ext-v1-e01-t04-ci-pipeline
      kind: External
      name: 'Prerequisite from E01: GitHub Actions CI pipeline'
      description: >-
        Cross-epic prerequisite owned by v1-e01-repo-foundation (release v1.0).
      inputs:
        goalRef: v1-e01-t04-ci-pipeline
        specRef: plan_specs/v1/e01-repo-foundation/t04-ci-pipeline.yaml
    - id: ext-v1-e05-t06-card-selection-contract
      kind: External
      name: 'Prerequisite from E05: CardSelection / MarkupSpan contract and prompts'
      description: >-
        Cross-epic prerequisite owned by v1-e05-model-router (release v1.1).
