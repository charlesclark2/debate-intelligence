spec:
  # Filed by the PM, 2026-11-12, from the operator's requests of 2026-11-12 and v1-e07-t20's amendment of the same day.
  description: >-
    On 2026-11-12 Semantic Scholar's HTTPS endpoint answered keyed requests with the
    unauthenticated 429 while HTTP answered them with results, and v1-e07-t20 adds an opt-in,
    providers.semantic_scholar_insecure_http, for the operator alone. Blocked until Semantic
    Scholar confirms keyed HTTPS works and one keyed HTTPS request by curl (the key on standard
    input) answers 200; the PM then sets it to Pending. Then: remove the opt-in setting (an
    existing credentials file that still sets it is refused at load with the setting's name and
    the cure, delete the line), the adapter asks HTTPS only, the prod profile enables
    semantic_scholar, and the guides drop the HTTP sentences.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.integrations.discovery, config/profiles, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/guides]
    forbidden:
      - The key sent over plain HTTP
      - A live provider call in a test
  context:
    - kind: TaskRef
      name: v1-e07-t20-semantic-scholar-enabled-after-its-live-smoke
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        No setting or code path asks Semantic Scholar over HTTP, a credentials file still
        setting the opt-in is refused naming it, and both profiles enable semantic_scholar,
        by tests shown failing first.
status:
  phase: Blocked
