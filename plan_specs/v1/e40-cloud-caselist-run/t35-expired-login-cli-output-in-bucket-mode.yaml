# TASK v1-e40-t35-expired-login-cli-output-in-bucket-mode - A cloud run refused for an expired login names the Wednesday login in its own output too
# Epic: E40 — Weekly Caselist Run in the Cloud | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e40-t35-expired-login-cli-output-in-bucket-mode
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
