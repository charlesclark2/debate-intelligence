spec:
  # Filed by the PM, 2026-11-01, from v1-e40-t25's Follow-ups 1 and 2 (the PM's review, 2026-11-01).
  description: >-
    After v1-e40-t25, four messages still tell a bucket-mode reader to act on this machine: the
    stopped-run, mixed-failure and backlog banners of the run's email, and the CLI's "run the
    same command again". In bucket mode each names the next cloud run instead, as t25's hints
    do. And the S3 adapter's login hint is `aws sso login` whatever runs it, so every record
    reason a cloud run writes for a missing session tells the task to sign in by hand; the
    composition root passes the adapter a hint for the run's environment, so a cloud run's
    reasons name the task role and the cloud runbook's "A run that found no AWS session". Local
    mode's words are unchanged. This is the last bucket-mode wording task the PM files unless a
    run's email shows another.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.integrations, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks]
    forbidden:
      - A local-mode message changed
      - A key removed or renamed in a --json envelope
      - Network or AWS access in any test
  context:
    - kind: TaskRef
