# TASK v1-e08-t05-search-command — `debate-research search` command
# Epic: E08 Federated Research Workflows | Release: v1.4 (Federated research from the CLI) | Major: V1
# Architecture refs: §11 CLI commands and V1 acceptance criteria, §6 SearchService, §9, §15 (partial results)
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e08-t05-search-command
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.4
    debate/epic: v1-e08-research-workflows
  annotations:
    debate/title: "`debate-research search` command"
    debate/architecture-refs: §6, §9, §11, §15
spec:
  description: >-
    Ship `debate-research search "<query>"` with --since, --until, --max-results, --argument, --need,
    --providers, --expand-llm, --format table|json and --save. The command builds a SearchRequest, calls
    SearchService (expand → fan-out → normalize → rank) and renders a Rich table (rank, title, publisher/
    venue, date, source type, access hint, short explanation) or JSON of SearchResults with full feature
    vectors. A provider status footer lists each provider's outcome (ok, timeout, error, breaker open, not
    configured) so partial results are never silent. Exit codes: 0 results returned, 6 partial results, 7
    no results or all providers failed, 2 usage error. Boundaries: no cutting (t06), no digests (t07); the
    CLI contains no ranking or dedupe logic.
    (PM amendment 2026-10-21, from v1-e08-t01's PM review.) The container builds
    `FederatedSearchService` from `ProviderRegistry.from_settings` through the
    `DiscoveryProviders` port. The overall deadline is a new setting,
    `providers.search_deadline_seconds`, default 15, beside `timeout_seconds`; the status footer
    reads the outcome's `provider_health`.
    (PM amendment 2026-10-22, from the PM reviews of v1-e07-t02, v1-e07-t05, v1-e08-t02 and
    v1-e08-t03.) The container registers `openalex_factory`, `feed_factory` and
    `google_news_factory` (the feed providers over `load_feed_directory(config/feeds)`, with a
    `FileFeedCache` on `<storage.data_dir>/feeds/`), and closes every provider when the search
    ends (`aclose` through the registry or `ResilientProvider`). debate-cli requires
    `debate-core[http,feeds]`, so `debate_cli.installation` reports a missing extra. The service
    is built with `normalize=DedupeStage()` and
    `rank=FederatedRankStage(load_federated_ranking_config( FEDERATED_RANKING_CONFIG_PATH),
    clock=...)`. Ranked candidates become stored results here: each is matched to an Article by
    `find_by_canonical_url`, or saved as a discovery-only Article with access `UNKNOWN`, never
    fetched; the session decides whether a canonical URL is unique per owner and records it.
    `state.results` then holds `search_result_for(...)` for each, and `SearchOutcome` exposes
    `ranked_candidates` for the table and the JSON output (identifiers, provider sources, the
    seven features and the explanation). Once the command runs on real providers, the coach
    labels the results of one query per format on the topics current then, and the report
    records nDCG@10 ranked against provider order; a lower ranked figure opens a weight-tuning
    ticket and does not block this task (v1-e08-t03's PM review).
    (PM amendment 2026-11-01, from v1-e08-t04's PM review.) Wire v1-e08-t04's expansion: map
    `--argument`, `--need`, `--topic` (a topic preset id), `--var NAME=VALUE` (for example `bill=`) and
    `--expand-llm` onto `ExpansionRequest`; build `QueryExpansionStage` from
    `load_argument_taxonomy(ARGUMENT_TAXONOMY_PATH)`, with a guard only when `--expand-llm` is given;
    and print the expansion's warning when it has one. `UnknownExpansionChoice` exits 2, a usage error,
    because it is a choice the person typed, and its message lists the valid choices. `Search` is a
    `DomainEntity` and now carries the optional `expansion` field, so a stored search that has one is
    refused by a build from before v1-e08-t04. Say whether any installed build reads stored searches
    across builds. If one does, make that read tolerate the field and prove it with an earlier build's
    offline wheel, as the caselist tasks do; if none does, say so in the report.
  priority: 1
  constraints:
    # PM amendment 2026-10-22: registration, Article matching and the outcome live in debate_core.
    packages: [debate_cli, debate_core.application, debate_core.integrations.discovery, packages/debate_cli/tests, packages/debate_core/tests, packages/debate_cli/pyproject.toml, uv.lock, config/argument_taxonomy.yaml]
    forbidden:
      - Business logic (ranking, dedupe, expansion) in debate_cli
      - Hiding provider failures when results are partial
      - Live provider calls in CLI tests (recorded fixtures via registry override)
  context:
    - kind: TaskRef
      name: v1-e08-t03-feature-ranking
      relation: dependsOn
    - kind: TaskRef
      name: v1-e08-t04-argument-need-expansion
      relation: dependsOn
    - kind: TaskRef
      name: v1-e07-t02-openalex-adapter
      relation: dependsOn
    - kind: TaskRef
      name: v1-e07-t05-rss-news-adapter
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        `search "midterm elections" --since 2026-09-14 --max-results 20` on recorded fixtures prints at most
        20 ranked, deduped rows and a provider status footer, exiting 0.
    - id: ac2
      description: >-
        `search "health insurance" --argument politics-da --need link --format json` emits a JSON array
        whose items include rank, score, features, explanation, identifiers and provider sources.
    - id: ac3
      description: >-
        When a fixture provider times out, output is marked PARTIAL, the footer names the provider and
        reason, and the exit code is 6.
    - id: ac4
      description: >-
        Invalid --argument/--need values or since > until exit 2 with the list of valid choices, and
        `search --help` documents every flag.
    # PM amendment 2026-10-22
    - id: ac5
      description: >-
        The container registers the OpenAlex, feed and Google News providers and closes
        them, ranked candidates become stored results through Article matching without a
        fetch, and the JSON output carries each result's features and explanation, by tests
        on recorded fixtures.
    # PM amendment 2026-10-22
    - id: ac6
      description: >-
        The coach's labels on one real query per format are recorded with nDCG@10 ranked
        against provider order (operator); a lower ranked figure is ticketed, not a failure.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e08-t05-search-command-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.4
    debate/epic: v1-e08-research-workflows
spec:
  description: >-
    Options and wiring, then presenters (table, JSON, footer), then fixture-driven CLI tests.
  goalRef:
    name: v1-e08-t05-search-command
  graph:
    nodes:
      - id: command-options
        kind: Task
        name: Typer command, options and validation
        description: >-
          Define all flags with date parsing and choice validation from the taxonomy; wire SearchService via
          the CLI service factory.
        outputs: [packages/debate_cli/src/debate_cli/commands/search.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: command_succeeds
            name: search help renders
            command: uv
            args: [run, debate-research, search, --help]
      - id: presenters
        kind: Task
        name: Rich table, JSON output and provider footer
        description: >-
          Render results table and provider status footer on stdout/stderr appropriately; JSON mode prints
          only JSON to stdout.
        dependsOn: [command-options]
        outputs: [packages/debate_cli/src/debate_cli/presenters/search_presenter.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Presenter tests pass
            command: uv
            args: [run, pytest, packages/debate_cli/tests/test_search_command.py, -k, presenter]
      - id: cli-fixture-tests
        kind: Task
        name: CLI tests on recorded provider fixtures
        description: >-
          CliRunner tests for full, partial, empty and invalid-input cases with a fixture-backed registry.
        dependsOn: [presenters]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: search command tests pass offline
            command: uv
            args: [run, pytest, packages/debate_cli/tests/test_search_command.py]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
status:
  phase: Pending
