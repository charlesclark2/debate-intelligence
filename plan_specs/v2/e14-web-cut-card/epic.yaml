# EPIC E14 — Web App Shell & Cut-a-Card
# Major version: V2 | Release: v2.1 (Async jobs & web Cut-a-Card)
# Architecture refs: §4 Web frontend/UI, §12 Cut a Card
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e14-web-cut-card
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v2
    debate/release: v2.1
    debate/epic: v2-e14-web-cut-card
  annotations:
    debate/title: E14 — Web App Shell & Cut-a-Card
    debate/architecture-refs: §4 Web frontend/UI, §12 Cut a Card
spec:
  description: >-
    Build the Next.js application, authentication UX, hosting, and the first end-to-end web workflow:
    paste a URL, get a verified card, edit within provenance rules, export.
  priority: 6
  constraints:
    majorVersion: v2
    release: v2.1
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      Students sign in and reach an authenticated workspace on a hosted environment.
  - id: ac2
    description: >-
      Cut-a-Card shows job progress, explicit failure states, and opens the editor only after verification.
  - id: ac3
    description: >-
      The editor enforces deletion/markup/bracketed-only edits and exports DOCX or copies rich text.
status:
  phase: Pending
