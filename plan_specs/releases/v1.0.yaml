# RELEASE v1.0 — Foundation & verified evidence core
# Major version: V1. Epics: E01, E02, E03
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: release-v1-0
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.0
  annotations:
    debate/title: v1.0 — Foundation & verified evidence core
spec:
  description: >-
    Repo, tooling, CI, promotion flow, task tooling, domain core, and deterministic evidence verification
    exist; `debate-research verify` works on JSON manifests.
  priority: 1
  acceptanceCriteria:
  - id: epic-e01
    description: >-
      Epic E01 (Repository & Delivery Foundation) goal is Succeeded.
  - id: epic-e02
    description: >-
      Epic E02 (Domain Core: Entities, Ports & Local Persistence) goal is Succeeded.
  - id: epic-e03
    description: >-
      Epic E03 (Evidence Integrity & Verification Engine) goal is Succeeded.
  - id: tagged
    description: >-
      Release tag v1.0.0 is pushed and CHANGELOG.md has a v1.0 section.
  - id: gate
    description: >-
      Gate release-v1-0-gate is approved.
  # Close-out path, set by the PM on 2026-10-14 and updated at the v1.0 close-out, 2026-10-15.
  # Done: every E01, E02 and E03 task Succeeded, the three epics set Succeeded, CHANGELOG.md
  # created with a v1.0.0 section, and the package versions bumped from 0.1.0 to 1.0.0 so that
  # dev builds are `v1.0.0-dev.N` from here. What is left:
  #   1. A promotion of dev into main, with this close-out in it. The Gate's review starts on it:
  #      the demo of `debate-research verify` end to end and no evidence-integrity regression.
  #   2. The annotated tag v1.0.0 on the promotion's merge commit on main, and a GitHub release
  #      whose notes are CHANGELOG.md's v1.0.0 section. It has no assets: the stable install
  #      channel is v1-e09-t06's. The Gate's last check is `ci` green on the tagged commit.
  #   3. Straight after the tag, one PM pull request into dev: the versions bumped to 1.1.0 (until
  #      it merges every dev build is refused, because v1.0.0 is released; see
  #      scripts/release_version.py), the Gate's approval recorded, and this Goal Succeeded.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Gate
metadata:
  name: release-v1-0-gate
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.0
spec:
  gateType: review
  description: >-
    Release review for v1.0 (Foundation & verified evidence core): demo the release goal end to end, confirm
    CI green on the release tag, and confirm no evidence-integrity regressions.
  reviewers:
  - user:charlie
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: release-v1-0-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v1
    debate/release: v1.0
spec:
  description: >-
    Release plan for v1.0: complete its epics, tag, and pass the release gate.
  goalRef:
    name: release-v1-0
  series: v1
  version: v1.0
  graph:
    nodes:
    - id: e01
      kind: External
      name: Epic E01 — Repository & Delivery Foundation
      inputs:
        goalRef: v1-e01-repo-foundation
        specRef: plan_specs/v1/e01-repo-foundation/epic.yaml
    - id: e02
      kind: External
      name: 'Epic E02 — Domain Core: Entities, Ports & Local Persistence'
      inputs:
        goalRef: v1-e02-domain-core
        specRef: plan_specs/v1/e02-domain-core/epic.yaml
    - id: e03
      kind: External
      name: Epic E03 — Evidence Integrity & Verification Engine
      inputs:
        goalRef: v1-e03-evidence-integrity
        specRef: plan_specs/v1/e03-evidence-integrity/epic.yaml
    - id: tag-release
      kind: Task
      name: Tag and publish v1.0.0
      description: >-
        Update CHANGELOG.md, bump package versions, create the git tag, and publish release notes.
      dependsOn:
      - e01
      - e02
      - e03
      acceptanceCriteria:
      - type: command_succeeds
        name: Release tag exists
        command: git
        args:
        - rev-parse
        - v1.0.0
    - id: release-review
      kind: Gate
      name: v1.0 release review
      dependsOn:
      - tag-release
      gateRef:
        name: release-v1-0-gate
status:
  phase: Pending
