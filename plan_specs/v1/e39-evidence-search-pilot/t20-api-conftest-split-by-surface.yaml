# TASK v1-e39-t20-api-conftest-split-by-surface - The pilot API's test world split by surface, so a change selects only the tests it reaches
# Epic: E39 — Team Evidence Search (Student Pilot) | Release: v1.7 (Team evidence search pilot) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e39-t20-api-conftest-split-by-surface
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.7
    debate/epic: v1-e39-evidence-search-pilot
  annotations:
    debate/title: "The pilot API's test world split by surface, so a change selects only the tests it reaches"
spec:
  # Filed by the PM, 2026-10-27, from v1-e01-t32's follow-up work (the API conftest).
  description: >-
    19 of the API's 24 test files use the `world` fixture, which needs almost everything, and
    the conftest builds its corpus at import, so `affected_tests.py` cannot narrow the API tests
    however a change is read (v1-e01-t32: 15 of one merge's 25 API files came through `world`, 5
    through module code). Split `PilotWorld` by surface (search, download, landscape, auth),
    each a fixture of its own, and build the corpus in a fixture, not at import. No test's
    assertions change, and the collected count is unchanged.
  priority: 3
  constraints:
    packages: [packages/debate_api/tests]
    forbidden:
      - An assertion changed or a test removed
  context:
    - kind: TaskRef
      name: v1-e01-t32-test-selection-reach-round-three
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The collected ids are unchanged, and t32's measurement over the same merges selects
        fewer API files, recorded in the report.
status:
  phase: InProgress
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e39-t20-api-conftest-split-by-surface-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.7
    debate/epic: v1-e39-evidence-search-pilot
spec:
  description: >-
    Split the API test world by surface and build the corpus in a fixture.
  goalRef:
    name: v1-e39-t20-api-conftest-split-by-surface
  graph:
    nodes:
      - id: api-world-split
        kind: Task
        name: API world split
        description: >-
          Split the API test world by surface and build the corpus in a fixture.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: API tests pass
            command: uv
            args: [run, pytest, packages/debate_api/tests]
status:
  phase: Pending
