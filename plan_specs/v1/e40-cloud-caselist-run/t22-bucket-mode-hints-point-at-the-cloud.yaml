    build for the weekly agent"). In bucket mode, decided as v1-e40-t18 decides it (the details'
    `bucket_run`, the service's `bucket_mode`), each names what the cloud run's operator does
    instead, or says it is the PM's. Local mode keeps its wording. Tidy the pending reason's
    `").;` join while there.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks]
    forbidden:
      - A bucket-mode hint naming a command that publishes from the operator's working copy
      - A record shape an earlier build refuses to read
      - Network or AWS access in any test
  context: []
  acceptanceCriteria:
    - id: ac1
