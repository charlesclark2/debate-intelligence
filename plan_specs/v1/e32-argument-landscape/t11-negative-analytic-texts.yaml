# TASK v1-e32-t11-negative-analytic-texts - Counterplan texts, kritik alternatives and overviews in the landscape report
# Epic: E32 Argument Landscape Reports | Release: v1.2 (Argument landscape & file building) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e32-t11-negative-analytic-texts
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e32-argument-landscape
  annotations:
    debate/title: "Counterplan texts, kritik alternatives and overviews in the landscape report"
spec:
  # Filed by the PM, 2026-10-24, from the coach's review of the first Policy report, 2026-10-24 (v1-e32-t03).
  description: >-
    The coach asked for each CP's text, each K's alternative or role of the ballot, and each
    position's overview. These are analytics, which the parsed store does not keep (v1-e32-t03
    counted 1 CP text card in 322 CP documents), the same finding as plan texts in v1-e32-t09.
    Reuse t09's raw re-read and its derived cache (never text in the cache) rather than a parser
    change: counts first, per kind, of documents with a CP-text, alternative, role-of-the-ballot
    or overview label and the paragraph under it, sent to the PM with the proposed labels before
    building. Then show, per CP and per K, the distinct texts with the number of teams reading
    each, quoted word for word as data-use policy 1.13 allows (never beside a school or team
    code), and per position its most common overview. The report stays on the operator's machine
    and in the private `reports/` prefix.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_core.arguments, debate_core.domain, tests/fixtures/landscape, packages/debate_core/tests]
    forbidden:
      - A school, team code or debater's name beside any card or text in a report, fixture, log or commit
      - Card text, plan or counterplan text in a committed file or fixture (synthetic values only)
      - Network or AWS access in any test
      - Model calls (deterministic only; model stages are v1-e32-t07's)
  context:
    - kind: TaskRef
      name: v1-e32-t09-policy-plan-texts
      relation: dependsOn
    - kind: TaskRef
      name: v1-e32-t03-landscape-report
      relation: dependsOn
  # PM rulings on ac1's counts, 2026-10-24 (session report, "The PM's rulings, applied"):
  # 1. (b) with a guard: CP texts by label, plus the first should analytic of a block whose nearest
  #    placed heading is a CP, READS; at most 12 words before should and an actor phrase among them,
  #    the actor list in config (config/landscape/analytic_texts/), never in Python.
  # 2. The label lists as proposed, with what they leave out; a kind that shows almost nothing is
  #    reported, not dropped; the report states how many alternative labels it could not place.
  # 3. (c), counts only, the coach's decision: overviews per position, both sides, as teams with one;
  #    no overview text in the cache or the report (data-use policy 1.13 does not list them).
  # 4. The top 3 distinct texts per CP and K with their team counts, then "and N more texts, read by
  #    M teams".
  # 5. The cache key: source digest, parser version, the digest of the labels, rules and actor list,
  #    and the taxonomy positions and overrides.
  # Also: quoting under policy 1.13 (report.md only, never beside a school or team code, a text naming
  # a school withheld and counted); mutants on the withholding rule, the placement rule and the guard;
  # the dry run without --publish records the scan's hits by section; the first cache fill is an
  # operator block, and the PM coordinates the first publish.
  acceptanceCriteria:
    - id: ac1
      description: >-
        Counts before any rule, per kind, of documents with a CP-text, alternative,
        role-of-the-ballot or overview label and the paragraph under it, sent to the PM with
        the proposed labels.
    - id: ac2
      description: >-
        After the ruling, on synthetic sources, the report shows each CP's and K's distinct
        texts with their team counts and each position's most common overview, matching
        hand-written golden files; a text never stands beside a school or team code; tests
        shown failing first.
status:
  phase: InProgress
