    Draw the current-session boundary once, use it for the open-items check, and prove it with
    fixtures.
  goalRef:
    name: v1-e01-t24-partial-open-items-current-session
  graph:
    nodes:
      - id: current-session-open-items
        kind: Task
        name: Open items from the current session only
        description: >-
          The boundary, the check, the fixtures and the walk over existing reports.
        estimatedEffort: 1.5h
        acceptanceCriteria:
          - type: test_passes
            name: Task tooling tests pass
            command: uv
            args: [run, pytest, tests/scripts]
status:
  phase: Pending
