# EPIC E19 — Production Readiness, Privacy & Safety
# Major version: V2 | Release: v2.4 (Production readiness & school rollout)
# Architecture refs: §14, §15, §19
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e19-production-readiness
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v2
    debate/release: v2.4
    debate/epic: v2-e19-production-readiness
  annotations:
    debate/title: E19 — Production Readiness, Privacy & Safety
    debate/architecture-refs: §14, §15, §19
spec:
  description: >-
    Add quotas, audit logs, account export/deletion and retention, backups/restore drills, cost telemetry,
    load/security testing and a privacy/legal review before school-wide use.
  priority: 12
  constraints:
    majorVersion: v2
    release: v2.4
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      Per-user quotas and throttles bound model and search cost; per-feature cost is visible.
  - id: ac2
    description: >-
      Audit logs, account export/deletion and configurable retention exist.
  - id: ac3
    description: >-
      Backups are restore-tested; load and security reviews pass.
  - id: ac4
    description: >-
      A privacy/legal review (COPPA/FERPA applicability, privacy policy, terms) is completed and approved
      before rollout.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e19-production-readiness-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v2
    debate/release: v2.4
    debate/epic: v2-e19-production-readiness
spec:
  description: >-
    Task graph for epic E19 (Production Readiness, Privacy & Safety). Each Task node points at its own
    task-level PlanSpec.
  goalRef:
    name: v2-e19-production-readiness
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e05-t07-usage-telemetry
      kind: External
      name: 'Prerequisite from E05: Token/cost telemetry and budgets'
      description: >-
        Cross-epic prerequisite owned by v1-e05-model-router (release v1.2).
      inputs:
        goalRef: v1-e05-t07-usage-telemetry
        specRef: plan_specs/v1/e05-model-router/t07-usage-telemetry.yaml
    - id: ext-v2-e10-t06-observability-baseline
      kind: External
      name: 'Prerequisite from E10: Observability baseline'
      description: >-
        Cross-epic prerequisite owned by v2-e10-aws-foundation (release v2.0).
      inputs:
        goalRef: v2-e10-t06-observability-baseline
        specRef: plan_specs/v2/e10-aws-foundation/t06-observability-baseline.yaml
    - id: ext-v2-e11-t02-dynamodb-tables
      kind: External
      name: 'Prerequisite from E11: DynamoDB tables in Terraform'
      description: >-
        Cross-epic prerequisite owned by v2-e11-cloud-persistence (release v2.0).
      inputs:
        goalRef: v2-e11-t02-dynamodb-tables
        specRef: plan_specs/v2/e11-cloud-persistence/t02-dynamodb-tables.yaml
    - id: ext-v2-e11-t04-s3-snapshot-store
      kind: External
      name: 'Prerequisite from E11: S3 snapshot and export store'
      description: >-
        Cross-epic prerequisite owned by v2-e11-cloud-persistence (release v2.0).
      inputs:
        goalRef: v2-e11-t04-s3-snapshot-store
        specRef: plan_specs/v2/e11-cloud-persistence/t04-s3-snapshot-store.yaml
    - id: ext-v2-e12-t03-authn-authz
      kind: External
      name: 'Prerequisite from E12: Authentication, roles and tenancy'
      description: >-
        Cross-epic prerequisite owned by v2-e12-identity-api (release v2.0).
      inputs:
        goalRef: v2-e12-t03-authn-authz
        specRef: plan_specs/v2/e12-identity-api/t03-authn-authz.yaml
    - id: ext-v2-e12-t04-api-deploy
      kind: External
      name: 'Prerequisite from E12: API Gateway + ECS Fargate deployment'
      description: >-
        Cross-epic prerequisite owned by v2-e12-identity-api (release v2.0).
      inputs:
        goalRef: v2-e12-t04-api-deploy
        specRef: plan_specs/v2/e12-identity-api/t04-api-deploy.yaml
    - id: ext-v2-e15-t06-index-rebuild
      kind: External
      name: 'Prerequisite from E15: Index rebuild from source of truth'
      description: >-
        Cross-epic prerequisite owned by v2-e15-search-index (release v2.2).
      inputs:
        goalRef: v2-e15-t06-index-rebuild
        specRef: plan_specs/v2/e15-search-index/t06-index-rebuild.yaml
    - id: ext-v2-e17-t02-library-api
      kind: External
      name: 'Prerequisite from E17: Library API'
      description: >-
        Cross-epic prerequisite owned by v2-e17-card-library (release v2.3).
      inputs:
        goalRef: v2-e17-t02-library-api
        specRef: plan_specs/v2/e17-card-library/t02-library-api.yaml
    - id: t01
      kind: Task
      name: Quotas and rate limits
      description: >-
        Per-user/org daily quotas for jobs and model spend, API Gateway throttles, user-facing quota messages.
      inputs:
        specRef: plan_specs/v2/e19-production-readiness/t01-quotas-rate-limits.yaml
        goalRef: v2-e19-t01-quotas-rate-limits
      dependsOn:
      - ext-v2-e12-t04-api-deploy
      - ext-v1-e05-t07-usage-telemetry
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e19-t01-quotas-rate-limits reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e19-t01-quotas-rate-limits
    - id: t02
      kind: Task
      name: Audit logging
      description: >-
        Append-only audit events for auth, card edits, shares, exports, admin actions; retention policy.
      inputs:
        specRef: plan_specs/v2/e19-production-readiness/t02-audit-logging.yaml
        goalRef: v2-e19-t02-audit-logging
      dependsOn:
      - ext-v2-e12-t03-authn-authz
      - t04
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e19-t02-audit-logging reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e19-t02-audit-logging
    - id: t03
      kind: Task
      name: Account export, deletion and retention
      description: >-
        Self-service data export, account deletion across DynamoDB/S3/OpenSearch, configurable retention
        jobs.
      inputs:
        specRef: plan_specs/v2/e19-production-readiness/t03-account-lifecycle.yaml
        goalRef: v2-e19-t03-account-lifecycle
      dependsOn:
      - ext-v2-e17-t02-library-api
      - ext-v2-e15-t06-index-rebuild
      - t04
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e19-t03-account-lifecycle reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e19-t03-account-lifecycle
    - id: t04
      kind: Task
      name: Privacy and legal review
      description: >-
        Data inventory, minimization review for minors, COPPA/FERPA applicability assessment with counsel,
        privacy policy and terms, school/parent consent approach.
      inputs:
        specRef: plan_specs/v2/e19-production-readiness/t04-privacy-legal-review.yaml
        goalRef: v2-e19-t04-privacy-legal-review
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e19-t04-privacy-legal-review reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e19-t04-privacy-legal-review
    - id: t05
      kind: Task
      name: Backups and restore drill
      description: >-
        Verify PITR, S3 versioning, export manifests; run and document a restore drill; RTO/RPO targets.
      inputs:
        specRef: plan_specs/v2/e19-production-readiness/t05-backups-dr.yaml
        goalRef: v2-e19-t05-backups-dr
      dependsOn:
      - ext-v2-e11-t02-dynamodb-tables
      - ext-v2-e11-t04-s3-snapshot-store
      - ext-v2-e15-t06-index-rebuild
      - t03
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e19-t05-backups-dr reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e19-t05-backups-dr
    - id: t06
      kind: Task
      name: Cost telemetry dashboard
      description: >-
        Per-feature model/search/infra cost metrics and alarms using token telemetry and cost allocation
        tags.
      inputs:
        specRef: plan_specs/v2/e19-production-readiness/t06-cost-dashboard.yaml
        goalRef: v2-e19-t06-cost-dashboard
      dependsOn:
      - ext-v2-e10-t06-observability-baseline
      - ext-v1-e05-t07-usage-telemetry
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e19-t06-cost-dashboard reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e19-t06-cost-dashboard
    - id: t07
      kind: Task
      name: Load and security testing
      description: >-
        Load test key workflows, OWASP ASVS-lite review, dependency and container scanning, remediation.
      inputs:
        specRef: plan_specs/v2/e19-production-readiness/t07-load-security-testing.yaml
        goalRef: v2-e19-t07-load-security-testing
      dependsOn:
      - t01
      - t02
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e19-t07-load-security-testing reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e19-t07-load-security-testing
status:
  phase: Pending
