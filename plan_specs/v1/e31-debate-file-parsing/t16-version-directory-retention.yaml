# TASK v1-e31-t16-version-directory-retention - Superseded parsed-store version directories are retired, locally and in both buckets
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t16-version-directory-retention
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: "Superseded parsed-store version directories are retired, locally and in both buckets"
spec:
  # Filed by the PM, 2026-10-11, from v1-e31-t06's and v1-e31-t09's Follow-up work, and the 2026-10-11 re-parse.
  description: >-
    A parser or profile version change writes a new version directory and leaves the old one.
    After the 2026-10-11 re-parse `2026.09.20-docx-1` (about 5.8 GB per place) is superseded.
    The operator deleted it from the dev data directory by hand; copies remain in the dev and
    prod buckets. Define and build retention: which directory is current, how long a superseded
    one is kept, and a command that lists and, with confirmation, removes superseded directories
    locally and in a bucket, respecting the data-use policy's retention section. The dry run of
    `caselist parse` for a new parser version also reports `new_version: false` and `superseded:
    null`, which read as if nothing new were starting: make the dry run say a new version
    directory will be started and which it supersedes. Ruled by the PM, 2026-10-15: the everyday
    permission set has no `s3:DeleteObject` by design, and only a takedown deletes. So retention
    does not delete in a bucket. The command tags a superseded directory's objects, and a
    lifecycle rule on parsed/ expires a tagged object's current version at its next run, and its
    noncurrent version after the grace period. Until that first run, caselist retire --restore
    undoes it. After it, and for the grace period, copying the noncurrent versions back does
    (amended by the PM, 2026-10-16: S3 counts Expiration from creation, so the grace runs on
    noncurrent versions). The everyday set gains
    `s3:PutObjectTagging` and `s3:GetObjectTagging` on `parsed/` only. Locally the command
    deletes the directory, with confirmation. Out of scope: removal requests, which delete every
    version already.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.integrations.local, debate_core.integrations.s3, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, infrastructure/modules/evidence_bucket, docs/runbooks, docs/data]
    forbidden:
      - Removing the current version directory, or any directory without a dry run and a confirmation
      - Using the takedown profile for retention
      - Granting `s3:DeleteObject` or `s3:DeleteObjectVersion` to the everyday permission set, or any grant outside `parsed/`
      - Applying a Terraform change in a session (the operator applies, after the PM has read the plan)
  context:
    - kind: TaskRef
      name: v1-e31-t06-parse-pipeline
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A retention rule is written in docs/data/parsed-card-store.md, consistent with the
        data-use policy's retention section, and the command lists superseded directories in
        a dry run.
    - id: ac2
      description: >-
        With confirmation the command removes a superseded directory locally and tags its
        objects in a bucket for the lifecycle rule, and refuses the current one, by test
        against moto (amended by the PM, 2026-10-15: tag, not delete, in a bucket). A lifecycle
        rule on parsed/ expires a tagged object's current version at its next run, and its
        noncurrent version after the grace period. Until that first run, caselist retire
        --restore undoes it. After it, and for the grace period, copying the noncurrent
        versions back does (amended by the PM, 2026-10-16: S3 counts Expiration from creation,
        so the grace runs on noncurrent versions).
    - id: ac3
      description: >-
        The dry run for a new parser version says a new directory will be started and names
        the one it supersedes, shown failing first.
    - id: ac4
      description: >-
        Operator-run, after the merge: `2026.09.20-docx-1` retired under the rule in the dev
        and prod buckets (it is already gone from the dev data directory), and
        `2026.10.10-docx-2` retired in the dev data directory and in both buckets, each listed
        in a dry run first, counts recorded (amended by the PM, 2026-10-16: since the
        2026-10-16 re-parse `2026.10.10-docx-2` is superseded too).
    - id: ac5
      description: >-
        Added by the PM, 2026-10-15: the evidence bucket module gains the lifecycle rule on
        `parsed/` for tagged objects and the two tagging grants on `parsed/` for the everyday
        set, held by the module's tests (no delete grant added, none outside `parsed/`). The
        dev and prod `terraform plan` outputs are operator-run and read by the PM before the
        operator applies.
status:
  phase: InProgress
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e31-t16-version-directory-retention-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
spec:
  description: >-
    A retention rule and command for superseded version directories, and an honest dry run.
  goalRef:
    name: v1-e31-t16-version-directory-retention
  graph:
    nodes:
      - id: retention
        kind: Task
        name: Version directories retired
        description: >-
          The rule, the command, the dry-run wording and the operator's retirement.
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Parse tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application, -k, parse or retention]
status:
  phase: Pending
