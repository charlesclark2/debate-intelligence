# TASK v1-e41-t22-per-user-credentials-file-and-a-missing-working-folder - Keys come from a per-user file in any folder, and a deleted working folder no longer crashes a command
# Epic: E41 — Delivery Tooling Upkeep | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e41-t22-per-user-credentials-file-and-a-missing-working-folder
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.8
    debate/epic: v1-e41-delivery-tooling-upkeep
  annotations:
    debate/title: "Keys come from a per-user file in any folder, and a deleted working folder no longer crashes a command"
spec:
  # Filed by the PM, 2026-11-05, from v1-e07-t13's question 2 (the PM's ruling, 2026-11-05).
  description: >-
    The CLI reads `.env` only from the checkout's root or the working folder, so the operator
    keeps the provider keys and the contact email in one smoke folder and must run live searches
    from there; and on 2026-11-05 a command run from a removed worktree crashed with
    FileNotFoundError from `Path.cwd()`. As ruled on v1-e07-t13's Q2: (a) settings also read a
    per-user `~/.debate-research/<env>.env` (the environment's name, as the data directory uses
    it) holding credentials only (the provider keys and the contact email; say which settings
    those are and refuse any other name in it); (b) the file is refused, with a message naming
    the fix, when its group or others can read it; (c) no command writes it yet; (d) the reading
    lives in `debate_core.application`'s settings. Propose its place in the existing order of
    sources (environment variables, the working folder's `.env`, the checkout's `.env`, the
    profile) and stop for the PM's ruling. `config show` names each credential's source with its
    value masked, and `doctor` gains a row per provider that never fails: "no contact email:
    Crossref's public pool", "no GovInfo key: GovInfo not asked". A working folder that no
    longer exists is read as no working-folder `.env`, with one warning line, never a crash. The
    runbooks that send the operator to the smoke folder for live searches say the per-user file
    instead.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks, docs/guides]
    forbidden:
      - A credential's value in a test, a log, an output or an error
      - A command that writes the file
      - Reading a file its group or others can read
      - A live network call in a test
  context:
    - kind: TaskRef
      name: v1-e07-t13-profiles-enable-the-providers-that-passed-their-smoke
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The file's place in the order of sources is ruled on by the PM, and settings read it
        as ruled, refusing a readable-by-others file and any name that is not a credential,
        by tests with invented values shown failing first.
    - id: ac2
      description: >-
        `config show` names each credential's source, masked, `doctor` reports each
        provider's missing key or email without failing, and a deleted working folder gives
        a warning instead of a crash, by tests shown failing first.
status:
  phase: Succeeded
