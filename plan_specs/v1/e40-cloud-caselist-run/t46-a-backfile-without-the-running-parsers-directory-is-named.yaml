spec:
  # Filed by the PM, 2026-11-06, from v1-e40-t16's follow-up (the PM's ruling Q4, 2026-11-06).
  description: >-
    Nothing re-parses a backfile after a parser bump, and nothing says so: the weekly run parses
    only the caselists it follows, and the weekly index leaves backfiles out until v1-e39-t18.
    `caselist runs --remote` (or `doctor`, as the proposal argues) names each backfile whose
    parsed store has no directory at the running build's parser version, with the version it
    does hold, by tests on synthetic stores.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests]
    forbidden:
      - Network or AWS access in a test
  context: []
  acceptanceCriteria:
    - id: ac1
      description: >-
        Each backfile with no directory at the running parser version is named with the
        version it holds, by tests on synthetic stores shown failing first.
status:
  phase: Pending
