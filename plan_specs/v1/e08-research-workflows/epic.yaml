      dependsOn:
      - t05
      - ext-v1-e06-t06-cut-command
      - ext-v1-e05-t07-usage-telemetry
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e08-t06-auto-cut reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e08-t06-auto-cut
    - id: t07
      kind: Task
      name: '`debate-research daily` digests'
