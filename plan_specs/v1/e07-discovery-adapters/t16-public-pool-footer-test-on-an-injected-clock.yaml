---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e07-t16-public-pool-footer-test-on-an-injected-clock
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.4
    debate/epic: v1-e07-discovery-adapters
  annotations:
    debate/title: "The public-pool footer test counts its results on an injected clock, not the real one"
spec:
  # Filed by the PM, 2026-11-05, from v1-e41-t18's follow-up 2 (the PM's review, 2026-11-05).
  description: >-
    `packages/debate_cli/tests/test_search_command.py::test_on_the_committed_profile_without_a_c
    ontact_email_crossref_names_the_public_pool_in_the_footer` (from v1-e07-t13) depends on the
    real clock: how many Crossref queries fit under the public pool's pace of one query a second
    before the deadline decides how many results it sees. It failed dev's push run of `6db251b`
    (the `[dev]` case: expected 1 result, got 2), passed on the dispatch at `440f797`, and
    failed locally on v1-e41-t18's branch (the `[prod]` case: expected 2, got 1). A failed part
    also costs dev its durations refresh (v1-e41-t17's rule). Give the pace and the deadline an
    injected clock in this test, so the count is fixed, and say what the test now proves. Then
    list, by test name and count only, any other test whose outcome waits on a provider's real
    pace or a real deadline, and fix each the same way, or name it for the PM.
    (PM amendment 2026-11-05, the narrowing and rulings it was built to.) The footer test's pacer
    was put on PacerTime by v1-e32-t49 (def4453) to unblock dev; this task removed the unused moving_clock
    field, put the footer test's loop on virtual time, swept every test whose outcome can wait on real
    time (by reading and by recording every timer armed on a real loop), and fixed eleven functions;
    three tests became v1-e31-t38, v1-e40-t45 and v1-e41-t24.
  priority: 2
  constraints:
    packages: [debate_cli, debate_core.application, debate_core.integrations, packages/debate_cli/tests, packages/debate_core/tests]
    forbidden:
      - A live provider call in a test
      - A sleep or a retry added to make a test pass
      - Loosening an assertion to accept either count
  context:
    - kind: TaskRef
      name: v1-e07-t13-profiles-enable-the-providers-that-passed-their-smoke
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The public-pool footer test runs on an injected clock and gives one count every run,
        shown by repeated runs at both profiles; any other test waiting on a real pace or
        deadline is fixed or named for the PM.
status:
  phase: Succeeded
