    Re-list raw/ and parsed/ versions after deleting, and stop incomplete if any survived.
  goalRef:
    name: v1-e30-t29-removal-confirms-raw-and-parsed-deletes
  graph:
    nodes:
      - id: relist-after-delete
        kind: Task
        name: Re-list after deleting
        description: >-
          Re-list raw/ and parsed/ versions after deleting, and stop incomplete if any
          survived.
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Removal tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests, -k, removal]
status:
  phase: Pending
