spec:
  # Filed by the PM, 2026-11-01, from v1-e08-t04's question 4 (the PM's ruling, 2026-11-01).
  description: >-
    v1-e08-t04's taxonomy has five needs (uniqueness, link, internal link, impact, answers),
    which fit DAs, advantages and framing but not counterplans or kritiks. A counterplan's
    research is solvency, net benefit and competition; a kritik's is link, impact, alternative
    and framework. Give the taxonomy needs per argument family, and propose the shape (a needs
    set per family, validated so that each argument's pairs are complete within its family). Add
    the generic counterplans and kritiks the Policy landscape names, under the landscape's ids,
    with templates in the coach's terms, and mark them for the coach's review (operator). The
    existing arguments and their templates are unchanged.
    (PM amendment 2026-11-02, the coach's review of v1-e08-t04.) Widened to framing arguments, and
    raised to p2. A framework has no uniqueness or internal link: the question is whether it is good or
    not. Give a framing family its own needs, for example "framework good" and "answers", with no
    window, since philosophy evidence doesn't go stale. Reshape util, deontology, structural violence and
    cost-benefit into it, and give theory a family of its own (interpretation, standards, voters,
    answers). The coach's content, to be written as templates for his review:
    - **Util:** whether utilitarianism is good or not as a framework; predictions good or not good;
      predictions accurate or inaccurate; util inevitable.
    - **Deontology:** whether deontology is good or bad as a framework; for example, deontology allows
      better policy making.
    - **Structural violence:** whether structural violence should be evaluated above other consequences
      or not. Answers: war turns structural violence; economic decline turns structural violence;
      structural violence is inevitable; structural violence can't be solved.
    - **Cost-benefit:** in the framing family, the same shape as util. The coach's own wording is asked
      for at review.
    
    The arguments the coach reviewed (every DA and advantage, taxonomy 1.1.0) are unchanged.
  priority: 2
  constraints:
    packages: [config/argument_taxonomy.yaml, debate_core.domain, debate_core.application, packages/debate_core/tests]
    forbidden:
      - A change to an existing argument's templates or windows
      - A template holding a resolution or topic wording not taken from a committed file
      - Live model calls in tests
  context:
    - kind: TaskRef
      name: v1-e08-t04-argument-need-expansion
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The taxonomy validates needs per family, every counterplan and kritik has a template
        for each need of its family, and the added ids match the landscape's, by tests shown
        failing first; the coach reviews them (operator).
