# TASK v2-e10-t01-aws-account-baseline — AWS account baseline
# Epic: E10 AWS & Infrastructure-as-Code Foundation | Release: v2.0 (Cloud platform foundation) | Major: V2
# Architecture refs: §4, §5 AWS services, §14 least privilege / encryption, §15 cost controls
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e10-t01-aws-account-baseline
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.0
    debate/epic: v2-e10-aws-foundation
  annotations:
    debate/title: AWS account baseline
    debate/architecture-refs: §4, §5, §14, §15
spec:
  description: >-
    Establish the AWS account structure that every later V2 resource lands in: an AWS Organization with
    separate dev and prod member accounts (two environments only, per ADR-0013; or, if cost forces it, one
    account with strict environment tagging recorded in an ADR), IAM Identity Center users for the coach
    and any adult maintainers, root-account lockdown, an organization CloudTrail, and budgets with billing
    alarms. It also records the primary-region decision based on Bedrock availability of the models the
    ModelRouter routes to (Claude Sonnet 5, Claude Haiku 4.5, Titan Text Embeddings V2, Cohere Rerank
    3.5). This task is a small, largely manual bootstrap captured as a runbook plus minimal Terraform; it
    does NOT create remote state or environment modules (t02), CI roles (t03), KMS/Secrets (t04) or
    networking (t05). Students never receive AWS console or IAM access.
  priority: 1
  constraints:
    packages: [infrastructure/bootstrap, docs/runbooks, docs/adr]
    forbidden:
      - Long-lived IAM user access keys for humans or CI
      - Root-account access keys or day-to-day use of the root user
      - Granting AWS console/IAM access to student users (who may be minors)
      - Committing account ids, emails or credentials beyond what the runbook needs (use placeholders)
  acceptanceCriteria:
    - id: ac1
      description: >-
        An ADR records the primary AWS region and the evidence behind it: a table showing Bedrock
        on-demand or inference-profile availability for every model id in the ModelRouter routing config.
    - id: ac2
      description: >-
        dev and prod accounts (or the ADR-approved single-account alternative) exist under an
        Organization; root users have MFA and no access keys; humans sign in only via IAM Identity Center.
    - id: ac3
      description: >-
        An organization-wide multi-region CloudTrail writes to a dedicated, versioned, private S3 bucket
        with log-file validation enabled.
    - id: ac4
      description: >-
        AWS Budgets exist per account with alert thresholds at 50/80/100% of a documented monthly cap,
        plus a Cost Anomaly Detection monitor, all notifying the coach's email.
    - id: ac5
      description: >-
        docs/runbooks/aws-account-baseline.md lets another engineer reproduce the baseline step by step
        and lists the manual steps that are intentionally not in Terraform.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e10-t01-aws-account-baseline-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.0
    debate/epic: v2-e10-aws-foundation
spec:
  description: >-
    Decide the region first (it constrains everything else), then create the organization and identity
    baseline, turn on audit and cost guardrails, and finish with a reproducible runbook.
  goalRef:
    name: v2-e10-t01-aws-account-baseline
  graph:
    nodes:
      - id: region-adr
        kind: Task
        name: Primary region ADR from Bedrock availability
        description: >-
          Check Bedrock model access and cross-region inference profiles for every model id in the
          ModelRouter routing config, compare candidate regions (e.g. us-east-1, us-west-2) on
          availability, price and OpenSearch Serverless support, and record the decision.
        outputs: [docs/adr/0010-primary-aws-region.md]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Region ADR exists with a model availability table
            path: docs/adr/0010-primary-aws-region.md
            contentMatch: "Bedrock"
      - id: org-and-identity
        kind: Task
        name: Organization, accounts and IAM Identity Center
        description: >-
          Create the Organization and environment accounts, enable IAM Identity Center with permission
          sets (AdministratorAccess break-glass, PowerUser for maintainers, ReadOnly), enforce MFA, and
          lock down root users.
        dependsOn: [region-adr]
        outputs: [infrastructure/bootstrap/organization/main.tf]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: command_succeeds
            name: Organization bootstrap Terraform validates
            command: terraform
            args: [-chdir=infrastructure/bootstrap/organization, validate]
          - type: custom
            name: Root MFA and no root access keys confirmed
            description: >-
              Coach confirms in the IAM credential report for each account that root has MFA enabled and
              no active access keys.
      - id: cloudtrail
        kind: Task
        name: Organization CloudTrail
        description: >-
          Create an organization trail (all regions, management events, log-file validation) into a
          private, versioned, SSE-encrypted log bucket with block public access.
        dependsOn: [org-and-identity]
        outputs: [infrastructure/bootstrap/organization/cloudtrail.tf]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: CloudTrail definition enables log-file validation
            path: infrastructure/bootstrap/organization/cloudtrail.tf
            contentMatch: "enable_log_file_validation = true"
      - id: budgets
        kind: Task
        name: Budgets, billing alarms and anomaly detection
        description: >-
          Define per-account monthly budgets with 50/80/100% alerts, a Cost Anomaly Detection monitor
          and subscription, and a Bedrock-specific usage budget for early warning on model spend.
        dependsOn: [org-and-identity]
        outputs: [infrastructure/bootstrap/organization/budgets.tf]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: Budgets are defined in Terraform
            path: infrastructure/bootstrap/organization/budgets.tf
            contentMatch: "aws_budgets_budget"
      - id: runbook
        kind: Task
        name: Account baseline runbook
        description: >-
          Write the runbook covering manual steps (Organization creation, root MFA, Identity Center
          user invites), region rationale, and where budgets/alerts route.
        dependsOn: [cloudtrail, budgets]
        outputs: [docs/runbooks/aws-account-baseline.md]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: artifact_exists
            name: Runbook exists
            path: docs/runbooks/aws-account-baseline.md
            contentMatch: "IAM Identity Center"
          - type: custom
            name: Coach walkthrough of the baseline
            description: >-
              Coach signs in through Identity Center to each environment and confirms a test budget
              alert email was received.
status:
  phase: Pending
