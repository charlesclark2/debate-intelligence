# TASK v1-e31-t10-incremental-aggregate-rebuild - The weekly aggregate rebuild costs what the week added, not the whole store
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t10-incremental-aggregate-rebuild
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: "The weekly aggregate rebuild costs what the week added, not the whole store"
spec:
  # Filed by the PM, 2026-10-11, from v1-e34-t17's Follow-up work 1.
  description: >-
    Every pull that parses now rebuilds each touched caselist's aggregates from the whole store.
    On 2026-10-11 the rebuild alone took 314, 193, 473 and 71 s (hsld26, hspf26, hspolicy26,
    openev). hspolicy26 gained about 640 DOCX sources a week over the last three weeks; if the
    rebuild is proportional to the store it reaches 900 s for one caselist within about four
    weeks, and v1-e31-t06 noted it can be worse than proportional. Measure first how the rebuild
    scales (on synthetic stores of several sizes, and the real figures already recorded), and
    where its time goes: clustering, linking, writing. Then make the weekly rebuild's cost track
    the week's new sources: an incremental placement that gives the same occurrence table as a
    full rebuild. A full rebuild stays available and is what a parser or fingerprint version
    change does. Out of scope: the matching rules themselves.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_core.evidence, debate_core.integrations.local, packages/debate_core/tests, scripts, docs/data]
    forbidden:
      - An incremental rebuild whose occurrence table differs from a full rebuild's on the same store
      - Real card text in any fixture, log or report
  context:
    - kind: TaskRef
      name: v1-e34-t17-pull-parses-new-sources
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The scaling is measured on synthetic stores of at least three sizes and reported
        with where the time goes, before any change.
    - id: ac2
      description: >-
        An incremental rebuild after a week's new sources gives an occurrence table equal,
        row for row, to a full rebuild of the same store, by a property test over generated
        weeks, including a week that merges two existing clusters and one that a removal
        shrank.
    - id: ac3
      description: >-
        On the largest synthetic store, an incremental rebuild for a week of 5% new sources
        takes under a quarter of the full rebuild's time, reported with the figures.
    - id: ac4
      description: >-
        Operator-run: the next weekly run's parse stage duration, and a by-hand full
        rebuild, recorded in docs/data/caselist-parse-report.md.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e31-t10-incremental-aggregate-rebuild-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
spec:
  description: >-
    Measure the rebuild's scaling, then make the weekly rebuild incremental with a full rebuild
    as its oracle.
  goalRef:
    name: v1-e31-t10-incremental-aggregate-rebuild
  graph:
    nodes:
      - id: incremental-rebuild
        kind: Task
        name: Incremental aggregate rebuild
        description: >-
          The measurement, the incremental placement, its equivalence proof and the
          operator figures.
        estimatedEffort: 6h
        acceptanceCriteria:
          - type: test_passes
            name: Card stats tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests, -k, card_stats or rebuild or occurrence]
status:
  phase: Pending
