# TASK v1-e08-t18-auto-cut-report-names-per-run - An auto-cut run's report does not replace the last run's in the same directory
# Epic: E08 Federated Research Workflows | Release: v1.4 (Federated research from the CLI) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e08-t18-auto-cut-report-names-per-run
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.4
    debate/epic: v1-e08-research-workflows
  annotations:
    debate/title: "An auto-cut run's report does not replace the last run's in the same directory"
spec:
  # Filed by the PM, 2026-11-04, from v1-e08-t06's follow-up (the PM's review, 2026-11-03).
  description: >-
    `search --auto-cut` writes report.json beside the bundle under that fixed name, so a second
    run into the same directory replaces the first run's report. Name the report after the
    bundle (`<bundle>.report.json`) or add a `--report PATH` option, propose which, and keep the
    bundle's own manifest beside it as today. Tests on fixtures.
    (PM amendment 2026-11-09, from v1-e08-t07's follow-up.) `daily --auto-cut` writes its
    report.json into the digest directory under the same fixed name, so each day's run replaces the
    last day's report, and a `search --auto-cut` into the same folder does too. The naming chosen
    here covers both commands.
  priority: 3
  constraints:
    packages: [debate_cli, debate_core.application, packages/debate_cli/tests, docs/guides]
    forbidden:
      - Business logic in debate_cli
      - A live network or model call in a test
  context:
    - kind: TaskRef
      name: v1-e08-t07-daily-command
      relation: dependsOn
    - kind: TaskRef
      name: v1-e08-t06-auto-cut
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Two auto-cut runs into one directory keep both reports, by a test shown failing
        first, and the guide names the report's file.
status:
  phase: Pending
