# TASK v1-e29-t08-takedown-preflight-identity - The takedown preflight refuses the everyday profile before it writes anything
# Epic: E29 Cloud Evidence Store | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e29-t08-takedown-preflight-identity
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e29-cloud-evidence-store
  annotations:
    debate/title: "The takedown preflight refuses the everyday profile before it writes anything"
spec:
  # Filed by the PM, 2026-10-11, from v1-e30-t10's Follow-up work 3 and 7.
  description: >-
    Before v1-e29-t06, the takedown preflight's first step listed object versions, which the
    everyday profile could not do, so naming that profile by mistake failed before anything was
    written. v1-e29-t06 gave the everyday profile read-only `ListBucketVersions` under the
    removable prefixes. By the operator policy's text the everyday profile now lists, writes the
    preflight probe under `manifests/_suppression/preflight/`, and is refused only at the
    delete, leaving the probe. Nothing deletes a leftover probe. This was read from the policy
    and the code; moto does not enforce IAM. Restore the guarantee: the preflight's first step
    is one only the takedown role can pass, before any write. For example, the caller identity
    checked against the takedown role. Also correct the grant's stated purpose: the comment in
    `operator_access.tf` and docs/runbooks/evidence-store.md say the listing exists so a dry run
    can count versions, and `caselist status` uses it too since v1-e30-t10. Out of scope: the
    grants themselves.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_core.integrations.s3, debate_cli, infrastructure/modules/evidence_bucket, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks]
    forbidden:
      - A change to any IAM grant or policy statement
      - An account id, role ARN or SSO name in code, tests, docs or the report
  context:
    - kind: TaskRef
      name: v1-e29-t06-removal-grant-scope-test
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The preflight's first step refuses a caller that is not the takedown role, before
        any write, by test with a stubbed identity.
        `test_removal_profile_without_delete_rights_fails_preflight_with_nothing_deleted[everyday]`
        is restored to its meaning and passes.
    - id: ac2
      description: >-
        A preflight run with the takedown role behaves as today, by test.
    - id: ac3
      description: >-
        The removal runbook says how to delete a probe a previous preflight left, and the
        report says whether any exist in dev or prod by an operator-run listing of the probe
        prefix (counts only).
    - id: ac4
      description: >-
        The comment in operator_access.tf and docs/runbooks/evidence-store.md name both uses
        of the listing grant. The comment change is docs-only, and `terraform plan` shows no
        change (operator-run).
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e29-t08-takedown-preflight-identity-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
