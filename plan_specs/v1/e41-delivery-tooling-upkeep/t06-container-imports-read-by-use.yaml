spec:
  # Filed by the PM, 2026-11-01, from v1-e01-t43's PM question 1 (b) and Follow-up 3 (the PM's review, 2026-11-01).
  description: >-
    v1-e01-t43 reads a container.py change by part, but any change to a top-level import is the
    whole file, so four of the six measured merges, v1-e40-t21's among them, stay whole. When
    the set of modules the container's top-level imports load is the same on both sides, nothing
    new runs on import and only names are rebound: read such a change by the parts that use the
    names it binds. An import that loads a module not loaded before stays the whole file. Also
    read a `"debate_cli.container.X"` string (a `monkeypatch.setattr` target) as reaching part
    `X`, or the whole file when `X` is an import, instead of every part.
  priority: 3
  constraints:
    packages: [scripts, tests/scripts]
    forbidden:
      - A test that reaches a changed part left unselected
  context:
    - kind: TaskRef
      name: v1-e01-t43-container-diff-read-part-by-part
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        t43's six merges re-measured: af7052e's edit alone selects fewer files, an import
        loading a new module is still the whole file, and a `debate_cli.container.X` string
        reaches part `X`; every after-list is a subset of before; tests shown failing first.
status:
  phase: Succeeded
