spec:
  # Filed by the PM, 2026-10-19, from v1-e34-t26's Follow-up work 1 to 3.
  description: >-
    (1) Nothing redoes a report-stage check an expired session cut short: `--publish-pending`
    could compare the snapshots the newest run published but did not confirm, whose names are in
    the publish stage's work today and in no file. (2) The publish stage's count leaves out a
    manifest it uploads: a republish that uploads only the manifest says `0 object(s) uploaded
    across 1 snapshot(s)`. (3) A report-only pending run's record outcome is still `completed`
    (t23's Follow-up 2); t26 fixed the banner and left the outcome.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_cli, packages/debate_core/tests, packages/debate_cli/tests, docs/runbooks]
    forbidden:
      - A record shape an earlier build refuses to read
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e34-t26-pending-work-and-banner-words
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        (1) to (3) each by a test shown failing first; the agent's build at the time reads
        every record this build writes.
status:
  phase: Succeeded
