    Read the store's and the build's style profile versions, and add them to the build's store
    refusal.
  goalRef:
    name: v1-e33-t09-style-profile-version-refusal
  graph:
    nodes:
      - id: style-profile-refusal
        kind: Task
        name: Style profile in the store refusal
        description: >-
          Read the store's and the build's style profile versions, and add them to the
          build's store refusal.
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: File build service tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/application/test_file_build_service.py]
