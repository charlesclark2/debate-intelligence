# EPIC E41 — Delivery Tooling Upkeep
# Major version: V1 | Release: v1.8 (Weekly caselist run in the cloud)
# Architecture refs: docs/process/working-agreements.md, docs/process/task-workflow.md
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e41-delivery-tooling-upkeep
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.8
    debate/epic: v1-e41-delivery-tooling-upkeep
  annotations:
    debate/title: E41 — Delivery Tooling Upkeep
    debate/architecture-refs: working agreements, task workflow
spec:
  # Created by the PM, 2026-11-01, from the dependency audit and Charlie's ruling: E01 belongs to the
  # released v1.0, so the CI, test-selection and spec tooling follow-ups filed since cannot name the
  # later tasks they follow from. They live here, in the current release, from now on.
  description: >-
    Keep the repository's delivery tooling sound while the season's releases ship: test selection,
    CI and its time limits, the spec validator and the task workflow, the build's stamps and its
    licence checks. Every task here follows from a finding in a later epic's work and names that task
    as its prerequisite. When v1.8 is tagged, any task still open here moves to the next release's
    upkeep epic.
  priority: 3
  constraints:
    majorVersion: v1
    release: v1.8
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      Every task filed here is Succeeded, or moved to the next release's upkeep epic when v1.8 is
      tagged.
status:
  phase: Pending
---
