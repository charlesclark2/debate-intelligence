# EPIC E30 — Caselist Evidence Ingestion
# Major version: V1 | Release: v1.1 (Caselist evidence store)
# Architecture refs: §9 (opponent data / OpenCaselist), §13 Opponent intelligence, §14, §19
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e30-caselist-ingestion
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e30-caselist-ingestion
  annotations:
    debate/title: E30 — Caselist Evidence Ingestion
    debate/architecture-refs: §9 (opponent data / OpenCaselist), §13 Opponent intelligence, §14, §19
spec:
  description: >-
    Import the OpenCaselist open-source archives (HS LD, Policy, PF) and OpenEv camp files that the
    operator downloads, deduplicate across snapshots, record provenance manifests, and
    publish sources to the S3 evidence store, under a written data-use policy.
  priority: 2
  constraints:
    majorVersion: v1
    release: v1.1
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      A data-use policy for OpenCaselist and OpenEv content (permitted uses, no public redistribution,
      handling of debater initials, attribution) is written and approved before any import is published
      or automated.
  - id: ac2
    description: >-
      `debate-research caselist import` turns a weekly archive or camp-file download into deduplicated
      source documents with School/Team/Side/Tournament/Round metadata and a manifest.
  - id: ac3
    description: >-
      Imported sources and manifests for LD, Policy, PF and OpenEv are in the dev and prod evidence buckets.
status:
  phase: Pending
---
