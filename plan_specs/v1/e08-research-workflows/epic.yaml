# EPIC E08 — Federated Research Workflows
# Major version: V1 | Release: v1.2 (Federated research from the CLI)
# Architecture refs: §6 SearchService, §9 Ranking pipeline, §11 CLI commands
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e08-research-workflows
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e08-research-workflows
  annotations:
    debate/title: E08 — Federated Research Workflows
    debate/architecture-refs: §6 SearchService, §9 Ranking pipeline, §11 CLI commands
spec:
  description: >-
    Fan out searches across providers, normalize/dedupe, rank with explainable features, expand queries
    by debate argument and need, and ship `search`, `--auto-cut` and `daily`.
  priority: 3
  constraints:
    majorVersion: v1
    release: v1.2
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      `debate-research search` supports --since/--until/--max-results/--argument/--need/--format and returns
      deduped, ranked results with feature explanations.
  - id: ac2
    description: >-
      Partial results surface when providers fail; source quality is expressed as features, not a truth
      score.
  - id: ac3
    description: >-
      `--auto-cut N` and `daily <topic> --date` produce verified cards and a failure report.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e08-research-workflows-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e08-research-workflows
spec:
  description: >-
    Task graph for epic E08 (Federated Research Workflows). Each Task node points at its own task-level
    PlanSpec.
  goalRef:
    name: v1-e08-research-workflows
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e04-t01-url-canonicalization
      kind: External
      name: 'Prerequisite from E04: URL canonicalization and identifier detection'
      description: >-
        Cross-epic prerequisite owned by v1-e04-article-retrieval (release v1.1).
      inputs:
        goalRef: v1-e04-t01-url-canonicalization
        specRef: plan_specs/v1/e04-article-retrieval/t01-url-canonicalization.yaml
    - id: ext-v1-e05-t04-prompt-registry
      kind: External
      name: 'Prerequisite from E05: Versioned prompt registry'
      description: >-
        Cross-epic prerequisite owned by v1-e05-model-router (release v1.1).
      inputs:
        goalRef: v1-e05-t04-prompt-registry
        specRef: plan_specs/v1/e05-model-router/t04-prompt-registry.yaml
    - id: ext-v1-e05-t05-structured-output-validation
      kind: External
      name: 'Prerequisite from E05: Structured output validation and repair'
      description: >-
        Cross-epic prerequisite owned by v1-e05-model-router (release v1.1).
      inputs:
        goalRef: v1-e05-t05-structured-output-validation
        specRef: plan_specs/v1/e05-model-router/t05-structured-output-validation.yaml
    - id: ext-v1-e05-t07-usage-telemetry
      kind: External
      name: 'Prerequisite from E05: Token/cost telemetry and budgets'
      description: >-
        Cross-epic prerequisite owned by v1-e05-model-router (release v1.1).
      inputs:
        goalRef: v1-e05-t07-usage-telemetry
        specRef: plan_specs/v1/e05-model-router/t07-usage-telemetry.yaml
    - id: ext-v1-e06-t06-cut-command
      kind: External
      name: 'Prerequisite from E06: `debate-research cut` command'
      description: >-
        Cross-epic prerequisite owned by v1-e06-card-cutting (release v1.1).
      inputs:
        goalRef: v1-e06-t06-cut-command
        specRef: plan_specs/v1/e06-card-cutting/t06-cut-command.yaml
    - id: ext-v1-e07-t01-search-provider-contract
      kind: External
      name: 'Prerequisite from E07: SearchProvider contract, health and circuit breaking'
      description: >-
        Cross-epic prerequisite owned by v1-e07-discovery-adapters (release v1.2).
      inputs:
        goalRef: v1-e07-t01-search-provider-contract
        specRef: plan_specs/v1/e07-discovery-adapters/t01-search-provider-contract.yaml
    - id: ext-v1-e07-t02-openalex-adapter
