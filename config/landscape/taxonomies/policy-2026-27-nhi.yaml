  # Topicality
  - id: nhi-t
    label: T-NHI
    kind: t
    side: neg
    description: The affirmative's plan is not national health insurance as the negative defines the term.
    aliases: [t nhi, topicality nhi]
  - id: multipayer-t
    label: T-multi-payer
    kind: t
    side: neg
    description: National health insurance means a system with more than one payer, so a single payer plan is not topical.
    aliases: [t multipayer, t multi payer]
  - id: single-payer-t
    label: T-single payer
    kind: t
    side: neg
    description: National health insurance means single payer, so a plan that keeps private insurers is not topical.
    aliases: [t single payer]
  - id: no-single-payer-t
    label: T-no single payer
    kind: t
    side: neg
    description: Single payer is not national health insurance, so a single payer plan is not topical.
    aliases: [t no single payer, t no singlepayer]
  - id: establish-t
    label: T-establish
    kind: t
    side: neg
