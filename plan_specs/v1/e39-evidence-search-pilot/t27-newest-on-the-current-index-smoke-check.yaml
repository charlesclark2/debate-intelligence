spec:
  # Filed by the PM, 2026-10-31, from v1-e39-t25's Follow-up work (the PM's review, 2026-10-31).
  description: >-
    v1-e39-t25 made `tub index publish --newest` on the index `current.json` already names write
    only `checked-against.json` (when what it read differs from the record) or refuse with
    `SEARCH_INDEX_ALREADY_CURRENT`, never the object, manifest or pointer. Its tests are
    in-process; no smoke check runs it on an installed build (agreement 5). Add one to
    tests/smoke/test_tub_index_smoke.py, in its style and on the S3 stand-in: build, publish,
    add a suppression entry that stops nothing, rebuild, `--newest` writes only the record
    (object versions counted on the stand-in), and `--newest` again is refused. The existing
    checks' pinned key sets stay as they are.
  priority: 3
  constraints:
    packages: [tests/smoke]
    forbidden:
      - Network or AWS access in a test
      - A pinned smoke key set changed
  context:
    - kind: TaskRef
      name: v1-e39-t25-identical-rebuild-skipped-and-newest-records
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        On the checkout's script and an installed build, `--newest` on the current index
        writes only `checked-against.json` under a longer list and is refused under the same
        list, with no new version of the object, manifest or pointer, shown failing first
        against a break.
status:
  phase: Pending
