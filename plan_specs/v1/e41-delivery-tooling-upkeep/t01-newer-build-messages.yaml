# TASK v1-e41-t01-newer-build-messages - When a newer build wrote the database or added a setting, the error says so
# Epic: E41 — Delivery Tooling Upkeep | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e41-t01-newer-build-messages
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.8
    debate/epic: v1-e41-delivery-tooling-upkeep
  annotations:
    debate/title: "When a newer build wrote the database or added a setting, the error says so"
spec:
  # Filed by the PM, 2026-10-22, from v1-e39-t06's Follow-up 7 and the agent check of 2026-10-22.
  description: >-
    Two errors puzzle an operator whose installed build is older than the checkout. A database
    migrated by a newer build raises `MigrationError` with no code and no way forward; it gains
    its own code and a hint naming both schema versions and the fix (sync the worktree, or
    install the newer build). A setting this build does not know, read from a `.env` in the
    working directory, fails as `Extra inputs are not permitted`; when the name matches a
    settings pattern this build reserves (for example `providers.*_api_key`), the hint says a
    newer build may define it, and that running from another folder or upgrading fixes it. The
    typo protection stays: an unknown name is still refused.
    (PM amendment 2026-10-26, from v1-e33-t09's follow-up 2.) `files build`'s refusal of a store
    read by another parser version says "re-parse with this build" even when the store's parser
    is newer, and that re-parse writes a directory that sorts below the newer one, so the build
    refuses again. When the store's parser version is newer than the build's, the hint says to
    install the newer build instead. Style profile versions have no order, so when only the
    profile differs the hint names both and says which way to go depends on which build is
    newer, never asserting one.
    (PM note 2026-11-01, the dependency audit.) Moved from E01 as `v1-e01-t33-newer-build-messages`, unstarted: E01 belongs
    to the released v1.0, and this task's prerequisites ship later.
  priority: 3
  constraints:
    packages: [debate_core.application, debate_core.integrations, debate_cli, packages/debate_core/tests, packages/debate_cli/tests]
    forbidden:
      - Accepting an unknown setting
      - A secret's value in an error or a hint
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e39-t06-search-pages
      relation: dependsOn
    - kind: TaskRef
      name: v1-e33-t09-style-profile-version-refusal
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        A database at a newer schema version is refused with its own code and a hint naming
        both versions, by test shown failing first.
    - id: ac2
      description: >-
        An unknown setting is still refused, and one in a reserved pattern gets the
        newer-build hint, by tests shown failing first.
    - id: ac3
      description: >-
        Added by the PM, 2026-10-26. A store read by a newer parser version is refused with
        a hint to install the newer build, an older one keeps the re-parse hint, and a store
        under another style profile gets a hint naming both without asserting which is
        newer; tests shown failing first.
status:
  phase: InProgress
---
