spec:
  # Filed by the PM, 2026-10-16, from the operator's by-eye checks of 2026-10-16.
  description: >-
    A debater who stops reading a card in a round marks the place, and files carry the mark into
    later copies: a short line such as "Marked 10:42" inside or at the end of the evidence. The
    parser keeps it as evidence text, so two copies of one card differ by the marker, and a
    reader of the card sees a line that is not the author's. Count marker lines by form and
    position (end of body, inside it) per caselist, from the operator's corpus. Then decide with
    the PM: the marker must not be deleted from what the snapshot holds (evidence is addressed
    by offsets into the snapshot), so the choice is between recording it as a marker beside the
    evidence and leaving it, and whether fingerprints ignore it. Counts first; the PM rules
    before any rule changes.
    (PM amendment 2026-10-19, from v1-e31-t19's item (5) and the PM's ruling on it.) The same
    task rules on the short plain lines inside a body that the parser reads as nothing: 43,488
    sit between two body paragraphs of one card, in 15,796 cards (v1-e31-t19's counts in
    docs/data/caselist-parse-report.md). Option B, reading every such line as body, decides the
    marker question by default, so the two are ruled together: which lines are markers, which
    are body, and whether fingerprints ignore markers. It starts after v1-e31-t20 merges,
    because both change fingerprints.
    (PM rulings 2026-11-03, on the counts of 2026-11-02 in docs/data/caselist-parse-report.md.)
    Which forms are markers: the three clear forms only, marker-word-and-clock-time,
    clock-time-alone and marker-word-alone. A short line opening with a marker word, and a
    marker word and a time inside a longer line, are not. Markers (M1): left as they are, with
    no recording beside the evidence and no fingerprint change; a new ParsedCard field,
    card-fingerprint-v5 and a full re-parse would gain at most one cluster, and the
    near-duplicate rules already join copies that differ by a short marker. M3, built in this
    task: a marker word is never a cite's author name, so "Marked 10:42" reads as it would
    otherwise, with a parser bump that rides v1-e31-t32's re-parse (whichever of the two merges
    second takes the next parser version). The short plain lines between body paragraphs (L-D):
    a blind sample first, by item number in the coach's terminal, with the question "the
    source's own text, a note by whoever cut the card, or something else?", 8 items in each of
    seven strata (40 characters or fewer in capitals; 40 or fewer not in capitals; 41 to 200
    ending a sentence; 41 to 200 not ending one; over 200; omission notes; numbers and
    punctuation) and 10 of the clear markers, the per-stratum populations and the seed printed
    with it. From the tallies the session proposes L-A, L-B, L-C or a narrower rule by
    stratum, with each one's evidence-integrity risk, and the PM rules before anything is
    built. ac4's evaluation is handed to the operator whenever anything changes.
    (PM ruling 2026-11-03, on the coach's sample: seed 20261103, 66 items, by stratum in the
    store / the source's own text / a note by whoever cut the card / something else: 40
    characters or fewer in capitals 12,744 / 1 / 7 / 0; 40 or fewer not in capitals 15,611 / 6 /
    2 / 0; 41 to 200 ending a sentence 10,863 / 7 / 0 / 1; 41 to 200 not ending one 7,803 / 5 / 1
    / 2; over 200 3,834 / 8 / 0 / 0; omission notes 1,972 / 0 / 8 / 0; a number or punctuation
    alone 362 / 3 / 1 / 4; in-round markers 156 / 0 / 10 / 0.) N1, folded into
    2026.11.03-docx-8, one parser version for M3 and N1: a line read as nothing between two body
    paragraphs of one card is body when it is over 200 characters, or 41 to 200 characters and
    ends a sentence, and is not an omission note, a number or punctuation alone, or one of the
    three marker forms. A cite guard holds such a line as nothing when it contains a URL, a DOI
    or the word "accessed" in any case. Fixtures are shown failing first: one line of each
    stratum, the five left-alone strata pinned as nothing, a real cite between bodies untouched,
    and a 41 to 200 character line ending a sentence that carries a URL, between two bodies,
    staying nothing. Before and after over the same 13,518 sources: the lines N1 makes body by
    its two strata, the lines the cite guard holds back, and the cards whose evidence text
    changed. ac4's gate: run_parser_eval.py --tier both with N1 on and off; if EVIDENCE
    precision falls at all on either tier the session stops and reports, listing the lines N1
    added that the labels call something other than EVIDENCE by file and paragraph id only.
    Not in this task: the 40-or-fewer uncapitalised stratum and the 41 to 200 not-ending-a-
    sentence stratum, follow-ups needing a larger sample before any rule.
    (PM note 2026-11-03.) v1-e31-t32 merged first with 2026.11.03-docx-8, so this task takes
    2026.11.03-docx-9 at its sync, updates every pin t32 updated, and names both bumps in the
    parser version's docstring. The N1 ruling is unchanged.
  priority: 3
  constraints:
    packages: [debate_core.evidence, debate_core.integrations.docx_parser, packages/debate_core/tests, scripts, tests/fixtures/debate_files, docs/data]
    forbidden:
      - Removing marker text from a stored snapshot or changing evidence offsets into it
      - Running the corpus counts or a re-parse in a session (operator-run only)
      - Card text, a school, team code or file name in any fixture, file the tool writes, report or commit; the operator's checks are tallies only
  context:
    - kind: TaskRef
      name: v1-e31-t12-cite-detection
      relation: dependsOn
    - kind: TaskRef
      name: v1-e31-t20-long-cuts-and-limits
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The report gives the operator-run counts of marker lines by form and position per
        caselist, and how many clusters they split.
    - id: ac2
      description: >-
        The PM's ruling is written into this spec, and what it asks is built with synthetic
        fixtures shown failing first.
    - id: ac3
      description: >-
        If the parser or the fingerprint changes, its version is bumped and the operator's
        re-parse records the counts before and after in docs/data/caselist-parse-report.md.
    - id: ac4
      description: >-
        (PM amendment 2026-10-19) The ruling on the short plain lines between body
        paragraphs is written into this spec beside the marker ruling, and what it asks is
        built with synthetic fixtures shown failing first; the labelled evaluation's
        evidence precision does not fall.
status:
  phase: Succeeded
