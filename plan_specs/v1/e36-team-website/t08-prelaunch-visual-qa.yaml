# TASK v1-e36-t08-prelaunch-visual-qa — Pre-launch visual QA and launch readiness
# Epic: E36 Team Website Foundation | Release: v1.6 (Public team website) | Major: V1
# Architecture refs: §4 (stack), §5 (AWS), §14 (security/privacy), ADR-0010, ADR-0012, ADR-0013
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e36-t08-prelaunch-visual-qa
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.6
    debate/epic: v1-e36-team-website
  annotations:
    debate/title: Pre-launch visual QA and launch readiness
    debate/architecture-refs: §4, §5, §14, ADR-0010, ADR-0012, ADR-0013
spec:
  description: >-
    The last gate before parents see the site. The unit suite runs under jsdom, which has no layout
    engine, so it cannot judge whether a page fits a phone, whether the October 1 panel reads as the
    most important thing on the home page, or whether a colour pair passes in a real browser (t03
    disabled the axe colour-contrast rule for exactly that reason). This task closes that gap. It adds
    an operator-run QA command that serves the local static export and, in a real headless browser,
    captures every page at 390, 768 and 1280px, runs axe-core including colour-contrast, and records
    Lighthouse (or equivalent) performance, accessibility, best-practices and SEO scores per page,
    failing below a floor of 95 on accessibility and best practices. The findings, the per-width
    checklist and the score table go in the session report; the screenshots stay local review artifacts
    and are never committed, so no image of a student can reach the repository. On top of that: a
    keyboard-only walk of every interactive element, a print check of the FAQ, and a look at the dev
    preview in Safari on an iPhone and Chrome on an Android phone. It ends with the October 1
    announcement carrying a value Charlie has chosen, which lets a prod build succeed, and with the
    promotion checklist ready for Charlie to run. Out of scope: the design and structure work
    itself (t06, t07), the deploy script and smoke checks (t05), the home entry-point card labels
    (t09, which owns them and edits the same home.yaml in parallel), and running any deploy: promotion
    to main and the prod deploy stay operator steps until keyless CI deploys arrive (v2-e10-t03).
    Three things this task also owns, from the v1-e36-t07 review: the October 1 room is no longer flagged
    by anything, so the publishing-policy guard gets a check that fails a prod build while a required
    announcement field is unset (a room of "TBA" is a decision, an empty one is an oversight); the
    media-consent name allowlist becomes phrases rather than bare words, because entries like North, West,
    Blue and Valley weaken a word list for future prose; and the validate-dev site smoke suite that t05
    added in tests/smoke/test_site.py gains checks on what the pages say, not only that they are up and
    serving the right commit.
  priority: 1
  constraints:
    packages: [site/scripts, site/package.json, site/content, scripts, tests/smoke, docs/session-reports, docs/runbooks]
    forbidden:
      - Running a deploy, a promotion or an AWS command from an agent session
      - Wiring the browser-based QA tooling into `pnpm --dir site lint|test|build`, which must stay offline and fast
      - Committing screenshots, traces or audit HTML, or any image containing a student
      - Adding a runtime dependency, remote font, CDN asset or tracker to the shipped site
      - Lowering the 95 floor, skipping a page, or recording a score not produced by a run
      - Inventing the October 1 room, time or any other fact Charlie has not supplied
      - Marking the task done while the publishing-policy guard fails a prod build
  context:
    - kind: TaskRef
      name: v1-e36-t06-visual-design-pass
      relation: dependsOn
    - kind: TaskRef
      name: v1-e36-t07-page-structure-pass
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        docs/session-reports/v1-e36-t08-prelaunch-visual-qa.md records, for every page in sitemap.xml,
        the performance, accessibility, best-practices and SEO scores from a run against a local prod
        build, and the audit command exits non-zero if any page scores below 95 on accessibility or
        best practices.
    - id: ac2
      description: >-
        The same report carries a per-page checklist at 390, 768 and 1280px stating for each width that
        nothing overflows horizontally, the navigation behaves, the hero and the October 1 panel are
        legible, and card grids reflow; the screenshots behind it are regenerated by one command and are
        not committed.
    - id: ac3
      description: >-
        axe-core run in a real headless browser reports no WCAG 2.1 AA violations on any page, including
        the colour-contrast rule that jsdom cannot evaluate, and the report names the rule sets used.
    - id: ac4
      description: >-
        A keyboard-only walk reaches and operates every interactive element on every page (skip link,
        navigation menu, every <summary>, every button and link) with a visible focus ring and no focus
        trap, and printing the FAQ shows every answer; both are recorded item by item in the report.
    - id: ac5
      description: >-
        Every required October 1 announcement field carries a value Charlie has supplied — the room
        itself, or an explicit stand-in he has chosen such as "To be announced" — with no field left
        unset, and `SITE_ENV=prod SITE_URL=<team domain> pnpm --dir site build` exits 0 with the
        publishing-policy guard reporting no errors, alongside a passing lint, typecheck and full test
        run. A stand-in is a decision and satisfies this criterion; silence is an oversight and does not.
        Replacing a stand-in with the room later is a one-line content edit tracked by ac6, not a reopen.
    - id: ac6
      description: >-
        docs/runbooks/team-website.md carries a promotion checklist Charlie can follow (dev smoke check,
        replacing any announcement stand-in with the real value, promotion to main, prod deploy, prod
        smoke check, what to do if it looks wrong), and Charlie has ticked the pre-publication checklist
        in docs/policies/website-publishing.md for the launch commit.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e36-t08-prelaunch-visual-qa-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.6
    debate/epic: v1-e36-team-website
spec:
  description: >-
    Build the browser QA command, run the measured sweep, then the human checks, then fill the room and
    prove a clean prod build, and finish with the promotion checklist. About one day, including
    Charlie's answer on the room and his checklist pass.
  goalRef:
    name: v1-e36-t08-prelaunch-visual-qa
  graph:
    nodes:
      - id: qa-command
        kind: Task
        name: Operator-run browser QA command
        description: >-
          Add site/scripts/visual-qa.mjs: serve site/out from a local static server, walk every URL in
          sitemap.xml, screenshot each at 390, 768 and 1280px into a gitignored directory, run axe-core
          in the page with the wcag2a, wcag2aa, wcag21a and wcag21aa rule sets and the colour-contrast
          rule enabled, run the Lighthouse audit, and write a Markdown score table. Expose it as the
          `qa` package script with `--min-accessibility` and `--min-best-practices` (default 95); keep
          its dependencies out of the shipped bundle and out of lint, test and build, and record in
          site/README.md that the one-time browser download is an operator step.
        outputs:
          - site/scripts/visual-qa.mjs
          - site/package.json
          - site/README.md
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: artifact_exists
            name: QA script exists and enforces a score floor
            path: site/scripts/visual-qa.mjs
            contentMatch: "min-accessibility"
          - type: command_succeeds
            name: Lint, test and build stay offline and unaffected
            command: pnpm
            args: [--dir, site, test, offline]
      - id: measured-sweep
        kind: Task
        name: Scores, browser axe and responsive screenshots
        description: >-
          Build the export, run the QA command against it at all three widths, and paste the per-page
          score table, the axe result and the per-width checklist into the session report; fix or file
          anything below the floor before moving on.
        dependsOn: [qa-command]
        outputs: [docs/session-reports/v1-e36-t08-prelaunch-visual-qa.md]
        estimatedEffort: 1.5h
        acceptanceCriteria:
          - type: command_succeeds
            name: Every page clears the 95 accessibility and best-practices floor with axe clean
            command: pnpm
            args: [--dir, site, 'qa', '--', --min-accessibility, '95', --min-best-practices, '95']
          - type: artifact_exists
            name: Report records the per-page scores and the three widths
            path: docs/session-reports/v1-e36-t08-prelaunch-visual-qa.md
            contentMatch: "1280"
      - id: human-checks
        kind: Task
        name: Keyboard walk, print check and phone browsers
        description: >-
          Walk every page with the keyboard alone (skip link, navigation menu, each <summary>, each
          button and link), print the FAQ to PDF from the browser and confirm every answer is shown, and
          open the dev preview in Safari on an iPhone and Chrome on an Android phone; record each item
          and anything that looked wrong in the report.
        dependsOn: [measured-sweep]
        outputs: [docs/session-reports/v1-e36-t08-prelaunch-visual-qa.md]
        estimatedEffort: 1.5h
        acceptanceCriteria:
          - type: custom
            name: Keyboard-only walk and print check pass
            description: >-
              A reviewer tabs through every page reaching and operating every interactive element with a
              visible focus ring and no trap, and confirms a printed FAQ shows every answer; each page is
              ticked off in the report.
          - type: custom
            name: The site looks right on a real phone in Safari and Chrome
            description: >-
              Charlie or the operator opens the dev preview on an iPhone (Safari) and an Android phone
              (Chrome) and confirms the home hero, the October 1 panel, the events cards and the FAQ
              disclosures read correctly with nothing cut off or overlapping.
      - id: fill-room-and-prod-build
        kind: Task
        name: Settle the October 1 announcement and prove a clean prod build
        description: >-
          Take the room from Charlie, or the stand-in he chooses in its place, and replace the
          announcement field's `unsetNote` in site/content/home.yaml with that value, then run the full
          gate set and a prod build so the publishing-policy guard reports no errors for the first time.
          Touch only the announcement fact: the entry-point card labels in the same file belong to t09,
          which runs in parallel.
        dependsOn: [human-checks]
        outputs: [site/content/home.yaml]
        estimatedEffort: 45m
        acceptanceCriteria:
          - type: command_succeeds
            name: Prod build succeeds with no announcement field left unset
            command: env
            args: [SITE_ENV=prod, SITE_URL=https://wfbdebate.com, pnpm, --dir, site, build]
          - type: test_passes
            name: Full site suite passes offline
            command: pnpm
            args: [--dir, site, test]
          - type: command_succeeds
            name: Type check passes
            command: pnpm
            args: [--dir, site, typecheck]
      - id: launch-readiness
        kind: Task
        name: Promotion checklist and Charlie's sign-off
        description: >-
          Write the promotion checklist into docs/runbooks/team-website.md beside the existing deploy
          and rollback procedures (dev deploy and smoke check, promotion to main, prod deploy, prod
          smoke check with --expect-sha, what to do if a page looks wrong), and have Charlie tick the
          publishing policy's pre-publication checklist for the launch commit. The deploy itself is t05
          and is operator-run.
        dependsOn: [fill-room-and-prod-build]
        outputs: [docs/runbooks/team-website.md]
        estimatedEffort: 45m
        acceptanceCriteria:
          - type: artifact_exists
            name: Runbook carries the promotion checklist
            path: docs/runbooks/team-website.md
            contentMatch: "Promotion checklist"
          - type: custom
            name: Charlie signs off the launch commit
            description: >-
              Charlie reviews the QA report, agrees the site is ready to show parents, and ticks every
              item of the pre-publication checklist in docs/policies/website-publishing.md against the
              commit that will be promoted, on or before September 30, 2026.
status:
  phase: Pending
