# What a topic gives its variables. Each value is taken word for word from the topic's resolution in
# config/landscape/topics.yaml; a test checks it. LD's de-extinction preset came with its resolution
# (v1-e32-t06); it names no mechanisms, since an LD resolution has no plan.
#
# Plan mechanisms (v1-e08-t14, the PM's ruling of 2026-11-04): the coach's rule is that generic
# resolution links are fine, but links are usually to the mechanism of the plan text. So a DA's link
# search on a topic that lists mechanisms asks its link templates as they are, and then adds, from
# the DA's first link template that names only {query} and {topic}, one query on the resolution's
# words and one per mechanism, each ending with the country unless it already names it. A topic
# lists at most four. Each names the affirmative position in config/landscape/taxonomies/ it stands
# for (a test checks the id, its side and its label) and the phrase a search names it with, which is
# the coach's to edit. Phrases hold no digits.
topics:
  - id: policy-2026-27-nhi
    format: POLICY
    review: coach_reviewed
    variables:
      topic: national health insurance
      country: United States
    mechanisms:
      - {landscape_id: single-payer-aff, label: Single payer, phrase: single payer}
      - {landscape_id: medicare-for-all-aff, label: Medicare for all, phrase: Medicare for All}
      - {landscape_id: public-option-aff, label: Public option, phrase: public option}
      - {landscape_id: aca-reform-aff, label: ACA reform, phrase: Affordable Care Act}
  - id: ld-2026-nov-dec-de-extinction
    format: LD
    review: coach_reviewed
    variables:
      topic: de-extinction
