# TASK v1-e40-t33-expired-login-cloud-notice-names-the-wednesday-login - A cloud run refused for an expired login says the Wednesday login renews it, not to log in by hand
# Epic: E40 — Weekly Caselist Run in the Cloud | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e40-t33-expired-login-cloud-notice-names-the-wednesday-login
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.8
    debate/epic: v1-e40-cloud-caselist-run
  annotations:
