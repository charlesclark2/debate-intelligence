  # Filed by the PM, 2026-11-04, from v1-e31-t23's follow-ups (the PM's review, 2026-11-03).
  description: >-
    v1-e31-t23's rule N1 made body the lines between body paragraphs of 41 to 200 characters
    that end a sentence and those over 200. It left two strata the coach's sample favoured but
    too thinly to rule on: lines of 40 characters or fewer not in capitals (15,611; 6 of 8 the
    source's text) and lines of 41 to 200 that end no sentence (7,803; 5 of 8). Sample each
    larger through the sampler's `short-lines` plan (operator-run, the coach's three-way answer,
    no card text reaching the session), on the store after the re-parse to `docx-9`, and send
    the counts and tallies to the PM before any rule. Build only what the PM rules, with N1's
    guards, fixtures shown failing first, the parser version bumped and the labelled
    evaluation's EVIDENCE precision held.
  priority: 3
  constraints:
    packages: [debate_core.evidence, debate_core.integrations, scripts, packages/debate_core/tests, tests/scripts, docs/data]
    forbidden:
      - Card text in the report, a commit or the session
      - A school, team code or debater name anywhere
      - A rule before the PM's ruling
      - A fall in EVIDENCE precision on the labelled evaluation
  context:
    - kind: TaskRef
      name: v1-e31-t23-in-round-markers
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Larger samples of both strata, with the coach's tallies, are sent to the PM before
        any rule.
    - id: ac2
      description: >-
        A ruled rule has fixtures shown failing first, EVIDENCE precision holds on the
        labelled evaluation (operator), and the parser version is bumped with the operator's
        re-parse written out.
