spec:
  # Filed by the PM, 2026-11-13, from v1-e06-t16's follow-ups 1 to 3 (the PM's review, 2026-11-13) and the coach's decision of 2026-11-13.
  description: >-
    v1-e06-t16 left three gaps in the .docx body diff. (1) A body that takes the card's marker
    out where the cut joins punctuation to a word ('fail.The') equals the card's characters, so
    the comparison is empty and the card stays VERIFIED: a reader cannot see that text was cut.
    At a word join the same edit is already MANUAL_EDIT. A cut must always show, so a removed
    marker is a reason wherever the join falls, named as a hidden cut (propose its code and
    words, and whether it is MANUAL_EDIT with a detail or a reason of its own; stop for the PM's
    ruling on that one point). (2) An interpolation anchored inside a word reads as MANUAL_EDIT
    on an untouched export (the join card with an anchor at offset 11 inside 'levee':
    ManualEdit(evidence [9, 14), body [12, 20))); give the anchors as token boundaries beside
    the omission offsets, and say whether E03's edit API refuses a mid-word anchor. (3) The
    coach's decision of 2026-11-13: a marker typed by hand as three full stops with a space on
    each side (' ... ') counts the same as the profile's ' … ', so a body using it verifies as
    the rendered marker does; without the spaces it is not a marker. Applies to verify's reading
    only; the renderer keeps writing '…'.
  priority: 2
  constraints:
    packages: [debate_core.evidence, packages/debate_core/tests]
    forbidden:
      - A hidden cut reported as VERIFIED
      - A changed or added word reported as verified
      - A team card or real source in a fixture
      - Network access in a test
  context:
