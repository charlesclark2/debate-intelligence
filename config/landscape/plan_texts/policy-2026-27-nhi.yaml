# When a plan text that names no aff names the resolutional aff, nhi-aff (v1-e32-t09, the PM's context
# for ac3, 2026-10-24). Every plan says "national health insurance", so nhi-aff has no keywords. A plan
# text with a federal actor that names no aff names nhi-aff when each of its words is an English joining
# word, a frame word or a resolutional word. docs/guides/landscape-taxonomy.md says how to edit it.
#
# frame_words: the words in at least 80% of the plan texts on the coach's sheet of 2026-10-24.
# resolutional_words: the words of the clusters the coach marked nhi-aff (C16, C20, C28, C48, C127,
# C128 and C130 on that sheet). Single words only; no plan text, team or school is written here.
schema_version: 1
topic_id: policy-2026-27-nhi
position_id: nhi-aff
frame_words: [establish, federal, government, health, insurance, should, single, states, united]
resolutional_words: [care, comprehensive, covering, enact, finance, financing, national, nationally, plan, system, thus, universal]
