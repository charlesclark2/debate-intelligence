      kind: External
      name: 'Prerequisite from E30: Initial caselist and camp-file backfill'
      description: >-
        Cross-epic prerequisite owned by v1-e30-caselist-ingestion (release v1.1).
      inputs:
        goalRef: v1-e30-t06-initial-backfill
        specRef: plan_specs/v1/e30-caselist-ingestion/t06-initial-backfill.yaml
    - id: t01
      kind: Task
      name: CardMirror evaluation and editor decision
      description: >-
        Spike: round-trip team and caselist files through CardMirror (web and desktop), review its document
        schema (pockets/hats/blocks/tags/cards/cites/analytics/undertags) and fromDocx/toDocx API, the
        PolyForm Noncommercial license, the plugin bridge, and which features need a Debate Decoded subscription.
        Write ADR-0014 (adopt as team editor, or compatibility target only) with the consequences for
        later epics (card editor, library, file builder).
      inputs:
        specRef: plan_specs/v1/e31-debate-file-parsing/t01-cardmirror-evaluation.yaml
        goalRef: v1-e31-t01-cardmirror-evaluation
      dependsOn:
