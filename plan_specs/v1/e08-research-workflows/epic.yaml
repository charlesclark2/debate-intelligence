# EPIC E08 — Federated Research Workflows
# Major version: V1 | Release: v1.4 (Federated research from the CLI)
# Architecture refs: §6 SearchService, §9 Ranking pipeline, §11 CLI commands
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e08-research-workflows
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.4
    debate/epic: v1-e08-research-workflows
  annotations:
    debate/title: E08 — Federated Research Workflows
    debate/architecture-refs: §6 SearchService, §9 Ranking pipeline, §11 CLI commands
spec:
  description: >-
    Fan out searches across providers, normalize/dedupe, rank with explainable features, expand queries
    by debate argument and need, and ship `search`, `--auto-cut` and `daily`.
  priority: 5
  constraints:
    majorVersion: v1
    release: v1.4
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      `debate-research search` supports --since/--until/--max-results/--argument/--need/--format and returns
      deduped, ranked results with feature explanations.
  - id: ac2
    description: >-
      Partial results surface when providers fail; source quality is expressed as features, not a truth
      score.
  - id: ac3
    description: >-
      `--auto-cut N` and `daily <topic> --date` produce verified cards and a failure report.
status:
  phase: Pending
---
