# TASK v1-e37-t02-events-calendar - Events and tournaments calendar
# Epic: E37 Calendar & Announcements | Release: v1.6 | Major: V1
# Architecture refs: ADR-0015 (as accepted 2026-10-01), ADR-0012 (static export)
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e37-t02-events-calendar
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.6
    debate/epic: v1-e37-calendar-and-announcements
  annotations:
    debate/title: Events and tournaments calendar
spec:
  # Rewritten by the PM, 2026-10-01, when ADR-0015 was revised before acceptance: events are a file in
  # the repository, not a team Google Calendar. The earlier version fetched a public ICS feed at build
  # time with a last-good fallback; none of that remains.
  description: >-
    Put the team's tournament schedule on the site from a file in the repository.
    site/content/tournaments.yaml holds one entry per tournament, validated by a schema at build
    time: name, a date or date range, where, how it is held (in person, online but debated at
    Whitefish Bay High School, or online from home), the events it offers, whether it is overnight,
    a status (confirmed, tentative, or conditional with the condition stated), an optional
    sign-up-by date, and short notes. It is seeded with every entry in
    docs/data/2026-27-tournament-schedule.md, after which the YAML file is the source of record. The
    build renders a /schedule page (the /events route already explains the three debate events and
    is not renamed) listing the whole season in date order, with nationals in their own section, and
    publishes an iCalendar file generated from the same data so parents can subscribe in Google,
    Apple or Outlook. Three things a parent must not be misled about: two tournaments on the same
    weekend are both shown and visibly marked as overlapping, never merged or dropped; a tournament
    held online but debated at the high school says so, because it decides whether a student needs a
    ride; and the page does not depend on when it was last deployed to be correct, so it does not
    hide past tournaments by build date. Tournament text is public and passes the publishing-policy
    validator: an email address, phone number or likely student name fails the build, naming the
    entry. The coach guide's events section is rewritten for this file. Out of scope: announcements
    (t03), the parent email list (t05), and any external calendar service.
  priority: 1
  constraints:
    packages: [site/content, site/src, site/scripts, site/tests, docs/guides]
    forbidden:
      - Fetching anything from an external service at build time or in a visitor's browser
      - Hiding or reordering tournaments by build date
      - Merging, dropping or silently resolving two tournaments on the same dates
      - Describing a tournament debated online from the high school as simply "online"
      - Student names, contact details or rosters in tournament data
      - iCalendar UIDs that change when an unrelated field of an entry is edited
  context:
    - kind: TaskRef
      name: v1-e37-t01-content-editing-decision
      relation: dependsOn
    - kind: TaskRef
      name: v1-e36-t04-core-pages
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        site/content/tournaments.yaml is validated by a schema at build time and holds every entry
        in docs/data/2026-27-tournament-schedule.md. An invalid entry fails the build with a message
        naming the entry and the field, and the publishing-policy validator rejects an email
        address, phone number or non-allowlisted student name in any text field.
    - id: ac2
      description: >-
        `pnpm --dir site build` produces /schedule: the whole season in date order and nationals
        separately, each entry showing dates, name, where, how it is held, events, overnight, status
        and sign-up-by where set. Entries with overlapping dates are visibly marked as such, and
        /schedule is reachable from the site navigation.
    - id: ac3
      description: >-
        The build publishes an iCalendar file with one event per entry. A test parses it back and
        checks all-day and multi-day dates (exclusive end dates), and that each entry's UID is
        unchanged when its notes are edited. The schedule page offers a webcal:// link and the plain
        https link to it.
    - id: ac4
      description: >-
        docs/guides/coach-website-editing.md explains how to add, change and remove a tournament in
        the file, which publish path to use under ADR-0015 point 4 (the next promotion, or the
        hotfix path for a change inside the week), and what may never be written there. It no longer
        describes Google Calendar.
    - id: ac5
      description: >-
        `pnpm --dir site lint`, `typecheck`, `test` and `build` pass offline, and the export's
        accessibility checks cover /schedule.
status:
  phase: InProgress
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e37-t02-events-calendar-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.6
    debate/epic: v1-e37-calendar-and-announcements
spec:
  description: >-
    Schema and seed data, the page, the iCalendar file, then the guide.
  goalRef:
    name: v1-e37-t02-events-calendar
  graph:
    nodes:
      - id: data
        kind: Task
        name: Tournament schema and seed data
        description: >-
          The schema, the validator hookup and tournaments.yaml seeded from the 2026-27 schedule.
        outputs: [site/content/tournaments.yaml]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: artifact_exists
            name: site/content/tournaments.yaml
            path: site/content/tournaments.yaml
            contentMatch: "Wisconsin State Debate Tournament"
      - id: page
        kind: Task
        name: The schedule page
        description: >-
          /schedule in date order, overlaps marked, held-at-school stated, nationals separate.
        dependsOn: [data]
        estimatedEffort: 4h
        acceptanceCriteria:
          - type: command_succeeds
            name: The site builds
            command: pnpm
            args: [--dir, site, build]
      - id: ical
        kind: Task
        name: The iCalendar file and subscribe links
        description: >-
          Generated from the same data at build time, with stable UIDs, and tested by parsing it back.
        dependsOn: [data]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: command_succeeds
            name: The site tests pass
            command: pnpm
            args: [--dir, site, test]
      - id: guide
        kind: Task
        name: Rewrite the events section of the coach guide
        description: >-
          How to edit the file and publish a change, for whoever maintains the site.
        dependsOn: [page, ical]
        outputs: [docs/guides/coach-website-editing.md]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: artifact_exists
            name: docs/guides/coach-website-editing.md
            path: docs/guides/coach-website-editing.md
            contentMatch: "tournaments.yaml"
status:
  phase: Pending
