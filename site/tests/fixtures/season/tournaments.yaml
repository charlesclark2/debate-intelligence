# A synthetic season for the schedule tests (v1-e37-t10). Not the team's schedule: every
# tournament here is invented except the two national tournaments, whose names are the
# organisations' own. The tests' expected values are written by hand from this file, so it
# changes only with them, never with site/content/tournaments.yaml.
#
# Deliberately not in date order, so the page's sort is tested. What each entry is for:
#
#   lantern-hill-home-2026    conditional, with a condition long enough to fold in the calendar
#   harbor-point-online-2026  debated online from the high school
#   granite-falls-2026        Policy only, overnight, three days; overlaps prairie-cup-2026
#   nsda-nationals-2027       a national tournament, six days
#   lakeshore-2026            in person, one day, no overlap
#   copper-creek-...-2027     same day as silver-lake-qualifier-2027
#   northwoods-2026           overnight possibly, two days, no overlap
#   pine-hollow-2026          split by event: two arrangements
#   silver-lake-...-2027      same day as copper-creek-qualifier-2027
#   eastbrook-ncfl-...-2027   tentative, place to be announced
#   prairie-cup-2026          one day inside granite-falls-2026
#   ncfl-nationals-2027       a national tournament, two days

season: '2026-27'

revised: 2026-09-15

