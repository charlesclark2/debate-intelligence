# TASK v1-e01-t37-licence-check-over-the-lock - A CI check that every locked package's licence is one the project accepts
# Epic: E01 Repository & Delivery Foundation | Release: v1.0 (Foundation & verified evidence core) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e01-t37-licence-check-over-the-lock
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
  annotations:
    debate/title: "A CI check that every locked package's licence is one the project accepts"
spec:
  # Filed by the PM, 2026-10-25, from v1-e04-t04's follow-up, accepted by the PM (2026-10-25).
  description: >-
    The repository keeps no licence allowlist, so the PM's ruling on chardet (LGPL) and tld
    (MPL-1.1 elected) lives only in v1-e04-t04's report, and a later bump that changed a licence
    would pass unnoticed. Add a committed allowlist of accepted licence expressions, with named
    exceptions pinned to a package and version and the ruling that accepted each, and a check
    over `uv.lock` that reads each locked package's declared licence from its installed
    metadata, offline, and fails on one not accepted, naming the package. GPL-only and AGPL are
    never accepted. It runs in CI.
  priority: 3
  constraints:
    packages: [scripts, tests/scripts, config, .github/workflows, docs/process]
    forbidden:
      - A network call in the check
      - Accepting a GPL-only or AGPL licence
  context: []
  acceptanceCriteria:
    - id: ac1
      description: >-
        On synthetic metadata, the check passes an accepted licence and a pinned exception,
        and fails a GPL-only one, an exception at another version, and an unknown
        expression, each naming the package; tests shown failing first.
    - id: ac2
      description: >-
        On the real lock it passes with chardet and tld as pinned exceptions citing the PM's
        ruling of 2026-10-25, and CI runs it.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e01-t37-licence-check-over-the-lock-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
spec:
  description: >-
    Commit an allowlist with pinned exceptions and check the lock against it in CI.
  goalRef:
    name: v1-e01-t37-licence-check-over-the-lock
  graph:
    nodes:
      - id: licence-check
        kind: Task
        name: Licence check
        description: >-
          Commit an allowlist with pinned exceptions and check the lock against it in CI.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Script tests pass
            command: uv
            args: [run, pytest, tests/scripts, -k, licence]
status:
  phase: Pending
