# The camps the OpenEv importer recognises, and every spelling that names each one.
#
# Read by debate_core.application.caselist.camp_metadata when `debate-research caselist
# import-openev` runs without --camp-aliases. Edit it freely: add a camp, or add a spelling that a
# file or folder uses. A file whose folder and filename prefix match nothing here is still imported,
# with camp UNKNOWN and a warning, so a missing camp is something to add here, not an error.
#
# Shape: the canonical camp name (what gets recorded) maps to its spellings. The canonical name is
# always one of its own spellings, so it need not be repeated. Matching ignores case and treats
# spaces, hyphens, underscores and dots alike, so "Spartan Debate Institute" also matches
# "spartan-debate-institute" and "SPARTAN_DEBATE_INSTITUTE". A spelling matches whole words only:
# "SDI" matches "SDI - Politics DA" but not "SDIX Politics DA".
#
# No two camps may share a spelling; the loader refuses a table where they do. Spellings may overlap,
# as `Michigan` is the first word of `Michigan Classic`: the matcher tries the longest spelling first
# at each word, so "Michigan Classic 2026" is Michigan Classic and never Michigan, whatever the order
# here, and a folder must be a spelling as a whole.
#
# `openev` maps a canonical camp to OpenEv's own word for it: the last part of the camp's page,
# https://opencaselist.com/openev/<year>/<word>, which the search pilot's camp cards link to
# (v1-e39-t28). Add a word only after opening that page and seeing the camp's files, since the
# canonical name above is this table's choice, not OpenEv's. A camp with no word gets no link. Leave
# out a camp whose spellings OpenEv files as two camps, or that may name more than one of OpenEv's
# camps. A word is letters and digits only, and one camp's alone.
camps:
  DDI:
    - Dartmouth
    - Dartmouth Debate Institute
  # Michigan's three camps, filed apart as OpenEv files them (v1-e30-t32). Each canonical name is what
  # a card's link and provenance line show ("Find on OpenEv: Michigan Classic 2026 camp page"), so it is
  # the spelling the camps' own files use, and never a bare "Michigan", which names none of them alone.
  # OpenEv's word and label are spellings too, so a file in an OpenEv camp folder reads.
  Michigan7:
    - Michigan 7
    - UM7
  Michigan Classic:
    - UMC
  MNDI:
    - Michigan National Debate Institute
    - Michigan MNDI
  # A bare "Michigan" may be any of the three, and nothing in a stored file's name tells which: OpenEv's
  # label for UM7 is just "Michigan". It stays its own camp, with no OpenEv word and so no link.
  Michigan: []
  Gonzaga:
    - GDI
    - Gonzaga Debate Institute
  SDI:
    - Spartan
    - Spartan Debate Institute
  NHSI:
    - Northwestern
  UTNIF:
    - UT National Institute of Forensics
  CNDI:
    - California National Debate Institute
  Emory:
    - Emory National Debate Institute
  Georgetown:
    - Georgetown Debate Seminar
  Harvard:
    - Harvard Debate Council Summer Workshops
  JDI:
    - Jayhawk Debate Institute
  Mean Green:
    - Mean Green Workshops
  MSDI:
    - Missouri State Debate Institute
  Wake Forest:
    - Wake
  Wyoming:
    - Wyoming Forensics Institute

openev:
  # From OpenEv's own 2026 "Files By Camp" list, read by the PM in the operator's signed-in browser on
  # 2026-10-31, with the operator's word on Mean Green (OpenEv's "Mean Green Comet"). Michigan's three
  # camps are its MNDI ("Michigan (MNDI)"), UM7 ("Michigan") and UMC ("Michigan (Classic)"), from the
  # same list (v1-e30-t32). A bare Michigan has no word: it may be any of the three.
  CNDI: CNDI
  DDI: DDI
  Emory: ENDI
  Georgetown: GDS
  Gonzaga: GDI
  Harvard: HDC
  JDI: JDI
  Mean Green: MGC
  Michigan7: UM7
  Michigan Classic: UMC
  MNDI: MNDI
  MSDI: MSDI
  NHSI: NHSI
  UTNIF: UTNIF
  Wake Forest: RKS
  Wyoming: WYO
