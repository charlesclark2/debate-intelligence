# Site-wide strings. Validated by siteSettingsSchema in src/lib/content.ts at build time.
# House style: no em dashes, and spell out every acronym the first time a page uses it.
name: Whitefish Bay Debate
shortName: WFB Debate
tagline: The competitive debate team at Whitefish Bay High School.
navigationLabel: Main
footerNavigationLabel: About this site
skipLinkLabel: Skip to main content

# THE PRIMARY NAVIGATION, WRITTEN OUT
# -----------------------------------
# The header nav used to be every file in content/pages/, ordered by navOrder, which is how the
# accessibility statement came to sit in it between Contact and nothing: it was in the nav
# because it was a file, not because a parent needs it there.
#
# This list is the nav. It is the pages a parent or a prospective debater goes looking for, in the
# order they need them, and adding a page to the site no longer adds it to the nav by accident.
# Every published page that is not on this list is a utility page and is linked from the footer
# instead, so nothing becomes unreachable by being left out.
#
# Contact is deliberately not here. It is a short page whose whole content is four ways to send an
# email, the coaches page in the nav carries the address already, and the footer is where a visitor
# looks for a contact link. It is linked from the footer of every page.
#
# src/lib/content.ts validates it at build time: a slug here that is not a published page fails
# the build naming the slug, so renaming a page cannot silently empty a nav item.
primaryNavigation:
  - home
  - about
  - events
  - join
  - coaches
  - faq
logoAlternativeText: Whitefish Bay Blue Dukes
footerNote: >-
  A site run by the Whitefish Bay High School Debate Team, Whitefish Bay, Wisconsin. It is
  maintained by the team's coaches and is not an official district communication.

# The email allowlist. These are the only addresses that may appear anywhere on the site, in copy
# or in a mailto link; src/lib/publishing-policy.ts fails the build on any other address, and on
# any phone number. Coach and team addresses only: a student address is never published
# (docs/policies/website-publishing.md, Students 6).
contactEmails:
  - address: charles.clark@wfbschools.org
    name: Charlie Clark
    role: Head Coach

# Navigation label for the Debater login link. The link itself only renders when the debaterLogin
# feature flag is on, which it is not until the V2 app in web/ exists. See src/lib/feature-flags.ts.
debaterLoginLabel: Debater login
