spec:
  # Filed by the PM, 2026-11-05, from the 1.2.0 re-record of 2026-11-05, v1-e32-t46's follow-up on stage one, and the coach's rulings of 2026-11-05.
  description: >-
    Under prompt 1.2.0 neither route meets the 0.85 bar
    (docs/data/landscape-model-evaluation.md, 2026-11-05): Claude Sonnet 4.6 (`deep_audit`)
    scores 23 of 33, 0.697, and Claude Haiku 4.5 (`high_volume`) 21 of 37, 0.568. Tune on
    `deep_audit`; Haiku is reported, not tuned for. Sonnet's 10 wrong answers: four a wrong
    stance (rows 7, 13, 17, 57, each answered as answering a position the coach labelled as
    read; Haiku the same on 17 and 57, and on 39), four the wrong kind (row 5,
    `at:pharma-advantage` answered as reading `pharma-da`, on both routes; rows 21 and 40,
    `at:delay-cp` answered as `at:should-t`, on both routes; row 26, `at:cap-k` answered as
    reading `nhi-aff`), one the wrong position of the same kind (row 47), and one card labelled
    none placed (row 15). `generic-k` (rows 46, 50, 60) is counted right on neither route. Three
    changes, proposed first. (a) The own side's answer heading: a card under an answer heading
    inside the block of its own position's side defends that position and reads it (the coach
    kept rows 13 and 57 reading at the sitting). Count first, by row number and heading kind
    only, which of the wrong-stance rows sit so, and make the same rule stage one's: today the
    matcher gives ANSWERS to every card under an answer heading (v1-e32-t46's follow-up). (b)
    The coach's rulings of 2026-11-05: a card that answers an advantage is `at:<advantage>`,
    never the matching DA (pharmaceutical, innovation, growth against economy: no mirror pairs,
    so rows 5, 28 and 34 stay wrong when so answered), and more generally an answer to a
    position is that position answered, not the answering side's own case; and a definition card
    the affirmative reads against a counterplan answers that counterplan (no `should-t` second
    label for rows 21 and 40). (c) `generic-k`: from the three rows' outcomes and the taxonomy's
    description, what the model is missing, and a proposed change to the prompt or to the
    description (a description change is the coach's to review). The prompt's version is bumped
    with its cassettes keyed by it; the operator re-records the 47 on `deep_audit` (and
    `high_volume` if the PM rules), recorded by the PM. The bar, the threshold and the coach's
    labels do not change.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_core.arguments, prompts, scripts, packages/debate_core/tests, packages/debate_cli/tests, tests/smoke, docs/data, docs/runbooks]
    forbidden:
