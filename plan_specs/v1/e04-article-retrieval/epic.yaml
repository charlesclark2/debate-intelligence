# EPIC E04 — Article Retrieval & Extraction
# Major version: V1 | Release: v1.3 (URL → verified card)
# Architecture refs: §6 ArticleService, §9, §14, §19, §20 step 3
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e04-article-retrieval
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.3
    debate/epic: v1-e04-article-retrieval
  annotations:
    debate/title: E04 — Article Retrieval & Extraction
    debate/architecture-refs: §6 ArticleService, §9, §14, §19, §20 step 3
spec:
  description: >-
    Fetch accessible sources politely, detect paywalls and failures explicitly, extract readable text,
    and persist verified snapshots through ArticleService.
  priority: 4
  constraints:
    majorVersion: v1
    release: v1.3
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      Any accessible article or open-access PDF URL produces an Article + SourceSnapshot with hashes.
  - id: ac2
    description: >-
      Paywalled, blocked, robots-disallowed or failed fetches return an explicit AccessStatus — never
      a fabricated or partial card.
  - id: ac3
    description: >-
      `debate-research fetch <URL>` shows metadata, access status and snapshot id; integration tests run
      on recorded fixtures.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e04-article-retrieval-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.3
    debate/epic: v1-e04-article-retrieval
spec:
  description: >-
    Task graph for epic E04 (Article Retrieval & Extraction). Each Task node points at its own task-level
    PlanSpec.
  goalRef:
    name: v1-e04-article-retrieval
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e01-t07-cli-skeleton
      kind: External
      name: 'Prerequisite from E01: debate_cli Typer + Rich skeleton'
      description: >-
        Cross-epic prerequisite owned by v1-e01-repo-foundation (release v1.0).
      inputs:
        goalRef: v1-e01-t07-cli-skeleton
        specRef: plan_specs/v1/e01-repo-foundation/t07-cli-skeleton.yaml
    - id: ext-v1-e02-t01-domain-entities
      kind: External
      name: 'Prerequisite from E02: Pydantic domain entities and enums'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t01-domain-entities
        specRef: plan_specs/v1/e02-domain-core/t01-domain-entities.yaml
    - id: ext-v1-e02-t02-ports
      kind: External
      name: 'Prerequisite from E02: Repository and provider port interfaces'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t02-ports
        specRef: plan_specs/v1/e02-domain-core/t02-ports.yaml
    - id: ext-v1-e02-t05-settings-config
      kind: External
      name: 'Prerequisite from E02: Settings and configuration'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t05-settings-config
        specRef: plan_specs/v1/e02-domain-core/t05-settings-config.yaml
    - id: ext-v1-e02-t06-import-boundary-guard
      kind: External
      name: 'Prerequisite from E02: Import-boundary enforcement'
      description: >-
        Cross-epic prerequisite owned by v1-e02-domain-core (release v1.0).
      inputs:
        goalRef: v1-e02-t06-import-boundary-guard
        specRef: plan_specs/v1/e02-domain-core/t06-import-boundary-guard.yaml
    - id: ext-v1-e03-t02-hashing-provenance
      kind: External
      name: 'Prerequisite from E03: SHA-256 provenance and snapshot creation'
      description: >-
        Cross-epic prerequisite owned by v1-e03-evidence-integrity (release v1.0).
      inputs:
        goalRef: v1-e03-t02-hashing-provenance
        specRef: plan_specs/v1/e03-evidence-integrity/t02-hashing-provenance.yaml
    - id: t01
      kind: Task
      name: URL canonicalization and identifier detection
      description: >-
        Canonical URL rules (scheme/host case, tracking params, AMP, trailing slashes), rel=canonical
        support, DOI/arXiv/PMID detection.
      inputs:
        specRef: plan_specs/v1/e04-article-retrieval/t01-url-canonicalization.yaml
        goalRef: v1-e04-t01-url-canonicalization
      dependsOn:
      - ext-v1-e02-t01-domain-entities
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e04-t01-url-canonicalization reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e04-t01-url-canonicalization
    - id: t02
      kind: Task
      name: Polite HTTP fetcher
      description: >-
        httpx client with timeouts, bounded retries on idempotent errors, per-host rate limiting, identifying
        User-Agent, robots.txt respect, redirect/size limits, content-type sniffing.
      inputs:
        specRef: plan_specs/v1/e04-article-retrieval/t02-http-fetcher.yaml
        goalRef: v1-e04-t02-http-fetcher
      dependsOn:
      - t01
      - ext-v1-e02-t02-ports
      - ext-v1-e02-t05-settings-config
      - ext-v1-e02-t06-import-boundary-guard
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e04-t02-http-fetcher reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e04-t02-http-fetcher
    - id: t03
      kind: Task
      name: Access-status and paywall detection
      description: >-
        Classify responses into ACCESSIBLE, PAYWALLED, BLOCKED, ROBOTS_DISALLOWED, NOT_FOUND, UNSUPPORTED_TYPE,
        ERROR using status codes, known paywall markers and extracted-length heuristics; never attempt
        bypass.
      inputs:
        specRef: plan_specs/v1/e04-article-retrieval/t03-access-status.yaml
        goalRef: v1-e04-t03-access-status
      dependsOn:
      - t02
      - t04
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e04-t03-access-status reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e04-t03-access-status
    - id: t04
      kind: Task
      name: Readable-text extraction (HTML + PDF)
      description: >-
        trafilatura-based HTML extraction with fallback extractor, paragraph segmentation, PDF text extraction
        for open-access PDFs, extractor_version, and extraction-quality signals.
      inputs:
        specRef: plan_specs/v1/e04-article-retrieval/t04-content-extraction.yaml
        goalRef: v1-e04-t04-content-extraction
      dependsOn:
      - t02
      - ext-v1-e02-t06-import-boundary-guard
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e04-t04-content-extraction reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e04-t04-content-extraction
    - id: t05
      kind: Task
      name: ArticleService orchestration
      description: >-
        fetch → access check → extract → normalize → snapshot persist; dedupe by canonical URL + content
        hash; re-fetch policy; manual pasted-text mode flagged with provenance_mode=USER_SUPPLIED.
      inputs:
        specRef: plan_specs/v1/e04-article-retrieval/t05-article-service.yaml
        goalRef: v1-e04-t05-article-service
      dependsOn:
      - t03
      - t04
      - ext-v1-e03-t02-hashing-provenance
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e04-t05-article-service reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e04-t05-article-service
    - id: t06
      kind: Task
      name: '`debate-research fetch` command and recorded fixtures'
      description: >-
        CLI fetch command; recorded HTTP fixtures (respx/vcr) for representative news, think-tank, government,
        PDF and paywalled pages used in CI.
      inputs:
        specRef: plan_specs/v1/e04-article-retrieval/t06-fetch-command.yaml
        goalRef: v1-e04-t06-fetch-command
      dependsOn:
      - t05
      - ext-v1-e01-t07-cli-skeleton
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v1-e04-t06-fetch-command reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v1-e04-t06-fetch-command
status:
  phase: Pending
