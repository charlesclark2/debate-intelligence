# TASK v1-e39-t11-search-pages-follow-ups - Search pages: a result count, a way back to the results, a link to the disclosed file, and Copy card without the provenance line
# Epic: E39 — Team Evidence Search (Student Pilot) | Release: v1.7 (Team evidence search pilot) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e39-t11-search-pages-follow-ups
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.7
    debate/epic: v1-e39-evidence-search-pilot
  annotations:
    debate/title: "Search pages: a result count, a way back to the results, a link to the disclosed file, and Copy card without the provenance line"
spec:
  # Filed by the PM, 2026-10-22, from the coach's testing of the dev pilot on 2026-10-21 and 2026-10-22, and data-use policy version 1.11 (Charlie, 2026-10-22).
  description: >-
    The coach's first use of the dev pilot asked for four things on the pages v1-e39-t06 built.
    (1) A result count above the results: exact up to a cap, and "About N" or "N+" above it,
    counted by the reader for the same query and filters, so the count can never disagree with
    the results. (2) A plain "Back to results" link on a card page that returns to the same
    query, filters and page. It is carried as query parameters the page validates exactly as the
    search page does (v1-e39-t03's binding and cursor); a tampered or stale parameter lands on a
    fresh search page, never an error page and never an address taken from the request. The
    browser's own back button keeps working. (3) "Open on openCaselist" for a disclosed card's
    file and "Open on OpenEv" for a camp card's, in a new tab with no referrer, built from
    identifiers the index already stores in its unindexed columns. Where a link cannot be built,
    none is shown. Whole-file download stays out of the pilot (Charlie, 2026-10-22: the link-out
    is enough for now); V2's E35 plans it. (4) Under data-use policy version 1.11 (Charlie,
    2026-10-22), Copy card carries the tag, the cite and the card's text and no provenance line.
    The card page still shows the line, and the copy's audit record is unchanged.
  priority: 1
  constraints:
    packages: [debate_api, debate_core.domain, debate_core.application, debate_core.integrations, packages/debate_api/tests, packages/debate_core/tests]
    forbidden:
      - A provenance line in Copy card's HTML or plain text
      - A school, team code, tournament or round made searchable, or written to a log or an audit record
      - A redirect or link target taken from the request
      - Card text, a school, team code, file name, student name, username or email in any fixture, log, report or commit (synthetic values only)
      - Network or AWS access in any test
  context:
    - kind: TaskRef
      name: v1-e39-t07-removal-audit-and-exposure
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        The results page shows a count for the query and filters, exact up to a cap and
        marked as approximate above it, and the p95 query time on the measurement index
        stays within v1-e39-t03's budget with the count included, by test and a recorded
        figure.
    - id: ac2
      description: >-
        A card page links back to its results with the same query, filters and page from
        validated parameters; a tampered or stale parameter lands on a fresh search page, by
        tests shown failing first.
    # PM ruling 2026-10-22 (option A): a camp card shows no OpenEv link until the index stores an OpenEv address; v1-e39-t16 carries it from the import through CampFile into the index, after v1-e39-t13's format move.
    - id: ac3
      description: >-
        A disclosed card links to its file's page on openCaselist, in a new tab with no
        referrer; a camp card shows no link until the index stores an OpenEv address; a card
        whose link cannot be built shows none, by test.
    - id: ac4
      description: >-
        Copy card's HTML and plain text hold the tag, cite and text and no provenance line,
        the card page still shows the line, and the copy writes the same audit record as
        before, by tests shown failing first.
status:
  phase: Succeeded
