# Workspace root for the Debate Intelligence Platform. Not a distributable package itself: it holds
# the uv workspace definition, the shared dev tooling and every tool's configuration.
[project]
name = "debate-intelligence"
version = "1.1.0"
description = "Workspace root for the Debate Intelligence Platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/debate_core",
    "packages/debate_cli",
    "packages/debate_api",
    "packages/debate_workers",
]

[dependency-groups]
dev = [
    "anyio>=4.4",
    # The S3 adapters (v1-e29-t04) are dev-tested against moto, never an AWS account, so the dev
    # environment carries what debate-core's `aws` extra declares plus the stubs: boto3 to import
    # the adapter, and boto3-stubs because pyright runs strict over debate_core and boto3 itself
    # ships no inline types. moto, below, is what answers the adapter in place of AWS.
    "boto3>=1.35",
    # cognito-idp, logs and ssm for the pilot's adapters (v1-e39-t05), for the same reason as s3.
    "boto3-stubs[cognito-idp,logs,s3,ssm]>=1.35",
    # scripts/affected_tests.py (v1-e01-t28) builds the workspace packages' import graph with grimp.
    # import-linter brings it in too, but the script uses it directly, so it is named here. The lock
    # holds the version; the floor is the 3 series, whose build_graph takes cache_dir=None. The floor is
    # not the locked minor version because tests/architecture/test_single_interpreter_source.py reads
    # a three-point-teen specifier as a Python version.
    "grimp>=3.0",
    "httpx>=0.28",
    # Starlette's TestClient, which the pilot's app tests run through, deprecates httpx in favour of
    # httpx2 from Starlette 1.9 (v1-e39-t04's report; added by v1-e39-t05, which writes most of them).
    "httpx2>=2.15",
    "hypothesis>=6.100",
    # `uv run lint-imports` checks the ports-and-adapters boundaries. v1-e29-t04 adds the first
    # contract (no AWS SDK outside debate_core.integrations.s3); v1-e02-t06-import-boundary-guard
    # owns the full set and the CI job.
    "import-linter>=2.0",
    # The caselist_token store (v1-e34-t01) talks to the OS keychain through keyring. Tests never
    # reach the real keychain: they hand the store an in-memory backend.
    "keyring>=25",
    "lxml>=5.3",
    # The debate .docx parser (v1-e31-t03) reads WordprocessingML with lxml, and lxml ships no
    # inline types; pyright runs strict over debate_core, so the stubs are what let the adapter be
    # type-checked at all. Same reason as boto3-stubs above.
    "lxml-stubs>=0.5",
    # Answers the S3 adapters in-process (v1-e29-t04). The PR test suite reaches no AWS account.
    "moto[s3]>=5.0",
    # moto's server mode, which the installed-build smoke checks reach over loopback instead of
    # patching a process they cannot see (v1-e01-t21). Its own `server` extra would add cfn-lint,
    # docker and a dozen more for services the evidence store never calls; S3 and STS need only these.
    "flask>=3.0",
    "flask-cors>=5.0",
    "numbers-parser>=4.19",
    # The student search pilot's pages are tested in Chromium (v1-e39-t06): Playwright drives it, and
    # axe-playwright-python carries axe-core's script, which the tests inject into a page and the app
    # never serves. The browser is Playwright's own build, installed once per machine with
    # `uv run playwright install chromium`; the tests are marked `slow` (working agreement 1: browser
    # suites run outside the PR path). The lock holds playwright 1.63.0, whose Chromium is v1243.
    "axe-playwright-python>=0.1.8",
    "playwright>=1.63",
    "pre-commit>=4.0",
    "pre-commit-hooks>=5.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "pytest-xdist>=3.6",
    "python-docx>=1.1",
    "respx>=0.22",
    "ruff>=0.11",
    # ShellCheck as a wheel rather than a brew install, so `uv run shellcheck` works the same way
    # on a laptop and on a CI runner. scripts/site_deploy.sh (v1-e36-t05) is the first shell script
    # with a lint criterion of its own.
    "shellcheck-py>=0.10",
    # PyYAML ships no inline types; debate_core.integrations.models.routing_policy is type-checked strictly.
    "types-pyyaml>=6.0",
]

# ---------------------------------------------------------------------------------------------
# ruff: lint + format
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 110
# Nothing in scripts/ is excluded any more: v1-e01-t05-spec-tooling removed the temporary list
# v1-e01-t03 added and fixed what ruff reported, so every script is linted and formatted like the
# rest of the repository.
force-exclude = true  # honour ruff's own excludes when pre-commit passes file names explicitly
src = [
    "packages/debate_core/src",
    "packages/debate_cli/src",
    "packages/debate_api/src",
    "packages/debate_workers/src",
]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["debate_core", "debate_cli", "debate_api", "debate_workers"]

# ---------------------------------------------------------------------------------------------
# pyright: strict for the domain core, standard for the delivery packages
# ---------------------------------------------------------------------------------------------
[tool.pyright]
include = ["packages"]
exclude = ["**/__pycache__", "**/.*"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["packages/debate_core"]

# ---------------------------------------------------------------------------------------------
# import-linter: the ports-and-adapters boundaries, checked by `uv run lint-imports`
# ---------------------------------------------------------------------------------------------
# v1-e02-t06-import-boundary-guard owns this section. The first five contracts keep a named library
# inside its adapter (v1-e29-t04, v1-e34-t01, v1-e31-t03 added them with their adapters); the rest
# are the shape of the architecture. tests/architecture/test_import_contracts.py breaks every
# contract here on purpose and fails if one does not report itself BROKEN, or if a contract is
# added without a case there. What import-linter cannot see, how much a CLI command or API route
# does, is checked by scripts/check_thin_handlers.py; CI's import-boundaries job runs both.
[tool.importlinter]
# The one exception list left in this file is a ratchet, and what keeps it safe is that an
# ignore_imports entry matching nothing is an error rather than a shrug. That is import-linter's
# per-contract default - every contract class declares
# `unmatched_ignore_imports_alerting = fields.EnumField(AlertLevel, default=AlertLevel.ERROR)` - and
# it is proven here rather than restated: tests/architecture/test_import_contracts.py plants a stale
# entry in a copy of this file and asserts lint-imports fails naming it.
#
# Do not add `unmatched_ignore_imports_alerting` at this level. It is not read here at all, which
# v1-e01-t13 established by measurement: error, warn and none behave identically at the top level,
# while none *on a contract* lets a stale entry pass. A key here would only tell a reader the
# protection lives somewhere it does not. This paragraph replaces such a line, added in the
# v1-e02-t06 review on the assumption that it pinned the default.
root_packages = ["debate_core", "debate_cli", "debate_api", "debate_workers"]
# Required for a contract that forbids a module from outside the repository, such as boto3.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The AWS SDK never reaches the domain, the application layer or the other adapters"
type = "forbidden"
# Not even indirectly: nothing in this list may so much as depend on a module that imports boto3,
# which is what keeps `debate-core` installable and usable with no AWS SDK present at all.
# `debate_core.integrations` is named by its subpackages rather than whole, because listing the
# parent would include `integrations.s3` itself; a new adapter subpackage is added to this list in
# the PR that creates it. `integrations.bedrock` (v1-e05-t02-bedrock-adapter) is the other adapter
# allowed the SDK, so it is not listed; it is on the httpx and lxml lists below instead. So are the
# student search pilot's three (v1-e39-t05): `cognito`, `cloudwatch_audit` and `parameter_store`.
#
# `debate_api` left this list in v1-e39-t05, as ADR-0019 (Where the code goes) decided: its
# composition root builds the pilot's Cognito, audit and parameter adapters, so it is held to the
# direct form of the rule below, as the CLI is.
source_modules = [
    "debate_core.domain",
    "debate_core.retrieval",
    "debate_core.application",
    "debate_core.testing",
    "debate_core.integrations.local",
    "debate_core.integrations.models",
    "debate_core.integrations.docx_parser",
    "debate_core.integrations.docx_file_writer",
    "debate_core.integrations.file_streaming",
    "debate_core.integrations.opencaselist",
    "debate_core.integrations.discovery",
    "debate_core.integrations.http_fetcher",
    "debate_workers",
]
forbidden_modules = ["boto3", "botocore"]

[[tool.importlinter.contracts]]
name = "The HTTP client stays inside the adapters that talk HTTP"
type = "forbidden"
# httpx is the `http` extra (PM ruling 2026-10-21, v1-e04-t02 packaging). Like boto3, it may not
# reach the domain, the application layer, the shared test fakes or an adapter that has no business
# on the network, even indirectly. The adapters allowed it are the ones left off this list:
# debate_core.integrations.opencaselist (v1-e34-t01), debate_core.integrations.discovery (E07) and
# debate_core.integrations.http_fetcher (v1-e04-t02). `debate_core.retrieval` is on it (PM ruling,
# v1-e04-t01, 2026-10-19): retrieval holds the types, errors and rules, and the fetching adapter
# lives in debate_core.integrations.
source_modules = [
    "debate_core.domain",
    "debate_core.retrieval",
    "debate_core.application",
    "debate_core.testing",
    "debate_core.integrations.local",
    "debate_core.integrations.docx_file_writer",
    "debate_core.integrations.file_streaming",
    "debate_core.integrations.s3",
    "debate_core.integrations.bedrock",
    "debate_core.integrations.cognito",
    "debate_core.integrations.cloudwatch_audit",
    "debate_core.integrations.parameter_store",
    "debate_api",
    "debate_workers",
]
forbidden_modules = ["httpx"]

[[tool.importlinter.contracts]]
name = "The keychain library stays inside debate_core.integrations.opencaselist"
type = "forbidden"
# keyring is the `opencaselist` extra: the operator's caselist_token lives in the macOS keychain
# (v1-e34-t01). Nothing else reads a keychain, so every other module is held off it, the other
# HTTP adapters included.
source_modules = [
    "debate_core.domain",
    "debate_core.retrieval",
    "debate_core.application",
    "debate_core.testing",
    "debate_core.integrations.local",
    "debate_core.integrations.docx_file_writer",
    "debate_core.integrations.file_streaming",
    "debate_core.integrations.s3",
    "debate_core.integrations.bedrock",
    "debate_core.integrations.cognito",
    "debate_core.integrations.cloudwatch_audit",
    "debate_core.integrations.parameter_store",
    "debate_core.integrations.discovery",
    "debate_core.integrations.http_fetcher",
    "debate_api",
    "debate_workers",
]
forbidden_modules = ["keyring"]

[[tool.importlinter.contracts]]
name = "The CLI reaches httpx and keyring only through debate_core.integrations"
type = "forbidden"
# The composition root builds the OpenCaselist client (and, from v1-e04-t06, the article fetcher),
# so the chain to httpx is by design; what is forbidden is a command importing httpx or keyring
# itself.
allow_indirect_imports = true
source_modules = ["debate_cli"]
forbidden_modules = ["httpx", "keyring"]

[[tool.importlinter.contracts]]
name = "The CLI and the API reach the AWS SDK only through debate_core.integrations"
type = "forbidden"
# The delivery packages are held to the *direct* form of the same rule, because a composition root
# has to be able to construct an adapter: `debate_cli.container` imports
# `debate_core.integrations.s3` to build the store `debate-research store` syncs with
# (v1-e29-t05-evidence-sync-cli), and that import is a chain to boto3 by design. What stays
# forbidden is the CLI reaching for the SDK itself — a `boto3.client(...)` in a command, a
# `botocore` exception caught outside the adapter that is supposed to translate it — which is the
# part that would put AWS back into code that is meant not to know about it (ADR-0003, §6).
#
# `debate_api` is held to the same form since v1-e39-t05 (ADR-0019): `debate_api.container` builds
# the pilot's Cognito, audit and parameter adapters, and no route or page imports boto3 itself.
#
# The layers contract below is what forbids debate_core.application from importing
# debate_core.integrations at all.
allow_indirect_imports = true
source_modules = ["debate_cli", "debate_api"]
forbidden_modules = ["boto3", "botocore"]

# v1-e31-t03-debate-docx-parser. A document library is an adapter's business: the parse output
# model and the DebateFileParser port are plain values and Protocols, so nothing above the
# adapter has a reason to know that OOXML exists. python-docx is named alongside lxml because it
# is in the dev environment and is the other library that could drift across this boundary.
[[tool.importlinter.contracts]]
name = "Document libraries stay inside debate_core.integrations.docx_parser"
type = "forbidden"
# `debate_core.retrieval` is on this list for the same reason it is on the httpx one: HTML and PDF
# extraction (v1-e04-t04) is an adapter in debate_core.integrations; retrieval keeps its models.
source_modules = [
    "debate_core.domain",
    "debate_core.retrieval",
    "debate_core.application",
    "debate_core.testing",
    "debate_core.integrations.local",
    "debate_core.integrations.s3",
    "debate_core.integrations.bedrock",
    "debate_core.integrations.file_streaming",
    "debate_core.integrations.cognito",
    "debate_core.integrations.cloudwatch_audit",
    "debate_core.integrations.parameter_store",
    "debate_core.integrations.http_fetcher",
    "debate_api",
    "debate_workers",
]
forbidden_modules = ["lxml", "docx"]

# v1-e31-t06-parse-pipeline. `caselist parse` needs the parser built, and building adapters is the
# composition root's job, so `debate_cli.container` imports `debate_core.integrations.docx_parser`
# and the chain to lxml is by design. The CLI is held to the direct form of the rule, exactly as it
# is for the AWS SDK above: no command imports lxml or python-docx itself.
[[tool.importlinter.contracts]]
name = "The CLI reaches lxml only through debate_core.integrations.docx_parser"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["debate_cli"]
forbidden_modules = ["lxml", "docx"]

# v1-e02-t06-import-boundary-guard. The contracts from here down are the shape of the architecture
# itself (§1, §2): the ones above keep a named library inside its adapter, these keep each layer
# in its place. tests/architecture/test_import_contracts.py breaks each one on purpose and checks
# that lint-imports names it, so a contract here that stops biting fails that suite.

[[tool.importlinter.contracts]]
name = "debate_core layers: integrations and testing above application above evidence and retrieval above domain"
type = "layers"
# Each layer may import the ones below it and never the ones above: the domain model imports
# nothing else in debate_core, the evidence algorithms see only the domain, the application layer
# reaches adapters only through its ports, and an adapter never serves a use case by importing
# the shared test fakes. `|` makes integrations and testing independent: neither may import the
# other. `exhaustive` means a new debate_core subpackage fails this contract until it is placed in
# a layer here, rather than slipping in unconstrained.
#
# `retrieval` (v1-e04-t01-url-canonicalization) sits beside `evidence`: the pure procedures that
# turn a URL and fetched bytes into an article (canonical URLs, identifiers, and later access
# classification and extracted-content types) see only the domain, and the `|` keeps the two
# independent of each other. ArticleService in the application layer composes both.
containers = ["debate_core"]
layers = [
    "integrations | testing",
    "application",
    "evidence | retrieval",
    "domain",
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "The domain and application layers never import a delivery framework"
type = "forbidden"
# typer and rich belong to debate_cli, fastapi to debate_api: a use case that knows about any of
# them can no longer be called from the other front end or a worker (§1). boto3, botocore and
# httpx are forbidden to the same modules by the contracts above; `click` is here because typer
# is built on it and a use case that reaches for it has the same problem.
source_modules = [
    "debate_core.domain",
    "debate_core.evidence",
    "debate_core.retrieval",
    "debate_core.application",
]
forbidden_modules = ["typer", "click", "rich", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "debate_core never imports a delivery package"
type = "forbidden"
# The core is what every front end calls; the dependency never points back.
source_modules = ["debate_core"]
forbidden_modules = ["debate_cli", "debate_api", "debate_workers"]

[[tool.importlinter.contracts]]
name = "The delivery packages are independent of one another"
type = "independence"
# Something the CLI and the API both need belongs in debate_core, not in one of them.
modules = ["debate_cli", "debate_api", "debate_workers"]

[[tool.importlinter.contracts]]
name = "Delivery packages reach debate_core.integrations only through their composition root"
type = "forbidden"
# A command, route or job calls use cases in debate_core.application; which adapter implements a
# port is decided in one place per front end, the composition root (`debate_cli.container` for the
# CLI, `debate_api.container` for the pilot's app since v1-e39-t05; debate_workers adds its own to
# ignore_imports when it gets one). Indirect
# chains through that root are the design, so only direct imports are checked.
#
# The composition roots are the only entries. The four command imports that were grandfathered here
# when this contract was written (v1-e02-t06) were moved into debate_cli.container by
# v1-e01-t13-composition-root-cleanup; a command that needs an adapter asks the container for it.
allow_indirect_imports = true
source_modules = ["debate_cli", "debate_api", "debate_workers"]
forbidden_modules = ["debate_core.integrations"]
ignore_imports = [
    "debate_cli.container -> debate_core.integrations.**",
    "debate_api.container -> debate_core.integrations.**",
]

[[tool.importlinter.contracts]]
name = "Delivery packages never import debate_core.testing"
type = "forbidden"
# v1-e03-t04-verifier. The shared fakes and builders are test support. `build_card` passes its
# caller's verification_status through, so the scan that keeps VERIFIED inside EvidenceVerifier
# (packages/debate_core/tests/evidence/test_verifier.py) allow-lists debate_core/testing/builders.py.
# That is safe only while no production code can reach it: the layers contract above keeps
# debate_core.application and debate_core.integrations out, and this contract keeps the front ends
# out, directly or through any chain.
source_modules = ["debate_cli", "debate_api", "debate_workers"]
forbidden_modules = ["debate_core.testing"]

# ---------------------------------------------------------------------------------------------
# pytest: every project marker is registered here, once. Later tasks use them, never add their own.
# ---------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
# Where the one pytest plugin of our own lives: run_in_parts, which adds `--part K/N` and is loaded
# by the `-p` in addopts below. pytest puts `pythonpath` on sys.path before it loads `-p` plugins.
pythonpath = ["tests/pytest_plugins"]
testpaths = [
    "packages/debate_core/tests",
    "packages/debate_cli/tests",
    "packages/debate_api/tests",
    "packages/debate_workers/tests",
    "tests",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--numprocesses=auto",
    # No --cov here (v1-e01-t27). Coverage took a third of the suite's wall-clock (182 s against
    # 123 s on the operator's Mac, 5,812 tests) and nothing is gated on it, so a plain
    # `uv run pytest` and a pull request's `test` job both run without it. CI measures it on every
    # push to dev and main, in ci.yml's `coverage` job; locally, ask for it:
    # `uv run pytest --cov --cov-report=term-missing`. [tool.coverage] below still says what is
    # measured, so the report is the one this file used to produce on every run.
    #
    # `--part K/N` (tests/pytest_plugins/run_in_parts.py) runs one of N parts of the selection; the
    # N parts together are the whole of it. CI's `test` job is a matrix of them.
    "-p", "run_in_parts",
    "--disable-socket",
    # The repository contract suite (v1-e02-t04) runs its `async def` tests on a real asyncio
    # loop, and a loop builds its self-pipe from `socket.socketpair()`. AF_UNIX sockets cannot
    # reach a network, so allowing them keeps the suite offline while letting the loop start;
    # AF_INET and AF_INET6 stay blocked by `--disable-socket`.
    "--allow-unix-socket",
    "-m", "not slow and not live",
]
markers = [
    "slow: takes more than a few seconds; excluded by default, opt in with -m slow",
    "live: needs the network or a real model/provider; excluded by default, opt in with -m live",
    "eval: LLM evaluation suite, run outside the PR CI path",
    "dev: cloud smoke check targeting the dev environment",
    "prod: cloud smoke check targeting the prod environment",
]

[tool.coverage.run]
branch = true
source_pkgs = ["debate_core", "debate_cli", "debate_api", "debate_workers"]
# xdist workers that receive no tests collect nothing; that is expected, not a problem.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
show_missing = true
skip_empty = true
