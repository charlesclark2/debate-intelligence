  goalRef:
    name: v1-e32-t13-removal-reaches-landscape-school-views
  graph:
    nodes:
      - id: removal-landscape
        kind: Task
        name: Removal reaches school views
        description: >-
          Extend the removal plan and execute with the landscape school-view files, add
          the status residue check, the removal credential's grant and the runbook steps.
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: Removal tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests, -k, removal]
status:
