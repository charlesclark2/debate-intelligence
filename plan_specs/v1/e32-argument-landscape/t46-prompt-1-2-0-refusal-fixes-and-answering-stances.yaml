  # Filed by the PM, 2026-11-03, from v1-e32-t43's ruling 2 and ac3, and the coach's labelling decision (2026-11-03).
  description: >-
    Neither route meets the 0.85 bar (Claude Haiku 4.5, pipeline 0.636; Claude Sonnet 4.6,
    0.750; docs/data/landscape-model-evaluation.md). Prompt 1.2.0, same variables, carries three
    changes. (a) A kritik or counterplan card goes to its named or generic position even when it
    reads as general (4 of the 10 refusals of labelled cards). (b) A general card under a
    heading naming a word of a position serves that position (3 of the 10); null stays for a
    general card under no such heading. (c) The coach's stance label: today a card in a file
    read by the side opposite a position's, answering it, is labelled with that position, which
    the prompt's "the argument the card is read as" does not say; most of the wrong-kind answers
    are such cards (4 of 5 on Haiku; the pharmaceutical advantage read as the DA twice on
    Sonnet). The coach proposes an explicit stance, `at:<position>` (`at:politics-da`), for a
    card that answers a position. The coach's label and the model's answer both gain a stance
    (reads the position, or answers it), the label file's schema and the evaluation read it, and
    a wrong stance is scored as its own outcome. Propose the label format and how the coach
    relabels the 47 (the operator's sitting), then build on the PM's ruling. The re-record on
    the PM's choice of route is the operator's, a few cents. The bar, the threshold and the
    taxonomy do not change.
  priority: 2
  constraints:
    packages: [debate_core.application, debate_core.arguments, debate_cli, prompts, scripts, packages/debate_core/tests, packages/debate_cli/tests, docs/data, docs/guides, docs/runbooks]
    forbidden:
      - Card text, a tag, heading or label text in the report, docs, logs or a test
      - A school, team code or debater name anywhere
      - A change to the 85% bar, the review threshold or the taxonomy
      - A live model call by the session
      - A price written from memory
  context:
