    Measure the existing instances, build the check, fix them, then the prompt line.
  goalRef:
    name: v1-e01-t19-paste-safe-command-blocks
  graph:
    nodes:
      - id: check
        kind: Task
        name: Check, fix, and tell the sessions
        description: >-
          The scan, the fixes, the prompt line.
        estimatedEffort: 3h
        acceptanceCriteria:
