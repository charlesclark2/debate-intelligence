# TASK v1-e04-t04-content-extraction — Readable-text extraction (HTML + PDF)
# Epic: E04 Article Retrieval & Extraction | Release: v1.3 (URL → verified card) | Major: V1
# Architecture refs: §6 ArticleService, §8 step 1, §20 step 3 (httpx + trafilatura), §16
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e04-t04-content-extraction
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.3
    debate/epic: v1-e04-article-retrieval
  annotations:
    debate/title: Readable-text extraction (HTML + PDF)
    debate/architecture-refs: §6, §8, §16, §20 step 3
spec:
  description: >-
    Implement ContentExtractor adapters that turn fetched bytes into readable article text plus
    metadata hints: a trafilatura-based HTML extractor (main text, title, author, date, site name,
    rel=canonical, JSON-LD hints) with a readability-style fallback when trafilatura returns too
    little, and a PDF extractor (pypdf or pdfminer.six) for open-access PDFs that removes running
    headers/footers and page numbers and de-hyphenates line breaks. Output is ExtractedContent with
    paragraphs in reading order, extractor_name and extractor_version, and quality signals (char
    count, paragraph count, boilerplate ratio, fallback_used) consumed by t03 and t05. Metadata hints
    are unverified inputs to CitationService (E06), not verified citation fields. No normalization
    (E03-t01), hashing or persistence here.
  priority: 1
  constraints:
    packages: [debate_core.retrieval, debate_core.integrations]
    forbidden:
      - Modifying words during extraction (no spelling fixes, summarization or LLM cleanup)
      - OCR or extraction from DRM-protected or paywalled documents
      - Presenting extracted author/date hints as verified citation metadata
  context:
    - kind: TaskRef
      name: v1-e04-t02-http-fetcher
      relation: dependsOn
    - kind: TaskRef
      name: v1-e02-t06-import-boundary-guard
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        TrafilaturaExtractor implements the ContentExtractor port and, on saved news, think-tank and
        .gov HTML samples, returns body paragraphs matching golden files with navigation, ads and
        comment sections excluded.
    - id: ac2
      description: >-
        When the primary extractor yields fewer than the configured minimum characters, the fallback
        runs and fallback_used is true in the quality signals.
    - id: ac3
      description: >-
        PdfExtractor produces paragraphs from a sample open-access journal PDF with running headers,
        footers and page numbers removed and end-of-line hyphenation joined.
    - id: ac4
      description: >-
        Every ExtractedContent carries extractor_name, extractor_version (library version included) and
        quality signals; unsupported content types raise UnsupportedContentType.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e04-t04-content-extraction-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.3
    debate/epic: v1-e04-article-retrieval
spec:
  description: >-
    Output model and dispatcher, HTML extraction with fallback, PDF extraction, then golden tests.
  goalRef:
    name: v1-e04-t04-content-extraction
  graph:
    nodes:
      - id: extracted-model
        kind: Task
        name: ExtractedContent model and dispatcher
        description: >-
          ExtractedContent, MetadataHints and QualitySignals models; content-type dispatcher selecting
          the HTML or PDF extractor.
        outputs: [packages/debate_core/src/debate_core/retrieval/extraction.py]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: artifact_exists
            name: Extraction model exists
            path: packages/debate_core/src/debate_core/retrieval/extraction.py
            contentMatch: "class ExtractedContent"
      - id: html-extractor
        kind: Task
        name: trafilatura extractor with fallback
        description: >-
          trafilatura extract with favor_precision, paragraph-preserving output, metadata hints and a
          readability-lxml fallback when below the minimum length.
        dependsOn: [extracted-model]
        outputs: [packages/debate_core/src/debate_core/integrations/html_extractor.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: HTML extraction tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/test_html_extractor.py]
      - id: pdf-extractor
        kind: Task
        name: Open-access PDF extractor
        description: >-
          Page text extraction, repeated header/footer detection across pages, page-number removal,
          hyphenation joining and paragraph reconstruction.
        dependsOn: [extracted-model]
        outputs: [packages/debate_core/src/debate_core/integrations/pdf_extractor.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: PDF extraction tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/test_pdf_extractor.py]
      - id: golden-tests
        kind: Task
        name: Golden extraction fixtures and gates
        description: >-
          Saved HTML/PDF samples with expected paragraph output under tests/fixtures/extraction/; type
          check and import boundaries.
        dependsOn: [html-extractor, pdf-extractor]
        outputs: [tests/fixtures/extraction/]
        estimatedEffort: 1.5h
        acceptanceCriteria:
          - type: test_passes
            name: Golden extraction suite passes
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations, -k, "extractor"]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
status:
  phase: Pending
