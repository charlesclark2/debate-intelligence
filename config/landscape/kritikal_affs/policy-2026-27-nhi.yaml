# The kritikal affirmative (v1-e32-t17, the PM's rulings of 2026-10-25). A round reads position_id when
# a file of it holds no plan text and a K-aff marker: a role of the ballot (v1-e32-t11's labels), an
# advocacy-statement label (`Advocacy`, `Advocacy statement`, `Our advocacy is`, inline `Advocacy:`),
# `The 1AC is`, or a method label (`Method`, `Our method is`, inline `Method:`; not `Methods`). The
# markers are in the code; this file names the position and the K families.
#
# families: what the report's kritikal-affirmative group counts in the K-aff files' headings, a family
# per line with the files and teams naming it. It is a count of words in headings, never a placement:
# a family names no position and moves no round. Lowercase words, matched whole in a heading as the
# normalizer writes it; a longer phrase is matched first, so "racial cap" is not also "cap".
# docs/guides/landscape-taxonomy.md says how to edit it. No team, school or text is written here.
