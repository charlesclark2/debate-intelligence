             expect: {position: hubris-contention, role: READS, method: ALIAS}}
          - {path: [1NC, Hubris, Impact], tag: Backlash ends research, carries_alias: true,
             expect: {position: hubris-contention, role: READS, method: INHERITED}}
          - {path: [1NC, Cap K, Link], tag: Biotech is commodified, carries_alias: true,
             expect: {position: cap-k, role: READS, method: INHERITED}}
          - {path: ["AT: Util"], tag: Util fails, carries_alias: true,
             expect: {position: util-criterion, role: ANSWERS, method: ALIAS}}
          - {path: [Moral Hazard], tag: Revival breeds complacency, carries_alias: true,
             expect: {position: moral-hazard-response, role: READS, method: ALIAS}}
          - {path: [Theory, Nibs Bad], tag: Nibs skew time, carries_alias: true,
