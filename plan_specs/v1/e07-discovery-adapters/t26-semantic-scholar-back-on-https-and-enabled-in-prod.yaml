# TASK v1-e07-t26-semantic-scholar-back-on-https-and-enabled-in-prod - Semantic Scholar goes back to HTTPS once its keyed HTTPS endpoint works, and prod enables it
# Epic: E07 Discovery Provider Adapters | Release: v1.4 (Federated research from the CLI) | Major: V1
