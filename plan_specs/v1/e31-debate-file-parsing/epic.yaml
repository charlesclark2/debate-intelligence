# EPIC E31 — Debate File Parsing
# Major version: V1 | Release: v1.1 (Caselist evidence store)
# Architecture refs: §6 FileIntelligenceService, §13 Argument graph (file parsing), §16
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-debate-file-parsing
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: E31 — Debate File Parsing
    debate/architecture-refs: §6 FileIntelligenceService, §13 Argument graph (file parsing), §16
spec:
  description: >-
    Decide the editor and file-format reference (CardMirror evaluation, ADR-0014), define the shared Verbatim/CardMirror
    style profile, and parse imported .docx files into pockets, hats, blocks, tags, cites and card bodies
    with formatting and provenance, with card-level deduplication across teams.
  priority: 2
  constraints:
    majorVersion: v1
    release: v1.1
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      ADR-0014 records whether CardMirror becomes the team's editor and how our files stay compatible
      with it.
  - id: ac2
    description: >-
      The parser turns caselist and camp .docx files into structured cards with formatting offsets and
      source provenance, with measured accuracy.
  - id: ac3
    description: >-
      Cards are fingerprinted so the same card disclosed by many teams is counted once, with every occurrence
      recorded.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e31-debate-file-parsing-plan
  namespace: debate-intelligence
