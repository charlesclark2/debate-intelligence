# TASK v1-e01-t43-container-diff-read-part-by-part - A change to container.py reaches only the tests of the parts it changes
# Epic: E01 Repository & Delivery Foundation | Release: v1.0 (Foundation & verified evidence core) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e01-t43-container-diff-read-part-by-part
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.0
    debate/epic: v1-e01-repo-foundation
  annotations:
    debate/title: "A change to container.py reaches only the tests of the parts it changes"
spec:
  # Filed by the PM, 2026-10-30, from v1-e01-t39's Follow-up work.
  description: >-
    v1-e01-t39 reads container.py part by part for its imports, but a change to the file itself
    is still read as the whole file: five of t38's twenty merges edited it, carrying 152 of the
    335 files still selected through app.py. Read the diff part by part, so a new or changed
    factory reaches only what names it, failing toward the whole file for module-level changes.
  priority: 3
  constraints:
    packages: [scripts, tests/scripts]
    forbidden:
      - A test that reaches a changed part left unselected
  context: []
  acceptanceCriteria:
    - id: ac1
      description: >-
        t38's merges that edit container.py are re-measured, selecting fewer files, with the
        collected count unchanged; a module-level edit still selects the whole file; tests
        shown failing first.
status:
  phase: InProgress
