# TASK v1-e34-t36-token-unreadable-hint-on-the-mac - A Mac run stopped for an unreadable token says to log out and log in again
# Epic: E34 Caselist Sync | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e34-t36-token-unreadable-hint-on-the-mac
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e34-caselist-sync
  annotations:
    debate/title: "A Mac run stopped for an unreadable token says to log out and log in again"
spec:
  # Filed by the PM, 2026-10-31, from v1-e34-t35's check of the neighbouring codes (the PM's review, 2026-10-31).
  description: >-
    A run stopped by `CASELIST_TOKEN_UNREADABLE` reads "stopped: an error recorded as
    CASELIST_TOKEN_UNREADABLE" with no hint, in both modes. On the Mac the fix is the error's
    own: `caselist auth logout`, then `caselist auth login`. In the cloud it is the Wednesday
    login, so bucket mode stays as it is. Follow v1-e34-t35's pattern: a `fix_for` branch
    outside bucket mode, and words in `_WHAT_STOPPED_A_RUN` listed in
    `_WORDS_OUTSIDE_BUCKET_MODE_ONLY`.
  priority: 3
  constraints:
    packages: [debate_core.application, packages/debate_core/tests, docs/runbooks]
    forbidden:
      - A change to the cloud run's notice for this code
      - Network or AWS access in a test
  context:
    - kind: TaskRef
      name: v1-e34-t35-token-missing-hint-on-the-mac
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Outside bucket mode a run stopped for an unreadable token names logout then login
        and has its own words; in bucket mode the notice is unchanged, asserted by its old
        text; by tests shown failing first.
status:
  phase: Pending
