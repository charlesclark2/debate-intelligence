        kind: Task
        name: Shuffle
        description: >-
          Order-dependence checks use a plugin that is installed, or commands stop naming
          one that isn't.
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Shuffle tests pass
            command: uv
            args: [run, pytest, tests/docs, tests/scripts, -k, randomly or agreements]
