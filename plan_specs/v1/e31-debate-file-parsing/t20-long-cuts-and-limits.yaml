# TASK v1-e31-t20-long-cuts-and-limits - Long cuts join the one cluster that holds them, and the matching limits are set from samples
# Epic: E31 Debate File Parsing | Release: v1.1 | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e31-t20-long-cuts-and-limits
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.1
    debate/epic: v1-e31-debate-file-parsing
  annotations:
    debate/title: "Long cuts join the one cluster that holds them, and the matching limits are set from samples"
spec:
  # Filed by the PM, 2026-10-15, from v1-e31-t11's Follow-up work 1 and 3 to 6, and its Decision 1.
  description: >-
    What v1-e31-t11 measured and left in card matching. (1) Long cuts joined to the one cluster
    that holds them, with Decision 1's alternative as the starting design; it is the change that
    would re-join the divided pairs, since it merges the two long copies a cut sits between. (2)
    `MIN_CUT_SHARE`: 272 short cuts are under it, 91 of them between a tenth and a quarter; set
    it from the second sample of t11's step 7. (3) `MAX_CONTAINER_CLUSTERS` counts clusters
    before it confirms any, so a much-read card whose long copies are split fills the count with
    copies of itself; re-measure after (1). (4) A short body nine-tenths inside a body that
    lacks one of its ends: 26 on the corpus; a `sample --kept-apart-by lacking-an-end` decides
    whether they are copies. (5) A short body's own cluster is not among its witnesses; change
    it with (1). (6) Chains: the largest clusters lump different passages of one article,
    joined through long bodies that hold several of them; 62% of hspf26's largest cluster's
    pairs of distinct texts share no text, and 51% of hspolicy26's. (7) A false join: t11's join
    sample found two bodies sharing no text, joined because a third body holds all of both. The
    PM's ruling on t11's Follow-up 2 (2026-10-16): a card is a passage. Two bodies are one card
    when one holds the other or they overlap; two passages of one article are two cards. Bodies
    join only on text they share directly, never transitively through a third body. A body that
    holds the passages of two or more clusters is not a witness for joining any of them. This
    task is measured by v1-e31-t21's cluster shapes, not by a person reading large clusters; a
    person sees only the pairs whose overlap a rule cannot decide, through v1-e31-t21's sampler.
    t11's tallies and the shapes before this task are in docs/data/caselist-parse-report.md
    ("Card matching under card-fingerprint-v3, measured"). Amended by the PM, 2026-10-16. (8)
    t21's sampler decides contained pairs as the same card without showing them, but a short
    quote that two articles both carry is contained in each without being one card: that is the
    `MIN_CUT_SHARE` question of (2). Give `sample` an option that shows the person the pairs of
    one decided shape (for example contained, under a third of the larger), tallied apart from
    the rule's, without changing the rule's default. t21's join sample with the rule decided 19
    of 20 and asked 1, and openev's second-largest cluster holds 41% of pairs sharing no text.
    (8) added by the PM, 2026-10-17, from v1-e31-t21's Follow-up work 1.
  priority: 2
  constraints:
    packages: [debate_core.evidence, debate_core.application, packages/debate_core/tests, scripts, docs/data]
    forbidden:
      - A merge that joins two cards a coach-checked sample called different
      - Running the corpus measurements or a re-parse in a session (operator-run only)
      - Card text, school, team code or file name in a fixture from a real file, a report or a commit
  context:
    - kind: TaskRef
      name: v1-e31-t11-long-card-splits-and-fragment-merges
      relation: dependsOn
    - kind: TaskRef
      name: v1-e31-t21-cluster-shapes-and-sampler
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        (1), (5) and (7): the design is built on synthetic fixtures, shown failing first,
        including two disjoint bodies and a third holding both, which stay apart. The
        operator's join sample of 20 newly joined pairs, through v1-e31-t21's sampler, has no
        pair the coach calls different.
    - id: ac2
      description: >-
        (2) and (3): each limit is set from the recorded samples, with the figures in the
        report, and re-measured after (1).
    - id: ac3
      description: >-
        (4): the sample decides, and the rule follows it, by test.
    - id: ac4
      description: >-
        `fingerprint_version` is bumped, and the operator's re-parse records clusters,
        merges and divided pairs before and after in docs/data/caselist-parse-report.md.
    - id: ac5
      description: >-
        (6): after the rebuild, v1-e31-t21's shapes show under 5% of pairs sharing no text in
        each caselist's three largest clusters, against 62% and 51% before, with the figures in
        the report. A cluster over 5% is listed with its shape, and the PM decides whether it
        is a defect. Added by the PM, 2026-10-16.
    - id: ac6
      description: >-
        (8): `sample` can show the pairs of a decided shape the person names, tallied apart, by
        test; the operator's sample of contained pairs under a third of the larger, through it,
        sets or confirms `MIN_CUT_SHARE` with ac2. Added by the PM, 2026-10-17.
status:
  phase: Pending
