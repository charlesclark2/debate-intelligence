# EPIC E25 — Scouting Reports
# Major version: V3 | Release: v3.4 (Scouting reports)
# Architecture refs: §3 V3 scouting story, §13 Opponent intelligence
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v3-e25-scouting-reports
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v3
    debate/release: v3.4
    debate/epic: v3-e25-scouting-reports
  annotations:
    debate/title: E25 — Scouting Reports
    debate/architecture-refs: §3 V3 scouting story, §13 Opponent intelligence
spec:
  description: >-
    Summarize an opponent's disclosed positions and results into a sourced scouting report and feed disclosures
    into coverage predictions.
  priority: 16
  constraints:
    majorVersion: v3
    release: v3.4
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      A scouting report lists disclosed positions, side tendencies and results with a source link and
      retrieval time for every assertion.
  - id: ac2
    description: >-
      Reports never contain unsourced claims; inferences are labeled.
  - id: ac3
    description: >-
      Disclosures improve coverage-analysis predictions.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
