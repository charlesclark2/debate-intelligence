spec:
  # Filed by the PM, 2026-10-21, from v1-e39-t03's Follow-up work.
  description: >-
    The E33 writer's `provenance_line` and
    `debate_core.domain.evidence_search.occurrence_provenance_line` compose the same line from
    different records, held together only by tests. The writer calls the domain function,
    converting its record at the boundary, and the duplicate is removed. A built file's bytes do
    not change.
  priority: 3
  constraints:
    packages: [debate_core.domain, debate_core.integrations, packages/debate_core/tests]
    forbidden:
      - Any change to a built file's bytes or a provenance line's wording
      - Network or AWS access in any test
  acceptanceCriteria:
    - id: ac1
      description: >-
        One function composes the provenance line for both, and the writer's golden files
        are byte for byte unchanged.
