    Run the affected tests on pull requests into dev, and everything on pushes and promotions.
  goalRef:
    name: v1-e01-t38-ci-affected-tests-on-dev-pull-requests
  graph:
    nodes:
      - id: ci-affected-tests
        kind: Task
        name: CI affected tests on dev pull requests
        description: >-
          Run the affected tests on pull requests into dev, and everything on pushes and
          promotions.
