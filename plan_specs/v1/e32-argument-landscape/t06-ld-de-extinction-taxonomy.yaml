# TASK v1-e32-t06-ld-de-extinction-taxonomy - LD de-extinction position taxonomy
# Epic: E32 Argument Landscape Reports | Release: v1.2 (Argument landscape & file building) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e32-t06-ld-de-extinction-taxonomy
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.2
    debate/epic: v1-e32-argument-landscape
  annotations:
    debate/title: "LD de-extinction position taxonomy"
spec:
  # Filed by the PM, 2026-10-22, from the coach's priorities of 2026-10-22 (LD moves to the de-extinction topic after its last two space colonization tournaments).
  description: >-
    The LD position taxonomy for the November-December 2026 de-extinction topic, built with
    v1-e32-t01's seeding script and file format: values and criteria/standards, affirmative
    contention types and plans where teams read them, and the negative's DAs, CPs, Ks and
    theory, with generic.yaml reused for format-level positions (LD tricks, phil frameworks).
    The coach supplies the resolution's wording and its date range for
    `config/landscape/topics.yaml`; the session never writes a resolution from memory. Seeding
    first counts how many disclosed hsld26 files the store holds on the new topic, and seeds
    only from headings it holds; with too few files the task stops and says so in its report,
    and the coach decides when to run it again. The space colonization topic keeps its date
    range with no taxonomy, so earlier snapshots resolve. No code changes are expected beyond
    what t01 built; if t01's seeding or loader needs a change for LD, it is made here and named
    in the report.
  priority: 2
  constraints:
    packages: [config/landscape, scripts, debate_core.arguments, tests/config]
    forbidden:
      - Debater names, team codes or initials anywhere in taxonomy YAML or seeding fixtures
      - Hardcoding caselist slugs or topic wording in Python code (config only)
      - Writing a resolution's wording from memory; the coach supplies it
      - Model calls in the taxonomy loader or seeding step (seeding is deterministic)
      - Committing the real parsed corpus or heading dumps that include source paths with team codes
  context:
    - kind: TaskRef
      name: v1-e32-t01-position-taxonomy
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        `config/landscape/topics.yaml` maps hsld26 for the de-extinction date range the
        coach gave to a new taxonomy file, and keeps the space colonization range with no
        taxonomy.
    - id: ac2
      description: >-
        The de-extinction taxonomy has at least 12 active positions seeded from hsld26
        headings, each with a stable id, label, kind, side and at least one heading alias,
        and passes t01's loader and config tests.
    - id: ac3
      description: >-
        The report records how many disclosed hsld26 files on the new topic the seeding
        counted, the candidate count, and how many candidates the coach kept, merged or
        dropped, as counts only.
    - id: ac4
      description: >-
        The coach has reviewed the seeded file, and a `landscape report --caselist hsld26`
        dry run on the newest snapshot resolves the new topic.
status:
  phase: Pending
