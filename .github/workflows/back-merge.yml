# Opens the main → dev back-merge pull request after a hotfix (v1-e01-t08-branch-promotion-workflow).
#
# A hotfix merges into main from hotfix/<slug>, so main then holds commits dev lacks, and the
# `back-merge` check in promotion-guard.yml fails every promotion until dev has them. On every run,
# whatever started it, the first job asks scripts/check_promotion_source.py whether dev lacks
# anything, and if it does, opens a "Back-merge main → dev" pull request, or names the open one and
# leaves it in place (its head is main itself, so it already carries the new commits). A promotion
# from dev puts only a merge commit on main, which the check ignores, so after a promotion, and on
# any run where main and dev agree, it calls nothing on GitHub and prints one `OK:` line.
#
# The pull request's head is `main`, not a branch copied from it. That needs no write to the
# repository's contents: pushing a copy with the workflow token would be refused whenever the new
# commits touch .github/workflows/, which the token can never be granted. It also means the head
# commit already carries the green `ci` from the push to main, which matters because pull requests
# opened with the workflow token start no workflows of their own. Merging it cannot delete main:
# protect-main restricts deletion and has an empty bypass list.
#
# Needs the repository setting Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests"; without it `gh pr create` is refused and this job fails, which is the
# signal to back-merge by hand.
#
# A second job re-runs promotion-guard.yml on the pull requests open against main whose guard has
# not yet seen main's current tip (v1-e01-t12-promotion-guard-rerun, v1-e01-t15-promotion-guard-sweep).
# Merging into main re-runs nothing on pull requests already open against it, GitHub has no "base
# branch moved" event, and "require branches to be up to date" is off on purpose, so without this a
# promotion opened before a hotfix keeps a stale green `back-merge` and can merge a combination dev
# never validated. The re-run is how its `back-merge` learns main moved. Three triggers start both
# jobs; every one sweeps with the same scripts/rerun_promotion_guards.py and opens the back-merge
# pull request if dev lacks something (v1-e01-t26):
#
#   push               the fast path. main just moved, so this is seconds after a hotfix merges.
#   schedule           the backstop that needs no event. On 2026-09-30 GitHub never delivered the push
#                      for a merged hotfix (t12's sandbox proof): no workflow ran, nothing failed, and
#                      the promotion stayed green and wrong. Everything push-triggered is blind to that,
#                      so the schedule sweeps whether or not anything happened.
#   workflow_dispatch  the manual route: one click for an operator who notices a lost push. It takes no
#                      inputs. It runs from main or dev only (both jobs refuse any other ref).
#
# Why the schedule opens the back-merge pull request too, and not only the dispatch. Before
# v1-e01-t26 only a push opened it, so after a lost push the sweep turned a promotion red while the
# pull request that red check names did not exist. A dispatch now opens it, but a dispatch needs
# someone who already knows the push was lost. The schedule is the one route that needs nobody, and
# when no promotion is open the sweep has nothing to turn red: the back-merge pull request is then
# the only sign anywhere that a hotfix's push was lost, and the "same day" back-merge rule depends on
# it appearing. The cost is one short job in a scheduled run that exists anyway; when main and dev
# agree it calls nothing on GitHub, so nothing changes on any pull request, label or check.
#
# The sweep is quiet when nothing moved. promotion-guard.yml's `back-merge` job records the main
# commit it compared, as a notice on its check run, and a pull request whose newest guard run
# recorded main's current tip is left alone; a sweep that re-runs nothing prints one line. Only a
# run that recorded another commit, or none, is re-run. The script's docstring has the details.
#
# Why every 15 minutes. Charlie merges promotions by hand, usually within an hour of opening them, so
# the question is how long a lost push may leave a promotion green before the sweep turns it red.
# Four sweeps an hour bound that at about 15 minutes plus GitHub's start delay. GitHub delays scheduled
# runs under load and sometimes drops them; a dropped slot costs one more interval (about 30 minutes
# in all), and even two dropped in a row keep the stale window inside the hour a promotion usually
# stays open. A shorter interval would mostly add idle runs to the Actions list where a red run has
# to be noticed, and still could not close the window entirely: a merge in the minutes after a lost
# push is caught only by the hotfix template's checklist, which asks for the re-run job to have
# passed on the push. The minutes are off the hour because that is when GitHub's scheduler is busiest.
# A scheduled run uses this file as it is on the default branch, dev.
#
# Measured, 2026-10-15: GitHub ran this schedule about every two to five hours on this repository,
# not four times an hour, so in practice the bound above is hours. The schedule stays as the backstop
# for a push nobody notices was lost, and a promotion dispatches this workflow once just before it
# merges (the promotion template's checklist), so its guard is current whatever the schedule does.
#
# Runs only on push to main, the schedule and a dispatch, never on a pull request, so no fork's code
# ever runs with the write permissions below. Each is scoped to the one job that needs it. Both jobs
# check out only this workflow's own commit of main or dev, never a pull request's code, and refuse
# to run from any other ref. The sweep reads pull requests and runs through the API.

name: Back-merge main into dev

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  open-back-merge-pull-request:
    # Every trigger runs this, not only a push (v1-e01-t26). After a lost push, the schedule or a
    # dispatch is the only run there is, and it has to open the pull request that the red
    # `back-merge` check tells the operator to merge. With nothing to back-merge it calls nothing.
    # One group for every trigger, so two of these never run at once and cannot both find no pull
    # request open and both open one. A pending one replaced by a newer one loses nothing: the newer
    # one does the same from the live branches. A sweep never waits behind this job.
    concurrency:
      group: back-merge
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # open the back-merge pull request
    steps:
      # The checkout below is this workflow's own commit, and its script runs before the step that
      # holds the token. A push runs from main and the schedule from dev; a dispatch could name any
      # branch, including a pull request's, so it is refused there, as in the sweep.
      - name: Run only from main or dev
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Dispatch this workflow from main or dev; it checks out the ref it runs from."
          exit 1
      # Full depth for the same reason as promotion-guard.yml's back-merge job: a shallow clone
      # would answer "nothing missing" and no pull request would open.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch main and dev
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main
          +refs/heads/dev:refs/remotes/origin/dev
      - name: Find the commits on main that dev lacks
        id: compare
        # Exit 1 means dev lacks commits, which is this job's reason to act; exit 2 means the check
        # could not run, which fails the job.
        run: |
          status=0
          python3 scripts/check_promotion_source.py back-merge --head dev > compare.txt || status=$?
          cat compare.txt
          case "$status" in
            0) echo "needed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "needed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Open the back-merge pull request unless one is open
        if: steps.compare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The label is the warning on the pull request list: a squashed back-merge leaves main's
          # commits unreachable from dev and the `back-merge` check red for good. --force makes this
          # an idempotent create-or-update; the labels API accepts pull-requests: write.
          gh label create back-merge --repo "$REPO" --force --color B60205 \
            --description "Merge with a merge commit, never squash: a squash keeps back-merge red"
          open_pr=$(gh pr list --repo "$REPO" --base dev --head main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --repo "$REPO" --add-label back-merge
            echo "Back-merge pull request #$open_pr is open; its head is main, so it already has these commits."
            exit 0
          fi
          {
            echo "main holds commits that dev lacks, so a hotfix has not been back-merged yet."
            echo "Until this merges, the \`back-merge\` check fails on every promotion from dev."
            echo
            echo '```'
            sed -n 's/^FAILED: //p; /^  [0-9a-f]\{40\} /p' compare.txt
            echo '```'
            echo
            echo "- [ ] Merge into \`dev\` with **Create a merge commit**. A squash leaves main's commits"
            echo "      unreachable from dev and the \`back-merge\` check stays red."
            echo "- [ ] Merge it the same day as the hotfix (docs/process/branching-and-environments.md)."
            echo
            echo "Opened by .github/workflows/back-merge.yml."
          } > body.md
          gh pr create --repo "$REPO" --base dev --head main --label back-merge \
            --title "Back-merge main → dev" --body-file body.md

  rerun-promotion-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Sweeps queue rather than overlap. A pending sweep replaced by a newer one loses nothing, because
    # each reads the live state. If a push's sweep and a scheduled one still overlap, the script treats
    # a run the other just re-ran as handled.
    concurrency:
      group: rerun-promotion-guards-${{ github.event_name == 'push' && 'push' || 'sweep' }}
      cancel-in-progress: false
    permissions:
      actions: write # re-run promotion-guard.yml runs
      checks: read # read the main commit each guard run recorded on its check run
      contents: read # check out the script; read main's tip
      pull-requests: read # list the pull requests open against main
    steps:
      # The checkout below is this workflow's own commit. A push and the schedule run from main and
      # dev; a dispatch could name any branch, including a pull request's, so it is refused there.
      - name: Run only from main or dev
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Dispatch this workflow from main or dev; it checks out the ref it runs from."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/rerun_promotion_guards.py
          sparse-checkout-cone-mode: false
      # Standard library only, so the runner's own python3 runs it. A failed or refused re-run, or a
      # run that never finished, fails this job: that is the signal to re-run that pull request's
      # checks by hand (docs/process/branching-and-environments.md).
      - name: Re-run promotion-guard where it has not seen main's tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/rerun_promotion_guards.py --repo "$REPO"
