  namespace: debate-intelligence
  labels:
    planspec.io/kind: release
    debate/major-version: v3
    debate/release: v3.1
  annotations:
    debate/title: v3.1 — Case coverage analysis
spec:
  description: >-
    An uploaded affirmative yields predicted opposition positions and a coverage-gap report against the
    student's extensions.
  priority: 13
  acceptanceCriteria:
  - id: epic-e22
    description: >-
      Epic E22 (Case Coverage Analysis) goal is Succeeded.
