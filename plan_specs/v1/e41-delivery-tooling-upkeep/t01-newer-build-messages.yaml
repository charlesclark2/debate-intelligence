          Give the newer-schema refusal a code and hint, and the unknown-setting refusal a
          newer-build hint.
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: CLI tests pass
            command: uv
            args: [run, pytest, packages/debate_cli/tests, -k, config or migration or doctor]
