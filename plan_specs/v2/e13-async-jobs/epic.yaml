# EPIC E13 — Async Job Orchestration
# Major version: V2 | Release: v2.1 (Async jobs & web Cut-a-Card)
# Architecture refs: §5 Step Functions/SQS/EventBridge, ADR-009, §15
# Source of truth for task ordering inside this epic. Task details live in the tNN-*.yaml files beside this one.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e13-async-jobs
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v2
    debate/release: v2.1
    debate/epic: v2-e13-async-jobs
  annotations:
    debate/title: E13 — Async Job Orchestration
    debate/architecture-refs: §5 Step Functions/SQS/EventBridge, ADR-009, §15
spec:
  description: >-
    Represent slow work as durable jobs: SQS-backed workers, Step Functions workflows for card and search
    jobs, status APIs and domain events.
  priority: 6
  constraints:
    majorVersion: v2
    release: v2.1
    rule: Every task in this epic ships in this release; no task crosses major versions.
  acceptanceCriteria:
  - id: ac1
    description: >-
      CardJob and SearchJob run asynchronously with retries/catches and inspectable state.
  - id: ac2
    description: >-
      Clients poll or subscribe (SSE) to job status with explicit failure states.
  - id: ac3
    description: >-
      Jobs are idempotent and carry correlation ids across API, workflow, worker and model calls.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e13-async-jobs-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: epic
    debate/major-version: v2
    debate/release: v2.1
    debate/epic: v2-e13-async-jobs
spec:
  description: >-
    Task graph for epic E13 (Async Job Orchestration). Each Task node points at its own task-level PlanSpec.
  goalRef:
    name: v2-e13-async-jobs
  version: '1'
  graph:
    nodes:
    - id: ext-v1-e06-t02-card-service
      kind: External
      name: 'Prerequisite from E06: CardService pipeline'
      description: >-
        Cross-epic prerequisite owned by v1-e06-card-cutting (release v1.1).
      inputs:
        goalRef: v1-e06-t02-card-service
        specRef: plan_specs/v1/e06-card-cutting/t02-card-service.yaml
    - id: ext-v1-e08-t01-federated-search-service
      kind: External
      name: 'Prerequisite from E08: SearchService fan-out'
      description: >-
        Cross-epic prerequisite owned by v1-e08-research-workflows (release v1.2).
      inputs:
        goalRef: v1-e08-t01-federated-search-service
        specRef: plan_specs/v1/e08-research-workflows/t01-federated-search-service.yaml
    - id: ext-v1-e08-t07-daily-command
      kind: External
      name: 'Prerequisite from E08: `debate-research daily` digests'
      description: >-
        Cross-epic prerequisite owned by v1-e08-research-workflows (release v1.2).
      inputs:
        goalRef: v1-e08-t07-daily-command
        specRef: plan_specs/v1/e08-research-workflows/t07-daily-command.yaml
    - id: ext-v2-e10-t05-container-platform
      kind: External
      name: 'Prerequisite from E10: Networking, ECR and ECS/Fargate cluster'
      description: >-
        Cross-epic prerequisite owned by v2-e10-aws-foundation (release v2.0).
      inputs:
        goalRef: v2-e10-t05-container-platform
        specRef: plan_specs/v2/e10-aws-foundation/t05-container-platform.yaml
    - id: ext-v2-e11-t03-dynamodb-repositories
      kind: External
      name: 'Prerequisite from E11: DynamoDB repository implementations'
      description: >-
        Cross-epic prerequisite owned by v2-e11-cloud-persistence (release v2.0).
      inputs:
        goalRef: v2-e11-t03-dynamodb-repositories
        specRef: plan_specs/v2/e11-cloud-persistence/t03-dynamodb-repositories.yaml
    - id: ext-v2-e12-t05-core-endpoints
      kind: External
      name: 'Prerequisite from E12: Core resource endpoints'
      description: >-
        Cross-epic prerequisite owned by v2-e12-identity-api (release v2.0).
      inputs:
        goalRef: v2-e12-t05-core-endpoints
        specRef: plan_specs/v2/e12-identity-api/t05-core-endpoints.yaml
    - id: t01
      kind: Task
      name: Job entity and repository
      description: >-
        Job states, type, idempotency key, progress, result refs, error details; repository + contract
        tests.
      inputs:
        specRef: plan_specs/v2/e13-async-jobs/t01-job-model.yaml
        goalRef: v2-e13-t01-job-model
      dependsOn:
      - ext-v2-e11-t03-dynamodb-repositories
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e13-t01-job-model reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e13-t01-job-model
    - id: t02
      kind: Task
      name: SQS queues and worker framework
      description: >-
        Queues + DLQs in Terraform, debate_workers handler framework (visibility timeouts, retries, poison
        handling) running on Fargate.
      inputs:
        specRef: plan_specs/v2/e13-async-jobs/t02-sqs-workers.yaml
        goalRef: v2-e13-t02-sqs-workers
      dependsOn:
      - t01
      - ext-v2-e10-t05-container-platform
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e13-t02-sqs-workers reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e13-t02-sqs-workers
    - id: t03
      kind: Task
      name: CardJob Step Functions workflow
      description: >-
        fetch → extract → cite → select → verify → persist states with retries/catches mapped to AccessStatus/VerificationStatus.
      inputs:
        specRef: plan_specs/v2/e13-async-jobs/t03-card-job-workflow.yaml
        goalRef: v2-e13-t03-card-job-workflow
      dependsOn:
      - t02
      - ext-v1-e06-t02-card-service
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e13-t03-card-job-workflow reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e13-t03-card-job-workflow
    - id: t04
      kind: Task
      name: SearchJob workflow
      description: >-
        Provider fan-out (Map state or worker fan-out), normalization/ranking, persisted results.
      inputs:
        specRef: plan_specs/v2/e13-async-jobs/t04-search-job-workflow.yaml
        goalRef: v2-e13-t04-search-job-workflow
      dependsOn:
      - t02
      - ext-v1-e08-t01-federated-search-service
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e13-t04-search-job-workflow reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e13-t04-search-job-workflow
    - id: t05
      kind: Task
      name: Job status API (polling + SSE)
      description: >-
        Create/get/list job endpoints and an SSE stream; authorization by owner/org.
      inputs:
        specRef: plan_specs/v2/e13-async-jobs/t05-job-status-api.yaml
        goalRef: v2-e13-t05-job-status-api
      dependsOn:
      - t01
      - ext-v2-e12-t05-core-endpoints
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e13-t05-job-status-api reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e13-t05-job-status-api
    - id: t06
      kind: Task
      name: EventBridge domain events and schedules
      description: >-
        Emit JobCompleted/CardVerified events; scheduled daily-research rule invoking `daily` presets
        per user.
      inputs:
        specRef: plan_specs/v2/e13-async-jobs/t06-domain-events.yaml
        goalRef: v2-e13-t06-domain-events
      dependsOn:
      - t02
      - t04
      - ext-v1-e08-t07-daily-command
      acceptanceCriteria:
      - type: command_succeeds
        name: Task spec v2-e13-t06-domain-events reports phase Succeeded
        command: uv
        args:
        - run
        - scripts/validate_specs.py
        - --require-succeeded
        - v2-e13-t06-domain-events
status:
  phase: Pending
