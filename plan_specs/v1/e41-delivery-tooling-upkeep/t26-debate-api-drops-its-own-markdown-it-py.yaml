# TASK v1-e41-t26-debate-api-drops-its-own-markdown-it-py - debate_api no longer declares markdown-it-py, which it gets through debate-core
# Epic: E41 — Delivery Tooling Upkeep | Release: v1.8 (Weekly caselist run in the cloud) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e41-t26-debate-api-drops-its-own-markdown-it-py
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.8
    debate/epic: v1-e41-delivery-tooling-upkeep
  annotations:
