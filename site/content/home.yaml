# The structured parts of the home page: the hero line, the October 1 parent session panel, the
# entry-point cards and the "what debate builds" claims. Validated by homeContentSchema in
# src/lib/content.ts at build time, and read by src/app/page.tsx, which holds no copy of its own.
#
# The prose on the home page is still content/pages/home.md. This file holds only the parts that
# are laid out rather than read straight through: a field here becomes a heading, a fact in the
# panel, a card label or a link, and the page decides where it goes.
#
# House style, enforced by the loader: no em dashes, and no acronym that content/pages/ would
# have to spell out. Every href points inside this site.
#
# The wording is Charlie's, carried over from the v1-e36-t04 draft of home.md rather than
# rewritten: the design pass moved these lines, it did not reword them.

hero:
  lead: >-
    Whitefish Bay Debate empowers students to think critically, speak confidently, and compete
    with purpose through rigorous research, strategic argumentation, and a strong team culture.
  action:
    label: Come to the parent session on October 1
    href: '#parent-session'

# The single most important thing on this page. It renders as the one navy panel, directly under
# the hero. The room is the fact nobody has yet; v1-e36-t08 fills it in before launch.
parentSession:
  eyebrow: For parents
  title: Parent information session
  intro: >-
    Come and hear how a season works: what the events are, what a tournament weekend looks like,
    what it costs, and what the team asks of a family.
  facts:
    - label: Date
      value: Wednesday, October 1, 2026
    - label: Time
      value: 6:00 PM
    - label: Place
      value: Whitefish Bay High School
    - label: Room
      value: The room is not set yet. It will be posted here before the session.
  whatToExpect:
    - The three events the team competes in, explained in plain language.
    - What a tournament weekend actually looks like, from Friday to Sunday.
    - What a season costs, and what help is available.
    - What the team asks of a family, and what it does not.
  note: >-
    Bring your questions. You do not need to know anything about debate to come, and your student
    does not have to have decided anything yet.
  action:
    label: Read the questions parents ask
    href: /faq/

entryPoints:
  eyebrow: Start here
  title: Four things worth knowing first
  intro: >-
    Each one is a short page. Read the one that matches the question you came with.
  cards:
    - title: What the events are
      body: >-
        Policy, Lincoln-Douglas and Public Forum, explained for someone who has never seen a
        round, with what makes each one different.
      actionLabel: Read what the events are
      href: /events/
    - title: How to join
      body: >-
        Open to every student in grades 9 through 12, with no experience required and no tryout.
        Practice times and the three ways to sign up.
      actionLabel: Read how to join
      href: /join/
    - title: Questions parents ask
      body: >-
        Travel, costs, time commitment, judging, and what the team asks of a family over a
        season.
      actionLabel: Read the parent questions
      href: /faq/
    - title: Who coaches the team
      body: >-
        The coaching staff, how to reach them, and who to write to with a question about your
        student.
      actionLabel: Meet the coaches
      href: /coaches/

# The prose section, whose body is content/pages/home.md. Only its heading lives here.
prose:
  eyebrow: New to this
  title: What debate actually is

whatDebateBuilds:
  eyebrow: Why it is worth the weekends
  title: What debate builds
  intro: >-
    A season of debate asks a student to do four hard things well, over and over, in front of
    someone keeping score.
  claims:
    - title: Research that holds up
      body: >-
        Students find the evidence, read the whole source, and learn quickly what happens to an
        argument built on a sentence taken out of context.
    - title: Speaking under pressure
      body: >-
        Six minutes, a clock, and a judge. By the end of a season a student can stand up with
        four minutes of preparation and be worth listening to.
    - title: Thinking on both sides
      body: >-
        Every student argues both sides of the same question across a season, which is the
        fastest way there is to stop arguing against a caricature.
    - title: A team that travels together
      body: >-
        Long bus rides, early mornings, and a room full of people who take your ideas seriously.
        The team culture is the part students come back for.
