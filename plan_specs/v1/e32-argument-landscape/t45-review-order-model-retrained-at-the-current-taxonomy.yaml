  # Filed by the PM, 2026-11-02, from v1-e32-t41's follow-up 2 (the PM's review, 2026-11-02).
  description: >-
    The local classifier that orders the review queue was trained under taxonomy 1.4.0. It has
    not ordered the queue since 1.4.1, and still won't at 1.5.0, which added three positions.
    Train it again with `scripts/compare_local_classifier.py` at 1.5.0, record its comparison
    figures beside the last training's in docs/data, and let the queue use it again. Counts and
    ids only.
  priority: 3
  constraints:
    packages: [scripts, debate_core.application, packages/debate_core/tests, docs/data]
    forbidden:
      - Card text in the report, docs or logs
      - A live model call
      - A school, team code or debater name anywhere
