    scenarios:
      - {name: clog, forms: [clog, court clog]}                    # 2 teams (2 documents)
      - {name: court curbing, forms: [court curbing]}  # 2 teams (2 documents)
    not_scenarios: []
  - id: inequality-advantage
    label: Inequality advantage
    kind: advantage
    side: aff
