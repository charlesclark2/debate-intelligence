        cards:
          - {path: [1AC, Framework, "Value: Justice"], tag: Justice is the highest value, carries_alias: true,
             expect: {position: justice-value, role: READS, method: ALIAS}}
          - {path: [1AC, Framework, Util], tag: Consequences matter, carries_alias: true,
             expect: {position: util-criterion, role: READS, method: ALIAS}}
          - {path: [1AC, Framework], tag: Weigh outcomes, carries_alias: false,
             expect: {position: null, role: null, method: null}}
          - {path: [1AC, Ecosystems], tag: Tundra collapses, carries_alias: true,
             expect: {position: ecosystem-contention, role: READS, method: ALIAS}}
          - {path: [1AC, Ecosystems, Keystone species], tag: Keystones hold webs together, carries_alias: true,
             expect: {position: ecosystem-contention, role: READS, method: INHERITED}}
          - {path: [1AC, Ecosystems, Revival], tag: Mammoth revival restores tundra, carries_alias: true,
             expect: {position: species-revival-contention, role: READS, method: TAG_KEYWORD}}
          - {path: [1AC, Ecosystems, Revival], tag: Revival restores tundra, carries_alias: true,
             expect: {position: ecosystem-contention, role: READS, method: INHERITED}}
          - {path: [1AC, Utilitarianism, "AT: Deontology"], tag: Rules fail, carries_alias: true,
             expect: {position: util-criterion, role: READS, method: INHERITED}}
          - {path: [1AC, Framework, "Value: Justice", Definitions], tag: Justice defined, carries_alias: true,
             expect: {position: justice-value, role: READS, method: ALIAS}}
          - {path: ["AT: Hubris", Turn], tag: Caution is the real hubris, carries_alias: true,
             expect: {position: hubris-contention, role: ANSWERS, method: INHERITED}}
          - {path: [1AR, "AT: Moral Hazard"], tag: No hazard, carries_alias: true,
             expect: {position: moral-hazard-response, role: ANSWERS, method: ALIAS}}
          - {path: [Theory, "AT: Disclosure"], tag: Disclosure is not a norm, carries_alias: true,
             expect: {position: disclosure-theory, role: ANSWERS, method: ALIAS}}
          - {path: [Morality], tag: Morality first, carries_alias: true,
             expect: {position: morality-value, role: READS, method: ALIAS}}
      - name: ld-neg-file
        team_names: [Birch Hollow, BH]
        cards:
