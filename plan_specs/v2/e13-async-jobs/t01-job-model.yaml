# TASK v2-e13-t01-job-model — Job entity and repository
# Epic: E13 Async Job Orchestration | Release: v2.1 (Web app, debate tub & async jobs) | Major: V2
# Architecture refs: §5 Step Functions/SQS/EventBridge, ADR-009 async jobs, §7, §15
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v2-e13-t01-job-model
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.1
    debate/epic: v2-e13-async-jobs
  annotations:
    debate/title: Job entity and repository
    debate/architecture-refs: §5, ADR-009, §15
spec:
  description: >-
    Model asynchronous work as a first-class domain entity so browser requests never wait on article,
    LLM or export latency (ADR-009). Add a Job entity (job_id ULID, owner_id, organization_id, type such
    as CARD/SEARCH/EXPORT, state machine QUEUED → RUNNING → SUCCEEDED | FAILED | CANCELLED | CONFLICT,
    idempotency_key, progress steps with percentage and current stage, result_refs pointing to
    card/search ids, typed error details with a machine code such as PAYWALLED or VERIFICATION_FAILED,
    correlation_id, timestamps, ttl for transient progress), a JobRepository port with local and DynamoDB
    implementations, and contract tests. Legal state transitions are enforced in the domain. Queues and
    workers are t02, workflow wiring t03/t04 and the HTTP surface t05.
  priority: 1
  constraints:
    packages: [debate_core.domain, debate_core.application, debate_core.integrations.dynamodb]
    forbidden:
      - Storing full article text, model prompts or evidence bodies on Job items (store refs only)
      - Illegal state transitions (e.g. SUCCEEDED → RUNNING) being persistable
      - boto3 imports outside debate_core.integrations
      - A separate DynamoDB table without updating the AppTable design/ADR from E11-t01
  context:
    - kind: TaskRef
      name: v2-e11-t03-dynamodb-repositories
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Job and JobState exist in debate_core.domain with a transition() method; property tests show only
        the documented transitions succeed and terminal states are final.
    - id: ac2
      description: >-
        Creating a job with an existing (owner_id, idempotency_key) returns the original job instead of a
        duplicate, in both local and DynamoDB repositories.
    - id: ac3
      description: >-
        JobRepository supports get, list_by_owner (newest first, cursor), list_by_state for operators, and
        conditional update_progress/transition guarded by the current state.
    - id: ac4
      description: >-
        The shared repository contract suite includes Job cases and passes for local and DynamoDB Local
        backends.
    - id: ac5
      description: >-
        JobError codes cover retrieval, paywall/access, extraction, model, verification, conflict and
        internal failures, and map one-to-one to AccessStatus/VerificationStatus where applicable.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v2-e13-t01-job-model-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v2
    debate/release: v2.1
    debate/epic: v2-e13-async-jobs
spec:
  description: >-
    Domain entity and transitions, then the port and local implementation, then DynamoDB keys and
    adapter, then contract tests.
  goalRef:
    name: v2-e13-t01-job-model
  graph:
    nodes:
      - id: job-entity
        kind: Task
        name: Job entity, states and error codes
        description: >-
          Pydantic Job, JobState, JobType, JobProgress and JobError with transition rules and docstrings.
        outputs: [packages/debate_core/src/debate_core/domain/jobs.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Job transition tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/domain/test_jobs.py]
      - id: job-port-local
        kind: Task
        name: JobRepository port and local implementation
        description: >-
          Port with idempotent create and guarded transitions; filesystem/SQLite local implementation for
          CLI and tests.
        dependsOn: [job-entity]
        outputs: [packages/debate_core/src/debate_core/application/ports/jobs.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Local job repository tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/test_local_job_repository.py]
      - id: job-dynamo
        kind: Task
        name: DynamoDB job repository
        description: >-
          JOB# items plus an idempotency marker item written in the same transaction; GSI for owner and
          state listings per the AppTable design; ttl on progress detail items only.
        dependsOn: [job-port-local]
        outputs: [packages/debate_core/src/debate_core/integrations/dynamodb/job_repository.py]
        estimatedEffort: 3h
        acceptanceCriteria:
          - type: test_passes
            name: DynamoDB job repository tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/integrations/dynamodb, -k, job]
      - id: job-contracts
        kind: Task
        name: Job contract cases for both backends
        description: >-
          Add idempotency, transition-guard and pagination cases to the contract suite; run type and
          import checks.
        dependsOn: [job-dynamo]
        estimatedEffort: 1h
        acceptanceCriteria:
          - type: test_passes
            name: Job contract suite passes
            command: uv
            args: [run, pytest, packages/debate_core/tests/contracts, -k, job]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
status:
  phase: Pending
