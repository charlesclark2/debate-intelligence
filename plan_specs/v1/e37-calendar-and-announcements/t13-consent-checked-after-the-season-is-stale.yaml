# TASK v1-e37-t13-consent-checked-after-the-season-is-stale - A consent entry checked after its season ends is stale to the build, for names and images
# Epic: E37 — Calendar & Announcements (Coach-Editable) | Release: v1.6 (Public team website) | Major: V1
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e37-t13-consent-checked-after-the-season-is-stale
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
