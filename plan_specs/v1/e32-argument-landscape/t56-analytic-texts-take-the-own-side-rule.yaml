spec:
  # Filed by the PM, 2026-11-05, from v1-e32-t49's follow-up (the PM's review, 2026-11-05).
  description: >-
    v1-e32-t49 applies side_role to every card in PositionClassificationService.classify, so a
    card in a file disclosed only on its position's own side reads it. analytic_texts.py places
    overviews, counterplan texts and alternatives with matcher.place, outside classify: under an
    answer heading in a file on the position's own side they are ANSWERS, and the report counts
    them elsewhere. Apply the same side_role there, count first how many analytic texts across
    the newest hspolicy26 snapshot change role (counts only), and show it by tests on invented
    texts.
  priority: 3
  constraints:
    packages: [debate_core.arguments, debate_core.application, packages/debate_core/tests, docs/data]
    forbidden:
      - Analytic text, a school or team code in a test, log or report
      - A second copy of the side rule
  context:
    - kind: TaskRef
      name: v1-e32-t49-prompt-1-3-0-own-side-answers-and-the-coachs-rulings
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        Analytic texts in a file on their position's own side read it, through side_role,
        with the count of texts that change role reported, by tests on invented texts shown
        failing first.
