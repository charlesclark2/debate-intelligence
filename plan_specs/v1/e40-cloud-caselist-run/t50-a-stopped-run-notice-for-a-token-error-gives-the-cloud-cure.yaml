    and propose its title (t33 gave the expired login one of its own). (2) A bucket-mode run
    whose secret read is refused (STORE_ACCESS_DENIED at GetSecretValue, a decrypt or IAM
    change) exits 3, 'may be cured by a retry', with no hint, where a person is needed: measure
    the notice it sends today on a fake bucket, then propose its words (escalate to the PM with
    the error class; never an IAM or key-policy change by hand, as the runbook says). Stop for
    the PM's ruling on both before code. On the Mac nothing changes.
