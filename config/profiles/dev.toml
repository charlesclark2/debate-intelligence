# Environment profile: dev (DEBATE_ENV=dev)
#
# The development environment: the pre-release channel a tester installs on their own machine, and
# what a local source checkout resolves to when DEBATE_ENV is unset. It runs against public
# sources and nothing leaves the machine it runs on
# (docs/process/branching-and-environments.md).
#
# Precedence: an explicit --flag, then DEBATE_* in the environment, then .env, then this file.
# Anything not set here falls back to the built-in dev profile in
# debate_core.application.settings.
#
# NEVER put a secret in this file. It is committed. API keys, the OpenCaselist caselist_token and
# the polite-pool contact address come from the environment or from an uncommitted .env; see
# .env.example.
#
# The channel values below — which models dev routes to and the daily budget — are owned by
# v1-e01-t09-dev-prerelease-channel, which replaces the placeholders with the real dev routing
# file.

allow_network = true

[storage]
# Separate from prod, so a dev build can never write to the team's real evidence store.
data_dir = "~/.debate-research/dev"

[storage.s3]
# The dev evidence bucket, as `terraform -chdir=infrastructure/envs/dev output` reports it:
# bucket = evidence_bucket_name, aws_profile = evidence_operator_profile_name, region =
# aws_region. They are written here rather than read from Terraform state because the bucket
# suffix is a committed constant chosen for exactly that
# (docs/architecture/evidence-store-layout.md) — but if an apply ever reports different values,
# these are wrong and the apply is right.
#
# None of this is a secret. The credential is the SSO session `aws sso login --profile
# debate-dev-evidence` puts in the operator's own ~/.aws, which this platform never reads.
# No KMS key: the bucket's default encryption is the environment's customer-managed key, and a
# key ARN would put the account id in a committed file.
bucket = "debate-dev-evidence-a7508de8"
region = "us-east-1"
aws_profile = "debate-dev-evidence"

[providers]
enabled = ["openalex", "crossref", "rss"]

[http]
# Slower than prod on purpose: dev is where a new adapter's first, wrong version runs.
per_host_interval_seconds = 2.0
request_timeout_seconds = 30.0

[models]
routing_file = "config/model_routing.dev.yaml"
# Low cap; v1-e01-t09 owns the documented dev value and the E05 BudgetGuard enforces it.
budget_usd_daily = 2.0

[caselist]
# The E34 gate of docs/policies/caselist-data-use.md. Off by default in
# debate_core.application.settings: an installation that has not made this decision refuses to
# reach the API rather than asking. Turned on for the v1-e34-t02 validation run, after the policy was approved and the
# weekly cadence was agreed with the OpenCaselist maintainer. The cadence, the 8-per-minute
# download rate and the 5-per-day bulk cap are the maintainer's and are not raised here.
api_enabled = true
