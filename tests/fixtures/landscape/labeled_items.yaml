# Labeled items for the deterministic position matcher (v1-e32-t02-position-classification ac1).
#
# Synthetic throughout: every taxonomy, position, heading, tag, school and team code is invented,
# and nothing comes from a real disclosure. Each label was written by hand from the headings and
# the tag, never by running the matcher (working agreement 6).
#
# One block per format, each with its own small taxonomy, the coach's overrides and the caselist's
# schools. A document lists its disclosing team's own names (taken out of its headings before
# matching) and its cards: the card's section path as the store holds it, its tag (null for none),
# whether a heading on its path is an alias of the taxonomy (carries_alias), and the expected
# position, role and method (null for an item nothing places).
schema_version: 1
formats:

  - event: POLICY
    taxonomy:
      topic_id: policy-sample-topic
      taxonomy_version: 1.0.0
      event: POLICY
      positions:
        - {id: sample-plan-aff, label: Sample plan, kind: aff, side: aff, aliases: [sample plan, plan aff]}
        - {id: public-plan-aff, label: Public plan, kind: aff, side: aff, parent: sample-plan-aff, tag_keywords: [public plan]}
        - {id: voucher-plan-aff, label: Voucher plan, kind: aff, side: aff, parent: sample-plan-aff, tag_keywords: [vouchers]}
        - {id: growth-advantage, label: Growth advantage, kind: advantage, side: aff, aliases: [adv growth, growth]}
        - {id: spending-da, label: Spending DA, kind: da, side: neg, aliases: [spending da, da spending]}
        - {id: election-da, label: Election DA, kind: da, side: neg, tag_keywords: [midterm]}
        - {id: states-cp, label: States CP, kind: cp, side: neg, aliases: [states cp]}
        - {id: fed-cp, label: Fed CP, kind: cp, side: neg, aliases: [fed cp], deprecated: true, merged_into: states-cp}
        - {id: cap-k, label: Cap K, kind: k, side: neg, aliases: [cap k, capitalism k]}
        - {id: old-k, label: Old K, kind: k, side: neg, aliases: [old k], deprecated: true}
        - {id: t-sample, label: T sample, kind: t, side: neg, aliases: [t sample]}
        - {id: condo-bad, label: Condo bad, kind: theory, side: aff, aliases: [condo bad]}
    overrides:
      - {heading: deficit da, position_id: spending-da}
      - {heading: link, position_id: null}
    caselist_schools:
      Lakeside: [LS]
    documents:
      - name: policy-neg-file
        team_names: [Harbor Point, HP]
        cards:
          - {path: [1NC, Spending DA, Link], tag: Plan costs billions, carries_alias: true,
             expect: {position: spending-da, role: READS, method: INHERITED}}
          - {path: [1NC, Spending DA], tag: Deficits rise now, carries_alias: true,
             expect: {position: spending-da, role: READS, method: ALIAS}}
          - {path: [2NC, Spending DA, "AT: Link Turn"], tag: The turn is wrong, carries_alias: true,
             expect: {position: spending-da, role: READS, method: INHERITED}}
          - {path: [1NC, States CP], tag: States solve, carries_alias: true,
             expect: {position: states-cp, role: READS, method: ALIAS}}
          - {path: [1NC, Fed CP], tag: Federal action solves, carries_alias: true,
             expect: {position: states-cp, role: READS, method: ALIAS}}
          - {path: [1NC, Old K], tag: The old criticism, carries_alias: true,
             expect: {position: null, role: null, method: null}}
          - {path: [1NC, Cap K, Alternative], tag: Reject the market, carries_alias: true,
             expect: {position: cap-k, role: READS, method: INHERITED}}
          - {path: [1NC, Capitalism K], tag: Markets cause harm, carries_alias: true,
             expect: {position: cap-k, role: READS, method: ALIAS}}
          - {path: [T Sample], tag: Interpretation, carries_alias: true,
             expect: {position: t-sample, role: READS, method: ALIAS}}
          - {path: [Harbor Point Spending DA, Impact], tag: Recession follows, carries_alias: true,
             expect: {position: spending-da, role: READS, method: INHERITED}}
          - {path: [Lakeside States CP], tag: Fifty states act, carries_alias: true,
             expect: {position: states-cp, role: READS, method: ALIAS}}
          - {path: [1NC, Fiscal Cliff DA], tag: The cliff is near, carries_alias: false,
             expect: {position: null, role: null, method: null}}
          - {path: [1NC, Midterms DA], tag: Midterm control shifts, carries_alias: false,
             expect: {position: election-da, role: READS, method: TAG_KEYWORD}}
          - {path: [1NC, Deficit DA], tag: Deficits matter, carries_alias: false,
             expect: {position: spending-da, role: READS, method: OVERRIDE}}
          - {path: [1NC, Deficit DA, Impact], tag: Debt crisis, carries_alias: false,
             expect: {position: spending-da, role: READS, method: INHERITED}}
          - {path: [2NC, Link], tag: The plan spends, carries_alias: false,
             expect: {position: null, role: null, method: OVERRIDE}}
          - {path: [], tag: An orphan card, carries_alias: false,
             expect: {position: null, role: null, method: null}}
      - name: policy-aff-file
        team_names: [Maple Ridge, MR]
        cards:
          - {path: [Sample Plan, Plan Text], tag: The government should adopt a public plan, carries_alias: true,
             expect: {position: public-plan-aff, role: READS, method: TAG_KEYWORD}}
          - {path: [Sample Plan, Solvency], tag: Vouchers expand access, carries_alias: true,
             expect: {position: voucher-plan-aff, role: READS, method: TAG_KEYWORD}}
          - {path: [Sample Plan, Solvency], tag: Coverage expands, carries_alias: true,
             expect: {position: sample-plan-aff, role: READS, method: INHERITED}}
          - {path: [Sample Plan, Solvency], tag: A public plan and vouchers both work, carries_alias: true,
             expect: {position: sample-plan-aff, role: READS, method: INHERITED}}
          - {path: [Sample Plan, Adv Growth, Uniqueness], tag: Growth is slow, carries_alias: true,
             expect: {position: growth-advantage, role: READS, method: INHERITED}}
          - {path: [Sample Plan, Growth], tag: Growth rises, carries_alias: true,
             expect: {position: growth-advantage, role: READS, method: ALIAS}}
          - {path: [Case, Sample Plan], tag: Plan solves, carries_alias: true,
             expect: {position: sample-plan-aff, role: READS, method: ALIAS}}
          - {path: [Sample Plan, Inherency], tag: Status quo fails, carries_alias: true,
             expect: {position: sample-plan-aff, role: READS, method: INHERITED}}
          - {path: [Sample Plan, Inherency, Status quo fails], tag: null, carries_alias: true,
             expect: {position: sample-plan-aff, role: READS, method: INHERITED}}
          - {path: ["AT: Spending DA"], tag: No link, carries_alias: true,
             expect: {position: spending-da, role: ANSWERS, method: ALIAS}}
          - {path: ["AT: Spending DA", Link Turn], tag: Plan saves money, carries_alias: true,
             expect: {position: spending-da, role: ANSWERS, method: INHERITED}}
          - {path: [A2 States CP], tag: Perm do both, carries_alias: true,
             expect: {position: states-cp, role: ANSWERS, method: ALIAS}}
          - {path: ["AT: DAs", Spending DA], tag: Deficits are fine, carries_alias: true,
             expect: {position: spending-da, role: ANSWERS, method: ALIAS}}
          - {path: [Condo Bad], tag: Conditionality is a voter, carries_alias: true,
             expect: {position: condo-bad, role: READS, method: ALIAS}}

  - event: LD
    taxonomy:
      topic_id: ld-sample-topic
