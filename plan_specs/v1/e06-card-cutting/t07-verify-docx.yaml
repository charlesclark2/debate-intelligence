# TASK v1-e06-t07-verify-docx — Verify DOCX files
# Epic: E06 Card Cutting, Citation & Export | Release: v1.3 (URL → verified card) | Major: V1
# Architecture refs: §8 steps 5 and 7 (verification, edit restrictions), ADR-006, §11 (`verify evidence.docx`)
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: v1-e06-t07-verify-docx
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.3
    debate/epic: v1-e06-card-cutting
  annotations:
    debate/title: Verify DOCX files
    debate/architecture-refs: §8, ADR-006, §11
spec:
  description: >-
    Extend `debate-research verify` so it accepts a .docx exported by the platform. The verifier reads the
    embedded custom XML manifest (t04), re-derives each card's evidence from the stored snapshot via the
    E03 EvidenceVerifier, and then compares against what is actually in the document body. Body text is
    matched to its manifest card by position and tag; the body evidence is checked against the snapshot
    slice under the E03 edit policy: deletions of whole spans (ellipsis cuts) and markup changes are
    allowed, bracketed interpolations are reported as such, and any other change to quoted words is
    flagged MANUAL_EDIT with the differing range. Documents with no manifest (e.g. hand-cut team files)
    report NO_MANIFEST instead of pretending to verify. Boundaries: does not re-fetch sources, does not
    modify the DOCX, and does not verify arbitrary Verbatim files (that is V3 file intelligence).
  priority: 2
  constraints:
    packages: [debate_core.evidence, debate_core.application, debate_cli]
    forbidden:
      - Reporting VERIFIED for a card whose body text diverges from the snapshot beyond the edit policy
      - Network access during verify (snapshots come from the configured SnapshotStore only)
      - Writing to the input DOCX
  context:
    - kind: TaskRef
      name: v1-e06-t04-docx-renderer
      relation: dependsOn
    - kind: TaskRef
      name: v1-e03-t06-verify-command
      relation: dependsOn
  acceptanceCriteria:
    - id: ac1
      description: >-
        `verify out.docx` on an untouched export exits 0 and lists every card as VERIFIED with snapshot id.
    - id: ac2
      description: >-
        Changing a word inside a card's evidence in the DOCX body yields MANUAL_EDIT with the card index and
        character range, and a non-zero exit code.
    - id: ac3
      description: >-
        Removing underlining or deleting an entire unmarked sentence keeps the card VERIFIED; adding a
        bracketed interpolation reports INTERPOLATION_PRESENT as a warning.
    - id: ac4
      description: >-
        A DOCX with no embedded manifest exits with a distinct code and NO_MANIFEST status; a manifest
        whose snapshot is missing locally reports SNAPSHOT_UNAVAILABLE.
status:
  phase: Pending
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: v1-e06-t07-verify-docx-plan
  namespace: debate-intelligence
  labels:
    planspec.io/kind: task
    debate/major-version: v1
    debate/release: v1.3
    debate/epic: v1-e06-card-cutting
spec:
  description: >-
    Read the manifest and body, align body cards to manifest cards, diff under the edit policy, then extend
    the CLI and test tamper scenarios.
  goalRef:
    name: v1-e06-t07-verify-docx
  graph:
    nodes:
      - id: docx-reader
        kind: Task
        name: DOCX manifest and body reader
        description: >-
          Use read_embedded_manifest plus a body reader that segments tag/cite/evidence paragraphs by the
          profile's style names.
        outputs: [packages/debate_core/src/debate_core/evidence/docx_reader.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: Reader tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/evidence/test_docx_verify.py, -k, reader]
      - id: body-diff
        kind: Task
        name: Body-vs-snapshot diff under edit policy
        description: >-
          Align body evidence to the snapshot slice, classify differences as deletion, markup-only,
          bracketed interpolation or MANUAL_EDIT using the E03 edit policy.
        dependsOn: [docx-reader]
        outputs: [packages/debate_core/src/debate_core/evidence/docx_verify.py]
        estimatedEffort: 4h
        acceptanceCriteria:
          - type: test_passes
            name: Diff classification tests pass
            command: uv
            args: [run, pytest, packages/debate_core/tests/evidence/test_docx_verify.py, -k, diff]
      - id: cli-extension
        kind: Task
        name: Extend verify command for .docx
        description: >-
          Dispatch on file type, render per-card results in the existing Rich table/--json output and add
          exit codes for NO_MANIFEST and MANUAL_EDIT.
        dependsOn: [body-diff]
        outputs: [packages/debate_cli/src/debate_cli/commands/verify.py]
        estimatedEffort: 2h
        acceptanceCriteria:
          - type: test_passes
            name: verify DOCX CLI tests pass
            command: uv
            args: [run, pytest, packages/debate_cli/tests/test_verify_command.py, -k, docx]
          - type: command_succeeds
            name: Import boundaries hold
            command: uv
            args: [run, lint-imports]
status:
  phase: Pending
